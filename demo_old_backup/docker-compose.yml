# Docker Compose configuration for ProximaDB unified container

services:
  proximadb-unified:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5678:5678"  # ProximaDB REST API
      - "127.0.0.1:5679:5679"  # ProximaDB gRPC
      - "127.0.0.1:8080:8080"  # Demo Web UI
    volumes:
      - proximadb_data:/data
      - ./demo_results:/app/results
    environment:
      - RUST_LOG=info
      - PROXIMADB_CONFIG_PATH=/opt/proximadb/config/docker-config.toml
      - PROXIMADB_SERVER_URL=http://localhost:5678
      - PROXIMADB_GRPC_URL=localhost:5679
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proximadb-network

  # Optional: Interactive shell for CLI demos (use with --profile interactive)
  demo-interactive:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      proximadb-unified:
        condition: service_healthy
    environment:
      - PROXIMADB_SERVER_URL=http://proximadb-unified:5678
      - PROXIMADB_GRPC_URL=proximadb-unified:5679
      - PYTHONUNBUFFERED=1
    networks:
      - proximadb-network
    volumes:
      - ./demo_results:/app/results
    working_dir: /app
    command: /bin/bash
    stdin_open: true
    tty: true
    profiles: ["interactive"]


volumes:
  proximadb_data:

networks:
  proximadb-network:
    driver: bridge