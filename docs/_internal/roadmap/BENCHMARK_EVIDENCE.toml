# Benchmark Evidence Ledger
#
# Ties each externally-facing PERFORMANCE/CAPABILITY claim to its evidence:
# where the claim is asserted, the bench that (could) substantiate it, and — for
# claims we actually stand behind — the reproducible provenance (command, source,
# artifact, hardware, date, version).
#
# This exists because perf claims were scattered across README / BENCHMARKS /
# PRD with no link back to a runnable benchmark or a dated artifact. The ledger
# makes the gap explicit and machine-checkable (scripts/validate_benchmark_evidence.py).
#
# Status taxonomy (enforced by the validator):
#   measured     - backed by a checked-in dated artifact; REQUIRES bench_source,
#                  bench_command, artifact, hardware, date, version.
#   unverified   - a benchmark exists that could substantiate it, but there is no
#                  dated reproducible artifact tying THIS number to a run.
#                  REQUIRES bench_source; artifact/date/hardware may be empty.
#   aspirational - a target / acceptance-criterion only; no benchmark yet.
#                  REQUIRES bench_source empty.
#
# DO NOT promote an entry to `measured` without real provenance. Numbers in
# README/BENCHMARKS are claims, not evidence, until an artifact backs them.

as_of_date = "2026-06-15"
source_of_truth = "benches/ + checked-in dated artifacts"
header_status = "seeded-2026-06-15; most external claims are unverified pending dated artifacts"

