claim = "PAX footer-cache + ranged-read cloud-economics vs whole-byte (local S3-proxy measurement)"
metric = "object_store_read_economics"
status = "measured"
asserted_in = ["crates/storage/proximadb-storage-common/src/ranged_segment.rs"]
bench_source = "crates/storage/proximadb-storage-common/src/ranged_segment.rs"
bench_command = "cargo test -p proximadb-storage-common --lib footer_cache_ranged_read_economics_vs_whole_byte -- --nocapture"
artifact = "docs/_internal/status/PAX_FOOTER_CACHE_ECONOMICS_2026_06_25.adoc"
hardware = "Apple M1 Max, 64 GB, macOS 26.2 (shared dev machine — indicative, not an SLA)"
date = "2026-06-25"
version = "v0.2"
notes = "Local measurement (InMemoryRangeBridge = S3 ranged-GET proxy). 4000x128 PAX segment, Q=20 steady-state vector-column reads. RESULT: footer hit-ratio 0.950; ranged+cache 10.5MB/6000 GETs vs whole-byte 24.6MB/20 GETs -> bytes -57.1% BUT GETs +29,900%. FINDING: naive per-block ranged reads are FEE-DOMINATED -> naively wiring RAISES cloud cost. Real Phase 5 win = range coalescing (~8-16MiB GETs) + block pruning, not naive ranged reads. The harness is the ratchet for future coalescing work. EGRESS RECONCILIATION (audit 2026-06-25): the artifact's original $ line priced egress at internet $0.09/GB (saves $0.0012) vs a $0.00045/1k GET fee (+$0.0027). This is SUPERSEDED by the same-repo corrected model PAX_RANGED_READ_MULTICLOUD_COST_2026_06_25.adoc: compute is in-region with the store, so same-region storage-read egress is FREE on S3/GCS/Azure -> the byte saving has NO $ value and the +29,900% GET fee is UNOFFSET -> naive ranged read is purely cost-negative (the finding is strengthened, not weakened). Storage-read cost = GET-count x locality-independent per-request fee. Indicative, not an SLA."

