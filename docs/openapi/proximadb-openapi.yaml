          type: integer
          format: int32
          minimum: 0
    EntityProvenanceInput:
      type: object
      properties:
        source_id:
          type: string
        chunk_id:
          type: string
        chunk_position:
          type: integer
          format: int32
          minimum: 0
        extraction_method:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    EntityRelationInput:
      type: object
      required:
      - source_entity_id
      - target_entity_id
      - relation_type
      properties:
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        relation_type:
          type: string
        weight:
          type: number
          format: float
        properties:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    EntitySearchResult:
      type: object
      required:
      - entity
      - score
      properties:
        entity:
          $ref: '#/components/schemas/EntityDto'
        score:
          type: number
          format: float
    ErrorBody:
      type: object
      description: Inner body of [`ErrorResponse`].
      required:
      - type
      - message
      - code
      properties:
        type:
          type: string
          description: Stable machine-readable error code (snake_case).
          example: collection_not_found
        message:
          type: string
        code:
          type: integer
          format: int32
          description: HTTP status code.
        request_id:
          type:
          - string
          - 'null'
          description: Correlation id (matches the X-Request-ID header).
        details:
          type:
          - object
          - 'null'
          description: Optional structured context (e.g. migration hints).
    ErrorResponse:
      type: object
      description: |-
        Canonical ProximaDB error envelope (`{ error: { type, message, code } }`).

        `request_id` (also returned in the `X-Request-ID` response header) is present
        whenever the request passed through the request-id middleware; quote it in
        bug reports.
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ExplainQueryRequest:
      type: object
      required:
      - language
      - query
      properties:
        language:
          $ref: '#/components/schemas/QueryLanguage'
        query:
          type: string
          minLength: 1
        collection:
          type:
          - string
          - 'null'
    FusionHit:
      type: object
      required:
      - oid
      - score
      - source_count
      properties:
        oid:
          type: string
        score:
          type: number
          format: float
        source_count:
          type: integer
          minimum: 0
        labels:
          type: array
          items:
            type: string
          description: |-
            Graph node label(s) of the reached node. Exposed so cross-modal-joint
            consumers can correlate a fused hit by its graph label without a separate
            node lookup (#485). The expansion already reaches the node, so this is
            near-free to fill. Additive + back-compat (empty until populated).
    FusionSearchRequest:
      type: object
      required:
      - vector_collection
      - query_vector
      properties:
        vector_collection:
          type: string
          description: Vector collection to seed from (its records co-indexed with this graph by `oid`).
        query_vector:
          type: array
          items:
            type: number
            format: float
          description: Query embedding for the ANN seed.
        limit:
          type: integer
          minimum: 0
        max_depth:
          type: integer
          format: int32
          description: k-hop expansion depth (bounded; default 1 — the validated sweet spot).
          minimum: 0
        edge_types:
          type: array
          items:
            type: string
        max_seeds:
          type: integer
          description: How many of the top vector seeds to expand from (bounded expansion).
          minimum: 0
        vector_weight:
          type:
          - number
          - 'null'
          format: float
        graph_weight:
          type:
          - number
          - 'null'
          format: float
        rrf:
          type: boolean
          description: Use the rank-based RRF fallback instead of PIT-calibrated linear.
        consensus_beta:
          type:
          - number
          - 'null'
          format: float
          description: Consensus boost added to any `oid` present in ≥2 sources.
        grain:
          type:
          - string
          - 'null'
          description: 'Graph contribution grain: `"nodes"` (default), `"edges"`, or `"both"`.'
        min_weight_fraction:
          type:
          - number
          - 'null'
          format: float
          description: |-
            Cost-routing policy inputs (TD-141): drop negligible modalities (weight fraction) and budget each.
            When absent, fusion is unbounded.
        total_budget:
          type:
          - integer
          - 'null'
          minimum: 0
        text_query:
          type:
          - string
          - 'null'
          description: |-
            Optional BM25/full-text query (TD-138). When present (and non-empty), fusion also searches the
            collection's document index and merges BM25 hits into the result by shared `oid` — tri-modal
            (vector + graph + document) fusion. Absent ⇒ vector+graph only (unchanged).
        document_collection:
          type:
          - string
          - 'null'
          description: |-
            Collection whose document index to BM25-search. Defaults to `vector_collection` (documents
            co-indexed with the vectors share the record `oid`, so they merge by `oid`).
        document_weight:
          type:
          - number
          - 'null'
          format: float
          description: Document modality weight (mirrors `vector_weight` / `graph_weight`). Defaults to 1.0.
    FusionSearchResponse:
      type: object
      required:
      - results
      - stats
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/FusionHit'
        stats:
          $ref: '#/components/schemas/FusionStatsDto'
    FusionStatsDto:
      type: object
      required:
      - sources_fused
      - sources_skipped
      - candidates_in
      - items_out
      properties:
        sources_fused:
          type: integer
          minimum: 0
        sources_skipped:
          type: integer
          minimum: 0
        candidates_in:
          type: integer
          minimum: 0
        items_out:
          type: integer
          minimum: 0
    HnswConfigInput:
      type: object
      description: REST input for HNSW index params (mirrors proto `HnswConfig`).
      properties:
        m:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        ef_construction:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    HnswConfigOutput:
      type: object
      description: REST output for HNSW params (mirrors gRPC `V2HnswConfig`).
      properties:
        m:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        ef_construction:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ImpactAnalysisRequest:
      type: object
      required:
      - node_id
      properties:
        node_id:
          type: string
          description: Start symbol node id.
        direction:
          type:
          - string
          - 'null'
          description: '`"forward"` (default — what X impacts) or `"backward"` (what impacts X).'
        edge_types:
          type: array
          items:
            type: string
        max_depth:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          minimum: 0
    ImpactAnalysisResponse:
      type: object
      required:
      - node_ids
      - edge_count
      - max_depth_reached
      properties:
        node_ids:
          type: array
          items:
            type: string
          description: Reached node ids (canonical `oid` = `graph/{graph_id}/node/{id}`).
        edge_count:
          type: integer
          minimum: 0
        max_depth_reached:
          type: integer
          format: int32
          minimum: 0
    IndexConfigInput:
      type: object
      description: REST input for a single index config (mirrors proto `IndexConfig`).
      required:
      - algorithm
      properties:
        index_name:
          type:
          - string
          - 'null'
          description: Optional index name (defaults to `index_<n>`).
        algorithm:
          type: string
          description: 'Algorithm: "hnsw", "ivf", "pq", "flat", "annoy", "lsh".'
        parameters:
          type: object
          description: Free-form algorithm parameters.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        hnsw_config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HnswConfigInput'
            description: HNSW tuning (when algorithm == "hnsw").
        ivf_config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IvfConfigInput'
            description: IVF tuning (when algorithm == "ivf").
        is_primary:
          type:
          - boolean
          - 'null'
          description: Mark this index as the collection's primary ANN index (gRPC-v2 parity).
    IndexPolicyInput:
      type: object
      description: |-
        REST input for the per-collection index routing policy (mirrors proto
        `IndexPolicy`; ADR-028).
      properties:
        mode:
          type:
          - string
          - 'null'
          description: |-
            Routing mode: "auto" (default) | "exact" | "ivf" | "hnsw" | "helix".
            "auto"/omitted ⇒ cost-derived. "exact" ⇒ always brute-force (no index).
            The engine modes force the collection onto that engine/route.
        rehydrate:
          type:
          - string
          - 'null'
          description: |-
            Cold-start index warming: "auto" (default) | "eager" | "lazy" | "never".
            Index/auto modes only — rejected when `mode = "exact"`.
        byte_budget:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Exact-scan byte budget override (bytes). 0/omitted ⇒ cost-model default
            for the storage class.
          minimum: 0
        nprobe:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            nprobe override for index modes. 0/omitted ⇒ cost-derived. Rejected when
            `mode = "exact"`.
          minimum: 0
    IndexSpecOutput:
      type: object
      description: REST output for a single index config (mirrors gRPC `V2IndexSpec`).
      required:
      - algorithm
      - is_primary
      properties:
        algorithm:
          type: string
          description: 'Algorithm: "hnsw" | "ivf" | "pq" | "flat" | "annoy" | "lsh".'
        hnsw:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HnswConfigOutput'
            description: HNSW params (present when the index is HNSW).
        ivf:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IvfConfigOutput'
            description: IVF params (present when the index is IVF).
        is_primary:
          type: boolean
          description: Whether this is the collection's primary ANN index.
    IngestDocument:
      type: object
      description: A single record submitted for native embedding + indexing.
      required:
      - id
      properties:
        id:
          type: string
        text:
          type:
          - string
          - 'null'
          description: |-
            Raw text content. Required when `X-Embed-Source: native` (default);
            optional when the client also supplied a vector.
        vector:
          type:
          - array
          - 'null'
          items:
            type: number
            format: float
          description: |-
            Optional client-provided vector. When present, the server skips
            embedding for this record. Use case: SDK that already embedded
            locally (legacy path).
        metadata:
          type: object
          description: Arbitrary metadata fields. Stored as ProximaRecord props.
          additionalProperties: {}
          propertyNames:
            type: string
    IngestDocumentsRequest:
      type: object
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/IngestDocument'
    IngestDocumentsResponse:
      type: object
      required:
      - mode
      - records
      properties:
        mode:
          type: string
        records:
          type: array
          items:
            $ref: '#/components/schemas/IngestedRecord'
        retry_after_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    IngestedRecord:
      type: object
      required:
      - id
      - dim
      properties:
        id:
          type: string
        dim:
          type: integer
          format: int32
          minimum: 0
    InsertError:
      type: object
      description: Error details for a failed record insertion
      required:
      - index
      - error
      properties:
        index:
          type: integer
          description: Index of the record in the request
          minimum: 0
        id:
          type:
          - string
          - 'null'
          description: Record ID (if provided)
        error:
          type: string
          description: Error message
    InsertRecordsRequest:
      type: object
      description: |-
        Request to insert ProximaRecords

        ## Example JSON

        ```json
        {
            "records": [
                {
                    "id": "doc_1",
                    "vector": [0.1, 0.2, 0.3],
                    "props": {
                        "category": "electronics",
                        "price": 299.99,
                        "in_stock": true
                    },
                    "text_fields": [
                        {
                            "name": "description",
                            "content": "A detailed product description...",
                            "storage_hint": "adaptive"
                        }
                    ],
                    "source": "catalog_import"
                }
            ],
            "validate_schema": true
        }
        ```
        Not supported in v0.2: optimistic versioning, conditional-write predicates,
        update-by-filter, delete-by-filter, and patch / partial-record update. The
        live contract is exposed via `WriteContractHealth` on the route-health
        diagnostic endpoint (`GET /api/v2/_diagnostics/collections/{id}/route-health`);
        see also `docs/SUPPORTED_SURFACE.adoc` "Not Supported in v0.2".
      required:
      - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ProximaRecordInput'
          description: Records to insert
        validate_schema:
          type:
          - boolean
          - 'null'
          description: 'Whether to validate against collection schema (default: true)'
        upsert:
          type:
          - boolean
          - 'null'
          description: |-
            Whether existing records with the same ID should be replaced.

            The current durable record write path is idempotent/upsert-oriented; this
            field is accepted so SDKs can expose explicit upsert intent without
            leaving the OpenAPI contract.
    InsertRecordsResponse:
      type: object
      description: Response for insert operation
      required:
      - inserted_count
      - failed_count
      - errors
      - inserted_ids
      properties:
        inserted_count:
          type: integer
          description: Number of successfully inserted records
          minimum: 0
        failed_count:
          type: integer
          description: Number of failed records
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InsertError'
          description: Detailed errors for failed records
        inserted_ids:
          type: array
          items:
            type: string
          description: IDs of successfully inserted records
    IvfConfigInput:
      type: object
      description: REST input for IVF index params (mirrors proto `IvfConfig`).
      properties:
        n_lists:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        n_probe:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    IvfConfigOutput:
      type: object
      description: REST output for IVF params (mirrors gRPC `V2IvfConfig`).
      properties:
        n_lists:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        n_probe:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ListCollectionsV2Response:
      type: object
      description: Response for listing collections
      required:
      - collections
      - total
      - limit
      - offset
      - has_more
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CollectionV2Summary'
          description: List of collections
        total:
          type: integer
          format: int64
          description: Total count of collections
          minimum: 0
        limit:
          type: integer
          format: int32
          description: Limit used in this request
          minimum: 0
        offset:
          type: integer
          format: int32
          description: Offset used in this request
          minimum: 0
        has_more:
          type: boolean
          description: Whether there are more results
    ListModelRegistriesResponse:
      type: object
      required:
      - registries
      properties:
        registries:
          type: array
          items:
            $ref: '#/components/schemas/ModelRegistryRecordResponse'
    ModelRegistryRecordResponse:
      type: object
      description: |-
        REST uses a decimal string for stable catalog IDs so JavaScript clients do
        not lose precision. gRPC exposes the same value as `uint64`.
      required:
      - tenant_id
      - asset_id
      - registry
      properties:
        tenant_id:
          type: string
        asset_id:
          type: string
        registry:
          $ref: '#/components/schemas/CatalogEmbeddingModelRegistry'
    PredicateShortfallWire:
      type: object
      description: |-
        TD-064: predicate-aware recall shortfall (REST wire shape).

        Mirrors `observability::search_plan_trace::PredicateShortfall` as an
        explicit REST/OpenAPI schema so the field is typed and documented on the
        wire without forcing the observability type (or the slim `IndexQueryResult`
        DTO) to derive `ToSchema`.
      required:
      - requested_k
      - returned_k
      - oversample_pool
      - ann_filtering_mode
      properties:
        requested_k:
          type: integer
          format: int32
          description: The `top_k` value the caller asked for.
          minimum: 0
        returned_k:
          type: integer
          format: int32
          description: Results actually returned after predicate filtering + merge.
          minimum: 0
        oversample_pool:
          type: integer
          format: int32
          description: Candidate pool size considered before the predicate (oversample budget).
          minimum: 0
        ann_filtering_mode:
          type: string
          description: |-
            ADR-011 mode that produced the shortfall (`post_filter`, `inline`, or
            `pre_filter`).
    ProximaRecordInput:
      type: object
      description: |-
        Input format for ProximaRecord (JSON-friendly)

        This is the JSON-serializable input format for ProximaRecord.
        It uses serde_json::Value for typed fields to support dynamic typing
        at the API boundary, with validation happening during conversion.
      required:
      - vector
      properties:
        id:
          type:
          - string
          - 'null'
          description: Record ID (optional, will be auto-generated if not provided)
        vector:
          type: array
          items:
            type: number
            format: float
          description: Vector embedding (required)
        props:
          type:
          - object
          - 'null'
          description: Canonical rich property map.
          additionalProperties: {}
          propertyNames:
            type: string
        text_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TextFieldInput'
          description: Dedicated TEXT fields with storage hints
    QuantizationConfigInput:
      type: object
      description: |-
        REST input for quantization config (mirrors proto `QuantizationConfig`;
        gRPC-v2 parity with `V2QuantizationConfig`).
      properties:
        enabled:
          type:
          - boolean
          - 'null'
          description: Enable quantization for this collection.
        strategy:
          type:
          - string
          - 'null'
          description: 'Strategy: "smart_defaults" (default) | "minimal" | "aggressive" | "custom_levels".'
    QuantizationConfigOutput:
      type: object
      description: REST output for quantization config (mirrors gRPC `V2QuantizationConfig`).
      required:
      - enabled
      - strategy
      properties:
        enabled:
          type: boolean
        strategy:
          type: string
          description: Strategy label, e.g. "smart_defaults" | "minimal" | "aggressive".
    QueryLanguage:
      type: string
      enum:
      - uql
      - aql
      - federated
    QueryRequest:
      type: object
      required:
      - language
      - query
      properties:
        language:
          $ref: '#/components/schemas/QueryLanguage'
        query:
          type: string
          minLength: 1
        parameters:
          type:
          - array
          - 'null'
          items:
            type: object
        collection:
          type:
          - string
          - 'null'
        limit:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    QueryResponse:
      type: object
      description: |-
        Query facade result. Implementations return records, total_count, metrics,
        plan, or diagnostics depending on language and endpoint, so the body is a
        free-form JSON object.
    RecordV2Response:
      type: object
      description: Response for getting a single record
      required:
      - id
      - props
      properties:
        id:
          type: string
          description: Record ID
        vector:
          type:
          - array
          - 'null'
          items:
            type: number
            format: float
          description: Vector embedding (if requested)
        props:
          type: object
          description: Rich properties from the record
          additionalProperties: {}
          propertyNames:
            type: string
        text_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TextFieldOutput'
          description: TEXT fields (if include_text is true)
        version:
          type:
          - integer
          - 'null'
          format: int64
          description: Record version
          minimum: 0
        timestamp:
          type:
          - integer
          - 'null'
          format: int64
          description: Record timestamp
    ResolveModelAliasRequest:
      type: object
      required:
      - alias
      - dimension
      properties:
        alias:
          type: string
        dimension:
          type: integer
          format: int32
          minimum: 0
        runtime:
          type:
          - string
          - 'null'
          description: Runtime implementation that will execute the immutable contract.
        require_approved:
          type: boolean
          description: Require the latest append-only decision to approve the selected version.
    ResolvedEmbeddingModelResponse:
      type: object
      required:
      - asset_id
      - registry_name
      - registry_revision
      - contract_sha256
      - model
      properties:
        asset_id:
          type: string
        registry_name:
          type: string
        registry_revision:
          type: integer
          format: int64
          minimum: 0
        contract_sha256:
          type: string
        model:
          $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
    ResolvedModelBindingResponse:
      type: object
      required:
      - model
      - dimension
      - model_asset_id
      - model_version
      - contract_sha256
      - snapshot
      properties:
        model:
          type: string
        dimension:
          type: integer
          format: int32
          minimum: 0
        model_asset_id:
          type: string
        model_version:
          type: integer
          format: int64
          minimum: 0
        contract_sha256:
          type: string
        snapshot:
          $ref: '#/components/schemas/ResolvedEmbeddingModelResponse'
    RestColumnDefinition:
      type: object
      description: Column definition for schema
      required:
      - name
      - data_type
      properties:
        name:
          type: string
          description: Column name
        data_type:
          type: string
          description: |-
            Data type

            Supported types:
            - "text": Variable-length UTF-8 text
            - "text_large": Large text with sidecar storage
            - "integer": 64-bit signed integer
            - "float": 64-bit floating point
            - "decimal": 128-bit decimal (precision, scale)
            - "boolean": True/false
            - "timestamp": Microseconds since epoch
            - "timestamp_tz": Timestamp with timezone
            - "date": Days since epoch
            - "time": Microseconds since midnight
            - "uuid": RFC 4122 UUID
            - "binary": Raw bytes
            - "json": Validated JSON
            - "array_text", "array_integer", "array_float", "array_boolean"
            - "map_string_string", "map_string_any"
            - "geo_point": Latitude/longitude point
            - "vector": Fixed-dimension vector (specify dimension)
        nullable:
          type:
          - boolean
          - 'null'
          description: |-
            Whether null values are allowed

            Default: true
        indexed:
          type:
          - boolean
          - 'null'
          description: |-
            Create secondary index for this column

            Improves query performance for equality/range filters.
            Default: false
        filterable:
          type:
          - boolean
          - 'null'
          description: |-
            Enable filtering on this column

            When true, the column can be used in WHERE clauses.
            Default: true for indexed columns, false otherwise
        max_length:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Maximum length for TEXT/BINARY columns

            Default: no limit
          minimum: 0
        precision:
          type:
          - integer
          - 'null'
          format: int32
          description: Precision for DECIMAL type (1-38)
          minimum: 0
        scale:
          type:
          - integer
          - 'null'
          format: int32
          description: Scale for DECIMAL type (0-precision)
          minimum: 0
        vector_dimension:
          type:
          - integer
          - 'null'
          format: int32
          description: Dimension for VECTOR type
          minimum: 0
    ScanRecordsRequest:
      type: object
      description: |-
        Body of `POST /records/scan`. Mirrors the OpenAPI `ScanRecordsRequest`
        schema; all fields optional so an empty `{}` returns the first page.
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: |-
            Opaque continuation token returned as `next_cursor` from a
            prior page. Omit / null to start from the beginning.
        limit:
          type:
          - integer
          - 'null'
          format: int32
          description: Max records to return in this page. Server enforces upper bound.
          minimum: 0
        filter:
          description: |-
            Metadata filter applied (before the limit) to the scanned page.
            Accepts either the typed list form `[{field,op,value}]` (mirrors
            `searchRecords.filters`) or a simple equality map `{field: value}`.
        include_vector:
          type:
          - boolean
          - 'null'
        include_text:
          type:
          - boolean
          - 'null'
    ScanRecordsResponse:
      type: object
      description: |-
        Response shape for `scanRecords`. Empty `records` + null
        `next_cursor` signals end-of-scan. Each record matches the OpenAPI
        `RecordResponse` schema (same shape used by `getRecord`).
      required:
      - records
      - content_revision
      - content_revision_token
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordV2Response'
        content_revision:
          type: integer
          format: int64
          minimum: 0
        content_revision_token:
          type: string
        next_cursor:
          type:
          - string
          - 'null'
        scanned_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    SchemaChange:
      type: object
      description: Description of a schema change
      required:
      - change_type
      - description
      properties:
        change_type:
          type: string
          description: Type of change
        column:
          type:
          - string
          - 'null'
          description: Affected column (if applicable)
        description:
          type: string
          description: Description of the change
    SchemaDefinition:
      type: object
      description: |-
        Schema definition for a collection

        Defines the typed columns and enforcement rules for ProximaRecord support.
      required:
      - columns
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/RestColumnDefinition'
          description: Column definitions
        enforcement:
          type:
          - string
          - 'null'
          description: |-
            Schema enforcement mode

            - "strict": All columns must match schema exactly
            - "flexible": Schema on read, no validation at insert
            - "hybrid": Core columns enforced, additional fields allowed (default)
        allow_additional_fields:
          type:
          - boolean
          - 'null'
          description: |-
            Allow additional fields not defined in schema

            Only applies in "hybrid" mode.
            Default: true
    SchemaResponse:
      type: object
      description: Schema response with metadata
      required:
      - schema_id
      - schema_version
      - collection_id
      - schema
      - created_at
      properties:
        schema_id:
          type: string
          description: Schema ID (UUID)
        schema_version:
          type: string
          description: Schema version (semantic versioning)
        collection_id:
          type: string
          description: Collection this schema belongs to
        schema:
          $ref: '#/components/schemas/SchemaDefinition'
          description: Schema definition
        created_at:
          type: string
          description: Creation timestamp
        updated_at:
          type:
          - string
          - 'null'
          description: Last update timestamp
        parent_schema_id:
          type:
          - string
          - 'null'
          description: Parent schema ID (for evolution tracking)
    SearchEntitiesRequest:
      type: object
      properties:
        query_vector:
          type: array
          items:
            type: number
            format: float
          description: Query embedding for vector similarity search. Omit for metadata-only search.
        filters:
          type: object
          description: 'Equality metadata filters as a `{field: value}` JSON object.'
          additionalProperties: {}
          propertyNames:
            type: string
        top_k:
          type: integer
          format: int32
          minimum: 0
    SearchEntitiesResponse:
      type: object
      required:
      - results
      - total
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/EntitySearchResult'
        total:
          type: integer
          format: int32
          minimum: 0
    SqlRequest:
      type: object
      description: |-
        One SQL statement executed through the shared SQL authority.

        Parameter binding is intentionally not advertised yet: the relational
        execution port currently has no typed binding contract. Callers must not be
        offered a field that an adapter would silently ignore or interpolate.
      required:
      - query
      properties:
        query:
          type: string
          maxLength: 1048576
          minLength: 1
        collection:
          type:
          - string
          - 'null'
          description: Optional collection context used by vector/graph SQL extensions.
        timeout_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Per-request deadline. Defaults to 30 seconds and is capped at 5 minutes.
          maximum: 300000
          minimum: 1
    SqlResponse:
      type: object
      description: |-
        Stable JSON envelope for SQL reads and writes.

        For reads, `rows_returned` is the row count. For DDL/DML, the shared SQL
        authority reports the affected count in `rows_returned` and `rows` is empty.
      required:
      - rows
      - columns
      - column_types
      - rows_returned
      - rows_scanned
      - execution_time_ms
      - request_id
      properties:
        rows:
          type: array
          items:
            type: object
        columns:
          type: array
          items:
            type: string
        column_types:
          type: array
          items:
            type: string
        rows_returned:
          type: integer
          format: int64
          minimum: 0
        rows_scanned:
          type: integer
          format: int64
          minimum: 0
        execution_time_ms:
          type: integer
          format: int64
          minimum: 0
        request_id:
          type: string
    TextFieldInput:
      type: object
      description: |-
        Input format for TEXT fields

        TEXT fields are stored in dedicated columns with optional chunking
        for large content. The storage hint helps optimize storage strategy.
      required:
      - name
      - content
      properties:
        name:
          type: string
          description: Field name
        content:
          type: string
          description: Text content
        storage_hint:
          type:
          - string
          - 'null'
          description: |-
            Storage strategy hint

            - "inline": Store inline in main column (<4KB)
            - "chunked": Split into chunks with embeddings (4KB-1MB)
            - "sidecar": Store in separate sidecar file (>1MB)
            - "adaptive": Auto-select based on content size (default)
    TextFieldOutput:
      type: object
      description: Output format for TEXT fields
      required:
      - name
      - content
      - truncated
      properties:
        name:
          type: string
          description: Field name
        content:
          type: string
          description: Text content (may be truncated for large content)
        chunk_count:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of chunks (for chunked storage)
          minimum: 0
        truncated:
          type: boolean
          description: Whether content was truncated
    TypedFilter:
      type: object
      description: |-
        A typed filter for search operations

        Supports various comparison operators with type-safe values.
      required:
      - field
      - op
      - value
      properties:
        field:
          type: string
          description: Field name to filter on
        op:
          type: string
          description: |-
            Comparison operator

            Supported operators:
            - "eq": Equals
            - "neq": Not equals
            - "gt": Greater than
            - "gte": Greater than or equal
            - "lt": Less than
            - "lte": Less than or equal
            - "contains": String/array contains
            - "between": Value is between two bounds (requires value_upper)
            - "in": Value is in a list
            - "starts_with": String starts with prefix
            - "ends_with": String ends with suffix
        value:
          description: Filter value (type depends on field type)
        value_upper:
          description: Upper bound for "between" operator
    TypedSearchRequest:
      type: object
      description: |-
        Search request with typed filters

        ## Example JSON

        ```json
        {
            "vector": [0.1, 0.2, 0.3],
            "top_k": 10,
            "filters": [
                {"field": "category", "op": "eq", "value": "electronics"},
                {"field": "price", "op": "lt", "value": 500},
                {"field": "in_stock", "op": "eq", "value": true}
            ],
            "include_text": true
        }
        ```
      required:
      - vector
      - top_k
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          description: Query vector
          minItems: 1
        top_k:
          type: integer
          description: Number of results to return
          minimum: 1
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TypedFilter'
          description: Typed filters with operator support
        include_text:
          type:
          - boolean
          - 'null'
          description: |-
            Whether to include TEXT fields in results (default: false)

            TEXT fields can be large, so they are excluded by default.
            Set to true to include them in the response.
        include_vector:
          type:
          - boolean
          - 'null'
          description: |-
            Whether to include the vector in results (default: false)

            Vector data can be large, so it is excluded by default.
        debug:
          type:
          - boolean
          - 'null'
          description: |-
            Return the SearchPlanTrace + a human-readable route explain
            in the response (LLD §1 contract). Defaults to `false` so
            non-debug requests don't pay the JSON serialization cost of
            the ~30-field trace envelope.
    TypedSearchResponse:
      type: object
      description: Search response with typed results
      required:
      - results
      - latency_ms
      - request_id
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TypedSearchResult'
          description: Search results
        total_matches:
          type:
          - integer
          - 'null'
          format: int64
          description: Total number of matching documents (before top_k limit)
          minimum: 0
        latency_ms:
          type: integer
          format: int64
          description: Search latency in milliseconds
          minimum: 0
        request_id:
          type: string
          description: Request ID for tracing
        predicate_shortfall:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PredicateShortfallWire'
            description: |-
              TD-064: predicate-aware shortfall — present when a filtered search
              returned fewer than the requested `top_k` after the WAL+AXIS+storage
              merge. **Always emitted when present (NOT `debug`-gated)**, unlike
              `search_plan_trace`: a silent `<top_k` under a tenant/RLS filter is
              fail-open, so the client must be able to distinguish "fewer than k
              records match my filter" from "the engine returned my full top-k".
        search_plan_trace:
          description: |-
            SearchPlanTrace (LLD §10) — the per-query telemetry envelope that
            upstream gateways consume for metering and planner-v2 training.
            Phase 0 emits a stub trace populated from request_id + latency; later
            phases fill in the per-stage counters. Only emitted when the request
            sets `debug=true` (LLD §1 contract).
        explain:
          description: |-
            Human-readable explain summary derived from the SearchPlanTrace.
            Only emitted when the request sets `debug=true` — gives an on-call
            operator a one-glance view of the plan, cache result, and any
            actionable hints (high scan fraction, repair triggered, ...).
    TypedSearchResult:
      type: object
      description: Search result with typed fields
      required:
      - id
      - score
      - props
      properties:
        id:
          type: string
          description: Record ID
        score:
          type: number
          format: float
          description: Similarity score (0.0 - 1.0 for cosine, distance for L2)
        vector:
          type:
          - array
          - 'null'
          items:
            type: number
            format: float
          description: Vector embedding (if requested)
        props:
          type: object
          description: Rich properties from the record
          additionalProperties: {}
          propertyNames:
            type: string
        text_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TextFieldOutput'
          description: TEXT fields (if include_text is true)
    UpdateSchemaRequest:
      allOf:
      - $ref: '#/components/schemas/SchemaDefinition'
        description: Updated schema definition
      - type: object
        properties:
          force:
            type:
            - boolean
            - 'null'
            description: |-
              Force update even if validation warnings exist

              Use with caution - may cause data compatibility issues.
      description: |-
        Request to update schema

        ## Schema Evolution Rules

        1. **Adding Columns**: New columns must be nullable or have defaults
        2. **Type Changes**: Not allowed (except compatible widening like int32->int64)
        3. **Removing Columns**: Not allowed (use deprecation instead)
        4. **Enforcement Mode**: Can be changed, but strict->flexible may lose validation

        ## Example JSON

        ```json
        {
            "columns": [
                {"name": "category", "data_type": "text", "indexed": true},
                {"name": "price", "data_type": "float", "filterable": true},
                {"name": "tags", "data_type": "array_text", "nullable": true}
            ],
            "enforcement": "hybrid",
            "allow_additional_fields": true
        }
        ```
    UpdateSchemaResponse:
      type: object
      description: Schema update response
      required:
      - schema_id
      - schema_version
      - previous_schema_id
      - changes
      - warnings
      - updated_at
      properties:
        schema_id:
          type: string
          description: Updated schema ID
        schema_version:
          type: string
          description: New schema version
        previous_schema_id:
          type: string
          description: Previous schema ID (for rollback)
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaChange'
          description: List of applied changes
        warnings:
          type: array
          items:
            type: string
          description: Warnings about the update
        updated_at:
          type: string
          description: Update timestamp
