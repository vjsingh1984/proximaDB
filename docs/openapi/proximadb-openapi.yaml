openapi: 3.1.0
info:
  title: ProximaDB REST API
  description: SDK-facing ProximaDB REST contract. This specification is v2-first and centers on ProximaRecord, typed schemas, record search, and collection lifecycle operations. Legacy v1 compatibility routes are intentionally not part of this publishable SDK surface.
  contact:
    name: Vijaykumar Singh
    email: vijay@anvaiops.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.2.0
servers:
- url: http://localhost:5678
  description: Local ProximaDB server
paths:
  /api/v2/collections:
    get:
      tags:
      - Collections
      summary: List collections.
      description: |-
        List all collections with pagination.

        ## Query Parameters

        - `limit`: Maximum number of collections to return (default: 100)
        - `offset`: Offset for pagination (default: 0)
        - `include_stats`: Whether to include collection statistics

        ## Response

        Returns [`ListCollectionsV2Response`] with collection list.

        ## Errors

        - `500 Internal Server Error`: List operation failed
      operationId: listCollections
      parameters:
      - name: limit
        in: query
        description: 'Maximum number of collections to return (default: 100)'
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: offset
        in: query
        description: 'Offset for pagination (default: 0)'
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: include_stats
        in: query
        description: Whether to include statistics
        required: false
        schema:
          type: boolean
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsV2Response'
    post:
      tags:
      - Collections
      summary: Create a collection with optional schema.
      description: |-
        Create a new collection with optional schema support.

        ## Request Body

        See [`CreateCollectionV2Request`] for the expected JSON format.

        ## Response

        Returns [`CreateCollectionV2Response`] with collection details.

        ## Errors

        - `400 Bad Request`: Invalid request or schema
        - `409 Conflict`: Collection already exists
        - `500 Internal Server Error`: Creation failed
      operationId: createCollection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionV2Request'
        required: true
      responses:
        '200':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionV2Response'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/collections/{collection_id}:
    get:
      tags:
      - Collections
      summary: Get collection details.
      description: |-
        Get collection details including schema and statistics.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Response

        Returns [`CollectionV2Response`] with collection details.

        ## Errors

        - `404 Not Found`: Collection does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getCollection
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionV2Response'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Collections
      summary: Delete a collection.
      description: |-
        Delete a collection by ID/name. This v2 route keeps SDK lifecycle methods on
        the ProximaRecord-era API while delegating to the existing collection control
        plane.
      operationId: deleteCollection
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionV2Response'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/documents:
    post:
      tags:
      - Documents
      summary: Ingest documents for native server-side embedding.
      description: Canonical document-ingest surface (ADR-041, spec-driven-primary). Body `{records:[{id,text,metadata}]}`; the server embeds `text` natively under `X-Embed-Source=native` (default) when no per-record `vector` is supplied. `X-Tenant-ID` scopes records to a tenant; `X-Ingest-Mode` carries the billing mode.
      operationId: ingestDocuments
      parameters:
      - name: collection_id
        in: path
        description: Target collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDocumentsRequest'
        required: true
      responses:
        '200':
          description: Ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestDocumentsResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/entities:
    post:
      tags:
      - Entities
      operationId: upsert_entity_v2
      parameters:
      - name: collection_id
        in: path
        description: Collection backing the entities
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertEntityRequest'
        required: true
      responses:
        '200':
          description: Entity upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertEntityResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upsert failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/entities/search:
    post:
      tags:
      - Entities
      operationId: search_entities_v2
      parameters:
      - name: collection_id
        in: path
        description: Collection backing the entities
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEntitiesRequest'
        required: true
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEntitiesResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Search failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/entities/{entity_id}:
    get:
      tags:
      - Entities
      operationId: get_entity_v2
      parameters:
      - name: collection_id
        in: path
        description: Collection backing the entities
        required: true
        schema:
          type: string
      - name: entity_id
        in: path
        description: Entity ID
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Entity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDto'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Entities
      operationId: delete_entity_v2
      parameters:
      - name: collection_id
        in: path
        description: Collection backing the entities
        required: true
        schema:
          type: string
      - name: entity_id
        in: path
        description: Entity ID
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Entity deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertEntityResponse'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Delete failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/records/batch:
    post:
      tags:
      - Records
      summary: Insert or upsert ProximaRecord batches.
      description: |-
        Insert ProximaRecords into a collection with typed field support.

        ## Request Body

        See [`InsertRecordsRequest`] for the expected JSON format.

        ## Response

        Returns [`InsertRecordsResponse`] with counts and any errors.

        ## Errors

        - `400 Bad Request`: Invalid request format or validation error
        - `404 Not Found`: Collection does not exist
        - `500 Internal Server Error`: Storage or processing error
      operationId: insertRecords
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertRecordsRequest'
        required: true
      responses:
        '200':
          description: Batch write result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertRecordsResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/records/scan:
    post:
      tags:
      - Records
      summary: Paginated scan of records in a collection.
      description: |-
        Returns the next page of records (TD-099 acceptance 2 + 3, live).
        Cursor-based pagination: pass the response's `next_cursor` back as
        `cursor` to fetch the next page; a `null` cursor means the scan is
        exhausted. Cursors are minted and validated against the caller-facing
        collection id in the URL path, expire after 24h (HTTP 410), and reject
        cross-collection reuse (HTTP 400).
      operationId: scanRecords
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRecordsRequest'
        required: true
      responses:
        '200':
          description: Page of records + optional next cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRecordsResponse'
        '400':
          description: Invalid request (including a cursor minted for a different collection).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Collection changed during the scan; restart pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Cursor expired (older than 24h); restart the scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/records/{record_id}:
    get:
      tags:
      - Records
      summary: Get a record by ID.
      description: |-
        Get a single record by ID.

        ## Path Parameters

        - `collection_id`: Collection name/ID
        - `record_id`: Record ID

        ## Query Parameters

        - `include_vector`: Whether to include the vector (default: true)
        - `include_text`: Whether to include TEXT fields (default: false)

        ## Response

        Returns [`RecordV2Response`] with record details.

        ## Errors

        - `404 Not Found`: Collection or record does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getRecord
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: record_id
        in: path
        description: Record ID.
        required: true
        schema:
          type: string
      - name: include_vector
        in: query
        description: Whether to include the vector in the response
        required: false
        schema:
          type: boolean
      - name: include_text
        in: query
        description: Whether to include TEXT fields in the response
        required: false
        schema:
          type: boolean
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordV2Response'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Records
      summary: Delete a record by ID.
      description: Delete a single record by writing a tombstone through the rich record path.
      operationId: deleteRecord
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: record_id
        in: path
        description: Record ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Delete accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRecordV2Response'
  /api/v2/collections/{collection_id}/schema:
    get:
      tags:
      - Schema
      summary: Get collection schema.
      description: |-
        Retrieve the schema definition for a collection.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Response

        Returns [`SchemaResponse`] with full schema details.

        ## Errors

        - `404 Not Found`: Collection or schema does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getCollectionSchema
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Collection schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Schema
      summary: Update collection schema.
      description: |-
        Update the schema for a collection.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Request Body

        See [`UpdateSchemaRequest`] for the expected JSON format.

        ## Response

        Returns [`UpdateSchemaResponse`] with change details.

        ## Schema Evolution

        Schema updates must follow evolution rules to maintain data compatibility.
        See [`UpdateSchemaRequest`] for detailed rules.

        ## Errors

        - `400 Bad Request`: Invalid schema or evolution violation
        - `404 Not Found`: Collection does not exist
        - `409 Conflict`: Incompatible schema change
        - `500 Internal Server Error`: Update failed
      operationId: updateCollectionSchema
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchemaRequest'
        required: true
      responses:
        '200':
          description: Schema updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSchemaResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/collections/{collection_id}/search:
    post:
      tags:
      - Search
      summary: Search records with vector similarity and typed filters.
      description: |-
        Search a collection with typed filters.

        ## Request Body

        See [`TypedSearchRequest`] for the expected JSON format.

        ## Response

        Returns [`TypedSearchResponse`] with ranked results.

        ## Errors

        - `400 Bad Request`: Invalid request format or filter error
        - `404 Not Found`: Collection does not exist
        - `500 Internal Server Error`: Search execution error
      operationId: searchRecords
      parameters:
      - name: collection_id
        in: path
        description: Collection name/ID.
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypedSearchRequest'
        required: true
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypedSearchResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/graphs/{graph_id}/fusion-search:
    post:
      tags:
      - graphs
      summary: '`POST /api/v2/graphs/{graph_id}/fusion-search` — vector seed → graph expand → calibrated fuse-by-oid.'
      operationId: fusion_search_v2
      parameters:
      - name: graph_id
        in: path
        description: Graph ID for traversal expansion
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FusionSearchRequest'
        required: true
      responses:
        '200':
          description: Fusion results with calibrated scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusionSearchResponse'
        '400':
          description: Invalid request (empty query_vector, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fusion execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/graphs/{graph_id}/impact-analysis:
    post:
      tags:
      - graphs
      summary: |-
        `POST /api/v2/graphs/{graph_id}/impact-analysis` — forward/backward blast radius (TD-131). The
        server-side baseline for the embedded-parity gate; mirrors `GraphOperationsService::impact_analysis`.
      operationId: impact_analysis_v2
      parameters:
      - name: graph_id
        in: path
        description: Graph ID
        required: true
        schema:
          type: string
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpactAnalysisRequest'
        required: true
      responses:
        '200':
          description: Impacted node ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactAnalysisResponse'
        '400':
          description: Missing graph_id/node_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Impact analysis failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/model-registries:
    get:
      tags:
      - Model Registry
      operationId: listModelRegistries
      responses:
        '200':
          description: Tenant-scoped registries in deterministic name order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelRegistriesResponse'
      parameters:
      - name: X-Tenant-ID
