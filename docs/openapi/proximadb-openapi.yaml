      - count
      - objects
      properties:
        count:
          type: integer
          format: uint64
        objects:
          type: array
          items:
            $ref: '#/components/schemas/AbacPredicateObjectResponse'
    AbacGrantee:
      description: |
        Who a grant admits — an externally-tagged Rust enum. Exactly one
        of `Tenant` (every subject of that tenant) or `User` (one specific
        subject, possibly of a foreign tenant) is present.
      oneOf:
      - type: object
        required:
        - Tenant
        properties:
          Tenant:
            type: integer
            format: uint64
      - type: object
        required:
        - User
        properties:
          User:
            $ref: '#/components/schemas/AbacGranteeUser'
    AbacGranteeUser:
      type: object
      required:
      - tenant_stable_id
      - subject
      description: The `User` variant payload of [AbacGrantee](#/components/schemas/AbacGrantee).
      properties:
        tenant_stable_id:
          type: integer
          format: uint64
        subject:
          type: string
    AbacGrantAction:
      type: string
      enum:
      - Read
      - Write
      - Ddl
      - Grant
      description: |
        `Grant` is delegation authority (further re-grant); it is not
        consulted for data access, only by the admin surface.
    AbacGrantGranteeRequest:
      type: object
      required:
      - tenant
      description: |
        Grantee as provisioned over the wire: a tenant-wide share when
        `subject` is omitted/empty, else one user of (possibly foreign)
        `tenant`. Clients supply tenant/subject strings; stable ids are
        resolved server-side.
      properties:
        tenant:
          type: string
        subject:
          type:
          - string
          - 'null'
    AbacPostGrantRequest:
      type: object
      required:
      - owner_tenant
      - resource
      - grantee
      - actions
      description: Body for `POST /api/v2/abac/grants`.
      properties:
        owner_tenant:
          type: string
          description: The resource-owner tenant (string; resolved and must be minted).
        resource:
          $ref: '#/components/schemas/AbacScope'
        grantee:
          $ref: '#/components/schemas/AbacGrantGranteeRequest'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AbacGrantAction'
          uniqueItems: true
        predicate_ref:
          type:
          - integer
          - 'null'
          format: uint64
        field_mask:
          oneOf:
          - $ref: '#/components/schemas/AbacFieldMask'
          - type: 'null'
        expires_at_ms:
          type:
          - integer
          - 'null'
          format: int64
    AbacPostGrantResponse:
      type: object
      required:
      - grant_id
      - owner_tenant_stable_id
      properties:
        grant_id:
          type: string
        owner_tenant_stable_id:
          type: integer
          format: uint64
    AbacGrantRecord:
      type: object
      required:
      - grant_id
      - owner_tenant_stable_id
      - resource
      - grantee
      - actions
      - created_at_ms
      properties:
        grant_id:
          type: string
        owner_tenant_stable_id:
          type: integer
          format: uint64
        resource:
          $ref: '#/components/schemas/AbacScope'
        grantee:
          $ref: '#/components/schemas/AbacGrantee'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AbacGrantAction'
        predicate_ref:
          type:
          - integer
          - 'null'
          format: uint64
        field_mask:
          oneOf:
          - $ref: '#/components/schemas/AbacFieldMask'
          - type: 'null'
        created_at_ms:
          type: integer
          format: int64
        expires_at_ms:
          type:
          - integer
          - 'null'
          format: int64
        revoked_at_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Set once revoked; the record stays listed (audit trail).
    AbacGrantEnforcement:
      type: string
      enum:
      - Off
      - Audit
      - Enforce
      description: |
        Rollout is intended `Off` -> `Audit` (would-be-denials logged, read
        still admitted) -> `Enforce` (no applicable grant denies).
    AbacPutTenantPostureRequest:
      type: object
      required:
      - grant_enforcement
      properties:
        grant_enforcement:
          $ref: '#/components/schemas/AbacGrantEnforcement'
    AbacTenantSecurityPosture:
      type: object
      required:
      - tenant_stable_id
      - grant_enforcement
      - updated_at_ms
      properties:
        tenant_stable_id:
          type: integer
          format: uint64
        grant_enforcement:
          $ref: '#/components/schemas/AbacGrantEnforcement'
        updated_at_ms:
          type: integer
          format: int64
    PinTarget:
      type: string
      enum:
      - memory
      - nvme_ssd
      - cloud
      description: |
        Physical medium to pin to. `cloud` effectively means "do not
        promote this collection" (an explicit unpin-in-spirit).
    PinRequest:
      type: object
      required:
      - pinned
      description: |
        Body for `PATCH /api/v2/collections/{collection_id}/pin`. Either
        `{pinned: true, target: ..., replicas?: ...}` or `{pinned: false}`
        (target/replicas ignored when unpinning; `target` is REQUIRED
        when pinning — a plain-text 400 otherwise). `replicas` defaults
        to 1.
      properties:
        pinned:
          type: boolean
        target:
          oneOf:
          - $ref: '#/components/schemas/PinTarget'
          - type: 'null'
        replicas:
          type:
          - integer
          - 'null'
          format: uint32
    PinResponse:
      type: object
      required:
      - status
      - collection_id
      description: |
        Internally tagged by `status` (snake_case). `status: "pinned"`
        carries `target`/`replicas`/`pinned_at_ns`; `status: "unpinned"`
        carries `was_pinned` (true when the request removed an existing
        pin — useful for audit logs; false on a no-op or read of an
        unpinned collection).
      properties:
        status:
          type: string
          enum:
          - pinned
          - unpinned
        collection_id:
          type: string
        target:
          $ref: '#/components/schemas/PinTarget'
        replicas:
          type: integer
          format: uint32
        pinned_at_ns:
          type: integer
          format: int64
        was_pinned:
          type: boolean
    PinListItem:
      type: object
      required:
      - collection_id
      - target
      - replicas
      - pinned_at_ns
      properties:
        collection_id:
          type: string
        target:
          $ref: '#/components/schemas/PinTarget'
        replicas:
          type: integer
          format: uint32
        pinned_at_ns:
          type: integer
          format: int64
    PinListResponse:
      type: object
      required:
      - count
      - items
      properties:
        count:
          type: integer
          format: uint64
        items:
          type: array
          items:
            $ref: '#/components/schemas/PinListItem'
    AffinityResponse:
      type: object
      required:
      - status
      - collection_id
      description: |
        Internally tagged by `status` (snake_case). `status:
        "affinitized"` carries the entry — including STALE entries
        (routing already ignores them; `stale: true` flags them for the
        operator) — with `query_count` (monotonic queries served while
        this node held affinity) and `age_seconds` (seconds since the
        last recorded query). `status: "not_affinitized"` means no
        entry exists at all.
      properties:
        status:
          type: string
          enum:
          - affinitized
          - not_affinitized
        collection_id:
          type: string
        node_id:
          type: string
        query_count:
          type: integer
          format: uint64
        age_seconds:
          type: integer
          format: uint64
        stale:
          type: boolean
    AffinityDeleteResponse:
      type: object
      required:
      - status
      - collection_id
      - dropped
      description: |
        `status` is always `"dropped"`; the `dropped` flag
        distinguishes an actual removal from a no-op.
      properties:
        status:
          type: string
          enum:
          - dropped
        collection_id:
          type: string
        dropped:
          type: boolean
    AffinityListItem:
      type: object
      required:
      - collection_id
      - node_id
      - query_count
      - age_seconds
      - stale
      properties:
        collection_id:
          type: string
        node_id:
          type: string
        query_count:
          type: integer
          format: uint64
        age_seconds:
          type: integer
          format: uint64
        stale:
          type: boolean
    AffinityListResponse:
      type: object
      required:
      - count
      - items
      properties:
        count:
          type: integer
          format: uint64
        items:
          type: array
          items:
            $ref: '#/components/schemas/AffinityListItem'
    AssignmentReason:
      type: string
      enum:
      - create
      - operator
      - failover
      - rebalance
      - catalog_replay
      description: |
        Why an assignment was made (locked vocabulary for dashboards /
        EXPLAIN). `catalog_replay` = loaded from durable state at
        restart, not freshly assigned.
    PrimaryPod:
      type: object
      required:
      - pod
      - assigned_at_ns
      - reason
      properties:
        pod:
          type: string
          description: Pod identifier (typically a k8s pod name); opaque.
        assigned_at_ns:
          type: integer
          format: int64
          description: Wall-clock nanoseconds when last set; reassignments advance it.
        reason:
          $ref: '#/components/schemas/AssignmentReason'
    PrimaryPodLookupResponse:
      type: object
      required:
      - status
      - tenant_id
      - collection_id
      description: |
        Internally tagged by `status` (snake_case). `status: "bound"`
        carries `primary`; `status: "unbound"` means no binding (never
        a 404).
      properties:
        status:
          type: string
          enum:
          - bound
          - unbound
        tenant_id:
          type: string
        collection_id:
          type: string
        primary:
          $ref: '#/components/schemas/PrimaryPod'
    PrimaryPodAssignRequest:
      type: object
      required:
      - pod
      description: |
        Body for `PUT /api/v2/primary-pod/{tenant_id}/{collection_id}`.
        `reason` defaults to `"operator"` when omitted.
      properties:
        pod:
          type: string
        reason:
          $ref: '#/components/schemas/AssignmentReason'
    PrimaryPodAssignResponse:
      type: object
      required:
      - tenant_id
      - collection_id
      - primary
      properties:
        tenant_id:
          type: string
        collection_id:
          type: string
        primary:
          $ref: '#/components/schemas/PrimaryPod'
        previous:
          oneOf:
          - $ref: '#/components/schemas/PrimaryPod'
          - type: 'null'
          description: The prior binding on re-assignment; null on first assignment.
    PrimaryPodUnassignResponse:
      type: object
      required:
      - tenant_id
      - collection_id
      - removed
      properties:
        tenant_id:
          type: string
        collection_id:
          type: string
        removed:
          type: boolean
          description: True when a binding was actually removed; false when nothing was bound.
    PrimaryPodListItem:
      type: object
      required:
      - tenant_id
      - collection_id
      - primary
      properties:
        tenant_id:
          type: string
        collection_id:
          type: string
        primary:
          $ref: '#/components/schemas/PrimaryPod'
    PrimaryPodListResponse:
      type: object
      required:
      - count
      - items
      properties:
        count:
          type: integer
          format: uint64
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrimaryPodListItem'
    PrimaryPodOperatorErrorResponse:
      type: object
      required:
      - error
      - message
      - code
      description: |
        The FLAT error shape the primary-pod operator endpoints return
        (`{error, message, code}`, `error` a short machine-readable
        slug). Same convention as `AbacOperatorErrorResponse`; carried
        as its own schema because the two handler families define the
        type independently.
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AbacUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler with
        no resolved principal, indicating the auth middleware itself is
        misconfigured for this deployment (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    AbacForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — this is a
        cluster-scope operator surface; a tenant's own admin permissions
        do not satisfy it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    AbacTenantUnresolved:
      description: |
        The tenant path/body segment has no durable stable id and the
        configured catalog could not mint one (`error:
        "tenant_unresolved"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    AbacUnavailable:
      description: |
        ABAC is compiled in (`abac-policy`) but no durable store is open
        for this process (no `data_dir`), or the underlying store returned
        an error (`error: "abac_unavailable"` / `"grant_store_error"` /
        `"posture_store_error"` / `"tenant_mint_failed"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbacOperatorErrorResponse'
    PodUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler
        with no resolved principal (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrimaryPodOperatorErrorResponse'
    PodForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — a cluster-scope
        operator gate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrimaryPodOperatorErrorResponse'
tags:
- name: Collections
  description: Collection lifecycle.
- name: Schema
  description: Typed schema management.
- name: Records
  description: ProximaRecord write / read / scan.
- name: Search
  description: Vector similarity + typed-filter search.
- name: Query
  description: AQL / UQL query facade.
- name: SQL
  description: Authenticated single-statement SQL transport.
- name: Entities
  description: Entity orchestration (graph node + embeddings + provenance).
- name: Documents
  description: Native-embedding document ingest.
- name: Model Registry
  description: Tenant-scoped embedding-model lifecycle backed by xCatalog.
security:
- bearerAuth: []
