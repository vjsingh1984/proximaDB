components:
  parameters:
    GraphId:
      in: path
      name: graph_id
      required: true
      schema:
        minLength: 1
        type: string
    NodeId:
      in: path
      name: node_id
      required: true
      schema:
        minLength: 1
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Invalid request.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Resource not found.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Authentication required or insufficient permissions.
  schemas:
    ApplyModelRegistryMutationRequest:
      properties:
        expected_revision:
          description: Optimistic concurrency token returned by the previous read or mutation.
          format: int64
          minimum: 0
          type: integer
        mutation:
          $ref: '#/components/schemas/CatalogModelRegistryMutation'
          description: Command-shaped mutation; whole-registry replacement is intentionally unsupported.
      required:
      - expected_revision
      - mutation
      type: object
    BatchCreateEdgesRequest:
      description: |
        Body for `POST /api/v2/graphs/{id}/edges/batch`.
      properties:
        edges:
          items:
            $ref: '#/components/schemas/EdgeInput'
          minItems: 1
          type: array
      required:
      - edges
      type: object
    BatchCreateNodesRequest:
      description: |
        Body for `POST /api/v2/graphs/{id}/nodes/batch`.
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/NodeInput'
          minItems: 1
          type: array
      required:
      - nodes
      type: object
    BatchEdgesResponse:
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<BatchResults<Edge>>` envelope.
      properties:
        data:
          additionalProperties: true
          properties:
            count:
              type: integer
            results:
              items:
                $ref: '#/components/schemas/EdgeResponse'
              type: array
          type: object
        success:
          type: boolean
      type: object
    BatchNodesResponse:
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<BatchResults<Node>>` envelope.
      properties:
        data:
          additionalProperties: true
          properties:
            count:
              type: integer
            results:
              items:
                $ref: '#/components/schemas/NodeResponse'
              type: array
          type: object
        success:
          type: boolean
      type: object
    CapabilitiesResponse:
      additionalProperties: true
      properties:
        api_version:
          type: string
        error_envelope:
          additionalProperties: true
          type: object
        features:
          items:
            type: string
          type: array
        limits:
          additionalProperties: true
          type: object
        surface:
          type: string
      type: object
    CatalogArtifactDescriptor:
      description: Content-addressed reference to bytes held outside xCatalog.
      properties:
        digest:
          type: string
        media_type:
          type: string
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        uri:
          type: string
      required:
      - uri
      - digest
      - size_bytes
      - media_type
      type: object
    CatalogDeploymentBinding:
      description: Mutable serving intent that always resolves to an immutable version/digest.
      properties:
        artifact_digest:
          type: string
        endpoint:
          type: string
        name:
          type: string
        runtime:
          type: string
        updated_at_ms:
          format: int64
          type: integer
        version:
          format: int64
          minimum: 0
          type: integer
      required:
      - name
      - version
      - artifact_digest
      - runtime
      - endpoint
      - updated_at_ms
      type: object
    CatalogDimensionPolicy:
      oneOf:
      - enum:
        - fixed
        type: string
      - enum:
        - discrete
        type: string
      - properties:
          range:
            $ref: '#/components/schemas/CatalogDimensionRange'
        required:
        - range
        type: object
    CatalogDimensionRange:
      properties:
        minimum:
          format: int32
          minimum: 0
          type: integer
      required:
      - minimum
      type: object
    CatalogEmbeddingInputContract:
      description: Exact rendered-input and tokenizer budget consumed by an embedding runtime.
      properties:
        declared_context_limit:
          format: int32
          minimum: 0
          type: integer
        document_parameters:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        document_template:
          type: string
        effective_context_limit:
          format: int32
          minimum: 0
          type: integer
        model_revision:
          type: string
        query_parameters:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        query_template:
          type: string
        special_token_count:
          format: int32
          minimum: 0
          type: integer
        tokenizer_fingerprint:
          type: string
        tokenizer_id:
          type: string
        tokenizer_revision:
          type: string
      required:
      - model_revision
      - tokenizer_id
      - tokenizer_revision
      - tokenizer_fingerprint
      - declared_context_limit
      - effective_context_limit
      - special_token_count
      - document_template
      - query_template
      type: object
    CatalogEmbeddingModelRegistry:
      description: |-
        Registered embedding model: immutable versions plus separately mutable or
        append-only lifecycle records.
      properties:
        aliases:
          additionalProperties:
            format: int64
            minimum: 0
            type: integer
          propertyNames:
            type: string
          type: object
        decisions:
          items:
            $ref: '#/components/schemas/CatalogModelDecision'
          type: array
        deployments:
          additionalProperties:
            $ref: '#/components/schemas/CatalogDeploymentBinding'
          propertyNames:
            type: string
          type: object
        evidence:
          items:
            $ref: '#/components/schemas/CatalogEvaluationEvidence'
          type: array
        name:
          type: string
        revision:
          description: |-
            Optimistic concurrency token for catalog/API mutations. Old rows default
            to zero; every successful command increments it.
          format: int64
          minimum: 0
          type: integer
        schema_version:
          format: int32
          minimum: 0
          type: integer
        tags:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        versions:
          additionalProperties:
            $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
          propertyNames:
            format: int64
            minimum: 0
            type: integer
          type: object
      required:
      - schema_version
      - name
      type: object
    CatalogEmbeddingModelVersion:
      description: Immutable executable contract for one registered model version.
      properties:
        artifact:
          $ref: '#/components/schemas/CatalogArtifactDescriptor'
        created_at_ms:
          format: int64
          type: integer
        governance:
          $ref: '#/components/schemas/CatalogModelGovernance'
        input:
          $ref: '#/components/schemas/CatalogEmbeddingInputContract'
        lineage:
          $ref: '#/components/schemas/CatalogModelLineage'
        output:
          $ref: '#/components/schemas/CatalogEmbeddingOutputContract'
        provider_model_id:
          type: string
        source_run_id:
          type:
          - string
          - 'null'
        version:
          format: int64
          minimum: 0
          type: integer
      required:
      - version
      - provider_model_id
      - artifact
      - input
      - output
      - created_at_ms
      type: object
    CatalogEmbeddingOutputContract:
      properties:
        dimension_policy:
          $ref: '#/components/schemas/CatalogDimensionPolicy'
        native_dimension:
          format: int32
          minimum: 0
          type: integer
        normalized:
          type: boolean
        pooling:
          type: string
        supported_dimensions:
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
      required:
      - native_dimension
      - dimension_policy
      - supported_dimensions
      - normalized
      - pooling
      type: object
    CatalogEvaluationEvidence:
      description: Append-only evaluation summary. Large row-level results remain external.
      properties:
        created_at_ms:
          format: int64
          type: integer
        dataset_digest:
          type: string
        dataset_name:
          type: string
        evaluator:
          type: string
        evidence_id:
          type: string
        metrics:
          additionalProperties:
            format: double
            type: number
          propertyNames:
            type: string
          type: object
        version:
          format: int64
          minimum: 0
          type: integer
      required:
      - evidence_id
      - version
      - dataset_name
      - dataset_digest
      - evaluator
      - metrics
      - created_at_ms
      type: object
    CatalogLineageInput:
      description: Digest-pinned input consumed by the execution that produced a model.
      properties:
        digest:
          type: string
        kind:
          $ref: '#/components/schemas/CatalogLineageInputKind'
        name:
          type: string
      required:
      - kind
      - name
      - digest
      type: object
    CatalogLineageInputKind:
      enum:
      - dataset
      - feature_set
      - model
      - artifact
      type: string
    CatalogModelAccess:
      enum:
      - open
      - gated
      - unreviewed
      type: string
    CatalogModelAliasMutation:
      properties:
        alias:
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
      - alias
      - version
      type: object
    CatalogModelDecision:
      description: Append-only policy/audit decision, intentionally separate from evidence.
      properties:
        created_at_ms:
          format: int64
          type: integer
        decision:
          $ref: '#/components/schemas/CatalogModelDecisionKind'
        decision_id:
          type: string
        evidence_ids:
          items:
            type: string
          type: array
        principal:
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
      - decision_id
      - version
      - decision
      - evidence_ids
      - principal
      - created_at_ms
      type: object
    CatalogModelDecisionKind:
      enum:
      - approved
      - rejected
      - deprecated
      type: string
    CatalogModelGovernance:
      description: |-
        Supply-chain and runtime policy declared for an immutable model version.
        Approval decisions remain separate append-only audit records.
      properties:
        access:
          $ref: '#/components/schemas/CatalogModelAccess'
        approved_runtimes:
          items:
            type: string
          type: array
          uniqueItems: true
        license_id:
          type: string
        requires_remote_code:
          type: boolean
      type: object
    CatalogModelLineage:
      description: MLMD/OpenLineage-shaped producer execution and its declared inputs.
      properties:
        code_revision:
          type:
          - string
          - 'null'
        inputs:
          items:
            $ref: '#/components/schemas/CatalogLineageInput'
          type: array
        producer_execution_id:
          type:
          - string
          - 'null'
      type: object
    CatalogModelRegistryMutation:
      description: |-
        Command-shaped mutations preserve version/evidence/decision immutability at
        the persistence boundary. API adapters lower into these commands instead
        of replacing a whole registry document.
      oneOf:
      - properties:
          operation:
            enum:
            - register_version
            type: string
          payload:
            $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
        required:
        - payload
        - operation
        title: RegisterModelVersionMutation
        type: object
      - properties:
          operation:
            enum:
            - set_alias
            type: string
          payload:
            $ref: '#/components/schemas/CatalogModelAliasMutation'
        required:
        - payload
        - operation
        type: object
      - properties:
          operation:
            enum:
            - append_evidence
            type: string
          payload:
            $ref: '#/components/schemas/CatalogEvaluationEvidence'
        required:
        - payload
        - operation
        title: AppendModelEvidenceMutation
        type: object
      - properties:
          operation:
            enum:
            - record_decision
            type: string
          payload:
            $ref: '#/components/schemas/CatalogModelDecision'
        required:
        - payload
        - operation
        title: RecordModelDecisionMutation
        type: object
      - properties:
          operation:
            enum:
            - upsert_deployment
            type: string
          payload:
            $ref: '#/components/schemas/CatalogDeploymentBinding'
        required:
        - payload
        - operation
        title: UpsertModelDeploymentMutation
        type: object
    CollectionStatsV2:
      description: Collection statistics for v2 API
      properties:
        indexed_fields:
          description: Number of indexed fields
          format: int32
          minimum: 0
          type: integer
        record_count:
          description: |-
            Total number of records, or `null` when the server does not know.

            `null` is a real answer here, not a gap. The counter is maintained by
            `MetadataStore::update_stats`, which the record write path does not call,
            so a collection that has never had stats written carries none. Reporting
            `0` in that case is a *confident wrong answer* — indistinguishable from a
            genuinely empty collection, and it cost one downstream project a false
            durability bug report before the cause was found (#1527).
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        storage_size_bytes:
          description: Total storage size in bytes
          format: int64
          minimum: 0
          type: integer
        text_field_count:
          description: Number of TEXT fields with dedicated storage
          format: int32
          minimum: 0
          type: integer
      required:
      - storage_size_bytes
      - indexed_fields
      - text_field_count
      type: object
    CollectionV2Response:
      description: Collection details response
      properties:
        canonical_embedding_precision:
          description: |-
            Canonical embedding precision label for stored vectors.

            Stable string matching the proto `EmbeddingPrecision::as_str_name()`
            (e.g. "EMBEDDING_PRECISION_FP16"). `None` when the collection didn't
            set a non-default (Unspecified/Fp32) precision.
          type:
          - string
          - 'null'
        collection_id:
          description: Collection ID
          type: string
        created_at:
          description: Creation timestamp
          type: string
        dimension:
          description: Vector dimension
          format: int32
          minimum: 0
          type: integer
        distance_metric:
          description: Distance metric
          type: string
        engine:
          description: Storage engine
          type: string
        index_specs:
          description: |-
            Per-index config (HNSW/IVF params, is_primary) as persisted at create
            time. Mirrors the gRPC-v2 `GetCollection` `index_specs` (TD-122 parity).
          items:
            $ref: '#/components/schemas/IndexSpecOutput'
          type: array
        name:
          description: Collection name
          type: string
        proxima_record_enabled:
          description: Whether ProximaRecord is enabled
          type: boolean
        quantization:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuantizationConfigOutput'
            description: Quantization config as persisted at create time, or `None` when unset.
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SchemaDefinition'
            description: Schema definition (if defined)
        stats:
          $ref: '#/components/schemas/CollectionStatsV2'
          description: Collection statistics
        updated_at:
          description: Last update timestamp
          type:
          - string
          - 'null'
      required:
      - collection_id
      - name
      - dimension
      - engine
      - distance_metric
      - proxima_record_enabled
      - stats
      - index_specs
      - created_at
      type: object
    CollectionV2Summary:
      description: Summary of a collection for list operations
      properties:
        collection_id:
          description: Collection ID
          type: string
        dimension:
          description: Vector dimension
          format: int32
          minimum: 0
          type: integer
        engine:
          description: Storage engine
          type: string
        name:
          description: Collection name
          type: string
        proxima_record_enabled:
          description: Whether ProximaRecord is enabled
          type: boolean
        record_count:
          description: Record count (if include_stats is true)
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - collection_id
      - name
      - dimension
      - engine
      - proxima_record_enabled
      type: object
    CreateCollectionV2Request:
      description: |-
        Request to create a collection with schema support

        ## Example JSON

        ```json
        {
            "name": "products",
            "dimension": 768,
            "engine": "sst",
            "schema": {
                "columns": [
                    {"name": "category", "data_type": "text", "indexed": true},
                    {"name": "price", "data_type": "float", "filterable": true},
                    {"name": "description", "data_type": "text", "max_length": 10000}
                ],
                "enforcement": "hybrid",
                "allow_additional_fields": true
            },
            "enable_proxima_record": true
        }
        ```
      properties:
        canonical_embedding_precision:
          description: |-
            Canonical embedding precision for stored vectors

            Options: "fp32" (default), "fp16", "bf16", "int8", "uint8".
            Accepts the same string forms as the gRPC / Arrow Flight surfaces
            (e.g. "half", "float16", "EMBEDDING_PRECISION_FP16"). The DDL
            service applies the same normalisation, so SDKs and pgwire
            converge on the same enum discriminant.
          type:
          - string
          - 'null'
        dimension:
          description: Vector dimension (required)
          format: int32
          minimum: 1
          type: integer
        distance_metric:
          description: |-
            Distance metric for vector similarity

            Options: "cosine", "euclidean", "dot_product"
            Default: "cosine"
          type:
          - string
          - 'null'
        enable_proxima_record:
          description: |-
            Enable ProximaRecord support for this collection

            When enabled:
            - Records can use rich props and text_fields
            - Schema validation is applied at insert time
            - TEXT columns are stored in dedicated columnar format

            Default: false (backward compatible with v1)
          type:
          - boolean
          - 'null'
        engine:
          description: |-
            Storage engine selection

            Options: "auto", "sst", "helix", "viper", "swift", "nova", "raptor", "tst"
            Default: "auto" (system selects optimal engine)
          type:
          - string
          - 'null'
        index_configs:
          description: |-
            Index configurations (e.g. an explicit IVF or HNSW index).

            Restores v1 parity: the v1 proto create accepted `index_configs`, which
            drive `active_algorithm_for` (e.g. an IVF index → recall-tune dispatches
            to the IVF arm). When omitted, the engine selects a default (HNSW).
          items:
            $ref: '#/components/schemas/IndexConfigInput'
          type:
          - array
          - 'null'
        index_policy:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IndexPolicyInput'
            description: |-
              Per-collection cold/warm search routing policy (ADR-028). When omitted,
              the system decides cost-derived (`mode = "auto"`). Owners with hard SLAs
              override here; query-time precedence is per-query `search_mode` > this
              policy > cost-model auto-default.
        initial_capacity:
          description: Initial capacity hint for pre-allocation
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        name:
          description: Collection name (required)
          minLength: 1
          type: string
        quantization:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuantizationConfigInput'
            description: |-
              Quantization config (gRPC-v2 parity). When omitted, quantization is
              left unset (engine default).
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SchemaDefinition'
            description: Schema definition with column types
        tags:
          description: |-
            Operator metadata tags, e.g. `"recall_target:0.95"`,
            `"target_vector_count:1000"`, `"modalities:text,image"`. Consumed by the
            recall advisor / route-health (`services/collection/recall_target.rs`).
          items:
            type: string
          type:
          - array
          - 'null'
      required:
      - name
      - dimension
      type: object
    CreateCollectionV2Response:
      description: Response for collection creation
      properties:
        collection_id:
          description: Collection ID (same as name)
          type: string
        created_at:
          description: Creation timestamp
          type: string
        dimension:
          description: Vector dimension
          format: int32
          minimum: 0
          type: integer
        engine:
          description: Selected storage engine
          type: string
        name:
          description: Collection name
          type: string
        proxima_record_enabled:
          description: Whether ProximaRecord is enabled
          type: boolean
        schema_id:
          description: Schema ID (if schema was defined)
          type:
          - string
          - 'null'
      required:
      - collection_id
      - name
      - dimension
      - engine
      - proxima_record_enabled
      - created_at
      type: object
    CreateEdgeRequest:
      description: |
        Wrapped envelope: server expects `{"edge": EdgeInput}`.
      properties:
        edge:
          $ref: '#/components/schemas/EdgeInput'
      required:
      - edge
      type: object
    CreateGraphRequest:
      properties:
        description:
          nullable: true
          type: string
        graph_id:
          description: Unique identifier for the new graph collection.
          minLength: 1
          type: string
        name:
          description: Optional human-readable name (defaults to graph_id).
          nullable: true
          type: string
      required:
      - graph_id
      type: object
    CreateModelRegistryRequest:
      properties:
        name:
          description: Tenant-local registry name. Must be one traversal-free catalog segment.
          type: string
      required:
      - name
      type: object
    CreateNodeRequest:
      description: |
        Wrapped envelope: server expects `{"node": NodeInput}`.
      properties:
        node:
          $ref: '#/components/schemas/NodeInput'
      required:
      - node
      type: object
    DeleteCollectionV2Response:
      description: Response for deleting a collection through the v2 API.
      properties:
        collection_id:
          description: Deleted collection ID.
          type: string
        success:
          description: Whether the delete request was accepted.
          type: boolean
      required:
      - success
      - collection_id
      type: object
    DeleteGraphResponse:
      additionalProperties: true
      description: |
        204 No Content on success with an empty `GraphResponse` envelope;
        404 Not Found with an error envelope when the graph is missing.
      properties:
        success:
          type: boolean
      type: object
    DeleteNodeResponse:
      additionalProperties: true
      properties:
        id:
          type: string
        success:
          type: boolean
      type: object
    DeleteRecordV2Response:
      description: Response for deleting a single record.
      properties:
        id:
          description: Deleted record ID.
          type: string
        processing_time_us:
          description: Processing latency in microseconds.
          format: int64
          type: integer
        success:
          description: Whether the delete tombstone was accepted.
          type: boolean
      required:
      - success
      - id
      - processing_time_us
      type: object
    EdgeInput:
      description: |
        Edge payload nested inside `CreateEdgeRequest.edge`. Matches
        `RestEdgeInput` in proximadb-api's graph handler.
      properties:
        edge_type:
          type: string
        from_node_id:
          type: string
        id:
          minLength: 1
          type: string
        properties:
          additionalProperties: true
          type: object
        to_node_id:
          type: string
        weight:
          format: double
          nullable: true
          type: number
      required:
      - id
      - from_node_id
      - to_node_id
      - edge_type
      type: object
    EdgeResponse:
      additionalProperties: true
      properties:
        edge_type:
          nullable: true
          type: string
        from_node_id:
          type: string
        id:
          type: string
        properties:
          additionalProperties: true
          nullable: true
          type: object
        to_node_id:
          type: string
        weight:
          format: double
          nullable: true
          type: number
      required:
      - id
      type: object
    EmbeddingInput:
      properties:
        modality:
          nullable: true
          type: string
        model_id:
          nullable: true
          type: string
        vector:
          items:
            format: float
            type: number
          type: array
      required:
      - vector
      type: object
    EntityDto:
      properties:
        collection_id:
          type: string
        flexible_metadata:
          additionalProperties: {}
          propertyNames:
            type: string
          type: object
        id:
          type: string
      required:
      - id
      - collection_id
      - flexible_metadata
      type: object
    EntityEmbeddingInput:
      properties:
        dimension:
          format: int32
          minimum: 0
          type: integer
        modality:
          type:
          - string
          - 'null'
        model_id:
          type: string
        vector:
          items:
            format: float
            type: number
          type: array
      required:
      - model_id
      - vector
      type: object
    EntityProvenanceInput:
      properties:
        chunk_id:
          type: string
        chunk_position:
          format: int32
          minimum: 0
          type: integer
        extraction_method:
          type: string
        metadata:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        source_id:
          type: string
      type: object
    EntityRelationInput:
      properties:
        properties:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        relation_type:
          type: string
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        weight:
          format: float
          type: number
      required:
      - source_entity_id
      - target_entity_id
      - relation_type
      type: object
    EntitySearchResult:
      properties:
        entity:
          $ref: '#/components/schemas/EntityDto'
        score:
          format: float
          type: number
      required:
      - entity
      - score
      type: object
    ErrorBody:
      description: Inner body of [`ErrorResponse`].
      properties:
        code:
          description: HTTP status code.
          format: int32
          type: integer
        details:
          description: Optional structured context (e.g. migration hints).
          type:
          - object
          - 'null'
        message:
          type: string
        request_id:
          description: Correlation id (matches the X-Request-ID header).
          type:
          - string
          - 'null'
        type:
          description: Stable machine-readable error code (snake_case).
          example: collection_not_found
          type: string
      required:
      - type
      - message
      - code
      type: object
    ErrorResponse:
      description: |-
        Canonical ProximaDB error envelope (`{ error: { type, message, code } }`).

        `request_id` (also returned in the `X-Request-ID` response header) is present
        whenever the request passed through the request-id middleware; quote it in
        bug reports.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
      type: object
    ExplainQueryRequest:
      properties:
        collection:
          type:
          - string
          - 'null'
        language:
          $ref: '#/components/schemas/QueryLanguage'
        query:
          minLength: 1
          type: string
      required:
      - language
      - query
      type: object
    FusionHit:
      properties:
        labels:
          description: |-
            Graph node label(s) of the reached node. Exposed so cross-modal-joint
            consumers can correlate a fused hit by its graph label without a separate
            node lookup (#485). The expansion already reaches the node, so this is
            near-free to fill. Additive + back-compat (empty until populated).
          items:
            type: string
          type: array
        oid:
          type: string
        score:
          format: float
          type: number
        source_count:
          minimum: 0
          type: integer
      required:
      - oid
      - score
      - source_count
      type: object
    FusionSearchRequest:
      properties:
        consensus_beta:
          description: Consensus boost added to any `oid` present in ≥2 sources.
          format: float
          type:
          - number
          - 'null'
        document_collection:
          description: |-
            Collection whose document index to BM25-search. Defaults to `vector_collection` (documents
            co-indexed with the vectors share the record `oid`, so they merge by `oid`).
          type:
          - string
          - 'null'
        document_weight:
          description: Document modality weight (mirrors `vector_weight` / `graph_weight`). Defaults to 1.0.
          format: float
          type:
          - number
          - 'null'
        edge_types:
          items:
            type: string
          type: array
        grain:
          description: 'Graph contribution grain: `"nodes"` (default), `"edges"`, or `"both"`.'
          type:
          - string
          - 'null'
        graph_weight:
          format: float
          type:
          - number
          - 'null'
        limit:
          minimum: 0
          type: integer
        max_depth:
          description: k-hop expansion depth (bounded; default 1 — the validated sweet spot).
          format: int32
          minimum: 0
          type: integer
        max_seeds:
          description: How many of the top vector seeds to expand from (bounded expansion).
          minimum: 0
          type: integer
        min_weight_fraction:
          description: |-
            Cost-routing policy inputs (TD-141): drop negligible modalities (weight fraction) and budget each.
            When absent, fusion is unbounded.
          format: float
          type:
          - number
          - 'null'
        query_vector:
          description: Query embedding for the ANN seed.
          items:
            format: float
            type: number
          type: array
        rrf:
          description: Use the rank-based RRF fallback instead of PIT-calibrated linear.
          type: boolean
        text_query:
          description: |-
            Optional BM25/full-text query (TD-138). When present (and non-empty), fusion also searches the
            collection's document index and merges BM25 hits into the result by shared `oid` — tri-modal
            (vector + graph + document) fusion. Absent ⇒ vector+graph only (unchanged).
          type:
          - string
          - 'null'
        total_budget:
          minimum: 0
          type:
          - integer
          - 'null'
        vector_collection:
          description: Vector collection to seed from (its records co-indexed with this graph by `oid`).
          type: string
        vector_weight:
          format: float
          type:
          - number
          - 'null'
      required:
      - vector_collection
      - query_vector
      type: object
    FusionSearchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/FusionHit'
          type: array
        stats:
          $ref: '#/components/schemas/FusionStatsDto'
      required:
      - results
