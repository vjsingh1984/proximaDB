  /api/v2/abac/tenant-posture/{tenant}:
    parameters:
    - name: tenant
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - ABAC
      operationId: getTenantPosture
      summary: Get a tenant's explicit ABAC grant-enforcement posture.
      description: |
        404 means the tenant has NO explicit record — meaningfully
        different from `Off`, since an absent record means the tenant
        inherits the process default, which may itself be `Enforce`.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        '200':
          description: The tenant's explicit posture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacTenantSecurityPosture'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '404':
          description: No explicit posture record (tenant inherits the process default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacOperatorErrorResponse'
        '422':
          $ref: '#/components/responses/AbacTenantUnresolved'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    put:
      tags:
      - ABAC
      operationId: putTenantPosture
      summary: Set a tenant's ABAC grant-enforcement posture.
      description: |
        Intended rollout: `Off` -> `Audit` (watch would-be-denials fall to
        zero for this tenant) -> `Enforce`. Skipping the `Audit` rehearsal
        is how an operator breaks a customer's traffic.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbacPutTenantPostureRequest'
      responses:
        '200':
          description: The tenant's updated posture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacTenantSecurityPosture'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '422':
          $ref: '#/components/responses/AbacTenantUnresolved'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/abac/grants:
    post:
      tags:
      - ABAC
      operationId: postGrant
      summary: Provision an ADR-090 grant (cross-tenant entitlement).
      description: |
        Grants are the entitlement layer: "this grantee may perform these
        actions on this resource", where the grantee MAY be a foreign
        tenant or a foreign tenant's user — the one place cross-tenant
        sharing is expressible. Both the owner and the grantee tenant must
        resolve (fail-closed on unminted tenants); the grantee subject is
        deliberately NOT validated against the principal registry, so a
        share may be provisioned before its recipient's first login.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the body `tenant` field governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbacPostGrantRequest'
      responses:
        '200':
          description: The provisioned grant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacPostGrantResponse'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '422':
          $ref: '#/components/responses/AbacTenantUnresolved'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
