    get:
      tags:
      - ABAC
      operationId: listAttributeBindings
      summary: List every ABAC attribute binding.
      description: |
        Cluster-operator scope — every `(subject, tenant)` attribute
        binding across every tenant, by design (cross-tenant visibility is
        the point of an operator inspection endpoint).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — this is a cross-tenant operator view.
      responses:
        '200':
          description: Every attribute binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacAttributeBindingsResponse'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    post:
      tags:
      - ABAC
      operationId: postAttributeBinding
      summary: Upsert a subject's ABAC attribute binding.
      description: |
        The authority half of ABAC — a `(subject, tenant)`-keyed,
        multi-valued attribute set a policy's `predicate_ref` resolves
        against. Writes through the same store the live enforcer reads.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the body `tenant` field governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbacPostAttributeBindingRequest'
      responses:
        '200':
          description: The stored attribute binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacAttributeBinding'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '422':
          $ref: '#/components/responses/AbacTenantUnresolved'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/abac/predicate-objects:
    get:
      tags:
      - ABAC
      operationId: listPredicateObjects
      summary: List every registered ABAC predicate object.
      description: |
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      responses:
        '200':
          description: Every predicate object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacPredicateObjectsResponse'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/abac/predicate-objects/{object_id}:
    parameters:
    - name: object_id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
    get:
      tags:
      - ABAC
      operationId: getPredicateObject
      summary: Get one ABAC predicate object.
      description: |
        404 if unknown. Note a dangling `predicate_ref` on a policy binding
        resolves fail-closed (safe) regardless of this endpoint.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      responses:
        '200':
          description: The predicate object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacPredicateObjectResponse'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '404':
          description: No predicate object registered under this object_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacOperatorErrorResponse'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    put:
      tags:
      - ABAC
      operationId: putPredicateObject
      summary: Register (or replace) an ABAC predicate object.
      description: |
        The request body IS the `FilterExpression` directly (no wrapper) —
        a stored row-filter predicate that a policy binding's
        `predicate_ref` can reference.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbacFilterExpression'
      responses:
        '200':
          description: The registered predicate object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbacPredicateObjectResponse'
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    delete:
      tags:
      - ABAC
      operationId: deletePredicateObject
      summary: Revoke an ABAC predicate object.
      description: |
        Idempotent (204). Subsequent resolves of `object_id` by any policy
        binding fail-closed.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      responses:
        '204':
          description: Predicate object revoked (or already absent).
        '401':
          $ref: '#/components/responses/AbacUnauthorized'
        '403':
          $ref: '#/components/responses/AbacForbidden'
        '503':
          $ref: '#/components/responses/AbacUnavailable'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/collections/{collection_id}/pin:
    parameters:
    - name: collection_id
      in: path
      required: true
      schema:
        type: string
    patch:
      tags:
      - Collections
      operationId: patchCollectionPin
      summary: Set or clear a collection pin.
      description: |
        Pins a collection to a physical medium (or unpins it). Returns
        immediately with the new pin state; physical data movement
        happens out of band — the access-pattern engine reads the
        registry on its next evaluation.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the pin registry is collection-keyed, not
        tenant-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '200':
          description: The resulting pin state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '400':
          description: |
            `pinned: true` without `target`. The body is PLAIN TEXT
            (axum `(StatusCode, String)` error path), not JSON.
          content:
            text/plain:
              schema:
                type: string
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    get:
      tags:
      - Collections
      operationId: getCollectionPin
      summary: Read a collection's pin state.
      description: |
        200 with `status: "pinned"` + state when pinned; 200 with
        `status: "unpinned"` when not pinned.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the pin registry is collection-keyed, not
        tenant-scoped).
      responses:
        '200':
          description: Current pin state (pinned or unpinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/collections/pinning:
    get:
      tags:
      - Collections
      operationId: listCollectionPins
      summary: List every pinned collection.
      description: |
        Operator-dashboard view of all currently pinned collections
        (cross-tenant — the registry is collection-keyed).
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
      responses:
        '200':
          description: All pin entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinListResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/collections/{collection_id}/affinity:
    parameters:
    - name: collection_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Collections
      operationId: getCollectionAffinity
      summary: Read this node's cache-affinity entry for a collection.
      description: |
        Returns `status: "affinitized"` (with query count, age, and a
        `stale` flag) when an entry exists — including stale entries,
        so operators can see which collections went cold — and
        `status: "not_affinitized"` when there is no entry at all.
        Routing has already stopped using stale entries.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (the affinity registry is per-node, collection-keyed).
      responses:
        '200':
          description: The affinity entry (or its absence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffinityResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    delete:
      tags:
      - Collections
      operationId: deleteCollectionAffinity
      summary: Drop this node's cache-affinity entry for a collection.
      description: |
        Invalidates the affinity hint so routing re-evaluates on the
        next query. 200 always; `dropped` distinguishes an actual
        removal from a no-op.
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
      responses:
        '200':
          description: Drop outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffinityDeleteResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/collections/affinity:
    get:
      tags:
      - Collections
      operationId: listCollectionAffinities
      summary: List every cache-affinity entry on this node.
      description: |
        Sorted by collection_id; includes stale entries so operators
        can see which collections went cold.
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
      responses:
        '200':
          description: All affinity entries on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffinityListResponse'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/primary-pod/{tenant_id}/{collection_id}:
    parameters:
    - name: tenant_id
      in: path
      required: true
      schema:
        type: string
    - name: collection_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Collections
      operationId: getPrimaryPod
      summary: Look up a (tenant, collection)'s primary pod.
      description: |
        200 with `status: "bound"` + the assignment when one exists;
        200 with `status: "unbound"` when none does (never 404).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        '200':
          description: The binding (bound or unbound).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodLookupResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    put:
      tags:
      - Collections
      operationId: putPrimaryPod
      summary: Assign a (tenant, collection)'s primary pod.
      description: |
        Operator-gated (SystemAdmin ∪ ConfigureSystem) — these expose
        cross-tenant placement and drive WAL write routing. The
        assignment is mirrored to the catalog; a mirror failure is
        logged and counted but does NOT fail the request (PUT-success
        means the binding is in effect for routing; the catalog
        reconciles on the next write).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryPodAssignRequest'
      responses:
        '200':
          description: The assignment (with the previous binding when re-assigning).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodAssignResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
    delete:
      tags:
      - Collections
      operationId: deletePrimaryPod
      summary: Unassign a (tenant, collection)'s primary pod.
      description: |
        200 always; `removed` distinguishes an actual removal from a
        no-op. Catalog-mirror policy is the same as PUT (logged, not
        fatal).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the `tenant_id` PATH segment governs.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        '200':
          description: Unassign outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodUnassignResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
  /api/v2/primary-pod:
    get:
      tags:
      - Collections
      operationId: listPrimaryPods
      summary: List every primary-pod binding (all tenants).
      description: |
        Cross-tenant operator view — the registry is keyed by
        (tenant_id, collection_id).
        The optional `X-Tenant-ID` header is not consulted by this
        handler.
        Requires REST auth enabled — in an auth-disabled
        deployment every call to this operation returns 401
        `missing_auth_context`.
      responses:
        '200':
          description: All bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryPodListResponse'
        '401':
          $ref: '#/components/responses/PodUnauthorized'
        '403':
          $ref: '#/components/responses/PodForbidden'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        schema:
          type: string
components:
  schemas:
    ApplyModelRegistryMutationRequest:
      type: object
      required:
      - expected_revision
      - mutation
      properties:
        expected_revision:
          type: integer
          format: int64
          description: Optimistic concurrency token returned by the previous read or mutation.
          minimum: 0
        mutation:
          $ref: '#/components/schemas/CatalogModelRegistryMutation'
          description: Command-shaped mutation; whole-registry replacement is intentionally unsupported.
    CatalogArtifactDescriptor:
      type: object
      description: Content-addressed reference to bytes held outside xCatalog.
      required:
      - uri
      - digest
      - size_bytes
      - media_type
      properties:
        uri:
          type: string
        digest:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        media_type:
          type: string
    CatalogDeploymentBinding:
      type: object
      description: Mutable serving intent that always resolves to an immutable version/digest.
      required:
      - name
      - version
      - artifact_digest
      - runtime
      - endpoint
      - updated_at_ms
      properties:
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        artifact_digest:
          type: string
        runtime:
          type: string
        endpoint:
          type: string
        updated_at_ms:
          type: integer
          format: int64
    CatalogDimensionPolicy:
      oneOf:
      - type: string
        enum:
        - fixed
      - type: string
        enum:
        - discrete
      - type: object
        required:
        - range
        properties:
          range:
            $ref: '#/components/schemas/CatalogDimensionRange'
    CatalogDimensionRange:
      type: object
      required:
      - minimum
      properties:
        minimum:
          type: integer
          format: int32
          minimum: 0
    CatalogEmbeddingInputContract:
      type: object
      description: Exact rendered-input and tokenizer budget consumed by an embedding runtime.
      required:
      - model_revision
      - tokenizer_id
      - tokenizer_revision
      - tokenizer_fingerprint
      - declared_context_limit
      - effective_context_limit
      - special_token_count
      - document_template
      - query_template
      properties:
        model_revision:
          type: string
        tokenizer_id:
          type: string
        tokenizer_revision:
          type: string
        tokenizer_fingerprint:
          type: string
        declared_context_limit:
          type: integer
          format: int32
          minimum: 0
        effective_context_limit:
          type: integer
          format: int32
          minimum: 0
        special_token_count:
          type: integer
          format: int32
          minimum: 0
        document_template:
          type: string
        query_template:
          type: string
        document_parameters:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        query_parameters:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    CatalogEmbeddingModelRegistry:
      type: object
      description: |-
        Registered embedding model: immutable versions plus separately mutable or
        append-only lifecycle records.
      required:
      - schema_version
      - name
      properties:
        schema_version:
          type: integer
          format: int32
          minimum: 0
        revision:
          type: integer
          format: int64
          description: |-
            Optimistic concurrency token for catalog/API mutations. Old rows default
            to zero; every successful command increments it.
          minimum: 0
        name:
          type: string
        versions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CatalogEmbeddingModelVersion'
          propertyNames:
            type: integer
            format: int64
            minimum: 0
        aliases:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          propertyNames:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEvaluationEvidence'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModelDecision'
        deployments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CatalogDeploymentBinding'
          propertyNames:
            type: string
        tags:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
    CatalogEmbeddingModelVersion:
      type: object
      description: Immutable executable contract for one registered model version.
      required:
      - version
      - provider_model_id
      - artifact
      - input
      - output
      - created_at_ms
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        provider_model_id:
          type: string
        artifact:
          $ref: '#/components/schemas/CatalogArtifactDescriptor'
        input:
          $ref: '#/components/schemas/CatalogEmbeddingInputContract'
        output:
          $ref: '#/components/schemas/CatalogEmbeddingOutputContract'
        governance:
          $ref: '#/components/schemas/CatalogModelGovernance'
        lineage:
          $ref: '#/components/schemas/CatalogModelLineage'
        created_at_ms:
          type: integer
          format: int64
        source_run_id:
          type:
          - string
          - 'null'
    CatalogEmbeddingOutputContract:
      type: object
      required:
      - native_dimension
      - dimension_policy
      - supported_dimensions
      - normalized
      - pooling
      properties:
        native_dimension:
          type: integer
          format: int32
          minimum: 0
        dimension_policy:
          $ref: '#/components/schemas/CatalogDimensionPolicy'
        supported_dimensions:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        normalized:
          type: boolean
        pooling:
          type: string
    CatalogEvaluationEvidence:
      type: object
      description: Append-only evaluation summary. Large row-level results remain external.
      required:
      - evidence_id
      - version
      - dataset_name
      - dataset_digest
      - evaluator
      - metrics
      - created_at_ms
      properties:
        evidence_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        dataset_name:
          type: string
        dataset_digest:
          type: string
        evaluator:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        created_at_ms:
          type: integer
          format: int64
    CatalogLineageInput:
      type: object
      description: Digest-pinned input consumed by the execution that produced a model.
      required:
      - kind
      - name
      - digest
      properties:
        kind:
          $ref: '#/components/schemas/CatalogLineageInputKind'
        name:
          type: string
        digest:
          type: string
    CatalogLineageInputKind:
      type: string
      enum:
      - dataset
      - feature_set
      - model
      - artifact
    CatalogModelAccess:
      type: string
      enum:
      - open
      - gated
      - unreviewed
    CatalogModelAliasMutation:
      type: object
      required:
      - alias
