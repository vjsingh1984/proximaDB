        data_type:
          description: |-
            Data type

            Supported types:
            - "text": Variable-length UTF-8 text
            - "text_large": Large text with sidecar storage
            - "integer": 64-bit signed integer
            - "float": 64-bit floating point
            - "decimal": 128-bit decimal (precision, scale)
            - "boolean": True/false
            - "timestamp": Microseconds since epoch
            - "timestamp_tz": Timestamp with timezone
            - "date": Days since epoch
            - "time": Microseconds since midnight
            - "uuid": RFC 4122 UUID
            - "binary": Raw bytes
            - "json": Validated JSON
            - "array_text", "array_integer", "array_float", "array_boolean"
            - "map_string_string", "map_string_any"
            - "geo_point": Latitude/longitude point
            - "vector": Fixed-dimension vector (specify dimension)
          type: string
        filterable:
          description: |-
            Enable filtering on this column

            When true, the column can be used in WHERE clauses.
            Default: true for indexed columns, false otherwise
          type:
          - boolean
          - 'null'
        indexed:
          description: |-
            Create secondary index for this column

            Improves query performance for equality/range filters.
            Default: false
          type:
          - boolean
          - 'null'
        max_length:
          description: |-
            Maximum length for TEXT/BINARY columns

            Default: no limit
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        name:
          description: Column name
          type: string
        nullable:
          description: |-
            Whether null values are allowed

            Default: true
          type:
          - boolean
          - 'null'
        precision:
          description: Precision for DECIMAL type (1-38)
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        scale:
          description: Scale for DECIMAL type (0-precision)
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        vector_dimension:
          description: Dimension for VECTOR type
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - name
      - data_type
      type: object
    ScanRecordsRequest:
      description: |-
        Body of `POST /records/scan`. Mirrors the OpenAPI `ScanRecordsRequest`
        schema; all fields optional so an empty `{}` returns the first page.
      properties:
        cursor:
          description: |-
            Opaque continuation token returned as `next_cursor` from a
            prior page. Omit / null to start from the beginning.
          type:
          - string
          - 'null'
        filter:
          description: |-
            Metadata filter applied (before the limit) to the scanned page.
            Accepts either the typed list form `[{field,op,value}]` (mirrors
            `searchRecords.filters`) or a simple equality map `{field: value}`.
        include_text:
          type:
          - boolean
          - 'null'
        include_vector:
          type:
          - boolean
          - 'null'
        limit:
          description: Max records to return in this page. Server enforces upper bound.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      type: object
    ScanRecordsResponse:
      description: |-
        Response shape for `scanRecords`. Empty `records` + null
        `next_cursor` signals end-of-scan. Each record matches the OpenAPI
        `RecordResponse` schema (same shape used by `getRecord`).
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        records:
          items:
            $ref: '#/components/schemas/RecordV2Response'
          type: array
        scanned_count:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - records
      type: object
    SchemaChange:
      description: Description of a schema change
      properties:
        change_type:
          description: Type of change
          type: string
        column:
          description: Affected column (if applicable)
          type:
          - string
          - 'null'
        description:
          description: Description of the change
          type: string
      required:
      - change_type
      - description
      type: object
    SchemaDefinition:
      description: |-
        Schema definition for a collection

        Defines the typed columns and enforcement rules for ProximaRecord support.
      properties:
        allow_additional_fields:
          description: |-
            Allow additional fields not defined in schema

            Only applies in "hybrid" mode.
            Default: true
          type:
          - boolean
          - 'null'
        columns:
          description: Column definitions
          items:
            $ref: '#/components/schemas/RestColumnDefinition'
          type: array
        enforcement:
          description: |-
            Schema enforcement mode

            - "strict": All columns must match schema exactly
            - "flexible": Schema on read, no validation at insert
            - "hybrid": Core columns enforced, additional fields allowed (default)
          type:
          - string
          - 'null'
      required:
      - columns
      type: object
    SchemaResponse:
      description: Schema response with metadata
      properties:
        collection_id:
          description: Collection this schema belongs to
          type: string
        created_at:
          description: Creation timestamp
          type: string
        parent_schema_id:
          description: Parent schema ID (for evolution tracking)
          type:
          - string
          - 'null'
        schema:
          $ref: '#/components/schemas/SchemaDefinition'
          description: Schema definition
        schema_id:
          description: Schema ID (UUID)
          type: string
        schema_version:
          description: Schema version (semantic versioning)
          type: string
        updated_at:
          description: Last update timestamp
          type:
          - string
          - 'null'
      required:
      - schema_id
      - schema_version
      - collection_id
      - schema
      - created_at
      type: object
    SearchEntitiesRequest:
      properties:
        filters:
          additionalProperties: {}
          description: 'Equality metadata filters as a `{field: value}` JSON object.'
          propertyNames:
            type: string
          type: object
        query_vector:
          description: Query embedding for vector similarity search. Omit for metadata-only search.
          items:
            format: float
            type: number
          type: array
        top_k:
          format: int32
          minimum: 0
          type: integer
      type: object
    SearchEntitiesResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/EntitySearchResult'
          type: array
        total:
          format: int32
          minimum: 0
          type: integer
      required:
      - results
      - total
      type: object
    SqlRequest:
      description: |-
        One SQL statement executed through the shared SQL authority.

        Parameter binding is intentionally not advertised yet: the relational
        execution port currently has no typed binding contract. Callers must not be
        offered a field that an adapter would silently ignore or interpolate.
      properties:
        collection:
          description: Optional collection context used by vector/graph SQL extensions.
          type:
          - string
          - 'null'
        query:
          maxLength: 1048576
          minLength: 1
          type: string
        timeout_ms:
          description: Per-request deadline. Defaults to 30 seconds and is capped at 5 minutes.
          format: int64
          maximum: 300000
          minimum: 1
          type:
          - integer
          - 'null'
      required:
      - query
      type: object
    SqlResponse:
      description: |-
        Stable JSON envelope for SQL reads and writes.

        For reads, `rows_returned` is the row count. For DDL/DML, the shared SQL
        authority reports the affected count in `rows_returned` and `rows` is empty.
      properties:
        column_types:
          items:
            type: string
          type: array
        columns:
          items:
            type: string
          type: array
        execution_time_ms:
          format: int64
          minimum: 0
          type: integer
        request_id:
          type: string
        rows:
          items:
            type: object
          type: array
        rows_returned:
          format: int64
          minimum: 0
          type: integer
        rows_scanned:
          format: int64
          minimum: 0
          type: integer
      required:
      - rows
      - columns
      - column_types
      - rows_returned
      - rows_scanned
      - execution_time_ms
      - request_id
      type: object
    TextFieldInput:
      description: |-
        Input format for TEXT fields

        TEXT fields are stored in dedicated columns with optional chunking
        for large content. The storage hint helps optimize storage strategy.
      properties:
        content:
          description: Text content
          type: string
        name:
          description: Field name
          type: string
        storage_hint:
          description: |-
            Storage strategy hint

            - "inline": Store inline in main column (<4KB)
            - "chunked": Split into chunks with embeddings (4KB-1MB)
            - "sidecar": Store in separate sidecar file (>1MB)
            - "adaptive": Auto-select based on content size (default)
          type:
          - string
          - 'null'
      required:
      - name
      - content
      type: object
    TextFieldOutput:
      description: Output format for TEXT fields
      properties:
        chunk_count:
          description: Number of chunks (for chunked storage)
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        content:
          description: Text content (may be truncated for large content)
          type: string
        name:
          description: Field name
          type: string
        truncated:
          description: Whether content was truncated
          type: boolean
      required:
      - name
      - content
      - truncated
      type: object
    TraverseRequest:
      description: |
        Flat shape (no wrapper). Matches `RestTraversalRequest` in
        proximadb-api.
      properties:
        algorithm:
          description: bfs | dfs | shortest_path
          nullable: true
          type: string
        edge_types:
          items:
            type: string
          type: array
        limit:
          minimum: 1
          nullable: true
          type: integer
        max_depth:
          default: 3
          minimum: 1
          type: integer
        node_labels:
          items:
            type: string
          type: array
        start_node_id:
          type: string
      required:
      - start_node_id
      type: object
    TraverseResponse:
      additionalProperties: true
      properties:
        edges:
          items:
            $ref: '#/components/schemas/EdgeResponse'
          type: array
        nodes:
          items:
            $ref: '#/components/schemas/NodeResponse'
          type: array
        paths:
          items:
            items:
              type: string
            type: array
          type: array
      type: object
    TypedFilter:
      description: |-
        A typed filter for search operations

        Supports various comparison operators with type-safe values.
      properties:
        field:
          description: Field name to filter on
          type: string
        op:
          description: |-
            Comparison operator

            Supported operators:
            - "eq": Equals
            - "neq": Not equals
            - "gt": Greater than
            - "gte": Greater than or equal
            - "lt": Less than
            - "lte": Less than or equal
            - "contains": String/array contains
            - "between": Value is between two bounds (requires value_upper)
            - "in": Value is in a list
            - "starts_with": String starts with prefix
            - "ends_with": String ends with suffix
          type: string
        value:
          description: Filter value (type depends on field type)
        value_upper:
          description: Upper bound for "between" operator
      required:
      - field
      - op
      - value
      type: object
    TypedSearchRequest:
      description: |-
        Search request with typed filters

        ## Example JSON

        ```json
        {
            "vector": [0.1, 0.2, 0.3],
            "top_k": 10,
            "filters": [
                {"field": "category", "op": "eq", "value": "electronics"},
                {"field": "price", "op": "lt", "value": 500},
                {"field": "in_stock", "op": "eq", "value": true}
            ],
            "include_text": true
        }
        ```
      properties:
        debug:
          description: |-
            Return the SearchPlanTrace + a human-readable route explain
            in the response (LLD §1 contract). Defaults to `false` so
            non-debug requests don't pay the JSON serialization cost of
            the ~30-field trace envelope.
          type:
          - boolean
          - 'null'
        filters:
          description: Typed filters with operator support
          items:
            $ref: '#/components/schemas/TypedFilter'
          type:
          - array
          - 'null'
        include_text:
          description: |-
            Whether to include TEXT fields in results (default: false)

            TEXT fields can be large, so they are excluded by default.
            Set to true to include them in the response.
          type:
          - boolean
          - 'null'
        include_vector:
          description: |-
            Whether to include the vector in results (default: false)

            Vector data can be large, so it is excluded by default.
          type:
          - boolean
          - 'null'
        top_k:
          description: Number of results to return
          minimum: 1
          type: integer
        vector:
          description: Query vector
          items:
            format: float
            type: number
          minItems: 1
          type: array
      required:
      - vector
      - top_k
      type: object
    TypedSearchResponse:
      description: Search response with typed results
      properties:
        explain:
          description: |-
            Human-readable explain summary derived from the SearchPlanTrace.
            Only emitted when the request sets `debug=true` — gives an on-call
            operator a one-glance view of the plan, cache result, and any
            actionable hints (high scan fraction, repair triggered, ...).
        latency_ms:
          description: Search latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        predicate_shortfall:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PredicateShortfallWire'
            description: |-
              TD-064: predicate-aware shortfall — present when a filtered search
              returned fewer than the requested `top_k` after the WAL+AXIS+storage
              merge. **Always emitted when present (NOT `debug`-gated)**, unlike
              `search_plan_trace`: a silent `<top_k` under a tenant/RLS filter is
              fail-open, so the client must be able to distinguish "fewer than k
              records match my filter" from "the engine returned my full top-k".
        request_id:
          description: Request ID for tracing
          type: string
        results:
          description: Search results
          items:
            $ref: '#/components/schemas/TypedSearchResult'
          type: array
        search_plan_trace:
          description: |-
            SearchPlanTrace (LLD §10) — the per-query telemetry envelope that
            upstream gateways consume for metering and planner-v2 training.
            Phase 0 emits a stub trace populated from request_id + latency; later
            phases fill in the per-stage counters. Only emitted when the request
            sets `debug=true` (LLD §1 contract).
        total_matches:
          description: Total number of matching documents (before top_k limit)
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - results
      - latency_ms
      - request_id
      type: object
    TypedSearchResult:
      description: Search result with typed fields
      properties:
        id:
          description: Record ID
          type: string
        props:
          additionalProperties: {}
          description: Rich properties from the record
          propertyNames:
            type: string
          type: object
        score:
          description: Similarity score (0.0 - 1.0 for cosine, distance for L2)
          format: float
          type: number
        text_fields:
          description: TEXT fields (if include_text is true)
          items:
            $ref: '#/components/schemas/TextFieldOutput'
          type:
          - array
          - 'null'
        vector:
          description: Vector embedding (if requested)
          items:
            format: float
            type: number
          type:
          - array
          - 'null'
      required:
      - id
      - score
      - props
      type: object
    UpdateSchemaRequest:
      allOf:
      - $ref: '#/components/schemas/SchemaDefinition'
        description: Updated schema definition
      - properties:
          force:
            description: |-
              Force update even if validation warnings exist

              Use with caution - may cause data compatibility issues.
            type:
            - boolean
            - 'null'
        type: object
      description: |-
        Request to update schema

        ## Schema Evolution Rules

        1. **Adding Columns**: New columns must be nullable or have defaults
        2. **Type Changes**: Not allowed (except compatible widening like int32->int64)
        3. **Removing Columns**: Not allowed (use deprecation instead)
        4. **Enforcement Mode**: Can be changed, but strict->flexible may lose validation

        ## Example JSON

        ```json
        {
            "columns": [
                {"name": "category", "data_type": "text", "indexed": true},
                {"name": "price", "data_type": "float", "filterable": true},
                {"name": "tags", "data_type": "array_text", "nullable": true}
            ],
            "enforcement": "hybrid",
            "allow_additional_fields": true
        }
        ```
    UpdateSchemaResponse:
      description: Schema update response
      properties:
        changes:
          description: List of applied changes
          items:
            $ref: '#/components/schemas/SchemaChange'
          type: array
        previous_schema_id:
          description: Previous schema ID (for rollback)
          type: string
        schema_id:
          description: Updated schema ID
          type: string
        schema_version:
          description: New schema version
          type: string
        updated_at:
          description: Update timestamp
          type: string
        warnings:
          description: Warnings about the update
          items:
            type: string
          type: array
      required:
      - schema_id
      - schema_version
      - previous_schema_id
      - changes
      - warnings
      - updated_at
      type: object
    UpsertEntityRequest:
      properties:
        embeddings:
          items:
            $ref: '#/components/schemas/EntityEmbeddingInput'
          type: array
        flexible_metadata:
          additionalProperties: {}
          propertyNames:
            type: string
          type: object
        id:
          description: Empty ⇒ the server generates a UUID.
          type: string
        provenance:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EntityProvenanceInput'
        relations:
          items:
            $ref: '#/components/schemas/EntityRelationInput'
          type: array
      type: object
    UpsertEntityResponse:
      properties:
        entity_id:
          type: string
        message:
          type: string
        success:
          type: boolean
      required:
      - success
      - entity_id
      - message
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact:
    email: vijay@anvaiops.com
    name: Vijaykumar Singh
  description: SDK-facing ProximaDB REST contract. This specification is v2-first and centers on ProximaRecord, typed schemas, record search, and collection lifecycle operations. Legacy v1 compatibility routes are intentionally not part of this publishable SDK surface.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: ProximaDB REST API
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/v2/_meta/capabilities:
    get:
      description: |
        Advertises API version, supported features, limits, and the error- envelope contract so SDKs can adapt instead of hard-coding assumptions.
      operationId: getCapabilities
      parameters:
      - description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        in: header
        name: X-Tenant-ID
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
          description: Capability document.
      security: []
      summary: Negotiate server capabilities.
      tags:
      - Meta
  /api/v2/collections:
    get:
      description: |-
        List all collections with pagination.

        ## Query Parameters

        - `limit`: Maximum number of collections to return (default: 100)
        - `offset`: Offset for pagination (default: 0)
        - `include_stats`: Whether to include collection statistics

        ## Response

        Returns [`ListCollectionsV2Response`] with collection list.

        ## Errors

        - `500 Internal Server Error`: List operation failed
      operationId: listCollections
      parameters:
      - description: 'Maximum number of collections to return (default: 100)'
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: 'Offset for pagination (default: 0)'
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: Whether to include statistics
        in: query
        name: include_stats
        required: false
        schema:
          type: boolean
      - description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        in: header
        name: X-Tenant-ID
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsV2Response'
          description: Collection page.
      summary: List collections.
      tags:
      - Collections
    post:
      description: |-
        Create a new collection with optional schema support.

        ## Request Body

        See [`CreateCollectionV2Request`] for the expected JSON format.

        ## Response

        Returns [`CreateCollectionV2Response`] with collection details.

        ## Errors

        - `400 Bad Request`: Invalid request or schema
        - `409 Conflict`: Collection already exists
        - `500 Internal Server Error`: Creation failed
      operationId: createCollection
      parameters:
      - description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        in: header
        name: X-Tenant-ID
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionV2Request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionV2Response'
          description: Collection created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request.
      summary: Create a collection with optional schema.
      tags:
      - Collections
  /api/v2/collections/{collection_id}:
    delete:
      description: |-
        Delete a collection by ID/name. This v2 route keeps SDK lifecycle methods on
        the ProximaRecord-era API while delegating to the existing collection control
        plane.
      operationId: deleteCollection
      parameters:
      - description: Collection name/ID.
        in: path
        name: collection_id
        required: true
        schema:
          type: string
      - description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        in: header
        name: X-Tenant-ID
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionV2Response'
          description: Collection deleted.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found.
      summary: Delete a collection.
      tags:
      - Collections
    get:
      description: |-
        Get collection details including schema and statistics.

        ## Path Parameters

        - `collection_id`: Collection name/ID

        ## Response

        Returns [`CollectionV2Response`] with collection details.

        ## Errors

        - `404 Not Found`: Collection does not exist
        - `500 Internal Server Error`: Retrieval failed
      operationId: getCollection
      parameters:
      - description: Collection name/ID.
        in: path
        name: collection_id
        required: true
        schema:
          type: string
      - description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        in: header
        name: X-Tenant-ID
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionV2Response'
          description: Collection details.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found.
      summary: Get collection details.
      tags:
      - Collections
  /api/v2/collections/{collection_id}/documents:
    post:
      description: Canonical document-ingest surface (ADR-041, spec-driven-primary). Body `{records:[{id,text,metadata}]}`; the server embeds `text` natively under `X-Embed-Source=native` (default) when no per-record `vector` is supplied. `X-Tenant-ID` scopes records to a tenant; `X-Ingest-Mode` carries the billing mode.
      operationId: ingestDocuments
      parameters:
      - description: Target collection name/ID.
        in: path
        name: collection_id
        required: true
        schema:
          type: string
      - description: Optional explicit tenant selector. Applied only when there is no authenticated tenant context — a JWT tenant claim takes precedence, and a header that disagrees with the authenticated tenant is rejected. Absent ⇒ the default tenant. Tenant isolation is structural on the server; this header only selects the tenant.
        in: header
        name: X-Tenant-ID
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDocumentsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestDocumentsResponse'
          description: Ingested.
        '400':
          content:
