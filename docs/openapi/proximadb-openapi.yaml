            application/json:
              schema:
                $ref: '#/components/schemas/SqlResponse'
        '400':
          description: Invalid SQL request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Query deadline exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Write lock conflict.
