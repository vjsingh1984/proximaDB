          - integer
          - 'null'
      type: object
    HnswConfigOutput:
      description: REST output for HNSW params (mirrors gRPC `V2HnswConfig`).
      properties:
        ef_construction:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        ef_search:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        m:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      type: object
    ImpactAnalysisRequest:
      properties:
