<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon symbol: thicker strokes for tiny sizes -->
  <defs>
    <style>
      .cloud { stroke:#0ea5e9; stroke-width:2; fill:none; }
      .graph { stroke:#ef4444; stroke-width:2; fill:none; }
      .vector { stroke:#059669; stroke-width:2; fill:none; }
      .sks { stroke:#7c3aed; stroke-width:2; fill:none; }
      .db { stroke:#1e40af; stroke-width:2; fill:none; }
      .ring { stroke:#1e40af; stroke-width:4; fill:none; }
    </style>
  </defs>

  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="44" class="ring"/>
    <g transform="translate(-20,-20)"><path d="M -8,2 Q -8,-3 -5,-3 Q -3,-5 1,-3 Q 4,-5 6,-2 Q 7,0 6,2 Q 4,3 1,3 L -6,3 Q -8,3 -8,2 Z" class="cloud"/></g>
    <g transform="translate(20,-20)" class="graph">
      <circle cx="-7" cy="-5" r="2.5"/>
      <circle cx="7" cy="-5" r="2.5"/>
      <circle cx="0" cy="7" r="2.5"/>
      <line x1="-7" y1="-5" x2="7" y2="-5"/>
      <line x1="-7" y1="-5" x2="0" y2="7"/>
      <line x1="7" y1="-5" x2="0" y2="7"/>
    </g>
    <g transform="translate(-20,20)" class="vector">
      <line x1="-8" y1="8" x2="8" y2="-8" stroke-linecap="round"/>
      <line x1="8" y1="-8" x2="2" y2="-8"/>
      <line x1="8" y1="-8" x2="8" y2="-2"/>
      <line x1="-8" y1="8" x2="4" y2="3" stroke-linecap="round"/>
      <line x1="4" y1="3" x2="-2" y2="3"/>
      <line x1="4" y1="3" x2="4" y2="9"/>
      <line x1="-8" y1="8" x2="0" y2="-8" stroke-linecap="round"/>
      <line x1="0" y1="-8" x2="-6" y2="-8"/>
      <line x1="0" y1="-8" x2="0" y2="-2"/>
    </g>
    <g transform="translate(20,20)" class="sks">
      <rect x="-8" y="-10" width="16" height="20" rx="2"/>
      <line x1="8" y1="-10" x2="4" y2="-6"/>
      <line x1="4" y1="-6" x2="8" y2="-6"/>
      <line x1="-4" y1="2" x2="-1" y2="5"/>
      <line x1="-1" y1="5" x2="4" y2="0"/>
    </g>
    <g class="db">
      <ellipse cx="0" cy="-4" rx="6" ry="2.4"/>
      <rect x="-6" y="-4" width="12" height="10"/>
      <ellipse cx="0" cy="6" rx="6" ry="2.4"/>
    </g>
  </g>
</svg>

