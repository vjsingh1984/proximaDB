<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="novaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;" />
      <stop offset="50%" style="stop-color:#ea580c;" />
      <stop offset="100%" style="stop-color:#dc2626;" />
    </linearGradient>
    <radialGradient id="novaRadial" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;" />
      <stop offset="50%" style="stop-color:#f59e0b;" />
      <stop offset="100%" style="stop-color:#ea580c;" />
    </radialGradient>
    <filter id="novaShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <filter id="novaGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="#fef3c7" stroke="url(#novaGradient)" stroke-width="1" opacity="0.9"/>
  
  <!-- NOVA star burst visualization -->
  <g transform="translate(30, 30)">
    <!-- Star/nova explosion effect -->
    <g filter="url(#novaGlow)">
      <!-- Main star -->
      <path d="M 0 -15 L 4 -4 L 15 0 L 4 4 L 0 15 L -4 4 L -15 0 L -4 -4 Z" 
            fill="url(#novaRadial)" opacity="0.9" filter="url(#novaShadow)"/>
      
      <!-- Secondary rays -->
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z" 
            fill="url(#novaGradient)" opacity="0.6" transform="rotate(45)"/>
    </g>
    
    <!-- Data analytics rings -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#novaGradient)" stroke-width="1" opacity="0.5" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#novaGradient)" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Central core -->
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="2" fill="url(#novaGradient)"/>
  </g>
  
  <!-- NOVA label -->
  <text x="30" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#dc2626" text-anchor="middle">
    NOVA
  </text>
</svg>