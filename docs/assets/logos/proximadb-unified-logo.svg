<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Logo gradients -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Symbol: Unified Intelligence Hub -->
  <g transform="translate(60, 60)">
    <!-- Central hub representing unified platform -->
    <circle cx="0" cy="0" r="25" fill="url(#logoGradient)" filter="url(#logoGlow)"/>
    
    <!-- Vector search rays emanating from center (representing speed/processing) -->
    <g stroke="url(#logoGradient)" stroke-width="3" opacity="0.8">
      <line x1="0" y1="-35" x2="0" y2="-45" stroke-linecap="round"/>
      <line x1="25" y1="-18" x2="32" y2="-23" stroke-linecap="round"/>
      <line x1="25" y1="18" x2="32" y2="23" stroke-linecap="round"/>
      <line x1="0" y1="35" x2="0" y2="45" stroke-linecap="round"/>
      <line x1="-25" y1="18" x2="-32" y2="23" stroke-linecap="round"/>
      <line x1="-25" y1="-18" x2="-32" y2="-23" stroke-linecap="round"/>
    </g>
    
    <!-- Graph nodes around the hub (representing connectivity) -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="0" cy="-40" r="4"/> <!-- Top -->
      <circle cx="35" cy="-20" r="4"/> <!-- Top right -->
      <circle cx="35" cy="20" r="4"/>  <!-- Bottom right -->
      <circle cx="0" cy="40" r="4"/>   <!-- Bottom -->
      <circle cx="-35" cy="20" r="4"/> <!-- Bottom left -->
      <circle cx="-35" cy="-20" r="4"/><!-- Top left -->
    </g>
    
    <!-- Connection lines (representing graph relationships and data flow) -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.6">
      <line x1="0" y1="-25" x2="0" y2="-36"/>
      <line x1="18" y1="-13" x2="31" y2="-16"/>
      <line x1="18" y1="13" x2="31" y2="16"/>
      <line x1="0" y1="25" x2="0" y2="36"/>
      <line x1="-18" y1="13" x2="-31" y2="16"/>
      <line x1="-18" y1="-13" x2="-31" y2="-16"/>
    </g>
    
    <!-- Central multimodal icon -->
    <g fill="white">
      <!-- Simplified representation of different data types -->
      <rect x="-6" y="-8" width="4" height="6" rx="1"/> <!-- Text/Doc -->
      <rect x="-1" y="-8" width="6" height="6" rx="1" fill="none" stroke="white" stroke-width="1"/> <!-- Image -->
      <polygon points="2,-5 2,1 7,-2" fill="white"/> <!-- Video play -->
      <circle cx="0" cy="5" r="3" fill="none" stroke="white" stroke-width="1"/> <!-- Audio wave -->
      <path d="M -2,5 Q 0,2 2,5" fill="none" stroke="white" stroke-width="1"/>
    </g>
  </g>

  <!-- Company Name -->
  <text x="140" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#textGradient)">
    Proxima
  </text>
  <!-- Shifted right to avoid overlap with 'Proxima' -->
  <text x="252" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="url(#textGradient)">
    DB
  </text>
  
  <!-- Tagline -->
  <text x="140" y="65" font-family="Arial, sans-serif" font-size="11" fill="#64748b" font-weight="400">
    Unified Intelligence Platform
  </text>
  
  <!-- Capability indicators -->
  <text x="140" y="80" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">
    Vector • Graph • SKS • SQL
  </text>

  <!-- Speed indicator -->
  <g transform="translate(260, 90)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24" opacity="0.2"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#f59e0b">
      ⚡
    </text>
  </g>
</svg>
