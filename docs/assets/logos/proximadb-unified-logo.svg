<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Logo gradients -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Symbol: 2x2 Quadrant Grid (Cloud, Graph, Vector, SKS) with central DB, outline-only -->
  <g transform="translate(60, 60)">
    <!-- Enclosing ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#logoGradient)" stroke-width="3" filter="url(#logoGlow)"/>

    <!-- Q1 Cloud (top-left) -->
    <g transform="translate(-12,-12)">
      <path d="M -6,2 Q -6,-3 -4,-3 Q -2,-4 2,-3 Q 4,-4 6,-2 Q 7,0 6,2 Q 4,3 2,3 L -4,3 Q -6,3 -6,2 Z"
            fill="none" stroke="#0ea5e9" stroke-width="1.4"/>
    </g>

    <!-- Q2 Graph (top-right) -->
    <g transform="translate(12,-12)" fill="none" stroke="#ef4444" stroke-width="1.4">
      <circle cx="-5" cy="-3" r="2.0"/>
      <circle cx="5" cy="-3" r="2.0"/>
      <circle cx="0" cy="5" r="2.0"/>
      <line x1="-5" y1="-3" x2="5" y2="-3"/>
      <line x1="-5" y1="-3" x2="0" y2="5"/>
      <line x1="5" y1="-3" x2="0" y2="5"/>
    </g>

    <!-- Q3 Vector (bottom-left) as quiver -->
    <g transform="translate(-12,12)" fill="none" stroke="#059669" stroke-width="1.4">
      <line x1="-5" y1="5" x2="5" y2="-5" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="1" y2="-5"/>
      <line x1="5" y1="-5" x2="5" y2="-1"/>
      <line x1="-5" y1="5" x2="3" y2="2" stroke-linecap="round"/>
      <line x1="3" y1="2" x2="-1" y2="2"/>
      <line x1="3" y1="2" x2="3" y2="6"/>
      <line x1="-5" y1="5" x2="0" y2="-5" stroke-linecap="round"/>
      <line x1="0" y1="-5" x2="-4" y2="-5"/>
      <line x1="0" y1="-5" x2="0" y2="-1"/>
    </g>

    <!-- Q4 SKS (bottom-right) as knowledge page with checkmark -->
    <g transform="translate(12,12)" fill="none" stroke="#7c3aed" stroke-width="1.4">
      <rect x="-6" y="-8" width="12" height="16" rx="1.4"/>
      <line x1="6" y1="-8" x2="3" y2="-5"/>
      <line x1="3" y1="-5" x2="6" y2="-5"/>
      <line x1="-3" y1="1" x2="-1" y2="3"/>
      <line x1="-1" y1="3" x2="3" y2="-1"/>
    </g>

    <!-- Center DB cylinder -->
    <g transform="translate(0,0)" fill="none" stroke="#1e40af" stroke-width="1.4">
      <ellipse cx="0" cy="-3" rx="5" ry="2.0"/>
      <rect x="-5" y="-3" width="10" height="8"/>
      <ellipse cx="0" cy="5" rx="5" ry="2.0"/>
    </g>
  </g>

  <!-- Company Name -->
  <text x="140" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#textGradient)">
    Proxima
  </text>
  <!-- Shifted right to avoid overlap with 'Proxima' -->
  <text x="252" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="url(#textGradient)">
    DB
  </text>
  
  <!-- Tagline -->
  <text x="140" y="65" font-family="Arial, sans-serif" font-size="11" fill="#64748b" font-weight="400">
    Unified Intelligence Platform
  </text>
  
  <!-- Capability indicators -->
  <text x="140" y="80" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">
    Vector • Graph • SKS • SQL
  </text>
  <text x="140" y="92" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">
    Serverless • Multicloud
  </text>

  <!-- Speed indicator -->
  <g transform="translate(260, 90)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24" opacity="0.2"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#f59e0b">
      ⚡
    </text>
  </g>
</svg>
