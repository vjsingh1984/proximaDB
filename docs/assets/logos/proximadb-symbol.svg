<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimal symbol-only mark: 2x2 grid + center DB, flat ring -->
  <defs>
    <style>
      .cloud { stroke:#0ea5e9; stroke-width:1.4; fill:none; }
      .graph { stroke:#ef4444; stroke-width:1.4; fill:none; }
      .vector { stroke:#059669; stroke-width:1.4; fill:none; }
      .sks { stroke:#7c3aed; stroke-width:1.4; fill:none; }
      .db { stroke:#1e40af; stroke-width:1.4; fill:none; }
      .ring { stroke:#1e40af; stroke-width:3; fill:none; }
    </style>
  </defs>

  <!-- Enclosing flat ring -->
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="38" class="ring"/>

    <!-- Q1 Cloud -->
    <g transform="translate(-16,-16)">
      <path d="M -7,2 Q -7,-3 -4,-3 Q -2,-5 2,-3 Q 5,-5 7,-2 Q 8,0 7,2 Q 5,3 2,3 L -5,3 Q -7,3 -7,2 Z" class="cloud"/>
    </g>

    <!-- Q2 Graph -->
    <g transform="translate(16,-16)" class="graph">
      <circle cx="-6" cy="-4" r="2.0"/>
      <circle cx="6" cy="-4" r="2.0"/>
      <circle cx="0" cy="6" r="2.0"/>
      <line x1="-6" y1="-4" x2="6" y2="-4"/>
      <line x1="-6" y1="-4" x2="0" y2="6"/>
      <line x1="6" y1="-4" x2="0" y2="6"/>
    </g>

    <!-- Q3 Vector (quiver) -->
    <g transform="translate(-16,16)" class="vector">
      <line x1="-6" y1="6" x2="6" y2="-6" stroke-linecap="round"/>
      <line x1="6" y1="-6" x2="2" y2="-6"/>
      <line x1="6" y1="-6" x2="6" y2="-2"/>
      <line x1="-6" y1="6" x2="3" y2="2" stroke-linecap="round"/>
      <line x1="3" y1="2" x2="-1" y2="2"/>
      <line x1="3" y1="2" x2="3" y2="6"/>
      <line x1="-6" y1="6" x2="0" y2="-6" stroke-linecap="round"/>
      <line x1="0" y1="-6" x2="-4" y2="-6"/>
      <line x1="0" y1="-6" x2="0" y2="-2"/>
    </g>

    <!-- Q4 SKS (page + check) -->
    <g transform="translate(16,16)" class="sks">
      <rect x="-6" y="-8" width="12" height="16" rx="1.4"/>
      <line x1="6" y1="-8" x2="3" y2="-5"/>
      <line x1="3" y1="-5" x2="6" y2="-5"/>
      <line x1="-3" y1="1" x2="-1" y2="3"/>
      <line x1="-1" y1="3" x2="3" y2="-1"/>
    </g>

    <!-- Center DB -->
    <g class="db">
      <ellipse cx="0" cy="-3" rx="5" ry="2.0"/>
      <rect x="-5" y="-3" width="10" height="8"/>
      <ellipse cx="0" cy="5" rx="5" ry="2.0"/>
    </g>
  </g>
</svg>

