<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sstGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;" />
      <stop offset="50%" style="stop-color:#059669;" />
      <stop offset="100%" style="stop-color:#047857;" />
    </linearGradient>
    <filter id="sstShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <filter id="sstGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="#f0fdf4" stroke="url(#sstGradient)" stroke-width="1" opacity="0.9"/>
  
  <!-- SSTable layers visualization -->
  <g transform="translate(30, 30)">
    <!-- Layer 1 (newest) -->
    <rect x="-18" y="-12" width="36" height="6" rx="1" fill="url(#sstGradient)" opacity="0.9" filter="url(#sstGlow)"/>
    
    <!-- Layer 2 -->
    <rect x="-18" y="-4" width="36" height="6" rx="1" fill="url(#sstGradient)" opacity="0.7"/>
    
    <!-- Layer 3 -->
    <rect x="-18" y="4" width="36" height="6" rx="1" fill="url(#sstGradient)" opacity="0.5"/>
    
    <!-- Merge arrow pointing down -->
    <path d="M 0 -14 L 0 14 M -4 10 L 0 14 L 4 10" 
          stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Data flow dots -->
    <circle cx="-8" cy="-9" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-9" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="8" cy="-9" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- SST label -->
  <text x="30" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">
    SST
  </text>
</svg>