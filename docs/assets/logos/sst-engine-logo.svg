<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- SST Engine Logo: Sorted String Table - Log-Structured Merge Tree -->
  <!-- Design: Layered mountain/rock formation representing LSM tree levels -->
  
  <defs>
    <!-- Gradient for SST layers -->
    <linearGradient id="sstGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2C5530;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A7C59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#68A85B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for data layers -->
    <linearGradient id="dataLayerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#68A85B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2C5530;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Gradient for merge operations -->
    <linearGradient id="mergeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.5" />
    </linearGradient>
    
    <!-- Glow effect for LSM structure -->
    <filter id="sstGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Data flow animation -->
    <filter id="dataFlow">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#0F1419"/>
  
  <!-- Grid pattern for technical feel -->
  <g opacity="0.1">
    <pattern id="techGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#68A85B" stroke-width="0.5"/>
    </pattern>
    <rect width="400" height="200" fill="url(#techGrid)"/>
  </g>
  
  <!-- LSM Tree Structure - Layered mountain formation -->
  <g transform="translate(50, 50)" filter="url(#sstGlow)">
    <!-- Level 0 (top layer - smallest, most recent) -->
    <rect x="120" y="0" width="60" height="15" fill="url(#sstGradient)" rx="3"/>
    <text x="150" y="10" font-family="monospace" font-size="8" fill="#FFF" text-anchor="middle">L0</text>
    
    <!-- Level 1 -->
    <rect x="100" y="20" width="100" height="18" fill="url(#sstGradient)" rx="3" opacity="0.9"/>
    <text x="150" y="32" font-family="monospace" font-size="8" fill="#FFF" text-anchor="middle">L1</text>
    
    <!-- Level 2 -->
    <rect x="80" y="43" width="140" height="22" fill="url(#sstGradient)" rx="3" opacity="0.8"/>
    <text x="150" y="57" font-family="monospace" font-size="8" fill="#FFF" text-anchor="middle">L2</text>
    
    <!-- Level 3 -->
    <rect x="60" y="70" width="180" height="25" fill="url(#sstGradient)" rx="3" opacity="0.7"/>
    <text x="150" y="86" font-family="monospace" font-size="8" fill="#FFF" text-anchor="middle">L3</text>
    
    <!-- Level 4 (base layer - largest, oldest) -->
    <rect x="40" y="100" width="220" height="30" fill="url(#sstGradient)" rx="3" opacity="0.6"/>
    <text x="150" y="119" font-family="monospace" font-size="8" fill="#FFF" text-anchor="middle">L4</text>
  </g>
  
  <!-- Compaction arrows showing merge operations -->
  <g opacity="0.8">
    <!-- Compaction from L0 to L1 -->
    <path d="M 190 65 L 185 85 L 195 85 Z" fill="url(#mergeGradient)"/>
    <path d="M 170 65 L 165 85 L 175 85 Z" fill="url(#mergeGradient)"/>
    
    <!-- Compaction from L1 to L2 -->
    <path d="M 180 88 L 175 108 L 185 108 Z" fill="url(#mergeGradient)" opacity="0.8"/>
    <path d="M 200 88 L 195 108 L 205 108 Z" fill="url(#mergeGradient)" opacity="0.8"/>
    
    <!-- Compaction from L2 to L3 -->
    <path d="M 190 113 L 185 133 L 195 133 Z" fill="url(#mergeGradient)" opacity="0.6"/>
    
    <!-- Compaction from L3 to L4 -->
    <path d="M 190 145 L 185 165 L 195 165 Z" fill="url(#mergeGradient)" opacity="0.4"/>
  </g>
  
  <!-- Data flow visualization (sorted strings) -->
  <g transform="translate(280, 40)" opacity="0.7">
    <!-- Write path -->
    <rect x="0" y="0" width="80" height="8" fill="url(#dataLayerGradient)" rx="2"/>
    <rect x="0" y="12" width="70" height="8" fill="url(#dataLayerGradient)" rx="2"/>
    <rect x="0" y="24" width="75" height="8" fill="url(#dataLayerGradient)" rx="2"/>
    <rect x="0" y="36" width="65" height="8" fill="url(#dataLayerGradient)" rx="2"/>
    <rect x="0" y="48" width="78" height="8" fill="url(#dataLayerGradient)" rx="2"/>
    
    <!-- Sorted indicator -->
    <text x="85" y="30" font-family="monospace" font-size="7" fill="#68A85B">SORTED</text>
    
    <!-- Performance metrics -->
    <rect x="0" y="65" width="80" height="15" fill="none" stroke="#68A85B" stroke-width="1" rx="2"/>
    <text x="40" y="75" font-family="monospace" font-size="8" fill="#68A85B" text-anchor="middle">17K/s</text>
  </g>
  
  <!-- MemTable visualization (in-memory component) -->
  <g transform="translate(20, 40)" opacity="0.8">
    <rect x="0" y="0" width="25" height="40" fill="none" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="12" y="10" font-family="monospace" font-size="7" fill="#FFD700" text-anchor="middle">MEM</text>
    <text x="12" y="20" font-family="monospace" font-size="7" fill="#FFD700" text-anchor="middle">TABLE</text>
    
    <!-- Data items in MemTable -->
    <rect x="3" y="25" width="19" height="2" fill="#FFD700" opacity="0.6"/>
    <rect x="3" y="28" width="15" height="2" fill="#FFD700" opacity="0.6"/>
    <rect x="3" y="31" width="17" height="2" fill="#FFD700" opacity="0.6"/>
    <rect x="3" y="34" width="13" height="2" fill="#FFD700" opacity="0.6"/>
  </g>
  
  <!-- Flush arrow from MemTable to L0 -->
  <path d="M 50 60 L 65 60 L 60 55 M 65 60 L 60 65" stroke="#FFD700" stroke-width="2" fill="none"/>
  <text x="57" y="55" font-family="monospace" font-size="6" fill="#FFD700">FLUSH</text>
  
  <!-- Bloom filter indicators -->
  <g transform="translate(320, 110)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#4A7C59"/>
    <circle cx="10" cy="0" r="3" fill="#4A7C59"/>
    <circle cx="20" cy="0" r="3" fill="#4A7C59"/>
    <circle cx="30" cy="0" r="3" fill="#4A7C59"/>
    <text x="15" y="-8" font-family="monospace" font-size="6" fill="#4A7C59" text-anchor="middle">BLOOM</text>
  </g>
  
  <!-- Text -->
  <text x="200" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="36" 
        font-weight="bold" fill="#FFFFFF" text-anchor="middle">SST</text>
  
  <text x="200" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="11" 
        fill="#68A85B" text-anchor="middle" letter-spacing="2">LOG-STRUCTURED MERGE TREE</text>
  
  <!-- Performance badges -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="55" height="18" rx="3" fill="none" stroke="#68A85B" stroke-width="1"/>
    <text x="27" y="12" font-family="monospace" font-size="9" fill="#68A85B" text-anchor="middle">LSM-TREE</text>
  </g>
  
  <g transform="translate(325, 170)">
    <rect x="0" y="0" width="55" height="18" rx="3" fill="none" stroke="#68A85B" stroke-width="1"/>
    <text x="27" y="12" font-family="monospace" font-size="9" fill="#68A85B" text-anchor="middle">HIGH-WRITE</text>
  </g>
</svg>