<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- SWIFT Engine Logo: Storage With Instant Fast Traversal -->
  <!-- Design: Fast bird silhouette with hierarchical superblock visualization -->
  
  <defs>
    <!-- Gradient for the swift -->
    <linearGradient id="swiftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0091EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#01579B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for wing trails -->
    <linearGradient id="trailGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00E5FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for superblocks -->
    <linearGradient id="superblockGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0091EA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#01579B;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Motion blur for speed effect -->
    <filter id="motionBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2,0"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="swiftGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#001122"/>
  
  <!-- Speed lines in background -->
  <g opacity="0.3">
    <line x1="0" y1="40" x2="150" y2="40" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="80" x2="140" y2="80" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="100" x2="110" y2="100" stroke="#00E5FF" stroke-width="1"/>
    <line x1="0" y1="120" x2="130" y2="120" stroke="#00E5FF" stroke-width="1"/>
  </g>
  
  <!-- Hierarchical SuperBlock visualization -->
  <g transform="translate(250, 30)" opacity="0.7">
    <!-- SuperBlock container -->
    <rect x="0" y="0" width="130" height="90" fill="none" stroke="#0091EA" stroke-width="2" rx="4"/>
    <text x="65" y="-5" font-family="monospace" font-size="8" fill="#00E5FF" text-anchor="middle">SUPERBLOCK</text>
    
    <!-- Tier 1: Large blocks -->
    <rect x="5" y="5" width="30" height="25" fill="url(#superblockGradient)" rx="2"/>
    <rect x="40" y="5" width="30" height="25" fill="url(#superblockGradient)" rx="2"/>
    <rect x="75" y="5" width="30" height="25" fill="url(#superblockGradient)" rx="2"/>
    <rect x="110" y="5" width="15" height="25" fill="url(#superblockGradient)" rx="2"/>
    
    <!-- Tier 2: Medium blocks -->
    <rect x="5" y="35" width="20" height="15" fill="url(#superblockGradient)" rx="1" opacity="0.8"/>
    <rect x="30" y="35" width="20" height="15" fill="url(#superblockGradient)" rx="1" opacity="0.8"/>
    <rect x="55" y="35" width="20" height="15" fill="url(#superblockGradient)" rx="1" opacity="0.8"/>
    <rect x="80" y="35" width="20" height="15" fill="url(#superblockGradient)" rx="1" opacity="0.8"/>
    <rect x="105" y="35" width="20" height="15" fill="url(#superblockGradient)" rx="1" opacity="0.8"/>
    
    <!-- Tier 3: Small blocks (records) -->
    <rect x="5" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="16" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="27" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="38" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="49" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="60" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="71" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="82" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="93" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="104" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="115" y="55" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    
    <rect x="5" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="16" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="27" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="38" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="49" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="60" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="71" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="82" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="93" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="104" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="115" y="66" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    
    <rect x="5" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="16" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="27" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="38" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="49" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="60" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="71" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="82" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="93" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="104" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
    <rect x="115" y="77" width="8" height="8" fill="url(#superblockGradient)" rx="1" opacity="0.6"/>
  </g>
  
  <!-- Stylized swift bird in motion -->
  <g transform="translate(70, 50)" filter="url(#swiftGlow)">
    <!-- Motion trails -->
    <path d="M -30 0 Q 0 -5, 30 0 Q 60 5, 90 0" 
          stroke="url(#trailGradient)" stroke-width="3" fill="none" filter="url(#motionBlur)"/>
    <path d="M -20 10 Q 10 5, 40 10 Q 70 15, 100 10" 
          stroke="url(#trailGradient)" stroke-width="2" fill="none" filter="url(#motionBlur)"/>
    
    <!-- Main body (streamlined) -->
    <ellipse cx="50" cy="30" rx="35" ry="8" fill="url(#swiftGradient)"/>
    
    <!-- Head -->
    <ellipse cx="80" cy="30" rx="12" ry="6" fill="url(#swiftGradient)"/>
    
    <!-- Beak (pointed for speed) -->
    <path d="M 90 30 L 98 28 L 96 32 Z" fill="#00E5FF"/>
    
    <!-- Eye -->
    <circle cx="83" cy="28" r="2" fill="#FFFFFF"/>
    <circle cx="83" cy="28" r="1" fill="#000000"/>
    
    <!-- Wings (swept back for speed) -->
    <path d="M 45 25 Q 20 15, 5 20 Q 10 35, 35 35 Q 50 30, 45 25 Z" 
          fill="url(#swiftGradient)" opacity="0.9"/>
    <path d="M 55 35 Q 30 25, 15 30 Q 20 45, 45 45 Q 60 40, 55 35 Z" 
          fill="url(#swiftGradient)" opacity="0.7"/>
    
    <!-- Tail (forked for maneuverability) -->
    <path d="M 20 30 L 5 25 L 8 30 L 5 35 L 20 30 Z" fill="url(#swiftGradient)" opacity="0.8"/>
  </g>
  
  <!-- Index traversal visualization -->
  <g transform="translate(20, 130)" opacity="0.6">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#00E5FF">O(log n) TRAVERSAL:</text>
    <circle cx="0" cy="15" r="2" fill="#00E5FF"/>
    <line x1="0" y1="15" x2="20" y2="15" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="20" cy="15" r="2" fill="#0091EA"/>
    <line x1="20" y1="15" x2="40" y2="15" stroke="#0091EA" stroke-width="1"/>
    <circle cx="40" cy="15" r="2" fill="#01579B"/>
    <text x="50" y="18" font-family="monospace" font-size="8" fill="#01579B">FOUND</text>
  </g>
  
  <!-- Text -->
  <text x="200" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="36" 
        font-weight="bold" fill="#FFFFFF" text-anchor="middle">SWIFT</text>
  
  <text x="200" y="177" font-family="'Segoe UI', Arial, sans-serif" font-size="11" 
        fill="#00E5FF" text-anchor="middle" letter-spacing="2">INSTANT FAST TRAVERSAL</text>
  
  <!-- Performance badges -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="70" height="18" rx="3" fill="none" stroke="#00E5FF" stroke-width="1"/>
    <text x="35" y="12" font-family="monospace" font-size="9" fill="#00E5FF" text-anchor="middle">BILLION-SCALE</text>
  </g>
  
  <g transform="translate(310, 170)">
    <rect x="0" y="0" width="70" height="18" rx="3" fill="none" stroke="#00E5FF" stroke-width="1"/>
    <text x="35" y="12" font-family="monospace" font-size="9" fill="#00E5FF" text-anchor="middle">ZERO-COPY</text>
  </g>
</svg>