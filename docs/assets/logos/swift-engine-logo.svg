<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="swiftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;" />
      <stop offset="50%" style="stop-color:#0891b2;" />
      <stop offset="100%" style="stop-color:#0e7490;" />
    </linearGradient>
    <linearGradient id="swiftSpeed" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#06b6d4;" stop-opacity="0"/>
      <stop offset="50%" style="stop-color:#0891b2;" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#06b6d4;" stop-opacity="0"/>
    </linearGradient>
    <filter id="swiftMotion">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
    <filter id="swiftShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="#ecfeff" stroke="url(#swiftGradient)" stroke-width="1" opacity="0.9"/>
  
  <!-- SWIFT bird/arrow visualization -->
  <g transform="translate(30, 30)">
    <!-- Speed lines -->
    <rect x="-20" y="-2" width="15" height="1" fill="url(#swiftSpeed)" opacity="0.8"/>
    <rect x="-20" y="0" width="18" height="1" fill="url(#swiftSpeed)" opacity="0.6"/>
    <rect x="-20" y="2" width="12" height="1" fill="url(#swiftSpeed)" opacity="0.4"/>
    
    <!-- Swift arrow/bird shape -->
    <g filter="url(#swiftShadow)">
      <!-- Main body -->
      <path d="M -8 0 L 12 0 L 16 -3 L 12 0 L 16 3 L 12 0" 
            fill="url(#swiftGradient)" stroke="url(#swiftGradient)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      
      <!-- Wing -->
      <path d="M -2 0 L -8 -8 L 2 -4 L 6 0" 
            fill="url(#swiftGradient)" opacity="0.9"/>
      <path d="M -2 0 L -8 8 L 2 4 L 6 0" 
            fill="url(#swiftGradient)" opacity="0.7"/>
    </g>
    
    <!-- Motion blur effect -->
    <ellipse cx="-5" cy="0" rx="8" ry="3" fill="url(#swiftGradient)" opacity="0.2" filter="url(#swiftMotion)"/>
    
    <!-- Data stream visualization -->
    <circle cx="10" cy="0" r="1" fill="#0891b2" opacity="0.8">
      <animate attributeName="cx" values="10;-25;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- SWIFT label -->
  <text x="30" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#0e7490" text-anchor="middle">
    SWIFT
  </text>
</svg>