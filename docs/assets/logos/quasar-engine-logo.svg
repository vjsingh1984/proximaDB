  <circle cx="40" cy="40" r="4" fill="white"/>

  <text x="100" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#7c3aed">QUASAR</text>
  <text x="100" y="52" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Disk-Based Graph Engine</text>
