<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Logo gradients -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Symbol: 2x2 Quadrant Grid (Cloud, Graph, Vector, SKS) -->
  <g transform="translate(60, 60)">
    <!-- Enclosing ring around the grid -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#logoGradient)" stroke-width="3" filter="url(#logoGlow)"/>

    <!-- Q1: Cloud (top-left) outline only -->
    <g transform="translate(-14,-14)">
      <path d="M -7,2 Q -7,-3 -4,-3 Q -2,-5 2,-3 Q 5,-5 7,-2 Q 8,0 7,2 Q 5,3 2,3 L -5,3 Q -7,3 -7,2 Z"
            fill="none" stroke="#0ea5e9" stroke-width="1.4" opacity="1"/>
    </g>

    <!-- Q2: Graph (top-right) outline only -->
    <g transform="translate(14,-14)">
      <g fill="none" stroke="#ef4444" stroke-width="1.4" opacity="1">
        <circle cx="-6" cy="-4" r="2.0"/>
        <circle cx="6" cy="-4" r="2.0"/>
        <circle cx="0" cy="6" r="2.0"/>
        <line x1="-6" y1="-4" x2="6" y2="-4"/>
        <line x1="-6" y1="-4" x2="0" y2="6"/>
        <line x1="6" y1="-4" x2="0" y2="6"/>
      </g>
    </g>

    <!-- Q3: Vector (bottom-left) as quiver of 3 arrows (outline only) -->
    <g transform="translate(-14,14)">
      <g stroke="#059669" stroke-width="1.4" fill="none">
        <!-- Common origin -->
        <!-- Arrow 1 -->
        <line x1="-6" y1="6" x2="6" y2="-6" stroke-linecap="round"/>
        <line x1="6" y1="-6" x2="2" y2="-6"/>
        <line x1="6" y1="-6" x2="6" y2="-2"/>
        <!-- Arrow 2 -->
        <line x1="-6" y1="6" x2="3" y2="2" stroke-linecap="round"/>
        <line x1="3" y1="2" x2="-1" y2="2"/>
        <line x1="3" y1="2" x2="3" y2="6"/>
        <!-- Arrow 3 -->
        <line x1="-6" y1="6" x2="0" y2="-6" stroke-linecap="round"/>
        <line x1="0" y1="-6" x2="-4" y2="-6"/>
        <line x1="0" y1="-6" x2="0" y2="-2"/>
      </g>
    </g>

    <!-- Q4: SKS (bottom-right) as knowledge page with accuracy check (outline only) -->
    <g transform="translate(14,14)" fill="none" stroke="#7c3aed" stroke-width="1.4">
      <!-- Page outline -->
      <rect x="-6" y="-8" width="12" height="16" rx="1.6"/>
      <!-- Folded corner -->
      <line x1="7" y1="-9" x2="3" y2="-5"/>
      <line x1="3" y1="-5" x2="7" y2="-5"/>
      <!-- Accuracy checkmark -->
      <line x1="-3" y1="2" x2="-1" y2="4"/>
      <line x1="-1" y1="4" x2="3" y2="0"/>
    </g>

    <!-- Center DB cylinder at grid origin (0,0), outline only -->
    <g transform="translate(0,0)" fill="none" stroke="#1e40af" stroke-width="1.4">
      <ellipse cx="0" cy="-3" rx="5" ry="2.0"/>
      <rect x="-5" y="-3" width="10" height="8"/>
      <ellipse cx="0" cy="5" rx="5" ry="2.0"/>
    </g>
  </g>

  <!-- Company Name -->
  <text x="140" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="url(#textGradient)">
    Proxima
  </text>
  <!-- Shifted right to avoid overlap with 'Proxima' -->
  <text x="252" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="300" fill="url(#textGradient)">
    DB
  </text>
  
  <!-- Enhanced Tagline -->
  <text x="140" y="60" font-family="Arial, sans-serif" font-size="10" fill="#64748b" font-weight="500">
    Unified Intelligence Platform
  </text>
  
  <!-- Core Capabilities -->
  <!-- Updated to reflect current capabilities -->
  <text x="140" y="75" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8">
    Vector • Graph • SKS • SQL
  </text>
  <text x="140" y="86" font-family="Arial, sans-serif" font-size="8.5" fill="#94a3b8">
    Serverless • Multicloud
  </text>
  
  <!-- Performance and cloud indicators -->
  <g transform="translate(140, 98)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="8" fill="#10b981">⚡ Hardware-accelerated</text>
    <text x="70" y="0" font-family="Arial, sans-serif" font-size="8" fill="#0ea5e9">☁️ Zero Infrastructure</text>
  </g>

  <!-- Multicloud provider icons -->
  <!-- Moved further down to avoid overlaps with added capability line -->
  <g transform="translate(260, 110)" opacity="0.7">
    <!-- AWS icon -->
    <rect x="0" y="0" width="8" height="6" rx="1" fill="#ff9900"/>
    <!-- Azure icon -->  
    <rect x="10" y="0" width="8" height="6" rx="1" fill="#0078d4"/>
    <!-- GCP icon -->
    <rect x="20" y="0" width="8" height="6" rx="1" fill="#4285f4"/>
    <!-- Generic cloud -->
    <rect x="30" y="0" width="8" height="6" rx="1" fill="#6b7280"/>
  </g>
</svg>
