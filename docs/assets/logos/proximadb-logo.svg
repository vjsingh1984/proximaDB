<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient with professional blue tones -->
    <linearGradient id="proximaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;" />
      <stop offset="50%" style="stop-color:#1e40af;" />
      <stop offset="100%" style="stop-color:#1e3a8a;" />
    </linearGradient>
    
    <!-- Accent gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;" />
      <stop offset="100%" style="stop-color:#0891b2;" />
    </linearGradient>
    
    <!-- Professional shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    
    <!-- Glow effect for nodes -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Icon: Vector space visualization -->
  <g transform="translate(20, 15)">
    <!-- Background hexagon shape -->
    <path d="M 15 5 L 35 5 L 45 20 L 35 35 L 15 35 L 5 20 Z" 
          fill="url(#proximaGradient)" opacity="0.1"/>
    
    <!-- Main 'P' curve with vector connections -->
    <path d="M 10 10 L 10 40 M 10 10 Q 30 10, 30 20 T 10 30" 
          fill="none" stroke="url(#proximaGradient)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Vector space nodes -->
    <circle cx="10" cy="10" r="4" fill="#ffffff" stroke="url(#proximaGradient)" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="30" cy="20" r="4" fill="#ffffff" stroke="url(#proximaGradient)" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="10" cy="30" r="4" fill="#ffffff" stroke="url(#proximaGradient)" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="10" cy="40" r="3" fill="url(#proximaGradient)" opacity="0.7"/>
    
    <!-- Connecting vectors -->
    <line x1="14" y1="12" x2="26" y2="18" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
    <line x1="14" y1="28" x2="26" y2="22" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
    
    <!-- Dynamic data flow visualization -->
    <circle cx="20" cy="15" r="1.5" fill="url(#accentGradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="25" r="1.5" fill="url(#accentGradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ProximaDB Text -->
  <text x="75" y="42" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="600" fill="#1e3a8a" filter="url(#shadow)">
    Proxima
  </text>
  <text x="168" y="42" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#proximaGradient)">
    DB
  </text>
  
  <!-- Tagline -->
  <text x="75" y="58" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="10" fill="#64748b" letter-spacing="1.5" font-weight="500">
    VECTOR DATABASE PLATFORM
  </text>
</svg>