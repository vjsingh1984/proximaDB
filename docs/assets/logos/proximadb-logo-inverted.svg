<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Inverted logo for dark backgrounds: white strokes/text on transparent -->
  <defs>
    <style>
      .ink { stroke:#ffffff; fill:none; stroke-width:1.4; }
      .ring { stroke:#ffffff; fill:none; stroke-width:3; }
      .text { fill:#ffffff; font-family:Arial, sans-serif; }
    </style>
  </defs>

  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="34" class="ring"/>
    <!-- Q1 cloud -->
    <path d="M -21,-12 Q -21,-17 -18,-17 Q -16,-19 -12,-17 Q -9,-19 -7,-16 Q -6,-14 -7,-12 Q -9,-11 -12,-11 L -19,-11 Q -21,-11 -21,-12 Z" class="ink"/>
    <!-- Q2 graph -->
    <g class="ink">
      <circle cx="14" cy="-14" r="2"/>
      <circle cx="26" cy="-14" r="2"/>
      <circle cx="20" cy="-4" r="2"/>
      <line x1="14" y1="-14" x2="26" y2="-14"/>
      <line x1="14" y1="-14" x2="20" y2="-4"/>
      <line x1="26" y1="-14" x2="20" y2="-4"/>
    </g>
    <!-- Q3 vector quiver -->
    <g class="ink">
      <line x1="-26" y1="14" x2="-14" y2="2" stroke-linecap="round"/>
      <line x1="-14" y1="2" x2="-18" y2="2"/>
      <line x1="-14" y1="2" x2="-14" y2="6"/>
      <line x1="-26" y1="14" x2="-17" y2="10" stroke-linecap="round"/>
      <line x1="-17" y1="10" x2="-21" y2="10"/>
      <line x1="-17" y1="10" x2="-17" y2="14"/>
      <line x1="-26" y1="14" x2="-20" y2="2" stroke-linecap="round"/>
      <line x1="-20" y1="2" x2="-24" y2="2"/>
      <line x1="-20" y1="2" x2="-20" y2="6"/>
    </g>
    <!-- Q4 sks page+check -->
    <g class="ink">
      <rect x="14" y="14" width="12" height="16" rx="1.4"/>
      <line x1="26" y1="14" x2="23" y2="17"/>
      <line x1="23" y1="17" x2="26" y2="17"/>
      <line x1="17" y1="26" x2="19" y2="28"/>
      <line x1="19" y1="28" x2="23" y2="24"/>
    </g>
    <!-- Center DB -->
    <g class="ink">
      <ellipse cx="0" cy="-3" rx="5" ry="2"/>
      <rect x="-5" y="-3" width="10" height="8"/>
      <ellipse cx="0" cy="5" rx="5" ry="2"/>
    </g>
  </g>

  <text x="140" y="42" class="text" style="font-size:26px; font-weight:bold;">Proxima</text>
  <text x="252" y="42" class="text" style="font-size:26px; font-weight:300;">DB</text>
  <text x="140" y="60" class="text" style="font-size:10px; font-weight:500; opacity:0.85;">Unified Intelligence Platform</text>
</svg>

