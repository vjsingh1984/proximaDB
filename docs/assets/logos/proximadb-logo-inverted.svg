<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Inverted logo for dark backgrounds with vibrant colored strokes -->
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .text { font-family:Arial, sans-serif; }
    </style>
  </defs>

  <!-- Dark background for inverted variant -->
  <rect width="320" height="120" fill="#0b1221"/>

  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.7" stroke-width="3"/>
    <!-- Q1 cloud -->
    <path d="M -21,-12 Q -21,-17 -18,-17 Q -16,-19 -12,-17 Q -9,-19 -7,-16 Q -6,-14 -7,-12 Q -9,-11 -12,-11 L -19,-11 Q -21,-11 -21,-12 Z"
          fill="none" stroke="#22d3ee" stroke-width="1.6"/>
    <!-- Q2 graph -->
    <g fill="none" stroke="#f87171" stroke-width="1.6">
      <circle cx="14" cy="-14" r="2"/>
      <circle cx="26" cy="-14" r="2"/>
      <circle cx="20" cy="-4" r="2"/>
      <line x1="14" y1="-14" x2="26" y2="-14"/>
      <line x1="14" y1="-14" x2="20" y2="-4"/>
      <line x1="26" y1="-14" x2="20" y2="-4"/>
    </g>
    <!-- Q3 vector quiver -->
    <g fill="none" stroke="#34d399" stroke-width="1.6">
      <line x1="-26" y1="14" x2="-14" y2="2" stroke-linecap="round"/>
      <line x1="-14" y1="2" x2="-18" y2="2"/>
      <line x1="-14" y1="2" x2="-14" y2="6"/>
      <line x1="-26" y1="14" x2="-17" y2="10" stroke-linecap="round"/>
      <line x1="-17" y1="10" x2="-21" y2="10"/>
      <line x1="-17" y1="10" x2="-17" y2="14"/>
      <line x1="-26" y1="14" x2="-20" y2="2" stroke-linecap="round"/>
      <line x1="-20" y1="2" x2="-24" y2="2"/>
      <line x1="-20" y1="2" x2="-20" y2="6"/>
    </g>
    <!-- Q4 sks page+check (shrunk to avoid ring overlap) -->
    <g fill="none" stroke="#a78bfa" stroke-width="1.6">
      <rect x="12" y="12" width="10" height="13" rx="1.2"/>
      <line x1="22" y1="12" x2="19" y2="15"/>
      <line x1="19" y1="15" x2="22" y2="15"/>
      <line x1="15" y1="23" x2="17" y2="25"/>
      <line x1="17" y1="25" x2="21" y2="21"/>
    </g>
    <!-- Center DB -->
    <g fill="none" stroke="#60a5fa" stroke-width="1.6">
      <ellipse cx="0" cy="-3" rx="5" ry="2"/>
      <rect x="-5" y="-3" width="10" height="8"/>
      <ellipse cx="0" cy="5" rx="5" ry="2"/>
    </g>
  </g>

  <text x="140" y="42" class="text" style="font-size:26px; font-weight:bold; fill:#f8fafc;">Proxima</text>
  <text x="252" y="42" class="text" style="font-size:26px; font-weight:300; fill:#60a5fa;">DB</text>
  <text x="140" y="60" class="text" style="font-size:10px; font-weight:500; fill:#e2e8f0; opacity:0.9;">Unified Intelligence Platform</text>
</svg>
