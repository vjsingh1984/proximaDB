<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="raptorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;" />
      <stop offset="50%" style="stop-color:#dc2626;" />
      <stop offset="100%" style="stop-color:#b91c1c;" />
    </linearGradient>
    <linearGradient id="raptorWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;" />
      <stop offset="100%" style="stop-color:#ef4444;" />
    </linearGradient>
    <filter id="raptorShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <filter id="raptorSharp">
      <feMorphology operator="dilate" radius="0.5"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="#fef2f2" stroke="url(#raptorGradient)" stroke-width="1" opacity="0.9"/>
  
  <!-- RAPTOR eagle/hawk visualization -->
  <g transform="translate(30, 30)">
    <!-- Matrix/HNSW graph visualization background -->
    <g opacity="0.3">
      <line x1="-12" y1="-12" x2="12" y2="-12" stroke="#dc2626" stroke-width="0.5"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#dc2626" stroke-width="0.5"/>
      <line x1="-12" y1="12" x2="12" y2="12" stroke="#dc2626" stroke-width="0.5"/>
      <line x1="-12" y1="-12" x2="-12" y2="12" stroke="#dc2626" stroke-width="0.5"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#dc2626" stroke-width="0.5"/>
      <line x1="12" y1="-12" x2="12" y2="12" stroke="#dc2626" stroke-width="0.5"/>
    </g>
    
    <!-- Raptor bird silhouette -->
    <g filter="url(#raptorShadow)">
      <!-- Head and beak -->
      <path d="M 0 -12 L 3 -10 L 6 -8 L 4 -6 L 0 -8 Z" 
            fill="url(#raptorGradient)" filter="url(#raptorSharp)"/>
      
      <!-- Body -->
      <ellipse cx="0" cy="-3" rx="5" ry="8" fill="url(#raptorGradient)"/>
      
      <!-- Wings spread -->
      <path d="M -5 -5 Q -12 -8, -16 -2 L -12 0 L -8 -2 Z" 
            fill="url(#raptorWing)" opacity="0.9"/>
      <path d="M 5 -5 Q 12 -8, 16 -2 L 12 0 L 8 -2 Z" 
            fill="url(#raptorWing)" opacity="0.9"/>
      
      <!-- Tail feathers -->
      <path d="M -3 5 L -2 10 L 0 12 L 2 10 L 3 5 Z" 
            fill="url(#raptorGradient)" opacity="0.8"/>
    </g>
    
    <!-- HNSW connection nodes -->
    <circle cx="-8" cy="-8" r="1.5" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <circle cx="8" cy="-8" r="1.5" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <circle cx="0" cy="8" r="1.5" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    
    <!-- Connection lines -->
    <line x1="-8" y1="-8" x2="0" y2="-3" stroke="#dc2626" stroke-width="0.5" opacity="0.5" stroke-dasharray="1,1"/>
    <line x1="8" y1="-8" x2="0" y2="-3" stroke="#dc2626" stroke-width="0.5" opacity="0.5" stroke-dasharray="1,1"/>
    <line x1="0" y1="5" x2="0" y2="8" stroke="#dc2626" stroke-width="0.5" opacity="0.5" stroke-dasharray="1,1"/>
  </g>
  
  <!-- RAPTOR label -->
  <text x="30" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#b91c1c" text-anchor="middle">
    RAPTOR
  </text>
</svg>