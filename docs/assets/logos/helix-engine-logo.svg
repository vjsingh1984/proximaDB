<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helixGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;" />
      <stop offset="50%" style="stop-color:#0d9488;" />
      <stop offset="100%" style="stop-color:#0f766e;" />
    </linearGradient>
    <linearGradient id="helixGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eead4;" />
      <stop offset="100%" style="stop-color:#14b8a6;" />
    </linearGradient>
    <filter id="helixShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <filter id="helixGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="#f0fdfa" stroke="url(#helixGradient1)" stroke-width="1" opacity="0.9"/>
  
  <!-- HELIX double helix DNA visualization -->
  <g transform="translate(30, 30)">
    <!-- Helix strands -->
    <g filter="url(#helixShadow)">
      <!-- First strand -->
      <path d="M -10 -15 Q -5 -10, 0 -5 T 10 5 Q 5 10, 0 15" 
            fill="none" stroke="url(#helixGradient1)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Second strand (intertwined) -->
      <path d="M 10 -15 Q 5 -10, 0 -5 T -10 5 Q -5 10, 0 15" 
            fill="none" stroke="url(#helixGradient2)" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Connection rungs -->
    <g opacity="0.7">
      <line x1="-7" y1="-12" x2="7" y2="-12" stroke="#0d9488" stroke-width="1.5"/>
      <line x1="-5" y1="-7" x2="5" y2="-7" stroke="#0d9488" stroke-width="1.5"/>
      <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#0d9488" stroke-width="1.5"/>
      <line x1="-3" y1="3" x2="3" y2="3" stroke="#0d9488" stroke-width="1.5"/>
      <line x1="-5" y1="8" x2="5" y2="8" stroke="#0d9488" stroke-width="1.5"/>
      <line x1="-7" y1="13" x2="7" y2="13" stroke="#0d9488" stroke-width="1.5"/>
    </g>
    
    <!-- Data nodes on helix -->
    <g filter="url(#helixGlow)">
      <circle cx="-7" cy="-12" r="2" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
      <circle cx="5" cy="-7" r="2" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
      <circle cx="-3" cy="-2" r="2" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
      <circle cx="3" cy="3" r="2" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
      <circle cx="-5" cy="8" r="2" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
      <circle cx="7" cy="13" r="2" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
    </g>
    
    <!-- Rotating animation indicator -->
    <g opacity="0.4">
      <path d="M -15 0 A 15 15 0 0 1 0 -15" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="2,3">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- HELIX label -->
  <text x="30" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#0f766e" text-anchor="middle">
    HELIX
  </text>
</svg>