<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="viperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;" />
      <stop offset="50%" style="stop-color:#7c3aed;" />
      <stop offset="100%" style="stop-color:#6d28d9;" />
    </linearGradient>
    <linearGradient id="viperAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;" />
      <stop offset="100%" style="stop-color:#8b5cf6;" />
    </linearGradient>
    <filter id="viperShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <filter id="viperGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="#faf5ff" stroke="url(#viperGradient)" stroke-width="1" opacity="0.9"/>
  
  <!-- VIPER 'V' with columnar data visualization -->
  <g transform="translate(30, 30)">
    <!-- Stylized 'V' representing columnar structure -->
    <path d="M -12 -15 L -6 5 L 0 -15 L 6 5 L 12 -15" 
          fill="none" stroke="url(#viperGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#viperShadow)"/>
    
    <!-- Columnar data blocks -->
    <rect x="-14" y="8" width="6" height="8" rx="1" fill="url(#viperAccent)" opacity="0.8"/>
    <rect x="-7" y="8" width="6" height="8" rx="1" fill="url(#viperGradient)" opacity="0.9"/>
    <rect x="0" y="8" width="6" height="8" rx="1" fill="url(#viperAccent)" opacity="0.8"/>
    <rect x="7" y="8" width="6" height="8" rx="1" fill="url(#viperGradient)" opacity="0.9"/>
    
    <!-- Data compression visualization -->
    <circle cx="0" cy="-10" r="2" fill="#ffffff" stroke="url(#viperGradient)" stroke-width="1.5">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Parquet format indicator -->
    <path d="M -3 12 L 3 12" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- VIPER label -->
  <text x="30" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#6d28d9" text-anchor="middle">
    VIPER
  </text>
</svg>