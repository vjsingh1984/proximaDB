<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="vectorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="graphGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sksGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#heroGradient)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Main Title -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">
    ProximaDB
  </text>
  
  <!-- Tagline -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="300" text-anchor="middle" fill="#e2e8f0">
    The World's First Unified Vector + Graph + Knowledge Platform
  </text>

  <!-- Three Core Capabilities - Unified Design -->
  <g transform="translate(150, 180)">
    <!-- Vector Search Circle -->
    <circle cx="0" cy="80" r="60" fill="url(#vectorGradient)" filter="url(#glow)" opacity="0.9"/>
    <!-- Move labels below the icon to avoid overlap -->
    <text x="0" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">VECTOR</text>
    <text x="0" y="168" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Text • Image • Video</text>
    <!-- Removed ops/sec text to reduce clutter/overlap -->
    
    <!-- Vector quiver (outline) for clarity inside the vector circle -->
    <g fill="none" stroke="white" stroke-width="1.6" opacity="0.9">
      <line x1="-20" y1="90" x2="15" y2="55" stroke-linecap="round"/>
      <line x1="15" y1="55" x2="7" y2="55"/>
      <line x1="15" y1="55" x2="15" y2="63"/>
      <line x1="-20" y1="90" x2="8" y2="75" stroke-linecap="round"/>
      <line x1="8" y1="75" x2="1" y2="75"/>
      <line x1="8" y1="75" x2="8" y2="82"/>
      <line x1="-20" y1="90" x2="-2" y2="55" stroke-linecap="round"/>
      <line x1="-2" y1="55" x2="-9" y2="55"/>
      <line x1="-2" y1="55" x2="-2" y2="63"/>
    </g>
  </g>

  <g transform="translate(600, 180)">
    <!-- Graph Network Circle -->
    <circle cx="0" cy="80" r="60" fill="url(#graphGradient)" filter="url(#glow)" opacity="0.9"/>
    <!-- Move label below the icon to avoid overlap -->
    <text x="0" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">GRAPH</text>
    <!-- Removed production readiness and engine name text per request -->
    
    <!-- Graph nodes and connections -->
    <!-- Shift graph nodes down to avoid overlapping the GRAPH label -->
    <g fill="white" opacity="0.8" transform="translate(0,12)">
      <circle cx="-15" cy="65" r="3"/>
      <circle cx="15" cy="65" r="3"/>
      <circle cx="-10" cy="95" r="3"/>
      <circle cx="10" cy="95" r="3"/>
      <line x1="-15" y1="65" x2="15" y2="65" stroke="white" stroke-width="1"/>
      <line x1="-15" y1="65" x2="-10" y2="95" stroke="white" stroke-width="1"/>
      <line x1="15" y1="65" x2="10" y2="95" stroke="white" stroke-width="1"/>
      <line x1="-10" y1="95" x2="10" y2="95" stroke="white" stroke-width="1"/>
    </g>
  </g>

  <g transform="translate(1050, 180)">
    <!-- SKS Unified Circle -->
    <circle cx="0" cy="80" r="60" fill="url(#sksGradient)" filter="url(#glow)" opacity="0.9"/>
    <!-- Move labels below the icon to avoid overlap -->
    <text x="0" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">SKS</text>
    <text x="0" y="168" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Hybrid AI</text>
    
    <!-- SKS knowledge page with accuracy check (outline) shifted up -->
    <g fill="none" stroke="white" stroke-width="2" opacity="0.9">
      <rect x="-18" y="40" width="36" height="40" rx="4"/>
      <line x1="18" y1="40" x2="10" y2="48"/>
      <line x1="10" y1="48" x2="18" y2="48"/>
      <line x1="-6" y1="66" x2="-1" y2="71"/>
      <line x1="-1" y1="71" x2="8" y2="60"/>
    </g>
  </g>

  <!-- Connecting lines showing unified system -->
  <line x1="210" y1="260" x2="540" y2="260" stroke="white" stroke-width="3" opacity="0.6" stroke-dasharray="5,5"/>
  <line x1="660" y1="260" x2="990" y2="260" stroke="white" stroke-width="3" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- Central "ONE PLATFORM" indicator -->
  <rect x="500" y="320" width="200" height="40" rx="20" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="1"/>
  <text x="600" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    ONE PLATFORM
  </text>

  <!-- Performance indicators -->
  <g transform="translate(100, 420)">
    <rect width="300" height="80" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fbbf24">
      ⚡ Sub-Microsecond Latency
    </text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      Hardware-accelerated
    </text>
    <text x="150" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e2e8f0">
      SIMD-Optimized • Zero-Copy
    </text>
  </g>

  <g transform="translate(450, 420)">
    <rect width="300" height="80" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">
      🧠 Unified Intelligence
    </text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      Vector + Graph + Knowledge
    </text>
    <text x="150" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e2e8f0">
      Text • Image • Video • Audio
    </text>
  </g>

  <g transform="translate(800, 420)">
    <rect width="300" height="80" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b5cf6">
      🌐 API-First Serverless
    </text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      REST + gRPC • Auto-Orchestration
    </text>
    <text x="150" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e2e8f0">
      Zero Infrastructure Management
    </text>
  </g>

  <!-- Bottom CTA -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">
    🎯 Creating a New Category: <tspan font-weight="bold">Unified Intelligence Platforms</tspan>
  </text>
</svg>
