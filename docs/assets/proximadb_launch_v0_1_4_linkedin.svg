<?xml version="1.0" encoding="UTF-8"?>
<!-- ProximaDB v0.1.4 LinkedIn Banner (1200x627) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #e2e8f0; }
      .chip { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #0f172a; }
      .kicker { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #cbd5e1; }
      .metric { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #cbd5e1; }
      .footer { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #94a3b8; }
      .cardTitle { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0b1220; }
      .cardText { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0b1220; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="627" fill="url(#bgGradient)"/>

  <!-- Accent orbs -->
  <circle cx="1060" cy="90" r="90" fill="url(#accentGradient)" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="160" cy="540" r="120" fill="url(#accentGradient)" opacity="0.20" filter="url(#softGlow)"/>

  <!-- Header -->
  <text x="60" y="100" class="kicker">Launch · v0.1.4</text>
  <text x="60" y="150" class="title">ProximaDB</text>
  <text x="60" y="190" class="subtitle">Hybrid Vector + Graph Database for AI</text>

  <!-- Feature chips -->
  <g transform="translate(60,220)">
    <rect x="0" y="0" rx="10" ry="10" width="240" height="38" fill="#e2e8f0"/>
    <text x="16" y="26" class="chip">SKS: Vector + Graph</text>
  </g>
  <g transform="translate(314,220)">
    <rect x="0" y="0" rx="10" ry="10" width="260" height="38" fill="#e2e8f0"/>
    <text x="16" y="26" class="chip">Type-Safe Filters (Faster)</text>
  </g>
  <g transform="translate(588,220)">
    <rect x="0" y="0" rx="10" ry="10" width="310" height="38" fill="#e2e8f0"/>
    <text x="16" y="26" class="chip">SST+LZ4: Compression Accelerates</text>
  </g>

  <!-- Metrics row -->
  <g transform="translate(60,288)">
    <!-- Card 1: Hybrid Query -->
    <rect x="0" y="0" width="340" height="140" rx="16" ry="16" fill="#c7d2fe"/>
    <text x="20" y="44" class="cardTitle">Hybrid Query (Vector + Graph)</text>
    <text x="20" y="82" class="metric">≈ 2.14 ms</text>
    <text x="20" y="112" class="label">Unified SKS pipeline · demo workload</text>
  </g>

  <g transform="translate(420,288)">
    <!-- Card 2: Filters -->
    <rect x="0" y="0" width="340" height="140" rx="16" ry="16" fill="#bae6fd"/>
    <text x="20" y="44" class="cardTitle">Type-Safe Filtering</text>
    <text x="20" y="82" class="metric">-20% to +3%</text>
    <text x="20" y="112" class="label">Often faster than no filters</text>
  </g>

  <g transform="translate(780,288)">
    <!-- Card 3: Compression -->
    <rect x="0" y="0" width="340" height="140" rx="16" ry="16" fill="#bbf7d0"/>
    <text x="20" y="44" class="cardTitle">SST + LZ4 (10K Vectors)</text>
    <text x="20" y="82" class="metric">≈ 5.32 ms</text>
    <text x="20" y="112" class="label">Faster vs uncompressed · ~50%+ savings</text>
  </g>

  <!-- Engine row -->
  <g transform="translate(60,460)">
    <text x="0" y="0" class="subtitle" style="font-size:20px;">AUTO Engine Selection</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="250" height="50" rx="12" ry="12" fill="#f1f5f9"/>
      <text x="16" y="32" class="cardText">HELIX · SWIFT · SST · VIPER</text>
    </g>
  </g>

  <!-- SIMD + Footer -->
  <g transform="translate(420,460)">
    <text x="0" y="0" class="subtitle" style="font-size:20px;">SIMD Acceleration</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="300" height="50" rx="12" ry="12" fill="#f1f5f9"/>
      <text x="16" y="32" class="cardText">AVX2 · AVX512 · NEON</text>
    </g>
  </g>

  <g transform="translate(60,560)">
    <text x="0" y="0" class="footer">Single Binary · REST/gRPC · Python SDK · Cloud Tiering</text>
  </g>

  <!-- Watermark -->
  <g opacity="0.85" transform="translate(940,560)">
    <rect x="0" y="-28" width="200" height="36" rx="18" ry="18" fill="url(#accentGradient)"/>
    <text x="20" y="-5" class="footer" style="fill:#0b1220; font-weight:800;">ProximaDB</text>
  </g>
</svg>

