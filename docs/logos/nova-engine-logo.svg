<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- NOVA Engine Logo: Next-gen Optimized Vector Analytics -->
  <!-- Design: Supernova explosion with hierarchical statistics visualization -->
  
  <defs>
    <!-- Radial gradient for nova burst -->
    <radialGradient id="novaGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFE53B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF2525;stop-opacity:0.9" />
      <stop offset="60%" style="stop-color:#FF00AA;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#6600FF;stop-opacity:0.4" />
    </radialGradient>
    
    <!-- Linear gradient for stats bars -->
    <linearGradient id="statsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00AA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFE53B;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="novaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Star filter -->
    <filter id="starBurst">
      <feMorphology operator="dilate" radius="1"/>
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#000014"/>
  
  <!-- Star field background -->
  <g opacity="0.6">
    <circle cx="50" cy="30" r="1" fill="#FFF"/>
    <circle cx="120" cy="50" r="0.5" fill="#FFF"/>
    <circle cx="350" cy="40" r="1" fill="#FFF"/>
    <circle cx="300" cy="20" r="0.5" fill="#FFF"/>
    <circle cx="250" cy="35" r="0.8" fill="#FFF"/>
    <circle cx="180" cy="25" r="0.5" fill="#FFF"/>
    <circle cx="370" cy="60" r="0.7" fill="#FFF"/>
  </g>
  
  <!-- Nova burst center -->
  <g transform="translate(100, 70)" filter="url(#novaGlow)">
    <!-- Core -->
    <circle cx="0" cy="0" r="15" fill="url(#novaGradient)"/>
    
    <!-- Burst rays -->
    <g opacity="0.8">
      <!-- Main cross -->
      <rect x="-2" y="-40" width="4" height="80" fill="url(#novaGradient)" transform="rotate(0)"/>
      <rect x="-2" y="-40" width="4" height="80" fill="url(#novaGradient)" transform="rotate(90)"/>
      
      <!-- Diagonal rays -->
      <rect x="-1.5" y="-35" width="3" height="70" fill="url(#novaGradient)" transform="rotate(45)"/>
      <rect x="-1.5" y="-35" width="3" height="70" fill="url(#novaGradient)" transform="rotate(-45)"/>
      
      <!-- Secondary rays -->
      <rect x="-1" y="-30" width="2" height="60" fill="url(#novaGradient)" transform="rotate(22.5)"/>
      <rect x="-1" y="-30" width="2" height="60" fill="url(#novaGradient)" transform="rotate(-22.5)"/>
      <rect x="-1" y="-30" width="2" height="60" fill="url(#novaGradient)" transform="rotate(67.5)"/>
      <rect x="-1" y="-30" width="2" height="60" fill="url(#novaGradient)" transform="rotate(-67.5)"/>
    </g>
    
    <!-- Inner bright core -->
    <circle cx="0" cy="0" r="8" fill="#FFE53B" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- Hierarchical statistics visualization -->
  <g transform="translate(220, 40)" opacity="0.8">
    <!-- SuperBlock level -->
    <rect x="0" y="0" width="150" height="8" fill="url(#statsGradient)" rx="2"/>
    <text x="155" y="6" font-family="monospace" font-size="8" fill="#FFE53B">SuperBlock</text>
    
    <!-- Block level -->
    <g transform="translate(10, 15)">
      <rect x="0" y="0" width="60" height="6" fill="url(#statsGradient)" rx="1" opacity="0.8"/>
      <rect x="70" y="0" width="60" height="6" fill="url(#statsGradient)" rx="1" opacity="0.8"/>
      <text x="135" y="5" font-family="monospace" font-size="7" fill="#FF00AA">Blocks</text>
    </g>
    
    <!-- Row group level -->
    <g transform="translate(20, 28)">
      <rect x="0" y="0" width="25" height="4" fill="url(#statsGradient)" rx="1" opacity="0.6"/>
      <rect x="30" y="0" width="25" height="4" fill="url(#statsGradient)" rx="1" opacity="0.6"/>
      <rect x="60" y="0" width="25" height="4" fill="url(#statsGradient)" rx="1" opacity="0.6"/>
      <rect x="90" y="0" width="25" height="4" fill="url(#statsGradient)" rx="1" opacity="0.6"/>
      <text x="120" y="4" font-family="monospace" font-size="6" fill="#6600FF">RowGroups</text>
    </g>
  </g>
  
  <!-- Zone map visualization -->
  <g transform="translate(250, 90)" opacity="0.6">
    <rect x="0" y="0" width="120" height="30" fill="none" stroke="#FF00AA" stroke-width="1" rx="3"/>
    <text x="60" y="10" font-family="monospace" font-size="8" fill="#FF00AA" text-anchor="middle">ZONE MAPS</text>
    <line x1="10" y1="15" x2="30" y2="15" stroke="#FFE53B" stroke-width="2"/>
    <line x1="40" y1="15" x2="60" y2="15" stroke="#FFE53B" stroke-width="2"/>
    <line x1="70" y1="15" x2="90" y2="15" stroke="#FFE53B" stroke-width="2"/>
    <line x1="95" y1="15" x2="110" y2="15" stroke="#FFE53B" stroke-width="2"/>
    
    <!-- Min/max indicators -->
    <circle cx="10" cy="15" r="2" fill="#FFE53B"/>
    <circle cx="110" cy="15" r="2" fill="#FFE53B"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="36" 
        font-weight="bold" fill="#FFFFFF" text-anchor="middle">NOVA</text>
  
  <text x="200" y="177" font-family="'Segoe UI', Arial, sans-serif" font-size="11" 
        fill="#FF00AA" text-anchor="middle" letter-spacing="2">NEXT-GEN VECTOR ANALYTICS</text>
  
  <!-- Performance indicators -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="55" height="18" rx="3" fill="none" stroke="#FFE53B" stroke-width="1"/>
    <text x="27" y="12" font-family="monospace" font-size="9" fill="#FFE53B" text-anchor="middle">3-TIER</text>
  </g>
  
  <g transform="translate(325, 170)">
    <rect x="0" y="0" width="55" height="18" rx="3" fill="none" stroke="#FFE53B" stroke-width="1"/>
    <text x="27" y="12" font-family="monospace" font-size="9" fill="#FFE53B" text-anchor="middle">STATS</text>
  </g>
</svg>