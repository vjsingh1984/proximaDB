<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- RAPTOR Engine Logo: Row-Aligned Predicated Tensor Optimized Repository -->
  <!-- Design: Aggressive bird of prey with row-based data visualization -->
  
  <defs>
    <!-- Gradient for the raptor -->
    <linearGradient id="raptorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for row data -->
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#0A0E27"/>
  
  <!-- Row data visualization (representing row-aligned storage) -->
  <g opacity="0.6">
    <!-- Row 1 -->
    <rect x="20" y="40" width="360" height="8" rx="2" fill="url(#dataGradient)"/>
    <!-- Row 2 -->
    <rect x="20" y="55" width="340" height="8" rx="2" fill="url(#dataGradient)"/>
    <!-- Row 3 -->
    <rect x="20" y="70" width="350" height="8" rx="2" fill="url(#dataGradient)"/>
    <!-- Row 4 -->
    <rect x="20" y="85" width="330" height="8" rx="2" fill="url(#dataGradient)"/>
    <!-- Row 5 -->
    <rect x="20" y="100" width="355" height="8" rx="2" fill="url(#dataGradient)"/>
  </g>
  
  <!-- Stylized raptor silhouette -->
  <g transform="translate(50, 30)" filter="url(#shadow)">
    <!-- Wing -->
    <path d="M 0 40 L 30 20 L 60 25 L 80 35 L 70 45 L 40 50 Z" 
          fill="url(#raptorGradient)" opacity="0.9"/>
    <!-- Body -->
    <ellipse cx="35" cy="45" rx="25" ry="18" fill="url(#raptorGradient)"/>
    <!-- Head -->
    <circle cx="55" cy="38" r="12" fill="url(#raptorGradient)"/>
    <!-- Beak -->
    <path d="M 65 38 L 72 36 L 70 40 Z" fill="#FF4500"/>
    <!-- Eye -->
    <circle cx="58" cy="36" r="2" fill="#FFF"/>
    <!-- Tail -->
    <path d="M 10 48 L 5 55 L 12 52 L 8 58 L 15 54 Z" fill="url(#raptorGradient)"/>
  </g>
  
  <!-- HNSW Graph visualization (small network) -->
  <g opacity="0.7">
    <!-- Connections -->
    <line x1="300" y1="60" x2="320" y2="50" stroke="#4A90E2" stroke-width="1"/>
    <line x1="320" y1="50" x2="340" y2="55" stroke="#4A90E2" stroke-width="1"/>
    <line x1="340" y1="55" x2="350" y2="70" stroke="#4A90E2" stroke-width="1"/>
    <line x1="300" y1="60" x2="310" y2="75" stroke="#4A90E2" stroke-width="1"/>
    <line x1="310" y1="75" x2="330" y2="80" stroke="#4A90E2" stroke-width="1"/>
    <!-- Nodes -->
    <circle cx="300" cy="60" r="3" fill="#7B68EE"/>
    <circle cx="320" cy="50" r="3" fill="#7B68EE"/>
    <circle cx="340" cy="55" r="3" fill="#7B68EE"/>
    <circle cx="350" cy="70" r="3" fill="#7B68EE"/>
    <circle cx="310" cy="75" r="3" fill="#7B68EE"/>
    <circle cx="330" cy="80" r="3" fill="#7B68EE"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="36" 
        font-weight="bold" fill="#FFFFFF" text-anchor="middle">RAPTOR</text>
  
  <text x="200" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="12" 
        fill="#7B68EE" text-anchor="middle" letter-spacing="3">ROW-ALIGNED TENSOR ENGINE</text>
  
  <!-- Performance indicator -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="none" stroke="#4A90E2" stroke-width="1"/>
    <text x="30" y="14" font-family="monospace" font-size="10" fill="#4A90E2" text-anchor="middle">HNSW</text>
  </g>
</svg>