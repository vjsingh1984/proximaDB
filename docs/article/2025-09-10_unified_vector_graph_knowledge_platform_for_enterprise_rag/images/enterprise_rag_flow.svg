<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified SVG for broad renderer compatibility: inline styles, no markers -->
  
  <!-- Reusable basic styles as attributes in elements below -->

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Enterprise RAG on ProximaDB: Unified Vector + Graph + SKS</text>

  <!-- Ingestion -->
  <rect x="60" y="90" width="220" height="120" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="170" y="120" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Ingestion</text>
  <text x="80" y="145" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Documents → Embeddings</text>
  <text x="80" y="170" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Metadata (dept, version, dates)</text>
  <text x="80" y="195" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Entities & relations extracted</text>
  <!-- doc icon -->
  <rect x="240" y="102" width="30" height="40" fill="#f3f4f6" stroke="#9ca3af" rx="4"/>
  <polyline points="270,102 260,112 270,112" fill="none" stroke="#9ca3af"/>

  <!-- SKS Entities -->
  <rect x="340" y="90" width="230" height="120" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="455" y="120" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Semantic Knowledge Store (SKS)</text>
  <text x="360" y="145" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Entities with embeddings</text>
  <text x="360" y="170" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Provenance & temporal info</text>
  <text x="360" y="195" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Typed & flexible metadata</text>
  <!-- cylinder -->
  <ellipse cx="555" cy="115" rx="18" ry="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <rect x="537" y="115" width="36" height="24" fill="#f3f4f6" stroke="#9ca3af"/>
  <ellipse cx="555" cy="139" rx="18" ry="6" fill="#f3f4f6" stroke="#9ca3af"/>

  <!-- Graph -->
  <rect x="650" y="90" width="220" height="120" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="760" y="120" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Graph Relationships</text>
  <text x="670" y="145" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• References, ownership, dependencies</text>
  <text x="670" y="170" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Constraints & traversal</text>
  <!-- graph nodes -->
  <g>
    <circle cx="855" cy="120" r="5"/>
    <circle cx="885" cy="135" r="5"/>
    <circle cx="845" cy="152" r="5"/>
  </g>
  <line x1="855" y1="120" x2="885" y2="135" style="stroke:#0ea5e9; stroke-width:2;"/>
  <line x1="855" y1="120" x2="845" y2="152" style="stroke:#0ea5e9; stroke-width:2;"/>
  <line x1="845" y1="152" x2="885" y2="135" style="stroke:#0ea5e9; stroke-width:2;"/>

  <!-- Arrows top row -->
  <line x1="280" y1="150" x2="335" y2="150" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="335,146 345,150 335,154" style="fill:#1f2937;"/>
  <line x1="570" y1="150" x2="645" y2="150" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="645,146 655,150 645,154" style="fill:#1f2937;"/>

  <!-- Query Layer -->
  <rect x="140" y="280" width="330" height="120" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="305" y="310" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">SQL Query (SqlService)</text>
  <rect x="160" y="325" width="290" height="54" rx="18" ry="18" style="fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5;"/>
  <text x="305" y="345" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">SELECT passage, source, owner</text>
  <text x="305" y="366" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">WHERE SIMILAR(...) AND FOLLOW(...)</text>

  <!-- Services -->
  <rect x="520" y="260" width="200" height="90" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="620" y="288" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Vector Operations</text>
  <text x="540" y="312" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Similarity + filtering</text>
  <text x="540" y="334" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Progressive search</text>

  <rect x="520" y="360" width="200" height="90" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="620" y="388" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Graph Service</text>
  <text x="540" y="412" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Traversal & pathfinding</text>
  <text x="540" y="434" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Constraints & streaming</text>

  <!-- Fusion -->
  <rect x="750" y="300" width="170" height="110" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="835" y="328" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Fusion</text>
  <text x="765" y="354" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• RRF / Adaptive fusion</text>
  <text x="765" y="376" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Ranking & dedup</text>

  <!-- Answer -->
  <rect x="950" y="280" width="190" height="140" rx="10" ry="10" style="fill:#ffffff; stroke:#1f2937; stroke-width:2;"/>
  <text x="1045" y="310" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Answer + Citations</text>
  <text x="970" y="336" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Cited sources (URLs)</text>
  <text x="970" y="358" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Owner & timestamp</text>
  <text x="970" y="380" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Compact context window</text>

  <!-- Arrows lower row -->
  <line x1="470" y1="340" x2="515" y2="308" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="515,303 525,310 513,315" style="fill:#1f2937;"/>
  <line x1="470" y1="340" x2="515" y2="402" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="515,397 525,405 513,409" style="fill:#1f2937;"/>
  <line x1="720" y1="305" x2="745" y2="340" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="744,335 755,345 742,347" style="fill:#1f2937;"/>
  <line x1="720" y1="405" x2="745" y2="370" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="740,370 753,368 745,380" style="fill:#1f2937;"/>
  <line x1="920" y1="355" x2="945" y2="352" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="944,348 955,352 944,356" style="fill:#1f2937;"/>

  <!-- Legend Pills -->
  <rect x="60" y="440" width="220" height="50" rx="18" ry="18" style="fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5;"/>
  <circle cx="78" cy="465" r="6" style="fill:#0ea5e9;"/>
  <text x="95" y="470" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">Vector Similarity</text>
  <circle cx="210" cy="465" r="6" style="fill:#8b5cf6;"/>
  <text x="228" y="470" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">Graph Traversal</text>

  <rect x="320" y="440" width="280" height="50" rx="18" ry="18" style="fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5;"/>
  <rect x="338" y="458" width="20" height="12" style="fill:#10b981;"/>
  <text x="365" y="468" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">SKS Entities & Metadata</text>
  <rect x="520" y="458" width="20" height="12" style="fill:#f59e0b;"/>
  <text x="545" y="468" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">Provenance & Temporal</text>

