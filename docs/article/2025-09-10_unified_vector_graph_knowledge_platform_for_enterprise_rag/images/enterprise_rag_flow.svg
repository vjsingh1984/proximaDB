<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill:#ffffff; stroke:#1f2937; stroke-width:2; rx:10; ry:10; }
      .title { font-family: Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827; }
      .text { font-family: Arial, sans-serif; font-size:13px; fill:#374151; }
      .arrow { stroke:#1f2937; stroke-width:2; marker-end:url(#arrowHead); fill:none; }
      .pill { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5; rx:18; ry:18; }
      .accent { fill:#0ea5e9; }
      .accent2 { fill:#8b5cf6; }
      .accent3 { fill:#10b981; }
      .accent4 { fill:#f59e0b; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">Enterprise RAG on ProximaDB: Unified Vector + Graph + SKS</text>

  <!-- Ingestion -->
  <rect x="60" y="90" width="220" height="120" class="box"/>
  <text x="170" y="120" text-anchor="middle" class="title">Ingestion</text>
  <text x="80" y="145" class="text">• Documents → Embeddings</text>
  <text x="80" y="170" class="text">• Metadata (dept, version, dates)</text>
  <text x="80" y="195" class="text">• Entities & relations extracted</text>
  <!-- doc icon -->
  <rect x="240" y="102" width="30" height="40" fill="#f3f4f6" stroke="#9ca3af" rx="4"/>
  <polyline points="270,102 260,112 270,112" fill="none" stroke="#9ca3af"/>

  <!-- SKS Entities -->
  <rect x="340" y="90" width="230" height="120" class="box"/>
  <text x="455" y="120" text-anchor="middle" class="title">Semantic Knowledge Store (SKS)</text>
  <text x="360" y="145" class="text">• Entities with embeddings</text>
  <text x="360" y="170" class="text">• Provenance & temporal info</text>
  <text x="360" y="195" class="text">• Typed & flexible metadata</text>
  <!-- cylinder -->
  <ellipse cx="555" cy="115" rx="18" ry="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <rect x="537" y="115" width="36" height="24" fill="#f3f4f6" stroke="#9ca3af"/>
  <ellipse cx="555" cy="139" rx="18" ry="6" fill="#f3f4f6" stroke="#9ca3af"/>

  <!-- Graph -->
  <rect x="650" y="90" width="220" height="120" class="box"/>
  <text x="760" y="120" text-anchor="middle" class="title">Graph Relationships</text>
  <text x="670" y="145" class="text">• References, ownership, dependencies</text>
  <text x="670" y="170" class="text">• Constraints & traversal</text>
  <!-- graph nodes -->
  <g fill="#0ea5e9">
    <circle cx="855" cy="120" r="5"/>
    <circle cx="885" cy="135" r="5"/>
    <circle cx="845" cy="152" r="5"/>
  </g>
  <g stroke="#0ea5e9">
    <line x1="855" y1="120" x2="885" y2="135"/>
    <line x1="855" y1="120" x2="845" y2="152"/>
    <line x1="845" y1="152" x2="885" y2="135"/>
  </g>

  <!-- Arrows top row -->
  <line x1="280" y1="150" x2="340" y2="150" class="arrow"/>
  <line x1="570" y1="150" x2="650" y2="150" class="arrow"/>

  <!-- Query Layer -->
  <rect x="140" y="280" width="330" height="120" class="box"/>
  <text x="305" y="310" text-anchor="middle" class="title">SQL Query (SqlService)</text>
  <rect x="160" y="325" width="290" height="54" class="pill"/>
  <text x="305" y="345" text-anchor="middle" class="text">SELECT passage, source, owner</text>
  <text x="305" y="366" text-anchor="middle" class="text">WHERE SIMILAR(...) AND FOLLOW(...)</text>

  <!-- Services -->
  <rect x="520" y="260" width="200" height="90" class="box"/>
  <text x="620" y="288" text-anchor="middle" class="title">Vector Operations</text>
  <text x="540" y="312" class="text">• Similarity + filtering</text>
  <text x="540" y="334" class="text">• Progressive search</text>

  <rect x="520" y="360" width="200" height="90" class="box"/>
  <text x="620" y="388" text-anchor="middle" class="title">Graph Service</text>
  <text x="540" y="412" class="text">• Traversal & pathfinding</text>
  <text x="540" y="434" class="text">• Constraints & streaming</text>

  <!-- Fusion -->
  <rect x="750" y="300" width="170" height="110" class="box"/>
  <text x="835" y="328" text-anchor="middle" class="title">Fusion</text>
  <text x="765" y="354" class="text">• RRF / Adaptive fusion</text>
  <text x="765" y="376" class="text">• Ranking & dedup</text>

  <!-- Answer -->
  <rect x="950" y="280" width="190" height="140" class="box"/>
  <text x="1045" y="310" text-anchor="middle" class="title">Answer + Citations</text>
  <text x="970" y="336" class="text">• Cited sources (URLs)</text>
  <text x="970" y="358" class="text">• Owner & timestamp</text>
  <text x="970" y="380" class="text">• Compact context window</text>

  <!-- Arrows lower row -->
  <line x1="470" y1="340" x2="520" y2="305" class="arrow"/>
  <line x1="470" y1="340" x2="520" y2="405" class="arrow"/>
  <line x1="720" y1="305" x2="750" y2="345" class="arrow"/>
  <line x1="720" y1="405" x2="750" y2="365" class="arrow"/>
  <line x1="920" y1="355" x2="950" y2="350" class="arrow"/>

  <!-- Legend Pills -->
  <rect x="60" y="440" width="220" height="50" class="pill"/>
  <circle cx="78" cy="465" r="6" class="accent"/>
  <text x="95" y="470" class="text">Vector Similarity</text>
  <circle cx="210" cy="465" r="6" class="accent2"/>
  <text x="228" y="470" class="text">Graph Traversal</text>

  <rect x="320" y="440" width="280" height="50" class="pill"/>
  <rect x="338" y="458" width="20" height="12" class="accent3"/>
  <text x="365" y="468" class="text">SKS Entities & Metadata</text>
  <rect x="520" y="458" width="20" height="12" class="accent4"/>
  <text x="545" y="468" class="text">Provenance & Temporal</text>

</svg>

