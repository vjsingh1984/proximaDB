<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <!-- Enhanced SVG: subtle gradients and gentle animation for emphasis -->
  <defs>
    <!-- Neutral panel gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <!-- Blue panel (Graph) -->
    <linearGradient id="panelGradBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <!-- Purple panel (SKS) -->
    <linearGradient id="panelGradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <!-- Green panel (Vector Ops) -->
    <linearGradient id="panelGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  
  <!-- Reusable basic styles as attributes in elements below -->

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Enterprise RAG on ProximaDB: Unified Vector + Graph + SKS</text>

  <!-- Ingestion -->
  <rect x="60" y="90" width="220" height="120" rx="10" ry="10" style="fill:url(#panelGrad); stroke:#1f2937; stroke-width:2;"/>
  <!-- Vibrant document icon centered at top -->
  <rect x="155" y="105" width="30" height="40" fill="#ff6b35" stroke="#e55a2b" stroke-width="2" rx="4"/>
  <polyline points="185,105 175,115 185,115" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="170" cy="120" r="3" fill="#ffffff"/>
  <!-- Title and text below icon -->
  <text x="170" y="155" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Ingestion</text>
  <text x="80" y="175" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Documents → Embeddings</text>
  <text x="80" y="190" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Metadata (dept, version, dates)</text>
  <text x="80" y="205" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Entities &amp; relations extracted</text>

  <!-- SKS Entities -->
  <rect x="340" y="90" width="230" height="120" rx="10" ry="10" style="fill:url(#panelGradPurple); stroke:#6b21a8; stroke-width:2;"/>
  <!-- Vibrant cylinder database icon centered at top -->
  <ellipse cx="455" cy="110" rx="20" ry="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <rect x="435" y="110" width="40" height="28" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <ellipse cx="455" cy="138" rx="20" ry="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="445" cy="120" r="2" fill="#ffffff"/>
  <circle cx="455" cy="125" r="2" fill="#ffffff"/>
  <circle cx="465" cy="120" r="2" fill="#ffffff"/>
  <!-- Title and text below icon -->
  <text x="455" y="160" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Semantic Knowledge Store (SKS)</text>
  <text x="360" y="180" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Entities with embeddings</text>
  <text x="360" y="195" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Provenance &amp; temporal info</text>
  <text x="360" y="210" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Typed &amp; flexible metadata</text>

  <!-- Graph -->
  <rect x="650" y="90" width="220" height="120" rx="10" ry="10" style="fill:url(#panelGradBlue); stroke:#1d4ed8; stroke-width:2;"/>
  <!-- Vibrant graph network icon centered at top -->
  <circle cx="750" cy="115" r="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  <circle cx="775" cy="110" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <circle cx="770" cy="135" r="6" fill="#06b6d4" stroke="#0284c7" stroke-width="2"/>
  <circle cx="740" cy="130" r="6" fill="#22d3ee" stroke="#0284c7" stroke-width="2"/>
  <line x1="750" y1="115" x2="775" y2="110" style="stroke:#ffffff; stroke-width:3;"/>
  <line x1="750" y1="115" x2="740" y2="130" style="stroke:#ffffff; stroke-width:3;"/>
  <line x1="775" y1="110" x2="770" y2="135" style="stroke:#ffffff; stroke-width:3;"/>
  <line x1="740" y1="130" x2="770" y2="135" style="stroke:#ffffff; stroke-width:3;"/>
  <!-- Title and text below icon -->
  <text x="760" y="160" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Graph Relationships</text>
  <text x="670" y="180" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• References, ownership, dependencies</text>
  <text x="670" y="195" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">• Constraints &amp; traversal</text>

  <!-- Arrows top row -->
  <line x1="280" y1="150" x2="335" y2="150" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="335,146 345,150 335,154" style="fill:#1f2937;"/>
  <line x1="570" y1="150" x2="645" y2="150" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="645,146 655,150 645,154" style="fill:#1f2937;"/>

  <!-- Query Layer -->
  <rect x="140" y="280" width="330" height="120" rx="10" ry="10" style="fill:url(#panelGrad); stroke:#1f2937; stroke-width:2;"/>
  <text x="305" y="310" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">SQL Query (SqlService)</text>
  <rect x="160" y="325" width="290" height="54" rx="18" ry="18" style="fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5;"/>
  <text x="305" y="345" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">SELECT passage, source, owner</text>
  <text x="305" y="366" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">WHERE SIMILAR(...) AND FOLLOW(...)</text>

  <!-- Services -->
  <rect x="520" y="260" width="200" height="90" rx="10" ry="10" style="fill:url(#panelGradGreen); stroke:#065f46; stroke-width:2;">
    <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="620" y="288" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Vector Operations</text>
  <text x="540" y="312" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Similarity + filtering</text>
  <text x="540" y="334" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Progressive search</text>

  <rect x="520" y="360" width="200" height="90" rx="10" ry="10" style="fill:url(#panelGradBlue); stroke:#1f2937; stroke-width:2;"/>
  <text x="620" y="388" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Graph Service</text>
  <text x="540" y="412" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Traversal &amp; pathfinding</text>
  <text x="540" y="434" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Constraints &amp; streaming</text>

  <!-- Fusion -->
  <rect x="750" y="300" width="170" height="110" rx="10" ry="10" style="fill:url(#panelGrad); stroke:#1f2937; stroke-width:2;">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <text x="835" y="328" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Fusion</text>
  <text x="765" y="354" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• RRF / Adaptive fusion</text>
  <text x="765" y="376" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Ranking &amp; dedup</text>

  <!-- Answer -->
  <rect x="950" y="280" width="190" height="140" rx="10" ry="10" style="fill:url(#panelGrad); stroke:#1f2937; stroke-width:2;"/>
  <text x="1045" y="310" text-anchor="middle" style="font-family:Arial, sans-serif; font-size:16px; font-weight:bold; fill:#111827;">Answer + Citations</text>
  <text x="970" y="336" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Cited sources (URLs)</text>
  <text x="970" y="358" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Owner &amp; timestamp</text>
  <text x="970" y="380" style="font-family:Arial, sans-serif; font-size:13px; fill:#374151;">• Compact context window</text>

  <!-- Arrows lower row -->
  <line x1="470" y1="340" x2="515" y2="308" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="515,303 525,310 513,315" style="fill:#1f2937;"/>
  <line x1="470" y1="340" x2="515" y2="402" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="515,397 525,405 513,409" style="fill:#1f2937;"/>
  <line x1="720" y1="305" x2="745" y2="340" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="744,335 755,345 742,347" style="fill:#1f2937;"/>
  <line x1="720" y1="405" x2="745" y2="370" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="740,370 753,368 745,380" style="fill:#1f2937;"/>
  <line x1="920" y1="355" x2="945" y2="352" style="stroke:#1f2937; stroke-width:2;"/>
  <polygon points="944,348 955,352 944,356" style="fill:#1f2937;"/>

  <!-- Legend Pills - Optimally sized and positioned -->
  <rect x="60" y="440" width="276" height="50" rx="18" ry="18" style="fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5;"/>
  <circle cx="78" cy="465" r="6" style="fill:#0ea5e9;"/>
  <text x="95" y="470" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">Vector Similarity</text>
  <circle cx="218" cy="465" r="6" style="fill:#8b5cf6;"/>
  <text x="235" y="470" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">Graph Traversal</text>

  <rect x="384" y="440" width="390" height="50" rx="18" ry="18" style="fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5;"/>
  <rect x="402" y="458" width="16" height="12" style="fill:#10b981;"/>
  <text x="426" y="468" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">SKS Entities &amp; Metadata</text>
  <rect x="600" y="458" width="16" height="12" style="fill:#f59e0b;"/>
  <text x="624" y="468" style="font-family:Arial, sans-serif; font-size:12px; fill:#374151;">Provenance &amp; Temporal</text>

</svg>
