<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920px" height="1080px" viewBox="0 0 1920 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>ProximaDB LinkedIn Article Cover</title>
    <defs>
        <linearGradient x1="0%" y1="100%" x2="100%" y2="0%" id="title-gradient">
            <stop stop-color="#8B5CF6" offset="0%"></stop>
            <stop stop-color="#3B82F6" offset="100%"></stop>
        </linearGradient>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="bg-gradient">
            <stop stop-color="#1e293b" offset="0%"></stop>
            <stop stop-color="#0f172a" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g id="background">
        <rect fill="url(#bg-gradient)" x="0" y="0" width="1920" height="1080"></rect>
    </g>
    <g id="content" transform="translate(360, 300)">
        <text id="title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#title-gradient)">
            <tspan x="0" y="80">Build Trustworthy, Large-Scale AI</tspan>
            <tspan x="0" y="180">on a Budget with ProximaDB</tspan>
        </text>
        
        <g id="icons" transform="translate(0, 350)">
            <!-- Icon 1: Economical Scale -->
            <g transform="translate(0, 0)">
                <circle cx="100" cy="100" r="80" fill="none" stroke="#3B82F6" stroke-width="10"/>
                <path d="M 75 60 L 75 140 M 125 60 L 125 140 M 90 75 C 110 75, 110 55, 100 55 S 90 75, 100 75 M 90 100 C 110 100, 110 80, 100 80 S 90 100, 100 100 M 90 125 C 110 125, 110 105, 100 105 S 90 125, 100 105" stroke="#3B82F6" stroke-width="10" fill="none" stroke-linecap="round"/>
                <text x="100" y="230" font-family="sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">Economical Scale</text>
            </g>

            <!-- Icon 2: Trust & Provenance -->
            <g transform="translate(400, 0)">
                <path d="M 100 20 L 180 50 L 180 120 L 100 180 L 20 120 L 20 50 Z" fill="none" stroke="#10B981" stroke-width="10"/>
                <path d="M 60 95 L 90 125 L 140 75" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="100" y="230" font-family="sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">Trust and Provenance</text>
            </g>

            <!-- Icon 3: AI & Search -->
            <g transform="translate(800, 0)">
                <path d="M 20 100 C 20 50, 50 20, 100 20 C 150 20, 180 50, 180 100 C 180 150, 150 180, 100 180 C 70 180, 45 165, 30 145" fill="none" stroke="#8B5CF6" stroke-width="10"/>
                <path d="M 90 80 A 20 20 0 1 1 110 100" fill="none" stroke="#FFFFFF" stroke-width="8"/>
                <circle cx="100" cy="100" r="8" fill="#FFFFFF"/>
                <text x="100" y="230" font-family="sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">Intelligent Search</text>
            </g>
        </g>
    </g>
</svg>