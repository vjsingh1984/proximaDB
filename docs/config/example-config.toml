# ProximaDB Example Configuration (TOML)

[server]
node_id = "node-1"
bind_address = "0.0.0.0"
port = 5678                # REST fallback if api.rest_port not used
grpc_port = 5679           # Optional; api.grpc_port typically used
data_dir = "./data"

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 100
timeout_seconds = 60
enable_tls = false
ttl_sweep_interval_seconds = 900
rest_compression = false
grpc_compression = false
compression_algorithm = "gzip"
compression_level = 6

[cache]
# Global Cross‑Cache Orchestrator memory budget (MB)
total_memory_mb = 512

[graph]
# Enable bounded prefetch hints during traversals
enable_prefetch = true
# Per-node/iteration adjacency prefetch budget
prefetch_budget = 8

[storage]
metadata_url = "file://./metadata"
mmap_enabled = true
cache_size_mb = 512        # Fallback if [cache] section missing

# One or more locations. Example for local disk:
[[storage.storage_locations]]
url = "file://./data"
weight = 1
tags = ["local"]

[storage.assignment_config]
strategy = "hash"         # hash | round-robin | weighted
affinity = true            # co-locate WAL/data/index

[storage.wal_config]
enable_wal = true
max_segment_mb = 256
flush_interval_ms = 100

# Optional: engine‑specific knobs (using defaults here)
[storage.sst_config]
block_size_kb = 256
lz4_block_compress = true

[storage.viper_config]
parquet_row_group_mb = 64
enable_zone_maps = true

[sks]
enabled = false
enable_entities = true
enable_relations = true
enable_provenance = true
enable_temporal = false
enable_sql_extensions = true
max_embedding_versions = 10
max_traversal_depth = 5
entity_cache_mb = 256
relations_cache_mb = 128
default_embedding_model = "openai/text-embedding-3-large"
storage_backend = "sst"     # memory | sst | viper

[tls]
enabled = false
cert_file = "certs/server.crt"
key_file = "certs/server.key"
bind_interface = "0.0.0.0"

[hardware]
enable_detection = true
enable_gpu_acceleration = true
enable_simd = true
enable_avx512 = true
enable_gpu_parsing = true
enable_gpu_similarity = true
gpu_min_vector_size = 64
gpu_min_batch_size = 100
