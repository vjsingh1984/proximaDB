<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <title>Phase 1: Cluster-Level Selection (K×K Matrix)</title>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    Phase 1: Cluster-Level Selection (K×K Matrix)
  </text>
  
  <!-- Query Vector -->
  <g id="query-vector">
    <circle cx="500" cy="100" r="15" fill="#4169e1" stroke="#fff" stroke-width="2"/>
    <text x="500" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Q</text>
    <text x="500" y="75" text-anchor="middle" fill="#333" font-size="14">Query Vector</text>
  </g>
  
  <!-- Distance calculation arrows -->
  <g id="distance-arrows" stroke="#666" stroke-width="2" fill="none">
    <path d="M 500 115 L 300 185" marker-end="url(#arrowhead)"/>
    <path d="M 500 115 L 500 185" marker-end="url(#arrowhead)"/>
    <path d="M 500 115 L 700 185" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Centroids with distances -->
  <g id="centroids">
    <!-- C1 -->
    <g transform="translate(300, 200)">
      <circle r="30" fill="#ff6b6b" stroke="#d32f2f" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="white" font-size="16" font-weight="bold">C1</text>
      <rect x="-40" y="45" width="80" height="30" fill="white" stroke="#d32f2f" stroke-width="1" rx="5"/>
      <text y="65" text-anchor="middle" fill="#d32f2f" font-size="14" font-weight="bold">d = 5.1</text>
    </g>
    
    <!-- C2 -->
    <g transform="translate(500, 200)">
      <circle r="30" fill="#4ecdc4" stroke="#00897b" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="white" font-size="16" font-weight="bold">C2</text>
      <rect x="-40" y="45" width="80" height="30" fill="white" stroke="#00897b" stroke-width="1" rx="5"/>
      <text y="65" text-anchor="middle" fill="#00897b" font-size="14" font-weight="bold">d = 5.3</text>
    </g>
    
    <!-- C3 -->
    <g transform="translate(700, 200)">
      <circle r="30" fill="#45b7d1" stroke="#0277bd" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="white" font-size="16" font-weight="bold">C3</text>
      <rect x="-40" y="45" width="80" height="30" fill="white" stroke="#0277bd" stroke-width="1" rx="5"/>
      <text y="65" text-anchor="middle" fill="#0277bd" font-size="14" font-weight="bold">d = 5.5</text>
    </g>
  </g>
  
  <!-- Boundary detection connections -->
  <g id="boundaries" stroke="#ff9800" stroke-width="3" fill="none" stroke-dasharray="5,3">
    <line x1="340" y1="230" x2="460" y2="230"/>
    <line x1="540" y1="230" x2="660" y2="230"/>
  </g>
  
  <!-- Boundary detection labels -->
  <g id="boundary-labels" fill="#ff9800" font-size="12" font-weight="bold">
    <text x="400" y="255" text-anchor="middle">BOUNDARY!</text>
    <text x="600" y="255" text-anchor="middle">BOUNDARY!</text>
  </g>
  
  <!-- Ratio Calculations Box -->
  <g id="ratio-box">
    <rect x="150" y="320" width="700" height="140" fill="white" stroke="#666" stroke-width="2" rx="10"/>
    <text x="500" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
      Boundary Detection Ratios
    </text>
    
    <!-- Ratio calculations -->
    <g font-size="14" fill="#333">
      <text x="200" y="380">
        <tspan font-weight="bold">C1/C2 =</tspan> 5.1/5.3 = 0.96
      </text>
      <text x="400" y="380" fill="#ff9800" font-weight="bold">
        (&gt; 0.8 → Boundary Detected!)
      </text>
      
      <text x="200" y="410">
        <tspan font-weight="bold">C2/C3 =</tspan> 5.3/5.5 = 0.96
      </text>
      <text x="400" y="410" fill="#ff9800" font-weight="bold">
        (&gt; 0.8 → Boundary Detected!)
      </text>
    </g>
    
    <!-- Action -->
    <rect x="190" y="425" width="620" height="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
    <text x="500" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#1976d2">
      Action: Must search C1, C2, C3 | Budget: Allocate based on distances
    </text>
  </g>
  
  <!-- K×K Matrix visualization -->
  <g id="kxk-matrix" transform="translate(50, 480)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">K×K Matrix:</text>
    <g transform="translate(0, 10)">
      <!-- Matrix grid -->
      <rect x="30" y="20" width="30" height="30" fill="#ffebee" stroke="#666" stroke-width="1"/>
      <rect x="60" y="20" width="30" height="30" fill="#fff3e0" stroke="#666" stroke-width="1"/>
      <rect x="90" y="20" width="30" height="30" fill="#fff3e0" stroke="#666" stroke-width="1"/>
      
      <rect x="30" y="50" width="30" height="30" fill="#fff3e0" stroke="#666" stroke-width="1"/>
      <rect x="60" y="50" width="30" height="30" fill="#ffebee" stroke="#666" stroke-width="1"/>
      <rect x="90" y="50" width="30" height="30" fill="#fff3e0" stroke="#666" stroke-width="1"/>
      
      <rect x="30" y="80" width="30" height="30" fill="#fff3e0" stroke="#666" stroke-width="1"/>
      <rect x="60" y="80" width="30" height="30" fill="#fff3e0" stroke="#666" stroke-width="1"/>
      <rect x="90" y="80" width="30" height="30" fill="#ffebee" stroke="#666" stroke-width="1"/>
      
      <!-- Labels -->
      <text x="45" y="15" text-anchor="middle" font-size="12" fill="#666">C1</text>
      <text x="75" y="15" text-anchor="middle" font-size="12" fill="#666">C2</text>
      <text x="105" y="15" text-anchor="middle" font-size="12" fill="#666">C3</text>
      
      <text x="20" y="40" text-anchor="end" font-size="12" fill="#666">C1</text>
      <text x="20" y="70" text-anchor="end" font-size="12" fill="#666">C2</text>
      <text x="20" y="100" text-anchor="end" font-size="12" fill="#666">C3</text>
      
      <!-- Values -->
      <text x="45" y="40" text-anchor="middle" font-size="10" fill="#333">0</text>
      <text x="75" y="40" text-anchor="middle" font-size="10" fill="#333">0.2</text>
      <text x="105" y="40" text-anchor="middle" font-size="10" fill="#333">0.4</text>
      
      <text x="45" y="70" text-anchor="middle" font-size="10" fill="#333">0.2</text>
      <text x="75" y="70" text-anchor="middle" font-size="10" fill="#333">0</text>
      <text x="105" y="70" text-anchor="middle" font-size="10" fill="#333">0.2</text>
      
      <text x="45" y="100" text-anchor="middle" font-size="10" fill="#333">0.4</text>
      <text x="75" y="100" text-anchor="middle" font-size="10" fill="#333">0.2</text>
      <text x="105" y="100" text-anchor="middle" font-size="10" fill="#333">0</text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>