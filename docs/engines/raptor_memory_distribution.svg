<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <title>RAPTOR Memory Distribution Analysis</title>
  
  <!-- Background -->
  <rect width="1400" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">
    RAPTOR Storage Memory Distribution (1M Vectors)
  </text>
  <text x="700" y="55" text-anchor="middle" font-size="14" fill="#666">
    K=100 rowgroups, P=1024 vectors/rowgroup, D=384 dimensions
  </text>
  
  <!-- Overall File Distribution Pie Chart -->
  <g id="file-distribution" transform="translate(350, 350)">
    <text x="0" y="-250" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
      Overall File Distribution
    </text>
    <text x="0" y="-230" text-anchor="middle" font-size="12" fill="#666">
      Total: ~1.6GB for 1M vectors
    </text>
    
    <!-- Pie slices -->
    <g transform="rotate(-90)">
      <!-- Vector Data: 1470MB (91.87%) - angle: 330.7° -->
      <path d="M 0,0 L 200,0 A 200,200 0 1,1 -62,-190 Z" fill="#4169e1" stroke="white" stroke-width="2"/>
      
      <!-- RowGroup Metadata: 50MB (3.125%) - angle: 11.25° -->
      <path d="M 0,0 L -62,-190 A 200,200 0 0,1 -51,-193.3 Z" fill="#ff6b6b" stroke="white" stroke-width="2"/>
      
      <!-- P² Matrices: 50MB (3.125%) - angle: 11.25° -->
      <path d="M 0,0 L -51,-193.3 A 200,200 0 0,1 -39,-196 Z" fill="#4ecdc4" stroke="white" stroke-width="2"/>
      
      <!-- Bloom Filters: 18MB (1.125%) - angle: 4.05° -->
      <path d="M 0,0 L -39,-196 A 200,200 0 0,1 -35,-197 Z" fill="#ffd93d" stroke="white" stroke-width="2"/>
      
      <!-- P×K Matrices: 10MB (0.625%) - angle: 2.25° -->
      <path d="M 0,0 L -35,-197 A 200,200 0 0,1 -32,-197.4 Z" fill="#96ceb4" stroke="white" stroke-width="2"/>
      
      <!-- ID Storage: 10MB (0.625%) - angle: 2.25° -->
      <path d="M 0,0 L -32,-197.4 A 200,200 0 0,1 -29,-197.8 Z" fill="#dda0dd" stroke="white" stroke-width="2"/>
      
      <!-- K² Matrix & Footer: 2MB (0.125%) - angle: 0.45° -->
      <path d="M 0,0 L -29,-197.8 A 200,200 0 0,1 -28,-198 Z" fill="#ff9800" stroke="white" stroke-width="2"/>
      
      <!-- Header & Metadata: 0.5MB (0.03%) - back to start -->
      <path d="M 0,0 L -28,-198 A 200,200 0 0,1 200,0 Z" fill="#e91e63" stroke="white" stroke-width="2"/>
    </g>
    
    <!-- Legend -->
    <g transform="translate(-350, -150)">
      <rect x="0" y="0" width="300" height="280" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
      <text x="150" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Components</text>
      
      <g transform="translate(10, 35)">
        <rect x="0" y="0" width="15" height="15" fill="#4169e1"/>
        <text x="20" y="11" font-size="11" fill="#333">Vector Data: 1,470MB (91.9%)</text>
      </g>
      
      <g transform="translate(10, 60)">
        <rect x="0" y="0" width="15" height="15" fill="#ff6b6b"/>
        <text x="20" y="11" font-size="11" fill="#333">RowGroup Metadata: 50MB (3.1%)</text>
      </g>
      
      <g transform="translate(10, 85)">
        <rect x="0" y="0" width="15" height="15" fill="#4ecdc4"/>
        <text x="20" y="11" font-size="11" fill="#333">P² Matrices: 50MB (3.1%)</text>
      </g>
      
      <g transform="translate(10, 110)">
        <rect x="0" y="0" width="15" height="15" fill="#ffd93d"/>
        <text x="20" y="11" font-size="11" fill="#333">Bloom Filters: 18MB (1.1%)</text>
      </g>
      
      <g transform="translate(10, 135)">
        <rect x="0" y="0" width="15" height="15" fill="#96ceb4"/>
        <text x="20" y="11" font-size="11" fill="#333">P×K Matrices (Adaptive): 10MB (0.6%)</text>
      </g>
      
      <g transform="translate(10, 160)">
        <rect x="0" y="0" width="15" height="15" fill="#dda0dd"/>
        <text x="20" y="11" font-size="11" fill="#333">ID Storage: 10MB (0.6%)</text>
      </g>
      
      <g transform="translate(10, 185)">
        <rect x="0" y="0" width="15" height="15" fill="#ff9800"/>
        <text x="20" y="11" font-size="11" fill="#333">K² Matrix + Footer: 2MB (0.1%)</text>
      </g>
      
      <g transform="translate(10, 210)">
        <rect x="0" y="0" width="15" height="15" fill="#e91e63"/>
        <text x="20" y="11" font-size="11" fill="#333">Header: 0.5MB (0.03%)</text>
      </g>
      
      <line x1="10" y1="235" x2="280" y2="235" stroke="#ddd" stroke-width="1"/>
      
      <text x="10" y="255" font-size="11" font-weight="bold" fill="#333">Total File Size: ~1.6GB</text>
    </g>
  </g>
  
  <!-- Single RowGroup Distribution Pie Chart -->
  <g id="rowgroup-distribution" transform="translate(1050, 350)">
    <text x="0" y="-250" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
      Single RowGroup Distribution
    </text>
    <text x="0" y="-230" text-anchor="middle" font-size="12" fill="#666">
      Per RowGroup: ~16MB for 1024 vectors
    </text>
    
    <!-- Pie slices -->
    <g transform="rotate(-90)">
      <!-- Vector Storage: 14.7MB (91.875%) - angle: 330.75° -->
      <path d="M 0,0 L 200,0 A 200,200 0 1,1 -62,-190 Z" fill="#2196f3" stroke="white" stroke-width="2"/>
      
      <!-- P² Matrix: 512KB (3.125%) - angle: 11.25° -->
      <path d="M 0,0 L -62,-190 A 200,200 0 0,1 -51,-193.3 Z" fill="#00bcd4" stroke="white" stroke-width="2"/>
      
      <!-- Metadata Columns: 300KB (1.83%) - angle: 6.6° -->
      <path d="M 0,0 L -51,-193.3 A 200,200 0 0,1 -44,-195 Z" fill="#8bc34a" stroke="white" stroke-width="2"/>
      
      <!-- Bloom Filter: 180KB (1.1%) - angle: 3.96° -->
      <path d="M 0,0 L -44,-195 A 200,200 0 0,1 -40,-196 Z" fill="#ffeb3b" stroke="white" stroke-width="2"/>
      
      <!-- P×K Matrix (Sparse): 100KB (0.61%) - angle: 2.2° -->
      <path d="M 0,0 L -40,-196 A 200,200 0 0,1 -37,-196.7 Z" fill="#9c27b0" stroke="white" stroke-width="2"/>
      
      <!-- ID Column: 100KB (0.61%) - angle: 2.2° -->
      <path d="M 0,0 L -37,-196.7 A 200,200 0 0,1 -34,-197.3 Z" fill="#f44336" stroke="white" stroke-width="2"/>
      
      <!-- Source Content: 50KB (0.305%) - angle: 1.1° -->
      <path d="M 0,0 L -34,-197.3 A 200,200 0 0,1 -32,-197.7 Z" fill="#795548" stroke="white" stroke-width="2"/>
      
      <!-- Column Metadata: 50KB (0.305%) - angle: 1.1° -->
      <path d="M 0,0 L -32,-197.7 A 200,200 0 0,1 -30,-198 Z" fill="#607d8b" stroke="white" stroke-width="2"/>
      
      <!-- RowGroup Metadata: 10KB (0.06%) - back to start -->
      <path d="M 0,0 L -30,-198 A 200,200 0 0,1 200,0 Z" fill="#ff5722" stroke="white" stroke-width="2"/>
    </g>
    
    <!-- Legend -->
    <g transform="translate(-350, -150)">
      <rect x="0" y="0" width="300" height="280" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
      <text x="150" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">RowGroup Components</text>
      
      <g transform="translate(10, 35)">
        <rect x="0" y="0" width="15" height="15" fill="#2196f3"/>
        <text x="20" y="11" font-size="11" fill="#333">Vector Storage: 14.7MB (91.9%)</text>
        <text x="30" y="24" font-size="9" fill="#666">Transposed, compressed</text>
      </g>
      
      <g transform="translate(10, 65)">
        <rect x="0" y="0" width="15" height="15" fill="#00bcd4"/>
        <text x="20" y="11" font-size="11" fill="#333">P² Matrix: 512KB (3.1%)</text>
        <text x="30" y="24" font-size="9" fill="#666">INT8 quantized</text>
      </g>
      
      <g transform="translate(10, 95)">
        <rect x="0" y="0" width="15" height="15" fill="#8bc34a"/>
        <text x="20" y="11" font-size="11" fill="#333">Metadata Columns: 300KB (1.8%)</text>
        <text x="30" y="24" font-size="9" fill="#666">Key-value pairs</text>
      </g>
      
      <g transform="translate(10, 125)">
        <rect x="0" y="0" width="15" height="15" fill="#ffeb3b"/>
        <text x="20" y="11" font-size="11" fill="#333">Bloom Filter: 180KB (1.1%)</text>
        <text x="30" y="24" font-size="9" fill="#666">ID membership test</text>
      </g>
      
      <g transform="translate(10, 155)">
        <rect x="0" y="0" width="15" height="15" fill="#9c27b0"/>
        <text x="20" y="11" font-size="11" fill="#333">P×K Matrix: 100KB (0.6%)</text>
        <text x="30" y="24" font-size="9" fill="#666">Sparse, adaptive</text>
      </g>
      
      <g transform="translate(10, 185)">
        <rect x="0" y="0" width="15" height="15" fill="#f44336"/>
        <text x="20" y="11" font-size="11" fill="#333">ID Column: 100KB (0.6%)</text>
        <text x="30" y="24" font-size="9" fill="#666">Dictionary encoded</text>
      </g>
      
      <g transform="translate(10, 215)">
        <rect x="0" y="0" width="15" height="15" fill="#795548"/>
        <text x="20" y="11" font-size="11" fill="#333">Source Content: 50KB (0.3%)</text>
      </g>
      
      <g transform="translate(10, 235)">
        <rect x="0" y="0" width="15" height="15" fill="#607d8b"/>
        <text x="20" y="11" font-size="11" fill="#333">Column Metadata: 50KB (0.3%)</text>
      </g>
      
      <g transform="translate(10, 255)">
        <rect x="0" y="0" width="15" height="15" fill="#ff5722"/>
        <text x="20" y="11" font-size="11" fill="#333">RowGroup Header: 10KB (0.06%)</text>
      </g>
    </g>
  </g>
  
  <!-- Summary Box -->
  <g id="summary" transform="translate(700, 620)">
    <rect x="-250" y="0" width="500" height="60" fill="white" stroke="#333" stroke-width="2" rx="5"/>
    <text x="0" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
      Key Insights
    </text>
    <text x="0" y="45" text-anchor="middle" font-size="12" fill="#666">
      Vector data dominates (>90%) • Indexes add only 8-10% overhead • Excellent compression ratios achieved
    </text>
  </g>
</svg>