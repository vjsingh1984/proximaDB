<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <title>RAPTOR Storage Architecture - Detailed Block Layout</title>
  
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">
    RAPTOR Storage Architecture - Physical File Layout
  </text>
  
  <!-- Main File Container -->
  <g id="raptor-file">
    <rect x="50" y="60" width="1300" height="920" fill="white" stroke="#333" stroke-width="2" rx="5"/>
    <text x="700" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">RAPTOR File (.rptr)</text>
    
    <!-- Header Section -->
    <g id="header-section">
      <rect x="70" y="110" width="1260" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="3"/>
      <text x="90" y="135" font-size="16" font-weight="bold" fill="#1976d2">Header (Fixed Size: 512 bytes)</text>
      
      <g transform="translate(90, 150)">
        <rect x="0" y="0" width="150" height="25" fill="#bbdefb" stroke="#0d47a1" stroke-width="1"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#0d47a1">Magic: RPTR</text>
        
        <rect x="160" y="0" width="150" height="25" fill="#bbdefb" stroke="#0d47a1" stroke-width="1"/>
        <text x="235" y="17" text-anchor="middle" font-size="12" fill="#0d47a1">Version: 1</text>
        
        <rect x="320" y="0" width="150" height="25" fill="#bbdefb" stroke="#0d47a1" stroke-width="1"/>
        <text x="395" y="17" text-anchor="middle" font-size="12" fill="#0d47a1">Collection ID</text>
        
        <rect x="480" y="0" width="150" height="25" fill="#bbdefb" stroke="#0d47a1" stroke-width="1"/>
        <text x="555" y="17" text-anchor="middle" font-size="12" fill="#0d47a1">Dimension: 384</text>
        
        <rect x="640" y="0" width="150" height="25" fill="#bbdefb" stroke="#0d47a1" stroke-width="1"/>
        <text x="715" y="17" text-anchor="middle" font-size="12" fill="#0d47a1">K Clusters: 100</text>
        
        <rect x="800" y="0" width="200" height="25" fill="#bbdefb" stroke="#0d47a1" stroke-width="1"/>
        <text x="900" y="17" text-anchor="middle" font-size="12" fill="#0d47a1">Footer Offset: 0x...</text>
      </g>
    </g>
    
    <!-- RowGroups Section -->
    <g id="rowgroups-section">
      <rect x="70" y="210" width="1260" height="500" fill="#fff" stroke="#666" stroke-width="2" rx="3"/>
      <text x="90" y="235" font-size="16" font-weight="bold" fill="#333">RowGroups (K = 100 rowgroups)</text>
      
      <!-- Single RowGroup Detail -->
      <g id="rowgroup-detail" transform="translate(90, 250)">
        <rect x="0" y="0" width="1220" height="440" fill="#f5f5f5" stroke="#424242" stroke-width="1" rx="3"/>
        <text x="10" y="20" font-size="14" font-weight="bold" fill="#424242">RowGroup[i] Structure (rowgroup_id == centroid_id)</text>
        
        <!-- RowGroup Metadata -->
        <g transform="translate(20, 35)">
          <rect x="0" y="0" width="1180" height="60" fill="#ffebee" stroke="#c62828" stroke-width="1" rx="2"/>
          <text x="10" y="20" font-size="13" font-weight="bold" fill="#c62828">RowGroupMetadata</text>
          
          <g transform="translate(10, 30)">
            <rect x="0" y="0" width="100" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1"/>
            <text x="50" y="14" text-anchor="middle" font-size="11">ID: u16</text>
            
            <rect x="110" y="0" width="100" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1"/>
            <text x="160" y="14" text-anchor="middle" font-size="11">Row Count</text>
            
            <rect x="220" y="0" width="150" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1"/>
            <text x="295" y="14" text-anchor="middle" font-size="11">Centroid Vector</text>
            
            <rect x="380" y="0" width="150" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1"/>
            <text x="455" y="14" text-anchor="middle" font-size="11">Centroid Stats</text>
            
            <rect x="540" y="0" width="150" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1"/>
            <text x="615" y="14" text-anchor="middle" font-size="11">Min/Max Timestamp</text>
            
            <rect x="700" y="0" width="200" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1"/>
            <text x="800" y="14" text-anchor="middle" font-size="11">Column Pages Map</text>
          </g>
        </g>
        
        <!-- Column Pages -->
        <g transform="translate(20, 105)">
          <rect x="0" y="0" width="1180" height="130" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="2"/>
          <text x="10" y="20" font-size="13" font-weight="bold" fill="#2e7d32">Column Pages (Columnar Storage)</text>
          
          <!-- Vector ID Column -->
          <g transform="translate(10, 30)">
            <rect x="0" y="0" width="280" height="90" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
            <text x="140" y="15" text-anchor="middle" font-size="11" font-weight="bold">VectorID Column</text>
            <text x="10" y="35" font-size="10">Type: String/UUID</text>
            <text x="10" y="50" font-size="10">Encoding: Dictionary</text>
            <text x="10" y="65" font-size="10">Compression: ZSTD</text>
            <text x="10" y="80" font-size="10">Offset: 0x1000</text>
          </g>
          
          <!-- Vectors Column (Transposed) -->
          <g transform="translate(300, 30)">
            <rect x="0" y="0" width="280" height="90" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
            <text x="140" y="15" text-anchor="middle" font-size="11" font-weight="bold">Vectors (Transposed)</text>
            <text x="10" y="35" font-size="10">Type: FP32[dimension][vectors]</text>
            <text x="10" y="50" font-size="10">Encoding: FastLanes</text>
            <text x="10" y="65" font-size="10">Compression: Mixed</text>
            <text x="10" y="80" font-size="10">Each dim stored separately</text>
          </g>
          
          <!-- Metadata Columns -->
          <g transform="translate(590, 30)">
            <rect x="0" y="0" width="280" height="90" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
            <text x="140" y="15" text-anchor="middle" font-size="11" font-weight="bold">Metadata Columns</text>
            <text x="10" y="35" font-size="10">Type: Various (JSON, Int, String)</text>
            <text x="10" y="50" font-size="10">Encoding: RLE/Dictionary</text>
            <text x="10" y="65" font-size="10">Compression: Per-column</text>
            <text x="10" y="80" font-size="10">Min/Max stats for pruning</text>
          </g>
          
          <!-- Timestamp Column -->
          <g transform="translate(880, 30)">
            <rect x="0" y="0" width="280" height="90" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
            <text x="140" y="15" text-anchor="middle" font-size="11" font-weight="bold">Timestamp Column</text>
            <text x="10" y="35" font-size="10">Type: Int64</text>
            <text x="10" y="50" font-size="10">Encoding: Delta</text>
            <text x="10" y="65" font-size="10">Compression: ZSTD</text>
            <text x="10" y="80" font-size="10">For temporal queries</text>
          </g>
        </g>
        
        <!-- Bloom Filter -->
        <g transform="translate(20, 245)">
          <rect x="0" y="0" width="380" height="80" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="2"/>
          <text x="10" y="20" font-size="13" font-weight="bold" fill="#c2185b">Bloom Filter (Per RowGroup)</text>
          <text x="10" y="40" font-size="10">Purpose: O(1) ID membership test</text>
          <text x="10" y="55" font-size="10">Size: ~180KB for 1024 vectors</text>
          <text x="10" y="70" font-size="10">FPR: 0.1% | Bits: 10/key | Hashes: 7</text>
        </g>
        
        <!-- P² Matrix -->
        <g transform="translate(410, 245)">
          <rect x="0" y="0" width="380" height="80" fill="#e1f5fe" stroke="#0277bd" stroke-width="1" rx="2"/>
          <text x="10" y="20" font-size="13" font-weight="bold" fill="#0277bd">P² Matrix (Intra-RowGroup)</text>
          <text x="10" y="40" font-size="10">Storage: Upper triangle only</text>
          <text x="10" y="55" font-size="10">Size: P×(P-1)/2 distances</text>
          <text x="10" y="70" font-size="10">Quantized: INT8 + FastLanes</text>
        </g>
        
        <!-- P×K Matrix -->
        <g transform="translate(800, 245)">
          <rect x="0" y="0" width="380" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="2"/>
          <text x="10" y="20" font-size="13" font-weight="bold" fill="#f57c00">P×K Matrix (Vector→Centroid)</text>
          <text x="10" y="40" font-size="10">Storage: Adaptive (10%-100%)</text>
          <text x="10" y="55" font-size="10">Strategy: Based on K/D ratio</text>
          <text x="10" y="70" font-size="10">Sparse: Only boundary vectors</text>
        </g>
        
        <!-- Column Page Metadata Detail -->
        <g transform="translate(20, 335)">
          <rect x="0" y="0" width="1160" height="90" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" rx="2"/>
          <text x="10" y="20" font-size="13" font-weight="bold" fill="#7b1fa2">ColumnPageMetadata (Per Column)</text>
          
          <g transform="translate(10, 30)">
            <rect x="0" y="0" width="140" height="50" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/>
            <text x="70" y="15" text-anchor="middle" font-size="10" font-weight="bold">File Offsets</text>
            <text x="70" y="30" text-anchor="middle" font-size="9">offset: u64</text>
            <text x="70" y="45" text-anchor="middle" font-size="9">size: u64</text>
            
            <rect x="150" y="0" width="140" height="50" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/>
            <text x="220" y="15" text-anchor="middle" font-size="10" font-weight="bold">Compression</text>
            <text x="220" y="30" text-anchor="middle" font-size="9">algorithm</text>
            <text x="220" y="45" text-anchor="middle" font-size="9">ratio</text>
            
            <rect x="300" y="0" width="140" height="50" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/>
            <text x="370" y="15" text-anchor="middle" font-size="10" font-weight="bold">Encoding</text>
            <text x="370" y="30" text-anchor="middle" font-size="9">FastLanes</text>
            <text x="370" y="45" text-anchor="middle" font-size="9">scheme</text>
            
            <rect x="450" y="0" width="140" height="50" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/>
            <text x="520" y="15" text-anchor="middle" font-size="10" font-weight="bold">Statistics</text>
            <text x="520" y="30" text-anchor="middle" font-size="9">min/max</text>
            <text x="520" y="45" text-anchor="middle" font-size="9">null_count</text>
          </g>
        </g>
      </g>
    </g>
    
    <!-- Footer Section -->
    <g id="footer-section">
      <rect x="70" y="730" width="1260" height="230" fill="#fff" stroke="#666" stroke-width="2" rx="3"/>
      <text x="90" y="755" font-size="16" font-weight="bold" fill="#333">Footer (Variable Size)</text>
      
      <!-- K² Matrix -->
      <g transform="translate(90, 770)">
        <rect x="0" y="0" width="400" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="2"/>
        <text x="10" y="20" font-size="13" font-weight="bold" fill="#d32f2f">K² Matrix (Inter-Centroid)</text>
        <text x="10" y="40" font-size="10">Storage: Full matrix (never compressed)</text>
        <text x="10" y="55" font-size="10">Size: K×K×4 bytes (40KB for K=100)</text>
        <text x="10" y="70" font-size="10">Purpose: Cluster boundary detection</text>
      </g>
      
      <!-- Centroids Block -->
      <g transform="translate(510, 770)">
        <rect x="0" y="0" width="400" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="2"/>
        <text x="10" y="20" font-size="13" font-weight="bold" fill="#2e7d32">Centroids Block</text>
        <text x="10" y="40" font-size="10">Storage: K centroid vectors</text>
        <text x="10" y="55" font-size="10">Format: FP32[K][dimension]</text>
        <text x="10" y="70" font-size="10">1-to-1 mapping with rowgroups</text>
      </g>
      
      <!-- File Metadata -->
      <g transform="translate(930, 770)">
        <rect x="0" y="0" width="380" height="80" fill="#e1f5fe" stroke="#0277bd" stroke-width="1" rx="2"/>
        <text x="10" y="20" font-size="13" font-weight="bold" fill="#0277bd">File Metadata</text>
        <text x="10" y="40" font-size="10">RowGroup offsets array</text>
        <text x="10" y="55" font-size="10">Schema descriptor</text>
        <text x="10" y="70" font-size="10">Statistics & checksums</text>
      </g>
      
      <!-- Footer Summary -->
      <g transform="translate(90, 860)">
        <rect x="0" y="0" width="1220" height="80" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="2"/>
        <text x="10" y="20" font-size="13" font-weight="bold" fill="#757575">Footer Layout</text>
        
        <g transform="translate(10, 35)">
          <rect x="0" y="0" width="200" height="35" fill="#eeeeee" stroke="#616161" stroke-width="1"/>
          <text x="100" y="22" text-anchor="middle" font-size="11">K² Matrix Offset</text>
          
          <rect x="210" y="0" width="200" height="35" fill="#eeeeee" stroke="#616161" stroke-width="1"/>
          <text x="310" y="22" text-anchor="middle" font-size="11">Centroids Offset</text>
          
          <rect x="420" y="0" width="200" height="35" fill="#eeeeee" stroke="#616161" stroke-width="1"/>
          <text x="520" y="22" text-anchor="middle" font-size="11">Metadata Offset</text>
          
          <rect x="630" y="0" width="200" height="35" fill="#eeeeee" stroke="#616161" stroke-width="1"/>
          <text x="730" y="22" text-anchor="middle" font-size="11">Footer Size</text>
          
          <rect x="840" y="0" width="200" height="35" fill="#eeeeee" stroke="#616161" stroke-width="1"/>
          <text x="940" y="22" text-anchor="middle" font-size="11">Magic: RPTR</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Size Legend -->
  <g id="size-legend" transform="translate(1100, 50)">
    <rect x="0" y="0" width="250" height="150" fill="white" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Typical Sizes (1M vectors)</text>
    
    <text x="10" y="40" font-size="10" fill="#666">K=100 rowgroups</text>
    <text x="10" y="55" font-size="10" fill="#666">P=1024 vectors/rowgroup</text>
    <text x="10" y="70" font-size="10" fill="#666">D=384 dimensions</text>
    
    <line x1="10" y1="75" x2="240" y2="75" stroke="#ddd" stroke-width="1"/>
    
    <text x="10" y="90" font-size="10" fill="#333">K² Matrix: 40KB</text>
    <text x="10" y="105" font-size="10" fill="#333">P² Matrices: 50MB total</text>
    <text x="10" y="120" font-size="10" fill="#333">P×K Matrices: 10-100MB</text>
    <text x="10" y="135" font-size="10" fill="#333">Bloom Filters: 18MB total</text>
  </g>
</svg>