<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>3D Vector Clustering Visualization - RAPTOR Engine</title>
  
  <!-- Background and grid -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- 3D Axes -->
  <g id="axes" stroke="#666" stroke-width="2">
    <!-- X axis -->
    <line x1="100" y1="700" x2="500" y2="700" marker-end="url(#arrowhead)"/>
    <text x="510" y="705" fill="#333" font-size="14" font-weight="bold">X</text>
    
    <!-- Y axis -->
    <line x1="100" y1="700" x2="100" y2="300" marker-end="url(#arrowhead)"/>
    <text x="85" y="290" fill="#333" font-size="14" font-weight="bold">Y</text>
    
    <!-- Z axis (perspective) -->
    <line x1="100" y1="700" x2="300" y2="500" marker-end="url(#arrowhead)"/>
    <text x="310" y="495" fill="#333" font-size="14" font-weight="bold">Z</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
    
    <!-- Gradient definitions for clusters -->
    <radialGradient id="cluster1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.2"/>
    </radialGradient>
    <radialGradient id="cluster2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.2"/>
    </radialGradient>
    <radialGradient id="cluster3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:0.2"/>
    </radialGradient>
    <radialGradient id="cluster4" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#96ceb4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#96ceb4;stop-opacity:0.2"/>
    </radialGradient>
    <radialGradient id="cluster5" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#dda0dd;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#dda0dd;stop-opacity:0.2"/>
    </radialGradient>
    <radialGradient id="cluster6" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:0.2"/>
    </radialGradient>
  </defs>
  
  <!-- Cluster 1 (r vectors) -->
  <g id="cluster1-group">
    <circle cx="250" cy="400" r="60" fill="url(#cluster1)" stroke="#ff6b6b" stroke-width="2"/>
    <!-- Centroid -->
    <circle cx="250" cy="400" r="8" fill="#d32f2f" stroke="#fff" stroke-width="2"/>
    <!-- Vectors -->
    <circle cx="230" cy="390" r="3" fill="#ff6b6b"/>
    <circle cx="270" cy="410" r="3" fill="#ff6b6b"/>
    <circle cx="240" cy="420" r="3" fill="#ff6b6b"/>
    <circle cx="260" cy="385" r="3" fill="#ff6b6b"/>
    <circle cx="255" cy="415" r="3" fill="#ff6b6b"/>
    <!-- Intra-cluster distances (dotted lines) -->
    <line x1="250" y1="400" x2="230" y2="390" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="250" y1="400" x2="270" y2="410" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="250" y1="400" x2="240" y2="420" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="250" y="470" text-anchor="middle" fill="#333" font-size="12">Cluster 1 (r vectors)</text>
  </g>
  
  <!-- Cluster 2 (s vectors) -->
  <g id="cluster2-group">
    <circle cx="450" cy="350" r="55" fill="url(#cluster2)" stroke="#4ecdc4" stroke-width="2"/>
    <!-- Centroid -->
    <circle cx="450" cy="350" r="8" fill="#00897b" stroke="#fff" stroke-width="2"/>
    <!-- Vectors -->
    <circle cx="435" cy="340" r="3" fill="#4ecdc4"/>
    <circle cx="465" cy="360" r="3" fill="#4ecdc4"/>
    <circle cx="445" cy="365" r="3" fill="#4ecdc4"/>
    <circle cx="460" cy="335" r="3" fill="#4ecdc4"/>
    <!-- Intra-cluster distances (dotted lines) -->
    <line x1="450" y1="350" x2="435" y2="340" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="450" y1="350" x2="465" y2="360" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="450" y="415" text-anchor="middle" fill="#333" font-size="12">Cluster 2 (s vectors)</text>
  </g>
  
  <!-- Cluster 3 (t vectors) -->
  <g id="cluster3-group">
    <circle cx="350" cy="550" r="65" fill="url(#cluster3)" stroke="#45b7d1" stroke-width="2"/>
    <!-- Centroid -->
    <circle cx="350" cy="550" r="8" fill="#0277bd" stroke="#fff" stroke-width="2"/>
    <!-- Vectors -->
    <circle cx="330" cy="540" r="3" fill="#45b7d1"/>
    <circle cx="370" cy="560" r="3" fill="#45b7d1"/>
    <circle cx="340" cy="570" r="3" fill="#45b7d1"/>
    <circle cx="360" cy="535" r="3" fill="#45b7d1"/>
    <circle cx="355" cy="555" r="3" fill="#45b7d1"/>
    <circle cx="345" cy="545" r="3" fill="#45b7d1"/>
    <!-- Intra-cluster distances (dotted lines) -->
    <line x1="350" y1="550" x2="330" y2="540" stroke="#45b7d1" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="350" y1="550" x2="370" y2="560" stroke="#45b7d1" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="350" y1="550" x2="340" y2="570" stroke="#45b7d1" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="350" y="625" text-anchor="middle" fill="#333" font-size="12">Cluster 3 (t vectors)</text>
  </g>
  
  <!-- Cluster 4 (u vectors) -->
  <g id="cluster4-group">
    <circle cx="550" cy="500" r="50" fill="url(#cluster4)" stroke="#96ceb4" stroke-width="2"/>
    <!-- Centroid -->
    <circle cx="550" cy="500" r="8" fill="#388e3c" stroke="#fff" stroke-width="2"/>
    <!-- Vectors -->
    <circle cx="535" cy="490" r="3" fill="#96ceb4"/>
    <circle cx="565" cy="510" r="3" fill="#96ceb4"/>
    <circle cx="545" cy="515" r="3" fill="#96ceb4"/>
    <!-- Intra-cluster distances (dotted lines) -->
    <line x1="550" y1="500" x2="535" y2="490" stroke="#96ceb4" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="550" y1="500" x2="565" y2="510" stroke="#96ceb4" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="550" y="560" text-anchor="middle" fill="#333" font-size="12">Cluster 4 (u vectors)</text>
  </g>
  
  <!-- Cluster 5 (v vectors) -->
  <g id="cluster5-group">
    <circle cx="200" cy="550" r="58" fill="url(#cluster5)" stroke="#dda0dd" stroke-width="2"/>
    <!-- Centroid -->
    <circle cx="200" cy="550" r="8" fill="#7b1fa2" stroke="#fff" stroke-width="2"/>
    <!-- Vectors -->
    <circle cx="180" cy="540" r="3" fill="#dda0dd"/>
    <circle cx="220" cy="560" r="3" fill="#dda0dd"/>
    <circle cx="195" cy="565" r="3" fill="#dda0dd"/>
    <circle cx="210" cy="535" r="3" fill="#dda0dd"/>
    <circle cx="190" cy="555" r="3" fill="#dda0dd"/>
    <!-- Intra-cluster distances (dotted lines) -->
    <line x1="200" y1="550" x2="180" y2="540" stroke="#dda0dd" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="200" y1="550" x2="220" y2="560" stroke="#dda0dd" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="200" y="620" text-anchor="middle" fill="#333" font-size="12">Cluster 5 (v vectors)</text>
  </g>
  
  <!-- Cluster 6 (w vectors) -->
  <g id="cluster6-group">
    <circle cx="400" cy="450" r="52" fill="url(#cluster6)" stroke="#ffd93d" stroke-width="2"/>
    <!-- Centroid -->
    <circle cx="400" cy="450" r="8" fill="#f57c00" stroke="#fff" stroke-width="2"/>
    <!-- Vectors -->
    <circle cx="385" cy="440" r="3" fill="#ffd93d"/>
    <circle cx="415" cy="460" r="3" fill="#ffd93d"/>
    <circle cx="395" cy="465" r="3" fill="#ffd93d"/>
    <circle cx="410" cy="435" r="3" fill="#ffd93d"/>
    <!-- Intra-cluster distances (dotted lines) -->
    <line x1="400" y1="450" x2="385" y2="440" stroke="#ffd93d" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <line x1="400" y1="450" x2="415" y2="460" stroke="#ffd93d" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="400" y="510" text-anchor="middle" fill="#333" font-size="12">Cluster 6 (w vectors)</text>
  </g>
  
  <!-- Inter-centroid distances (solid lines) - K² Matrix -->
  <g id="inter-centroid" stroke="#333" stroke-width="2" opacity="0.7">
    <line x1="250" y1="400" x2="450" y2="350"/>
    <line x1="250" y1="400" x2="350" y2="550"/>
    <line x1="250" y1="400" x2="400" y2="450"/>
    <line x1="450" y1="350" x2="550" y2="500"/>
    <line x1="450" y1="350" x2="400" y2="450"/>
    <line x1="350" y1="550" x2="200" y2="550"/>
    <line x1="350" y1="550" x2="400" y2="450"/>
    <line x1="550" y1="500" x2="400" y2="450"/>
    <line x1="200" y1="550" x2="250" y2="400"/>
  </g>
  
  <!-- Inter-cluster vector distances (dashed lines) - Example P×K distances -->
  <g id="inter-cluster-vectors" stroke="#999" stroke-width="1" stroke-dasharray="5,3" opacity="0.4">
    <!-- From cluster 1 vector to cluster 2 centroid -->
    <line x1="270" y1="410" x2="450" y2="350"/>
    <!-- From cluster 2 vector to cluster 3 centroid -->
    <line x1="465" y1="360" x2="350" y2="550"/>
    <!-- From cluster 3 vector to cluster 4 centroid -->
    <line x1="370" y1="560" x2="550" y2="500"/>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(750, 100)">
    <rect x="0" y="0" width="400" height="280" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Distance Types in RAPTOR</text>
    
    <!-- Formulas -->
    <text x="20" y="60" font-size="13" fill="#333" font-weight="bold">Total Vectors: n = r + s + t + u + v + w</text>
    <text x="20" y="85" font-size="13" fill="#333">where n = 6p (p avg vectors per cluster)</text>
    
    <!-- Legend items -->
    <g transform="translate(20, 110)">
      <!-- Intra-cluster (P² Matrix) -->
      <line x1="0" y1="0" x2="30" y2="0" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="2,2"/>
      <circle cx="35" cy="0" r="3" fill="#ff6b6b"/>
      <circle cx="45" cy="0" r="5" fill="#d32f2f" stroke="#fff" stroke-width="1"/>
      <text x="55" y="5" font-size="12" fill="#333">Intra-cluster: vector ↔ centroid (P²)</text>
    </g>
    
    <g transform="translate(20, 140)">
      <!-- Inter-centroid (K² Matrix) -->
      <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="2"/>
      <circle cx="5" cy="0" r="5" fill="#d32f2f" stroke="#fff" stroke-width="1"/>
      <circle cx="25" cy="0" r="5" fill="#00897b" stroke="#fff" stroke-width="1"/>
      <text x="55" y="5" font-size="12" fill="#333">Inter-centroid: centroid ↔ centroid (K²)</text>
    </g>
    
    <g transform="translate(20, 170)">
      <!-- Inter-cluster vectors (P×K Matrix) -->
      <line x1="0" y1="0" x2="30" y2="0" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
      <circle cx="5" cy="0" r="3" fill="#ff6b6b"/>
      <circle cx="25" cy="0" r="5" fill="#00897b" stroke="#fff" stroke-width="1"/>
      <text x="55" y="5" font-size="12" fill="#333">Inter-cluster: vector ↔ other centroid (P×K)</text>
    </g>
    
    <!-- Matrix Trinity -->
    <rect x="20" y="200" width="360" height="60" fill="#f0f8ff" stroke="#4169e1" stroke-width="1" rx="3"/>
    <text x="200" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Matrix Trinity Architecture</text>
    <text x="200" y="245" text-anchor="middle" font-size="11" fill="#333">P² (intra) + K² (inter) + P×K (cross) = O(1) navigation</text>
  </g>
  
  <!-- Title and description -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    3D Vector Space Clustering Visualization
  </text>
  <text x="600" y="65" text-anchor="middle" font-size="14" fill="#666">
    RAPTOR Engine: Matrix Trinity replaces HNSW graphs for efficient navigation
  </text>
</svg>