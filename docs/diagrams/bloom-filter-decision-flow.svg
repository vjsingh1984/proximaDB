<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold">Bloom Filter Decision Flow</text>
  
  <!-- Start -->
  <rect x="325" y="60" width="150" height="40" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2" rx="5"/>
  <text x="400" y="85" text-anchor="middle" font-size="14">Create Bloom Filter</text>
  
  <!-- Check Enabled -->
  <polygon points="400,140 450,180 400,220 350,180" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="185" text-anchor="middle" fill="white" font-size="12">enabled?</text>
  
  <!-- Arrow from Start to Check Enabled -->
  <line x1="400" y1="100" x2="400" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- NoOp path -->
  <rect x="550" y="160" width="180" height="60" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="640" y="185" text-anchor="middle" font-size="12">Return NoOpBloomFilter</text>
  <text x="640" y="205" text-anchor="middle" font-size="10">Always returns true</text>
  
  <!-- Arrow to NoOp -->
  <line x1="450" y1="180" x2="550" y2="180" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="175" text-anchor="middle" font-size="10">false</text>
  
  <!-- Check Items -->
  <polygon points="400,260 450,300 400,340 350,300" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" fill="white" font-size="11">expected_items</text>
  <text x="400" y="310" text-anchor="middle" fill="white" font-size="11">&gt; 0?</text>
  
  <!-- Arrow from enabled to check items -->
  <line x1="400" y1="220" x2="400" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="245" text-anchor="start" font-size="10">true</text>
  
  <!-- Arrow from check items to NoOp -->
  <line x1="450" y1="300" x2="640" y2="300" stroke="#6b7280" stroke-width="2"/>
  <line x1="640" y1="300" x2="640" y2="220" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="545" y="295" text-anchor="middle" font-size="10">false</text>
  
  <!-- Check Strategy -->
  <polygon points="400,380 450,420 400,460 350,420" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" fill="white" font-size="12">strategy?</text>
  
  <!-- Arrow from check items to check strategy -->
  <line x1="400" y1="340" x2="400" y2="380" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="365" text-anchor="start" font-size="10">true</text>
  
  <!-- Strategy Boxes -->
  <!-- ByteAligned -->
  <rect x="30" y="490" width="120" height="90" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="90" y="510" text-anchor="middle" font-size="11">Create</text>
  <text x="90" y="525" text-anchor="middle" font-size="11">ByteAlignedBloomFilter</text>
  <text x="90" y="545" text-anchor="middle" font-size="9">- Byte boundaries</text>
  <text x="90" y="558" text-anchor="middle" font-size="9">- SSTable optimized</text>
  <text x="90" y="571" text-anchor="middle" font-size="9">- Efficient disk I/O</text>
  
  <!-- BitPacked -->
  <rect x="180" y="490" width="120" height="90" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="240" y="510" text-anchor="middle" font-size="11">Create</text>
  <text x="240" y="525" text-anchor="middle" font-size="11">BitPackedBloomFilter</text>
  <text x="240" y="545" text-anchor="middle" font-size="9">- u64 array storage</text>
  <text x="240" y="558" text-anchor="middle" font-size="9">- Memory efficient</text>
  <text x="240" y="571" text-anchor="middle" font-size="9">- Hash seed support</text>
  
  <!-- Simple -->
  <rect x="330" y="490" width="120" height="90" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="390" y="510" text-anchor="middle" font-size="11">Create</text>
  <text x="390" y="525" text-anchor="middle" font-size="11">SimpleBloomFilter</text>
  <text x="390" y="545" text-anchor="middle" font-size="9">- Boolean array</text>
  <text x="390" y="558" text-anchor="middle" font-size="9">- Fast for small data</text>
  <text x="390" y="571" text-anchor="middle" font-size="9">- Easy debugging</text>
  
  <!-- Composite -->
  <rect x="480" y="490" width="120" height="90" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="540" y="510" text-anchor="middle" font-size="11">Create</text>
  <text x="540" y="525" text-anchor="middle" font-size="11">CompositeBloomFilter</text>
  <text x="540" y="545" text-anchor="middle" font-size="9">- Multiple filters</text>
  <text x="540" y="558" text-anchor="middle" font-size="9">- Metadata support</text>
  <text x="540" y="571" text-anchor="middle" font-size="9">- Complex queries</text>
  
  <!-- Arrows from strategy to boxes -->
  <line x1="350" y1="420" x2="90" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="150" y="450" text-anchor="middle" font-size="9">ByteAligned</text>
  
  <line x1="380" y1="460" x2="240" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="475" text-anchor="middle" font-size="9">BitPacked</text>
  
  <line x1="400" y1="460" x2="390" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="415" y="475" text-anchor="middle" font-size="9">Simple</text>
  
  <line x1="420" y1="460" x2="540" y2="490" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="510" y="475" text-anchor="middle" font-size="9">Composite</text>
  
  <!-- Configure Box -->
  <rect x="275" y="620" width="250" height="80" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2" rx="5"/>
  <text x="400" y="640" text-anchor="middle" font-size="12" font-weight="bold">Configure Parameters</text>
  <text x="400" y="660" text-anchor="middle" font-size="10">- bits_per_key</text>
  <text x="400" y="675" text-anchor="middle" font-size="10">- num_hashes</text>
  <text x="400" y="690" text-anchor="middle" font-size="10">- hash_algorithm</text>
  
  <!-- Arrows from strategies to configure -->
  <line x1="90" y1="580" x2="275" y2="660" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="580" x2="315" y2="620" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="580" x2="400" y2="620" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="580" x2="485" y2="620" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Ready Box -->
  <rect x="325" y="740" width="150" height="40" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" rx="5"/>
  <text x="400" y="765" text-anchor="middle" fill="white" font-size="14">Bloom Filter Ready</text>
  
  <!-- Arrows to Ready -->
  <line x1="400" y1="700" x2="400" y2="740" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="220" x2="640" y2="760" stroke="#6b7280" stroke-width="2"/>
  <line x1="640" y1="760" x2="475" y2="760" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Operation Decision -->
  <polygon points="400,820 450,860 400,900 350,860" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="865" text-anchor="middle" fill="white" font-size="12">Operation?</text>
  
  <!-- Arrow from Ready to Operation -->
  <line x1="400" y1="780" x2="400" y2="820" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>