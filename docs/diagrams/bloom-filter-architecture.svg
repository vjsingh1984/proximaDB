<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold">Bloom Filter Architecture</text>
  
  <!-- Config Box -->
  <rect x="50" y="60" width="150" height="60" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="95" text-anchor="middle" fill="white" font-size="14">BloomFilterConfig</text>
  
  <!-- Factory Box -->
  <rect x="300" y="60" width="150" height="60" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="375" y="95" text-anchor="middle" fill="white" font-size="14">BloomFilterFactory</text>
  
  <!-- Arrow from Config to Factory -->
  <line x1="200" y1="90" x2="300" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="85" text-anchor="middle" font-size="12">configures</text>
  
  <!-- Strategies Group -->
  <g id="strategies">
    <rect x="100" y="180" width="600" height="150" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2" rx="5"/>
    <text x="400" y="200" text-anchor="middle" font-size="16" font-weight="bold">Strategies</text>
    
    <!-- ByteAligned -->
    <rect x="120" y="220" width="100" height="80" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
    <text x="170" y="250" text-anchor="middle" font-size="12">ByteAligned</text>
    <text x="170" y="270" text-anchor="middle" font-size="10">SSTable</text>
    <text x="170" y="285" text-anchor="middle" font-size="10">Optimized</text>
    
    <!-- BitPacked -->
    <rect x="240" y="220" width="100" height="80" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
    <text x="290" y="250" text-anchor="middle" font-size="12">BitPacked</text>
    <text x="290" y="270" text-anchor="middle" font-size="10">Memory</text>
    <text x="290" y="285" text-anchor="middle" font-size="10">Efficient</text>
    
    <!-- Simple -->
    <rect x="360" y="220" width="100" height="80" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
    <text x="410" y="250" text-anchor="middle" font-size="12">Simple</text>
    <text x="410" y="270" text-anchor="middle" font-size="10">Small</text>
    <text x="410" y="285" text-anchor="middle" font-size="10">Datasets</text>
    
    <!-- Composite -->
    <rect x="480" y="220" width="100" height="80" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
    <text x="530" y="250" text-anchor="middle" font-size="12">Composite</text>
    <text x="530" y="270" text-anchor="middle" font-size="10">Metadata</text>
    <text x="530" y="285" text-anchor="middle" font-size="10">Aware</text>
    
    <!-- NoOp -->
    <rect x="600" y="220" width="80" height="80" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
    <text x="640" y="250" text-anchor="middle" font-size="12">NoOp</text>
    <text x="640" y="270" text-anchor="middle" font-size="10">Disabled/</text>
    <text x="640" y="285" text-anchor="middle" font-size="10">Empty</text>
  </g>
  
  <!-- Arrow from Factory to Strategies -->
  <line x1="375" y1="120" x2="375" y2="180" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="385" y="155" text-anchor="start" font-size="12">creates</text>
  
  <!-- Core Trait Box -->
  <rect x="250" y="360" width="300" height="80" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2" rx="5"/>
  <text x="400" y="380" text-anchor="middle" font-size="14" font-weight="bold">BloomFilterStrategy</text>
  <text x="400" y="400" text-anchor="middle" font-size="11">insert() | might_contain()</text>
  <text x="400" y="415" text-anchor="middle" font-size="11">serialize() | false_positive_rate()</text>
  
  <!-- Arrows from strategies to trait -->
  <line x1="170" y1="300" x2="300" y2="360" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="290" y1="300" x2="350" y2="360" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="410" y1="300" x2="400" y2="360" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="530" y1="300" x2="450" y2="360" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="640" y1="300" x2="500" y2="360" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Storage Engines -->
  <g id="engines">
    <rect x="50" y="480" width="700" height="80" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2" rx="5"/>
    <text x="400" y="500" text-anchor="middle" font-size="16" font-weight="bold">Storage Engines</text>
    
    <!-- LSM -->
    <rect x="150" y="510" width="120" height="40" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" rx="5"/>
    <text x="210" y="535" text-anchor="middle" fill="white" font-size="12">LSM Engine</text>
    
    <!-- VIPER -->
    <rect x="340" y="510" width="120" height="40" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" rx="5"/>
    <text x="400" y="535" text-anchor="middle" fill="white" font-size="12">VIPER Engine</text>
    
    <!-- Memtable -->
    <rect x="530" y="510" width="120" height="40" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" rx="5"/>
    <text x="590" y="535" text-anchor="middle" fill="white" font-size="12">Memtable</text>
  </g>
  
  <!-- Arrows from engines to strategies -->
  <line x1="210" y1="510" x2="170" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="120" y="405" text-anchor="middle" font-size="11">uses</text>
  
  <line x1="400" y1="510" x2="530" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="405" text-anchor="middle" font-size="11">uses</text>
  
  <line x1="590" y1="510" x2="290" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="405" text-anchor="middle" font-size="11">uses</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>