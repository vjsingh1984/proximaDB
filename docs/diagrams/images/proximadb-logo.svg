<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient for brand appeal -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for technical elements -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background with subtle tech pattern -->
  <rect width="400" height="120" fill="#ffffff" rx="8"/>
  
  <!-- Vector database icon - representing distributed data -->
  <g transform="translate(20, 20)">
    <!-- Main database cylinder -->
    <ellipse cx="40" cy="15" rx="35" ry="8" fill="url(#brandGradient)" opacity="0.8"/>
    <rect x="5" y="15" width="70" height="50" fill="url(#brandGradient)" opacity="0.9"/>
    <ellipse cx="40" cy="65" rx="35" ry="8" fill="url(#brandGradient)"/>
    
    <!-- Vector representation - connected nodes -->
    <g opacity="0.9">
      <!-- Connection lines representing vector relationships -->
      <line x1="15" y1="25" x2="25" y2="35" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
      <line x1="25" y1="35" x2="40" y2="30" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
      <line x1="40" y1="30" x2="55" y2="45" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
      <line x1="55" y1="45" x2="65" y2="35" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7"/>
      <line x1="25" y1="35" x2="55" y2="45" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.5"/>
      
      <!-- Vector nodes -->
      <circle cx="15" cy="25" r="4" fill="#ffffff" stroke="url(#accentGradient)" stroke-width="2"/>
      <circle cx="25" cy="35" r="4" fill="#ffffff" stroke="url(#accentGradient)" stroke-width="2"/>
      <circle cx="40" cy="30" r="4" fill="#ffffff" stroke="url(#accentGradient)" stroke-width="2"/>
      <circle cx="55" cy="45" r="4" fill="#ffffff" stroke="url(#accentGradient)" stroke-width="2"/>
      <circle cx="65" cy="35" r="4" fill="#ffffff" stroke="url(#accentGradient)" stroke-width="2"/>
    </g>
    
    <!-- Storage layers indicator -->
    <g opacity="0.6">
      <rect x="8" y="20" width="64" height="2" fill="#ffffff" rx="1"/>
      <rect x="8" y="35" width="64" height="2" fill="#ffffff" rx="1"/>
      <rect x="8" y="50" width="64" height="2" fill="#ffffff" rx="1"/>
    </g>
  </g>
  
  <!-- ProximaDB Text -->
  <g transform="translate(110, 25)">
    <!-- "Proxima" in modern sans-serif -->
    <text x="0" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="600" fill="url(#brandGradient)">
      Proxima
    </text>
    <!-- "DB" with emphasis -->
    <text x="140" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1e40af">
      DB
    </text>
    
    <!-- Tagline for business appeal -->
    <text x="0" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">
      Multi-Engine Vector Database
    </text>
    <text x="0" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#9ca3af">
      Serverless • Cloud • Local Deployment
    </text>
  </g>
  
  <!-- Technical badges for tech audience -->
  <g transform="translate(300, 20)">
    <!-- Performance badge -->
    <rect x="0" y="0" width="80" height="18" fill="url(#accentGradient)" rx="9" opacity="0.9"/>
    <text x="40" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">
      High Performance
    </text>
    
    <!-- Scalability badge -->
    <rect x="0" y="25" width="80" height="18" fill="#10b981" rx="9" opacity="0.9"/>
    <text x="40" y="37" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">
      Auto-Scaling
    </text>
    
    <!-- Multi-engine badge -->
    <rect x="0" y="50" width="80" height="18" fill="#8b5cf6" rx="9" opacity="0.9"/>
    <text x="40" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">
      Multi-Engine
    </text>
  </g>
  
  <!-- Subtle version indicator -->
  <text x="390" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="400" fill="#d1d5db" text-anchor="end">
    v1.0
  </text>
</svg>