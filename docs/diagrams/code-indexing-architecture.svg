<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2"/>
      <stop offset="100%" style="stop-color:#2e5c8a"/>
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#2f855a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936"/>
      <stop offset="100%" style="stop-color:#c05621"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#f7fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" fill="url(#headerGrad)"/>
  <text x="450" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">ProximaDB: Embedded Code Indexing Architecture</text>

  <!-- Left Panel: Source Code -->
  <g transform="translate(30, 80)">
    <rect width="240" height="200" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="36" rx="8" fill="url(#primaryGrad)"/>
    <rect x="0" y="28" width="240" height="8" fill="url(#primaryGrad)"/>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Source Code Repository</text>

    <!-- File icons -->
    <g transform="translate(20, 50)">
      <rect width="60" height="45" rx="4" fill="#edf2f7" stroke="#cbd5e0"/>
      <text x="30" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">.py</text>
      <text x="30" y="35" font-family="monospace" font-size="8" fill="#718096" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(90, 50)">
      <rect width="60" height="45" rx="4" fill="#edf2f7" stroke="#cbd5e0"/>
      <text x="30" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">.rs</text>
      <text x="30" y="35" font-family="monospace" font-size="8" fill="#718096" text-anchor="middle">Rust</text>
    </g>
    <g transform="translate(160, 50)">
      <rect width="60" height="45" rx="4" fill="#edf2f7" stroke="#cbd5e0"/>
      <text x="30" y="20" font-family="monospace" font-size="10" fill="#4a5568" text-anchor="middle">.ts</text>
      <text x="30" y="35" font-family="monospace" font-size="8" fill="#718096" text-anchor="middle">TypeScript</text>
    </g>

    <!-- Stats -->
    <text x="20" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Functions: 2,500+</text>
    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Classes: 800+</text>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Modules: 150+</text>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Languages: 10+</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(280, 160)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="20" y="-8" font-family="system-ui, sans-serif" font-size="9" fill="#4a90e2" text-anchor="middle">Parse</text>
  </g>

  <!-- Middle Panel: Tree-sitter AST -->
  <g transform="translate(330, 80)">
    <rect width="240" height="200" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="36" rx="8" fill="url(#secondaryGrad)"/>
    <rect x="0" y="28" width="240" height="8" fill="url(#secondaryGrad)"/>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Tree-sitter AST Parser</text>

    <!-- AST visualization -->
    <g transform="translate(20, 50)">
      <circle cx="100" cy="15" r="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
      <text x="100" y="19" font-family="monospace" font-size="8" fill="#22543d" text-anchor="middle">root</text>

      <line x1="100" y1="27" x2="60" y2="50" stroke="#68d391" stroke-width="1.5"/>
      <line x1="100" y1="27" x2="140" y2="50" stroke="#68d391" stroke-width="1.5"/>

      <circle cx="60" cy="60" r="10" fill="#c6f6d5" stroke="#2f855a"/>
      <text x="60" y="63" font-family="monospace" font-size="7" fill="#22543d" text-anchor="middle">fn</text>

      <circle cx="140" cy="60" r="10" fill="#c6f6d5" stroke="#2f855a"/>
      <text x="140" y="63" font-family="monospace" font-size="7" fill="#22543d" text-anchor="middle">class</text>

      <line x1="60" y1="70" x2="40" y2="90" stroke="#68d391" stroke-width="1.5"/>
      <line x1="60" y1="70" x2="80" y2="90" stroke="#68d391" stroke-width="1.5"/>

      <circle cx="40" cy="100" r="8" fill="#e6fffa" stroke="#319795"/>
      <text x="40" y="103" font-family="monospace" font-size="6" fill="#234e52" text-anchor="middle">args</text>

      <circle cx="80" cy="100" r="8" fill="#e6fffa" stroke="#319795"/>
      <text x="80" y="103" font-family="monospace" font-size="6" fill="#234e52" text-anchor="middle">body</text>
    </g>

    <!-- Extracted entities -->
    <text x="20" y="175" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Extracts: Functions, Classes,</text>
    <text x="20" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Imports, Docstrings, Types</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(580, 160)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#48bb78" stroke-width="2"/>
    <polygon points="40,0 32,-4 32,4" fill="#48bb78"/>
    <text x="20" y="-8" font-family="system-ui, sans-serif" font-size="9" fill="#48bb78" text-anchor="middle">Embed</text>
  </g>

  <!-- Right Panel: Embeddings -->
  <g transform="translate(630, 80)">
    <rect width="240" height="200" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="36" rx="8" fill="url(#accentGrad)"/>
    <rect x="0" y="28" width="240" height="8" fill="url(#accentGrad)"/>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Local Embeddings (BGE)</text>

    <!-- Vector visualization -->
    <g transform="translate(20, 55)">
      <text x="0" y="0" font-family="monospace" font-size="9" fill="#4a5568">[0.023, -0.156, 0.892, ...]</text>
      <text x="0" y="20" font-family="monospace" font-size="9" fill="#4a5568">[0.445, 0.012, -0.334, ...]</text>
      <text x="0" y="40" font-family="monospace" font-size="9" fill="#4a5568">[0.112, 0.789, 0.234, ...]</text>
      <text x="0" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#718096">...</text>
    </g>

    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Model: BGE-base</text>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Dimension: 768D</text>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Batched Processing</text>
  </g>

  <!-- Central Database Panel -->
  <g transform="translate(250, 310)">
    <rect width="400" height="180" rx="12" fill="white" stroke="#2e5c8a" stroke-width="3" filter="url(#shadow)"/>
    <rect width="400" height="44" rx="12" fill="url(#primaryGrad)"/>
    <rect x="0" y="36" width="400" height="8" fill="url(#primaryGrad)"/>
    <text x="200" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ProximaDB Embedded</text>

    <!-- Engine details -->
    <g transform="translate(20, 60)">
      <rect width="110" height="100" rx="6" fill="#ebf8ff" stroke="#4a90e2"/>
      <text x="55" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2c5282" text-anchor="middle">SST Engine</text>
      <text x="55" y="40" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">88K vec/sec</text>
      <text x="55" y="55" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">insert</text>
      <text x="55" y="75" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">141ms search</text>
      <text x="55" y="90" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">100% recall</text>
    </g>

    <g transform="translate(145, 60)">
      <rect width="110" height="100" rx="6" fill="#f0fff4" stroke="#48bb78"/>
      <text x="55" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#276749" text-anchor="middle">Graph Store</text>
      <text x="55" y="40" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Relationships</text>
      <text x="55" y="55" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Call graphs</text>
      <text x="55" y="75" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Dependencies</text>
      <text x="55" y="90" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Imports</text>
    </g>

    <g transform="translate(270, 60)">
      <rect width="110" height="100" rx="6" fill="#fffaf0" stroke="#ed8936"/>
      <text x="55" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c05621" text-anchor="middle">Storage</text>
      <text x="55" y="40" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">Single SST file</text>
      <text x="55" y="55" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">~3KB/vector</text>
      <text x="55" y="75" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">LZ4 compress</text>
      <text x="55" y="90" font-family="monospace" font-size="9" fill="#4a5568" text-anchor="middle">WAL recovery</text>
    </g>
  </g>

  <!-- Arrow from embeddings to DB -->
  <path d="M 750 280 Q 750 330 650 390" fill="none" stroke="#ed8936" stroke-width="2"/>
  <polygon points="650,390 658,386 654,378" fill="#ed8936"/>
  <text x="720" y="320" font-family="system-ui, sans-serif" font-size="9" fill="#ed8936">Store</text>

  <!-- Query Flow -->
  <g transform="translate(30, 510)">
    <rect width="200" height="110" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="8" fill="#805ad5"/>
    <rect x="0" y="24" width="200" height="8" fill="#805ad5"/>
    <text x="100" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Developer Query</text>

    <text x="15" y="55" font-family="monospace" font-size="10" fill="#4a5568">"How does auth</text>
    <text x="15" y="70" font-family="monospace" font-size="10" fill="#4a5568"> middleware work?"</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="9" fill="#718096">Natural language search</text>
  </g>

  <!-- Arrow from query to DB -->
  <path d="M 230 555 L 300 450" fill="none" stroke="#805ad5" stroke-width="2"/>
  <polygon points="300,450 292,454 296,462" fill="#805ad5"/>
  <text x="250" y="490" font-family="system-ui, sans-serif" font-size="9" fill="#805ad5">Search</text>

  <!-- Results Panel -->
  <g transform="translate(670, 510)">
    <rect width="200" height="110" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="8" fill="#38a169"/>
    <rect x="0" y="24" width="200" height="8" fill="#38a169"/>
    <text x="100" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Relevant Code</text>

    <text x="15" y="52" font-family="monospace" font-size="9" fill="#4a5568">auth_middleware.py:42</text>
    <text x="15" y="67" font-family="monospace" font-size="9" fill="#4a5568">session_handler.rs:156</text>
    <text x="15" y="82" font-family="monospace" font-size="9" fill="#4a5568">jwt_validator.ts:89</text>
    <text x="15" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#718096">Top-K similar code chunks</text>
  </g>

  <!-- Arrow from DB to results -->
  <path d="M 600 450 L 670 510" fill="none" stroke="#38a169" stroke-width="2"/>
  <polygon points="670,510 662,506 666,514" fill="#38a169"/>
  <text x="650" y="475" font-family="system-ui, sans-serif" font-size="9" fill="#38a169">Results</text>

  <!-- Performance badge -->
  <g transform="translate(350, 505)">
    <rect width="200" height="70" rx="8" fill="#1a365d" filter="url(#shadow)"/>
    <text x="100" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#90cdf4" text-anchor="middle">Performance</text>
    <text x="100" y="42" font-family="monospace" font-size="10" fill="white" text-anchor="middle">100K vectors in 297MB</text>
    <text x="100" y="58" font-family="monospace" font-size="10" fill="white" text-anchor="middle">p99 latency: 160ms</text>
  </g>
</svg>
