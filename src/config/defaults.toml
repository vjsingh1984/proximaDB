# ProximaDB Default Configuration
# This file contains all default values for ProximaDB configuration
# Users only need to specify values they want to override

[server]
node_id = "proximadb-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "./data"

[storage]
data_dirs = ["./data/storage"]
wal_dir = "./data/wal"
mmap_enabled = true
cache_size_mb = 512
bloom_filter_bits = 10

[storage.wal_config]
wal_urls = ["file://./data/wal"]
distribution_strategy = "RoundRobin"
collection_affinity = false
memory_flush_size_bytes = 10485760  # 10MB
global_flush_threshold = 1073741824  # 1GB
global_shrink_factor = 0.5
strategy_type = "Bincode"
memtable_type = "BTree"
sync_mode = "PerBatch"
batch_threshold = 100
write_buffer_size_mb = 8
concurrent_flushes = 2

[storage.lsm_config]
memtable_size_mb = 32
memory_flush_size_bytes = 33554432  # 32MB
memtable_type = "BTree"
level_count = 7
compaction_threshold = 4
compaction_strategy = "leveled"
compression = "snappy"
block_size_kb = 32
cache_size_mb = 128
write_buffer_size_mb = 32
max_files_per_level = 10
level_size_multiplier = 10.0
max_levels = 7
background_thread_count = 4
sync_mode = "perbatch"
enable_wal = true
wal_directory = "./data/lsm_wal"
data_directory = "./data/lsm_data"
mmap_enabled = true
prefetch_enabled = true
prefetch_size_kb = 64

[storage.bloom_filter_config]
bits_per_key = 10
enabled = true

[storage.storage_layout]
node_instance = 1
assignment_strategy = "RoundRobin"

[[storage.storage_layout.base_paths]]
base_dir = "./data/storage"
instance_id = 1
mount_point = "./"
disk_type = { Ssd = { max_iops = 50000 } }

[storage.storage_layout.base_paths.capacity_config]
max_wal_size_mb = 1024
metadata_reserved_mb = 256
warning_threshold_percent = 85.0

[storage.storage_layout.temp_config]
use_same_directory = true
temp_suffix = "___temp"
compaction_suffix = "___compaction"
flush_suffix = "___flushed"
cleanup_on_startup = true

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

[storage.metadata_backend]
backend_type = "filestore"
storage_url = "file://./data/metadata"
cache_size_mb = 64
flush_interval_secs = 30
enable_compression = true
enable_snapshots = true
snapshot_threshold = 100
keep_snapshots = 3

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 10
timeout_seconds = 30
enable_tls = false

[monitoring]
metrics_enabled = true
log_level = "info"

[consensus]
node_id = 1
cluster_peers = []
election_timeout_ms = 5000
heartbeat_interval_ms = 1000
snapshot_threshold = 1000

[tls]
enabled = false