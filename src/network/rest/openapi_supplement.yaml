# OpenAPI supplement fragment (TD-126 Phase 1).
#
# This fragment carries the published REST surfaces that are NOT yet generated
# from `#[utoipa::path]` annotations on the live handlers. The generator
# (src/network/rest/openapi.rs) deep-merges this on top of the utoipa-generated
# core document to produce docs/openapi/proximadb-openapi.yaml, and the CI drift
# gate covers the merged result.
#
# Why these surfaces are here rather than annotated in code (tracked for later
# TD-126 increments):
#   * /health*, /api/v2/_meta/capabilities  — handlers return dynamic JSON
#     (serde_json::Value), no concrete DTO to derive ToSchema on yet.
#   * /api/v2/graphs/*                       — handlers + DTOs live in the
#     `proximadb-api` crate with private request types (RestNodeInput, ...).
#   * hybrid / document-collections /
#     observability                          — free-form passthrough endpoints.
#
# The SDK contract gates (Python/Rust/Go/TS openapi_contract tests) exercise
# several of these (graphs, health probes), so they MUST stay in the published
# spec. Keep this fragment in sync with the live handlers until they are
# annotated; until then it is the source of truth for these operations only.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get server health.
      security: []
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Kubernetes liveness probe.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Kubernetes readiness probe.
      security: []
      responses:
        "200":
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /api/v2/_meta/capabilities:
    get:
      tags: [Meta]
      operationId: getCapabilities
      summary: Negotiate server capabilities.
      description: >
        Advertises API version, supported features, limits, and the error-
        envelope contract so SDKs can adapt instead of hard-coding assumptions.
      security: []
      responses:
        "200":
          description: Capability document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  # ── Graph surface (v2) — handlers live in the proximadb-api crate. ──────
  /api/v2/graphs:
    post:
      tags: [Graphs]
      operationId: createGraph
      summary: Create a graph collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGraphRequest"
      responses:
        "200":
          description: Graph collection metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Graphs]
      operationId: listGraphs
      summary: List graph collections.
      responses:
        "200":
          description: Graph collection listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGraphsResponse"
  /api/v2/graphs/{graph_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getGraph
      summary: Get a graph collection by id.
      responses:
        "200":
          description: Graph collection metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Graphs]
      operationId: deleteGraph
      summary: Delete a graph collection.
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGraphResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/nodes:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: createNode
      summary: Create a node in a graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "200":
          description: Created node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [Graphs]
      operationId: getNode
      summary: Get a node by id.
      responses:
        "200":
          description: Node payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Graphs]
      operationId: deleteNode
      summary: Delete a node by id.
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/edges:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: createEdge
      summary: Create an edge in a graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEdgeRequest"
      responses:
        "200":
          description: Created edge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/nodes/batch:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: batchCreateNodes
      summary: Create multiple nodes in a single call.
      description: |
        Batch counterpart to `createNode`. Use this on bulk-ingest paths
        where individual round-trips would dominate latency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateNodesRequest"
      responses:
        "200":
          description: Batch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchNodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/edges/batch:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: batchCreateEdges
      summary: Create multiple edges in a single call.
      description: |
        Batch counterpart to `createEdge`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateEdgesRequest"
      responses:
        "200":
          description: Batch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchEdgesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/traverse:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: traverseGraph
      summary: Traverse a graph from a start node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraverseRequest"
      responses:
        "200":
          description: Traversal result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraverseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v2/graphs/{graph_id}/stats:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getGraphStats
      summary: Get graph statistics.
      responses:
        "200":
          description: Graph statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphStatsResponse"
  # ── Hybrid search (free-form passthrough). ──────────────────────────────
  /api/v2/hybrid/search:
    post:
      tags: [Hybrid]
      operationId: hybridSearch
      summary: BM25 + vector hybrid (fusion) search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              additionalProperties: true
              properties:
                collection: { type: string }
                vector: { type: array, items: { type: number } }
                text_query: { type: string }
                top_k: { type: integer }
                fusion_strategy: { type: string }
      responses:
        "200":
          description: Fused results.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/hybrid/index:
    post:
      tags: [Hybrid]
      operationId: hybridIndex
      summary: Index documents for BM25 full-text search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, documents]
              additionalProperties: true
      responses:
        "200":
          description: Index result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  # ── Document collections (free-form passthrough). ───────────────────────
  /api/v2/document-collections:
    post:
      tags: [Documents]
      operationId: createDocumentCollection
      summary: Create a document collection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Created., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    get:
      tags: [Documents]
      operationId: listDocumentCollections
      summary: List document collections.
      responses:
        "200": { description: Collections., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v2/document-collections/{collection}/documents:
    parameters:
      - name: collection
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Documents]
      operationId: insertDocument
      summary: Insert a document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Inserted., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Documents]
      operationId: queryDocuments
      summary: Query documents.
      responses:
        "200": { description: Documents., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  # ── Observability (free-form passthrough). ──────────────────────────────
  /api/v2/observability/namespaces/{namespace}/logs:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestLog
      summary: Ingest a log entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Ingested., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v2/observability/namespaces/{namespace}/logs/search:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: queryLogs
      summary: Query logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Matching logs., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v2/observability/namespaces:
    post:
      tags: [Observability]
      operationId: createObservabilityNamespace
      summary: Create an observability namespace.
      description: |
        Creates a namespace for log/metric/trace data with tiered retention.
        Retention days default to hot=1, warm=7, cold=30; archive is fixed at
        365 days server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObservabilityNamespaceRequest"
      responses:
        "200":
          description: Namespace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateObservabilityNamespaceResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/observability/namespaces/{namespace}/logs/bulk:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestLogs
      summary: Ingest a batch of log entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLogIngestRequest"
      responses:
        "200":
          description: Ingestion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityIngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/observability/namespaces/{namespace}/metrics:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestMetric
      summary: Ingest a single metric sample.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricSampleInput"
      responses:
        "200":
          description: Ingestion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityIngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/observability/namespaces/{namespace}/metrics/bulk:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestMetrics
      summary: Ingest a batch of metric samples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMetricIngestRequest"
      responses:
        "200":
          description: Ingestion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityIngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/observability/namespaces/{namespace}/metrics/aggregate:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: aggregateMetrics
      summary: Aggregate a metric over a time range.
      description: |
        Aggregation defaults to `avg` with a 60-second step. Results are
        grouped by `group_by` label names and filtered by exact `labels` match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricAggregationInput"
      responses:
        "200":
          description: Aggregated time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricAggregationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/nl/translate:
    post:
      tags: [Query]
      operationId: translateNaturalLanguage
      summary: Translate natural language to a query (AV-SQL).
      description: |
        Runs the three-agent AV-SQL flow (rewrite → view generation → compose)
        over the configured LLM (`config.llm`) and returns the normalized
        query, the agent-selected views, and the final composed query string.
        Requires the LLM integration to be configured; the result is
        model-generated — validate before execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NlTranslateRequest"
      responses:
        "200":
          description: Translation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NlTranslateResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: LLM unavailable or translation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        version:
          type: string
        uptime_seconds:
          type: number
    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      properties:
        api_version:
          type: string
        surface:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        error_envelope:
          type: object
          additionalProperties: true
    # ── Graph schemas (v2). Reconciled against the proximadb-api graph
    # handler; server is authoritative for the wire contract. ───────────
    CreateGraphRequest:
      type: object
      required: [graph_id]
      properties:
        graph_id:
          type: string
          minLength: 1
          description: Unique identifier for the new graph collection.
        name:
          type: string
          nullable: true
          description: Optional human-readable name (defaults to graph_id).
        description:
          type: string
          nullable: true
    GraphCollectionResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<T>` envelope around graph
        collection metadata. The fields below are the common subset
        SDKs rely on; extra server-side fields are passed through.
      properties:
        graph_id:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        node_count:
          type: integer
          nullable: true
        edge_count:
          type: integer
          nullable: true
    ListGraphsResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<Vec<...>>` envelope with `data`
        containing the graph collections.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GraphCollectionResponse"
        success:
          type: boolean
    DeleteGraphResponse:
      type: object
      additionalProperties: true
      description: |
        204 No Content on success with an empty `GraphResponse` envelope;
        404 Not Found with an error envelope when the graph is missing.
      properties:
        success:
          type: boolean
    NodeInput:
      type: object
      required: [id]
      description: |
        Node payload nested inside `CreateNodeRequest.node`. Matches
        `RestNodeInput` in proximadb-api's graph handler.
      properties:
        id:
          type: string
          minLength: 1
        labels:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
        embedding:
          $ref: "#/components/schemas/EmbeddingInput"
          nullable: true
    EmbeddingInput:
      type: object
      required: [vector]
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
        model_id:
          type: string
          nullable: true
        modality:
          type: string
          nullable: true
    CreateNodeRequest:
      type: object
      required: [node]
      description: |
        Wrapped envelope: server expects `{"node": NodeInput}`.
      properties:
        node:
          $ref: "#/components/schemas/NodeInput"
    NodeResponse:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: string
        labels:
          type: array
          nullable: true
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
          nullable: true
    DeleteNodeResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        id:
          type: string
    EdgeInput:
      type: object
      required: [id, from_node_id, to_node_id, edge_type]
      description: |
        Edge payload nested inside `CreateEdgeRequest.edge`. Matches
        `RestEdgeInput` in proximadb-api's graph handler.
      properties:
        id:
          type: string
          minLength: 1
        from_node_id:
          type: string
        to_node_id:
          type: string
        edge_type:
          type: string
        properties:
          type: object
          additionalProperties: true
        weight:
          type: number
          format: double
          nullable: true
    CreateEdgeRequest:
      type: object
      required: [edge]
      description: |
        Wrapped envelope: server expects `{"edge": EdgeInput}`.
      properties:
        edge:
          $ref: "#/components/schemas/EdgeInput"
    EdgeResponse:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
        edge_type:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties: true
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
    TraverseRequest:
      type: object
      required: [start_node_id]
      description: |
        Flat shape (no wrapper). Matches `RestTraversalRequest` in
        proximadb-api.
      properties:
        start_node_id:
          type: string
        max_depth:
          type: integer
          minimum: 1
          default: 3
        edge_types:
          type: array
          items:
            type: string
        node_labels:
          type: array
          items:
            type: string
        algorithm:
          type: string
          nullable: true
          description: bfs | dfs | shortest_path
        limit:
          type: integer
          minimum: 1
          nullable: true
    TraverseResponse:
      type: object
      additionalProperties: true
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeResponse"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/EdgeResponse"
        paths:
          type: array
          items:
            type: array
            items:
              type: string
    GraphStatsResponse:
      type: object
      additionalProperties: true
      properties:
        node_count:
          type: integer
        edge_count:
          type: integer
        density:
          type: number
          format: double
          nullable: true
    BatchCreateNodesRequest:
      type: object
      required: [nodes]
      description: |
        Body for `POST /api/v2/graphs/{id}/nodes/batch`.
      properties:
        nodes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NodeInput"
    BatchNodesResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<BatchResults<Node>>` envelope.
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/NodeResponse"
            count:
              type: integer
    BatchCreateEdgesRequest:
      type: object
      required: [edges]
      description: |
        Body for `POST /api/v2/graphs/{id}/edges/batch`.
      properties:
        edges:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EdgeInput"
    BatchEdgesResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<BatchResults<Edge>>` envelope.
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/EdgeResponse"
            count:
              type: integer
    # ── Observability (wave-1 spec rationalization: TD-SPECRAT-1) ──────────────
    CreateObservabilityNamespaceRequest:
      type: object
      required: [name]
      description: |
        Body for `POST /api/v2/observability/namespaces`. Retention days
        default to hot=1, warm=7, cold=30.
      properties:
        name:
          type: string
          minLength: 1
        hot_retention_days:
          type: integer
          format: uint32
          default: 1
        warm_retention_days:
          type: integer
          format: uint32
          default: 7
        cold_retention_days:
          type: integer
          format: uint32
          default: 30
    CreateObservabilityNamespaceResponse:
      type: object
      required: [success, namespace]
      properties:
        success:
          type: boolean
        namespace:
          type: string
    LogEntryInput:
      type: object
      required: [message]
      description: |
        A single log entry for ingestion. `severity` defaults to `info`;
        `fields` carries arbitrary structured attributes.
      properties:
        timestamp_ns:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
        severity:
          type: string
          default: info
          description: "One of: trace, debug, info, warn, error, fatal (case-insensitive)."
        source:
          type: string
          nullable: true
        service:
          type: string
          nullable: true
        fields:
          type: object
          additionalProperties: true
    BulkLogIngestRequest:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LogEntryInput"
    MetricSampleInput:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: number
          format: double
        timestamp_ns:
          type: integer
          format: int64
          nullable: true
          description: Defaults to server receive time.
        labels:
          type: object
          additionalProperties: { type: string }
    BulkMetricIngestRequest:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MetricSampleInput"
    ObservabilityIngestResponse:
      type: object
      required: [ingested, failed, success]
      properties:
        ingested:
          type: integer
          format: uint64
        failed:
          type: integer
          format: uint64
        success:
          type: boolean
    MetricAggregationInput:
      type: object
      required: [metric_name, start_time_ns, end_time_ns]
      properties:
        metric_name:
          type: string
          minLength: 1
        start_time_ns:
          type: integer
          format: int64
        end_time_ns:
          type: integer
          format: int64
        aggregation:
          type: string
          default: avg
          description: "min, max, avg, sum, or count."
        step_seconds:
          type: integer
          format: uint32
          default: 60
        group_by:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    MetricDataPoint:
      type: object
      required: [timestamp_ns, value]
      properties:
        timestamp_ns:
          type: integer
          format: int64
        value:
          type: number
          format: double
    MetricTimeSeries:
      type: object
      required: [labels, points]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
    MetricAggregationResult:
      type: object
      required: [series, query_time_ms]
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricTimeSeries"
        query_time_ms:
          type: integer
          format: uint64
    NlTranslateRequest:
      type: object
      required: [query]
      description: |
        Body for `POST /api/v2/nl/translate`.
      properties:
        query:
          type: string
          minLength: 1
    NlTranslateResult:
      type: object
      required: [normalized_query, views, final_query]
      description: |
        Model-generated translation output — the final query string is not
        validated SQL/AQL; validate before executing it.
      properties:
        normalized_query:
          type: string
        views:
          type: array
          items: { type: string }
        final_query:
          type: string
