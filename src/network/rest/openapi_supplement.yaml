# OpenAPI supplement fragment (TD-126 Phase 1).
#
# This fragment carries the published REST surfaces that are NOT yet generated
# from `#[utoipa::path]` annotations on the live handlers. The generator
# (src/network/rest/openapi.rs) deep-merges this on top of the utoipa-generated
# core document to produce docs/openapi/proximadb-openapi.yaml, and the CI drift
# gate covers the merged result.
#
# Why these surfaces are here rather than annotated in code (tracked for later
# TD-126 increments):
#   * /health*, /api/v2/_meta/capabilities  — handlers return dynamic JSON
#     (serde_json::Value), no concrete DTO to derive ToSchema on yet.
#   * /api/v2/graphs/*                       — handlers + DTOs live in the
#     `proximadb-api` crate with private request types (RestNodeInput, ...).
#   * hybrid / document-collections /
#     observability                          — free-form passthrough endpoints.
#
# The SDK contract gates (Python/Rust/Go/TS openapi_contract tests) exercise
# several of these (graphs, health probes), so they MUST stay in the published
# spec. Keep this fragment in sync with the live handlers until they are
# annotated; until then it is the source of truth for these operations only.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get server health.
      security: []
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Kubernetes liveness probe.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Kubernetes readiness probe.
      security: []
      responses:
        "200":
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /api/v2/_meta/capabilities:
    get:
      tags: [Meta]
      operationId: getCapabilities
      summary: Negotiate server capabilities.
      description: >
        Advertises API version, supported features, limits, and the error-
        envelope contract so SDKs can adapt instead of hard-coding assumptions.
      security: []
      responses:
        "200":
          description: Capability document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  # ── Graph surface (v2) — handlers live in the proximadb-api crate. ──────
  /api/v2/graphs:
    post:
      tags: [Graphs]
      operationId: createGraph
      summary: Create a graph collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGraphRequest"
      responses:
        "200":
          description: Graph collection metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Graphs]
      operationId: listGraphs
      summary: List graph collections.
      responses:
        "200":
          description: Graph collection listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGraphsResponse"
  /api/v2/graphs/{graph_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getGraph
      summary: Get a graph collection by id.
      responses:
        "200":
          description: Graph collection metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphCollectionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Graphs]
      operationId: deleteGraph
      summary: Delete a graph collection.
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteGraphResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/nodes:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: createNode
      summary: Create a node in a graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "200":
          description: Created node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/GraphId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [Graphs]
      operationId: getNode
      summary: Get a node by id.
      responses:
        "200":
          description: Node payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Graphs]
      operationId: deleteNode
      summary: Delete a node by id.
      responses:
        "200":
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/edges:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: createEdge
      summary: Create an edge in a graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEdgeRequest"
      responses:
        "200":
          description: Created edge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/nodes/batch:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: batchCreateNodes
      summary: Create multiple nodes in a single call.
      description: |
        Batch counterpart to `createNode`. Use this on bulk-ingest paths
        where individual round-trips would dominate latency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateNodesRequest"
      responses:
        "200":
          description: Batch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchNodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/edges/batch:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: batchCreateEdges
      summary: Create multiple edges in a single call.
      description: |
        Batch counterpart to `createEdge`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateEdgesRequest"
      responses:
        "200":
          description: Batch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchEdgesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/graphs/{graph_id}/traverse:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    post:
      tags: [Graphs]
      operationId: traverseGraph
      summary: Traverse a graph from a start node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraverseRequest"
      responses:
        "200":
          description: Traversal result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraverseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v2/graphs/{graph_id}/stats:
    parameters:
      - $ref: "#/components/parameters/GraphId"
    get:
      tags: [Graphs]
      operationId: getGraphStats
      summary: Get graph statistics.
      responses:
        "200":
          description: Graph statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphStatsResponse"
  # ── Hybrid search (free-form passthrough). ──────────────────────────────
  /api/v2/hybrid/search:
    post:
      tags: [Hybrid]
      operationId: hybridSearch
      summary: BM25 + vector hybrid (fusion) search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              additionalProperties: true
              properties:
                collection: { type: string }
                vector: { type: array, items: { type: number } }
                text_query: { type: string }
                top_k: { type: integer }
                fusion_strategy: { type: string }
      responses:
        "200":
          description: Fused results.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/hybrid/index:
    post:
      tags: [Hybrid]
      operationId: hybridIndex
      summary: Index documents for BM25 full-text search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, documents]
              additionalProperties: true
      responses:
        "200":
          description: Index result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  # ── Document collections (free-form passthrough). ───────────────────────
  /api/v2/document-collections:
    post:
      tags: [Documents]
      operationId: createDocumentCollection
      summary: Create a document collection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Created., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    get:
      tags: [Documents]
      operationId: listDocumentCollections
      summary: List document collections.
      responses:
        "200": { description: Collections., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/v2/document-collections/{collection}/documents:
    parameters:
      - name: collection
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Documents]
      operationId: insertDocument
      summary: Insert a document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Inserted., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Documents]
      operationId: queryDocuments
      summary: Query documents.
      responses:
        "200": { description: Documents., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  # ── Observability (free-form passthrough). ──────────────────────────────
  /api/v2/observability/namespaces/{namespace}/logs:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestLog
      summary: Ingest a log entry.
      description: |
        Scope: path-namespace = isolation boundary (storage tenant key);
        X-Tenant-ID not consulted (TD-SPECRAT-2). Availability: mounted
        unconditionally on the unified server (the default, port 5678);
        legacy multi-port mode mounts it only with gRPC enabled; cluster-mode
        REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Ingested., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/observability/namespaces/{namespace}/logs/search:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: queryLogs
      summary: Query logs.
      description: |
        Reads are scoped by the path namespace — the same boundary the other
        observability ops use (any authenticated caller may query any
        namespace; TD-SPECRAT-2 tracks the ownership decision). Availability:
        mounted unconditionally on the unified server (the default, port
        5678); legacy multi-port mode mounts it only with gRPC enabled;
        cluster-mode REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Matching logs., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/observability/namespaces:
    post:
      tags: [Observability]
      operationId: createObservabilityNamespace
      summary: Create an observability namespace.
      description: |
        Creates a namespace for log/metric/trace data with tiered retention.
        Retention days default to hot=1, warm=7, cold=30; archive is fixed at
        365 days server-side.

        Scope: the path namespace IS the isolation boundary — it maps 1:1 onto
        the storage tenant key. The request's X-Tenant-ID header is not
        consulted by this surface (TD-SPECRAT-2 tracks multi-tenant namespace
        ownership). Availability: mounted unconditionally on the unified
        server (the default, port 5678); legacy multi-port mode mounts it only
        with gRPC enabled; cluster-mode REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObservabilityNamespaceRequest"
      responses:
        "200":
          description: Namespace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateObservabilityNamespaceResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/observability/namespaces/{namespace}/logs/bulk:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestLogs
      summary: Ingest a batch of log entries.
      description: |
        Scope: path-namespace = isolation boundary (storage tenant key);
        X-Tenant-ID not consulted (TD-SPECRAT-2). Availability: mounted
        unconditionally on the unified server (the default, port 5678);
        legacy multi-port mode mounts it only with gRPC enabled; cluster-mode
        REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLogIngestRequest"
      responses:
        "200":
          description: Ingestion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityIngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/observability/namespaces/{namespace}/metrics:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestMetric
      summary: Ingest a single metric sample.
      description: |
        Scope: path-namespace = isolation boundary (storage tenant key);
        X-Tenant-ID not consulted (TD-SPECRAT-2). Availability: mounted
        unconditionally on the unified server (the default, port 5678);
        legacy multi-port mode mounts it only with gRPC enabled; cluster-mode
        REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricSampleInput"
      responses:
        "200":
          description: Ingestion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityIngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/observability/namespaces/{namespace}/metrics/bulk:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: ingestMetrics
      summary: Ingest a batch of metric samples.
      description: |
        Scope: path-namespace = isolation boundary (storage tenant key);
        X-Tenant-ID not consulted (TD-SPECRAT-2). Availability: mounted
        unconditionally on the unified server (the default, port 5678);
        legacy multi-port mode mounts it only with gRPC enabled; cluster-mode
        REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMetricIngestRequest"
      responses:
        "200":
          description: Ingestion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityIngestResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/observability/namespaces/{namespace}/metrics/aggregate:
    parameters:
      - name: namespace
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Observability]
      operationId: aggregateMetrics
      summary: Aggregate a metric over a time range.
      description: |
        Aggregation defaults to `avg` with a 60-second step. Results are
        grouped by `group_by` label names and filtered by exact `labels` match.

        Scope: path-namespace = isolation boundary (storage tenant key);
        X-Tenant-ID not consulted (TD-SPECRAT-2). Availability: mounted
        unconditionally on the unified server (the default, port 5678);
        legacy multi-port mode mounts it only with gRPC enabled; cluster-mode
        REST does not mount it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricAggregationInput"
      responses:
        "200":
          description: Aggregated time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricAggregationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Storage/processing failure (maps to internal_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/nl/translate:
    post:
      tags: [Query]
      operationId: translateNaturalLanguage
      summary: Translate natural language to a query (AV-SQL).
      description: |
        Runs the three-agent AV-SQL flow (rewrite → view generation → compose)
        over the configured LLM (`config.llm`) and returns the normalized
        query, the agent-selected views, and the final composed query string.
        Requires the LLM integration to be configured; the result is
        model-generated — validate before execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NlTranslateRequest"
      responses:
        "200":
          description: Translation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NlTranslateResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: LLM unavailable or translation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # TD-SPECRAT-1 wave 3 (TD-ABAC control-plane / ADR-090 grants / TD-SEC-2
  # posture — src/network/rest/canonical/abac_admin.rs). Every operation
  # below:
  #   * is an OPERATOR (cluster-scope SystemAdmin/ConfigureSystem) surface,
  #     never the calling tenant's own data-plane scope;
  #   * is registered ONLY in builds compiled with `--features abac-policy`
  #     (default OFF, TD-FOUNDATION-3). A default build does not mount these
  #     routes at all — an unmatched path returns a generic axum 404, not
  #     the typed AbacOperatorErrorResponse documented below;
  #   * returns AbacOperatorErrorResponse (a FLAT {error, message, code}
  #     shape distinct from the canonical nested ErrorResponse envelope —
  #     this is the handler's real wire format, carried verbatim, not
  #     normalized into the canonical shape);
  #   * resolves tenant path segments from a STRING to the durable stable
  #     u64 server-side at write/read time (never accepts a raw stable id).
  /api/v2/abac/policy-bindings/{tenant}/{object_id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
      - name: object_id
        in: path
        required: true
        schema: { type: integer, format: uint64 }
    put:
      tags: [ABAC]
      operationId: putPolicyBinding
      summary: Upsert an ABAC policy binding.
      description: |
        Provisions (or replaces) the policy binding at `object_id` for
        `tenant` — a constraint-layer rule (`scope` + `effect`, optionally a
        `predicate_ref` row filter and a `field_mask`). Writes through the
        same store the live enforcer reads: visible on the next request, no
        restart. `Deny` wins during resolution; the default is deny.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPutPolicyBindingRequest"
      responses:
        "200":
          description: The stored binding (tenant string resolved to its stable id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyBinding"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    delete:
      tags: [ABAC]
      operationId: deletePolicyBinding
      summary: Remove an ABAC policy binding.
      description: |
        Idempotent — 204 whether or not a binding existed at `object_id`.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "204": { description: Binding removed (or already absent). }
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/policy-bindings/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ABAC]
      operationId: listPolicyBindings
      summary: List a tenant's live ABAC policy bindings.
      description: |
        The exact binding set the enforcer composes for reads under
        `tenant` — an operator inspection endpoint, not a per-tenant
        self-service one.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "200":
          description: The tenant's policy bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyBindingsResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/tenant-posture/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ABAC]
      operationId: getTenantPosture
      summary: Get a tenant's explicit ABAC grant-enforcement posture.
      description: |
        404 means the tenant has NO explicit record — meaningfully
        different from `Off`, since an absent record means the tenant
        inherits the process default, which may itself be `Enforce`.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "200":
          description: The tenant's explicit posture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacTenantSecurityPosture"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "404":
          description: No explicit posture record (tenant inherits the process default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacOperatorErrorResponse"
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    put:
      tags: [ABAC]
      operationId: putTenantPosture
      summary: Set a tenant's ABAC grant-enforcement posture.
      description: |
        Intended rollout: `Off` -> `Audit` (watch would-be-denials fall to
        zero for this tenant) -> `Enforce`. Skipping the `Audit` rehearsal
        is how an operator breaks a customer's traffic.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPutTenantPostureRequest"
      responses:
        "200":
          description: The tenant's updated posture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacTenantSecurityPosture"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/grants:
    post:
      tags: [ABAC]
      operationId: postGrant
      summary: Provision an ADR-090 grant (cross-tenant entitlement).
      description: |
        Grants are the entitlement layer: "this grantee may perform these
        actions on this resource", where the grantee MAY be a foreign
        tenant or a foreign tenant's user — the one place cross-tenant
        sharing is expressible. Both the owner and the grantee tenant must
        resolve (fail-closed on unminted tenants); the grantee subject is
        deliberately NOT validated against the principal registry, so a
        share may be provisioned before its recipient's first login.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the body `tenant` field governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPostGrantRequest"
      responses:
        "200":
          description: The provisioned grant id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPostGrantResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/grants/{owner_tenant}:
    parameters:
      - name: owner_tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ABAC]
      operationId: listGrants
      summary: List an owner tenant's grants.
      description: |
        Revoked grants stay listed with `revoked_at_ms` set — the audit
        trail is the point, not a live-only view.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "200":
          description: The owner's grants (including revoked/expired ones).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbacGrantRecord"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/grants/{owner_tenant}/{grant_id}:
    parameters:
      - name: owner_tenant
        in: path
        required: true
        schema: { type: string }
      - name: grant_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [ABAC]
      operationId: deleteGrant
      summary: Revoke a grant.
      description: |
        Idempotent — 204 whether the grant existed (and was revoked) or was
        already unknown/revoked. Revocation under the wrong owner cannot
        even name the grant (the store is owner-partitioned).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the tenant path segment governs.
      responses:
        "204": { description: Grant revoked (or already unknown/revoked). }
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/attribute-bindings:
    get:
      tags: [ABAC]
      operationId: listAttributeBindings
      summary: List every ABAC attribute binding.
      description: |
        Cluster-operator scope — every `(subject, tenant)` attribute
        binding across every tenant, by design (cross-tenant visibility is
        the point of an operator inspection endpoint).
        The optional `X-Tenant-ID` header is not consulted by this
        handler — this is a cross-tenant operator view.
      responses:
        "200":
          description: Every attribute binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacAttributeBindingsResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    post:
      tags: [ABAC]
      operationId: postAttributeBinding
      summary: Upsert a subject's ABAC attribute binding.
      description: |
        The authority half of ABAC — a `(subject, tenant)`-keyed,
        multi-valued attribute set a policy's `predicate_ref` resolves
        against. Writes through the same store the live enforcer reads.
        The optional `X-Tenant-ID` header is not consulted by this
        handler — the body `tenant` field governs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacPostAttributeBindingRequest"
      responses:
        "200":
          description: The stored attribute binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacAttributeBinding"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "422": { $ref: "#/components/responses/AbacTenantUnresolved" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/predicate-objects:
    get:
      tags: [ABAC]
      operationId: listPredicateObjects
      summary: List every registered ABAC predicate object.
      responses:
        "200":
          description: Every predicate object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPredicateObjectsResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
  /api/v2/abac/predicate-objects/{object_id}:
    parameters:
      - name: object_id
        in: path
        required: true
        schema: { type: integer, format: uint64 }
    get:
      tags: [ABAC]
      operationId: getPredicateObject
      summary: Get one ABAC predicate object.
      description: |
        404 if unknown. Note a dangling `predicate_ref` on a policy binding
        resolves fail-closed (safe) regardless of this endpoint.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      responses:
        "200":
          description: The predicate object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPredicateObjectResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "404":
          description: No predicate object registered under this object_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacOperatorErrorResponse"
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    put:
      tags: [ABAC]
      operationId: putPredicateObject
      summary: Register (or replace) an ABAC predicate object.
      description: |
        The request body IS the `FilterExpression` directly (no wrapper) —
        a stored row-filter predicate that a policy binding's
        `predicate_ref` can reference.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacFilterExpression"
      responses:
        "200":
          description: The registered predicate object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPredicateObjectResponse"
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
    delete:
      tags: [ABAC]
      operationId: deletePredicateObject
      summary: Revoke an ABAC predicate object.
      description: |
        Idempotent (204). Subsequent resolves of `object_id` by any policy
        binding fail-closed.
        The optional `X-Tenant-ID` header is not consulted by this
        handler (predicate objects are global, not tenant-scoped).
      responses:
        "204": { description: Predicate object revoked (or already absent). }
        "401": { $ref: "#/components/responses/AbacUnauthorized" }
        "403": { $ref: "#/components/responses/AbacForbidden" }
        "503": { $ref: "#/components/responses/AbacUnavailable" }
components:
  parameters:
    GraphId:
      name: graph_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AbacUnauthorized:
      description: |
        Missing auth context (401) — the request reached the handler with
        no resolved principal, indicating the auth middleware itself is
        misconfigured for this deployment (`error: "missing_auth_context"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    AbacForbidden:
      description: |
        Authenticated but lacks `SystemAdmin` or `ConfigureSystem`
        (`error: "operator_permission_required"`) — this is a
        cluster-scope operator surface; a tenant's own admin permissions
        do not satisfy it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    AbacTenantUnresolved:
      description: |
        The tenant path/body segment has no durable stable id and the
        configured catalog could not mint one (`error:
        "tenant_unresolved"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
    AbacUnavailable:
      description: |
        ABAC is compiled in (`abac-policy`) but no durable store is open
        for this process (no `data_dir`), or the underlying store returned
        an error (`error: "abac_unavailable"` / `"grant_store_error"` /
        `"posture_store_error"` / `"tenant_mint_failed"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AbacOperatorErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        version:
          type: string
        uptime_seconds:
          type: number
    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    CapabilitiesResponse:
      type: object
      additionalProperties: true
      properties:
        api_version:
          type: string
        surface:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        error_envelope:
          type: object
          additionalProperties: true
    # ── Graph schemas (v2). Reconciled against the proximadb-api graph
    # handler; server is authoritative for the wire contract. ───────────
    CreateGraphRequest:
      type: object
      required: [graph_id]
      properties:
        graph_id:
          type: string
          minLength: 1
          description: Unique identifier for the new graph collection.
        name:
          type: string
          nullable: true
          description: Optional human-readable name (defaults to graph_id).
        description:
          type: string
          nullable: true
    GraphCollectionResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<T>` envelope around graph
        collection metadata. The fields below are the common subset
        SDKs rely on; extra server-side fields are passed through.
      properties:
        graph_id:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        node_count:
          type: integer
          nullable: true
        edge_count:
          type: integer
          nullable: true
    ListGraphsResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<Vec<...>>` envelope with `data`
        containing the graph collections.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GraphCollectionResponse"
        success:
          type: boolean
    DeleteGraphResponse:
      type: object
      additionalProperties: true
      description: |
        204 No Content on success with an empty `GraphResponse` envelope;
        404 Not Found with an error envelope when the graph is missing.
      properties:
        success:
          type: boolean
    NodeInput:
      type: object
      required: [id]
      description: |
        Node payload nested inside `CreateNodeRequest.node`. Matches
        `RestNodeInput` in proximadb-api's graph handler.
      properties:
        id:
          type: string
          minLength: 1
        labels:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
        embedding:
          $ref: "#/components/schemas/EmbeddingInput"
          nullable: true
    EmbeddingInput:
      type: object
      required: [vector]
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
        model_id:
          type: string
          nullable: true
        modality:
          type: string
          nullable: true
    CreateNodeRequest:
      type: object
      required: [node]
      description: |
        Wrapped envelope: server expects `{"node": NodeInput}`.
      properties:
        node:
          $ref: "#/components/schemas/NodeInput"
    NodeResponse:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: string
        labels:
          type: array
          nullable: true
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
          nullable: true
    DeleteNodeResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        id:
          type: string
    EdgeInput:
      type: object
      required: [id, from_node_id, to_node_id, edge_type]
      description: |
        Edge payload nested inside `CreateEdgeRequest.edge`. Matches
        `RestEdgeInput` in proximadb-api's graph handler.
      properties:
        id:
          type: string
          minLength: 1
        from_node_id:
          type: string
        to_node_id:
          type: string
        edge_type:
          type: string
        properties:
          type: object
          additionalProperties: true
        weight:
          type: number
          format: double
          nullable: true
    CreateEdgeRequest:
      type: object
      required: [edge]
      description: |
        Wrapped envelope: server expects `{"edge": EdgeInput}`.
      properties:
        edge:
          $ref: "#/components/schemas/EdgeInput"
    EdgeResponse:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
        edge_type:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties: true
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
    TraverseRequest:
      type: object
      required: [start_node_id]
      description: |
        Flat shape (no wrapper). Matches `RestTraversalRequest` in
        proximadb-api.
      properties:
        start_node_id:
          type: string
        max_depth:
          type: integer
          minimum: 1
          default: 3
        edge_types:
          type: array
          items:
            type: string
        node_labels:
          type: array
          items:
            type: string
        algorithm:
          type: string
          nullable: true
          description: bfs | dfs | shortest_path
        limit:
          type: integer
          minimum: 1
          nullable: true
    TraverseResponse:
      type: object
      additionalProperties: true
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeResponse"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/EdgeResponse"
        paths:
          type: array
          items:
            type: array
            items:
              type: string
    GraphStatsResponse:
      type: object
      additionalProperties: true
      properties:
        node_count:
          type: integer
        edge_count:
          type: integer
        density:
          type: number
          format: double
          nullable: true
    BatchCreateNodesRequest:
      type: object
      required: [nodes]
      description: |
        Body for `POST /api/v2/graphs/{id}/nodes/batch`.
      properties:
        nodes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NodeInput"
    BatchNodesResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<BatchResults<Node>>` envelope.
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/NodeResponse"
            count:
              type: integer
    BatchCreateEdgesRequest:
      type: object
      required: [edges]
      description: |
        Body for `POST /api/v2/graphs/{id}/edges/batch`.
      properties:
        edges:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EdgeInput"
    BatchEdgesResponse:
      type: object
      additionalProperties: true
      description: |
        Server returns a `GraphResponse<BatchResults<Edge>>` envelope.
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/EdgeResponse"
            count:
              type: integer
    # ── Observability (wave-1 spec rationalization: TD-SPECRAT-1) ──────────────
    CreateObservabilityNamespaceRequest:
      type: object
      required: [name]
      description: |
        Body for `POST /api/v2/observability/namespaces`. Retention days
        default to hot=1, warm=7, cold=30.
      properties:
        name:
          type: string
          minLength: 1
        hot_retention_days:
          type: integer
          format: uint32
          default: 1
        warm_retention_days:
          type: integer
          format: uint32
          default: 7
        cold_retention_days:
          type: integer
          format: uint32
          default: 30
    CreateObservabilityNamespaceResponse:
      type: object
      required: [success, namespace]
      properties:
        success:
          type: boolean
        namespace:
          type: string
    LogEntryInput:
      type: object
      required: [message]
      description: |
        A single log entry for ingestion. `severity` defaults to `info`;
        `fields` carries arbitrary structured attributes.
      properties:
        timestamp_ns:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
        severity:
          type: string
          default: info
          description: "Canonical: trace, debug, info, warn, error, fatal. Aliases accepted (case-insensitive): verbose->trace, information->info, warning->warn, err->error, critical->fatal. Unknown values fall back to info."
        source:
          type: string
          nullable: true
        service:
          type: string
          nullable: true
        fields:
          type: object
          additionalProperties: true
    BulkLogIngestRequest:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LogEntryInput"
    MetricSampleInput:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: number
          format: double
        timestamp_ns:
          type: integer
          format: int64
          nullable: true
          description: Defaults to server receive time.
        labels:
          type: object
          additionalProperties: { type: string }
    BulkMetricIngestRequest:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MetricSampleInput"
    ObservabilityIngestResponse:
      type: object
      required: [ingested, failed, success]
      properties:
        ingested:
          type: integer
          format: uint64
        failed:
          type: integer
          format: uint64
        success:
          type: boolean
    MetricAggregationInput:
      type: object
      required: [metric_name, start_time_ns, end_time_ns]
      properties:
        metric_name:
          type: string
          minLength: 1
        start_time_ns:
          type: integer
          format: int64
        end_time_ns:
          type: integer
          format: int64
        aggregation:
          type: string
          default: avg
          description: "Canonical: min, max, avg, sum, count. Percentile/rate forms also accepted: p50, p90, p95, p99, rate. Unknown values fall back to avg."
        step_seconds:
          type: integer
          format: uint32
          default: 60
        group_by:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    MetricDataPoint:
      type: object
      required: [timestamp_ns, value]
      properties:
        timestamp_ns:
          type: integer
          format: int64
        value:
          type: number
          format: double
    MetricTimeSeries:
      type: object
      required: [labels, points]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
    MetricAggregationResult:
      type: object
      required: [series, query_time_ms]
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricTimeSeries"
        query_time_ms:
          type: integer
          format: uint64
    NlTranslateRequest:
      type: object
      required: [query]
      description: |
        Body for `POST /api/v2/nl/translate`.
      properties:
        query:
          type: string
          minLength: 1
    NlTranslateResult:
      type: object
      required: [normalized_query, views, final_query]
      description: |
        Model-generated translation output — the final query string is not
        validated SQL/AQL; validate before executing it.
      properties:
        normalized_query:
          type: string
        views:
          type: array
          items: { type: string }
        final_query:
          type: string
    AbacOperatorErrorResponse:
      type: object
      required: [error, message, code]
      description: |
        The FLAT error shape every ABAC operator endpoint returns —
        `{error, message, code}` where `error` is a short machine-readable
        slug (e.g. `"tenant_unresolved"`). This is deliberately DISTINCT
        from the canonical nested `ErrorResponse` (`{error: {type,
        message, code}}`) used elsewhere in this spec; it is the actual
        wire format of `abac_admin::OperatorErrorResponse`, carried
        verbatim rather than normalized.
      properties:
        error:
          type: string
          description: Machine-readable error slug.
        message:
          type: string
        code:
          type: integer
          description: The HTTP status code, repeated in the body.
    AbacScope:
      description: |
        The catalog container a policy/grant governs — a stable-id-keyed,
        externally-tagged Rust enum. Exactly one of `Namespace`, `Table`,
        or `Column` is present.
      oneOf:
        - type: object
          required: [Namespace]
          properties:
            Namespace: { type: integer, minimum: 0, maximum: 65535 }
        - type: object
          required: [Table]
          properties:
            Table: { type: integer, format: uint32 }
        - type: object
          required: [Column]
          properties:
            Column: { $ref: "#/components/schemas/AbacColumnScope" }
    AbacColumnScope:
      type: object
      required: [table, column]
      description: The `Column` variant payload of [AbacScope](#/components/schemas/AbacScope).
      properties:
        table: { type: integer, format: uint32 }
        column: { type: integer, format: uint32 }
    AbacEffect:
      type: string
      enum: [Permit, Deny]
      description: Permit or deny; deny wins during policy resolution.
    AbacFieldMask:
      type: string
      enum: ["Null", Redact, Forbid]
      description: |
        Column-level masking. `Forbid` rejects the read (existence must
        not leak); `Null`/`Redact` are projection rewrites.
    AbacAttrValue:
      description: |
        An ABAC subject attribute value — an externally-tagged Rust enum;
        exactly one of `Str`, `Int`, `Bool`, or `List` is present.
      oneOf:
        - type: object
          required: [Str]
          properties: { Str: { type: string } }
        - type: object
          required: [Int]
          properties: { Int: { type: integer, format: int64 } }
        - type: object
          required: [Bool]
          properties: { Bool: { type: boolean } }
        - type: object
          required: [List]
          properties:
            List: { type: array, items: { type: string } }
    AbacComparisonOperator:
      type: string
      enum:
        - Equals
        - NotEquals
        - GreaterThan
        - GreaterThanOrEqual
        - LessThan
        - LessThanOrEqual
        - In
        - NotIn
        - Contains
        - StartsWith
        - EndsWith
        - Between
        - IsNull
        - IsNotNull
        - Like
    AbacFilterExpression:
      type: object
      additionalProperties: true
      description: |
        A predicate-object row filter — a RECURSIVE, externally-tagged Rust
        enum (`proximadb_filter_expression::FilterExpression`). Modeled
        here as free-form JSON (rather than a typed `oneOf`) because the
        self-referential union is not representable in a form the SDK
        codegen tooling can process (openapi-python-client cannot resolve
        a `oneOf` branch whose `items` `$ref`s the union being defined);
        this is the one schema in the ABAC surface where the generated
        client falls back to an untyped object. Construct exactly one of:

        * `{"Comparison": {"field": <string>, "operator": <one of
          "Equals","NotEquals","GreaterThan","GreaterThanOrEqual",
          "LessThan","LessThanOrEqual","In","NotIn","Contains",
          "StartsWith","EndsWith","Between","IsNull","IsNotNull","Like">,
          "value": <any JSON value>}}`
        * `{"And": [<AbacFilterExpression>, ...]}`
        * `{"Or": [<AbacFilterExpression>, ...]}`
        * `{"Not": <AbacFilterExpression>}`

        See [AbacComparisonOperator](#/components/schemas/AbacComparisonOperator)
        for the authoritative operator enum (referenced here for docs only;
        not structurally, for the same recursion reason).
    AbacPutPolicyBindingRequest:
      type: object
      required: [scope, effect]
      description: Body for `PUT /api/v2/abac/policy-bindings/{tenant}/{object_id}`.
      properties:
        scope: { $ref: "#/components/schemas/AbacScope" }
        effect: { $ref: "#/components/schemas/AbacEffect" }
        predicate_ref:
          type: [integer, "null"]
          format: uint64
          description: |
            The predicate object this binding carries (a row-level rule).
            Omit for a predicate-free table-level grant. A dangling ref
            resolves fail-closed at read time.
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
    AbacPolicyBinding:
      type: object
      required: [object_id, tenant_stable_id, scope, effect]
      properties:
        object_id: { type: integer, format: uint64 }
        tenant_stable_id: { type: integer, format: uint64 }
        scope: { $ref: "#/components/schemas/AbacScope" }
        effect: { $ref: "#/components/schemas/AbacEffect" }
        predicate_ref:
          type: [integer, "null"]
          format: uint64
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
    AbacPolicyBindingsResponse:
      type: object
      required: [tenant, tenant_stable_id, count, bindings]
      properties:
        tenant: { type: string }
        tenant_stable_id: { type: integer, format: uint64 }
        count: { type: integer, format: uint64 }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AbacPolicyBinding" }
    AbacPostAttributeBindingRequest:
      type: object
      required: [subject_id, tenant, attrs]
      description: Body for `POST /api/v2/abac/attribute-bindings`.
      properties:
        subject_id: { type: string }
        tenant:
          type: string
          description: Tenant display name; resolved to the stable u64 server-side.
        attrs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AbacAttrValue" }
    AbacAttributeBinding:
      type: object
      required: [subject_id, tenant_stable_id, attrs]
      properties:
        subject_id: { type: string }
        tenant_stable_id: { type: integer, format: uint64 }
        attrs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AbacAttrValue" }
    AbacAttributeBindingsResponse:
      type: object
      required: [count, bindings]
      properties:
        count: { type: integer, format: uint64 }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AbacAttributeBinding" }
    AbacPredicateObjectResponse:
      type: object
      required: [object_id, expression]
      properties:
        object_id: { type: integer, format: uint64 }
        expression: { $ref: "#/components/schemas/AbacFilterExpression" }
    AbacPredicateObjectsResponse:
      type: object
      required: [count, objects]
      properties:
        count: { type: integer, format: uint64 }
        objects:
          type: array
          items: { $ref: "#/components/schemas/AbacPredicateObjectResponse" }
    AbacGrantee:
      description: |
        Who a grant admits — an externally-tagged Rust enum. Exactly one
        of `Tenant` (every subject of that tenant) or `User` (one specific
        subject, possibly of a foreign tenant) is present.
      oneOf:
        - type: object
          required: [Tenant]
          properties:
            Tenant: { type: integer, format: uint64 }
        - type: object
          required: [User]
          properties:
            User: { $ref: "#/components/schemas/AbacGranteeUser" }
    AbacGranteeUser:
      type: object
      required: [tenant_stable_id, subject]
      description: The `User` variant payload of [AbacGrantee](#/components/schemas/AbacGrantee).
      properties:
        tenant_stable_id: { type: integer, format: uint64 }
        subject: { type: string }
    AbacGrantAction:
      type: string
      enum: [Read, Write, Ddl, Grant]
      description: |
        `Grant` is delegation authority (further re-grant); it is not
        consulted for data access, only by the admin surface.
    AbacGrantGranteeRequest:
      type: object
      required: [tenant]
      description: |
        Grantee as provisioned over the wire: a tenant-wide share when
        `subject` is omitted/empty, else one user of (possibly foreign)
        `tenant`. Clients supply tenant/subject strings; stable ids are
        resolved server-side.
      properties:
        tenant: { type: string }
        subject:
          type: [string, "null"]
    AbacPostGrantRequest:
      type: object
      required: [owner_tenant, resource, grantee, actions]
      description: Body for `POST /api/v2/abac/grants`.
      properties:
        owner_tenant:
          type: string
          description: The resource-owner tenant (string; resolved and must be minted).
        resource: { $ref: "#/components/schemas/AbacScope" }
        grantee: { $ref: "#/components/schemas/AbacGrantGranteeRequest" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AbacGrantAction" }
          uniqueItems: true
        predicate_ref:
          type: [integer, "null"]
          format: uint64
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
        expires_at_ms:
          type: [integer, "null"]
          format: int64
    AbacPostGrantResponse:
      type: object
      required: [grant_id, owner_tenant_stable_id]
      properties:
        grant_id: { type: string }
        owner_tenant_stable_id: { type: integer, format: uint64 }
    AbacGrantRecord:
      type: object
      required:
        - grant_id
        - owner_tenant_stable_id
        - resource
        - grantee
        - actions
        - created_at_ms
      properties:
        grant_id: { type: string }
        owner_tenant_stable_id: { type: integer, format: uint64 }
        resource: { $ref: "#/components/schemas/AbacScope" }
        grantee: { $ref: "#/components/schemas/AbacGrantee" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/AbacGrantAction" }
        predicate_ref:
          type: [integer, "null"]
          format: uint64
        field_mask:
          oneOf:
            - $ref: "#/components/schemas/AbacFieldMask"
            - type: "null"
        created_at_ms: { type: integer, format: int64 }
        expires_at_ms:
          type: [integer, "null"]
          format: int64
        revoked_at_ms:
          type: [integer, "null"]
          format: int64
          description: Set once revoked; the record stays listed (audit trail).
    AbacGrantEnforcement:
      type: string
      enum: ["Off", Audit, Enforce]
      description: |
        Rollout is intended `Off` -> `Audit` (would-be-denials logged, read
        still admitted) -> `Enforce` (no applicable grant denies).
    AbacPutTenantPostureRequest:
      type: object
      required: [grant_enforcement]
      properties:
        grant_enforcement: { $ref: "#/components/schemas/AbacGrantEnforcement" }
    AbacTenantSecurityPosture:
      type: object
      required: [tenant_stable_id, updated_at_ms]
      properties:
        tenant_stable_id: { type: integer, format: uint64 }
        grant_enforcement: { $ref: "#/components/schemas/AbacGrantEnforcement" }
        updated_at_ms: { type: integer, format: int64 }
