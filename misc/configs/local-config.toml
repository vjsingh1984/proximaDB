# ProximaDB Configuration for Local Development
# Modified from docker-config.toml to use local directories

[server]
host = "0.0.0.0"
port = 5678
data_dir = "./data"

[grpc]
host = "0.0.0.0"
port = 5679

[storage]
# Single metadata URL - using local directory
metadata_url = "file://./metadata"

# Storage locations using local directories
[[storage.storage_locations]]
url = "file://./data"
weight = 1
tags = ["local", "dev"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Memory and performance settings optimized for local dev
mmap_enabled = true
cache_size_mb = 256
bloom_filter_bits = 10

[storage.sst_config]
memtable_size_mb = 1024  # 1GB to reduce small file creation
memory_flush_size_bytes = 16777216  # 16MB to reduce small file creation
compression = "zstd"  # ZSTD for better compression ratio
compression_enabled = true  # Enable compression by default
compression_level = 3  # Balanced speed/compression (1-22)
compaction_threshold = 5  # Minimum 5 files before compaction
write_buffer_size_mb = 8192  # 8GB for global write buffer
block_size_kb = 4096  # 4MB blocks for optimal ZSTD compression

[storage.viper_config]
row_group_size = 50000  # Smaller for demo workloads
compression = "zstd"  # ZSTD for columnar data
compression_enabled = true  # Enable compression by default  
compression_level = 3  # Balanced speed/compression
enable_statistics = true
data_directory = "./viper_data"
cache_size_mb = 256

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

[logging]
level = "info"
file_path = "./log/proximadb.log"
max_files = 5
max_file_size_mb = 100

[metrics]
enabled = true
port = 9090
path = "/metrics"

[security]
enable_tls = false  # Disabled for local dev simplicity

[performance]
# Optimized for local development
worker_threads = 4
max_connections = 1000
request_timeout_seconds = 30
batch_size = 100

[features]
# Enable all features for development
quantization_enabled = true
hnsw_indexing_enabled = true
metadata_indexing_enabled = true
distributed_mode = false  # Single node for local dev