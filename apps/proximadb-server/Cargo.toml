[package]
name = "proximadb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/vjsingh1984/proximadb"
description = "ProximaDB server binary - cloud-native vector database"

[[bin]]
name = "proximadb-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
proximadb = { path = "../../", default-features = false }
proximadb-embedding = { path = "../../crates/modalities/proximadb-embedding" }
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
