syntax = "proto3";

package proximadb.v2;

import "google/protobuf/struct.proto";

// Native v2 agent memory service for LangGraph-style BaseStore workloads.
service AgentMemoryService {
  rpc PutMemory(PutMemoryRequest) returns (MemoryItem);
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);
}

// Native v2 checkpoint service for resumable agent execution.
service AgentCheckpointService {
  rpc PutCheckpoint(PutCheckpointRequest) returns (CheckpointResponse);
  rpc GetCheckpoint(GetCheckpointRequest) returns (CheckpointResponse);
}

// Native v2 append-only event service for audit, replay, and workflow sourcing.
service AgentEventService {
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);
  rpc ReplayEvents(ReplayEventsRequest) returns (ReplayEventsResponse);
}

message MemoryItem {
  repeated string namespace = 1;
  string key = 2;
  google.protobuf.Value value = 3;
  optional int64 created_at_ms = 4;
  optional int64 updated_at_ms = 5;
  optional float score = 6;
}

message PutMemoryRequest {
  string store = 1;
  repeated string namespace = 2;
  string key = 3;
  google.protobuf.Value value = 4;
  optional google.protobuf.Value index = 5;
}

message SearchMemoryRequest {
  string store = 1;
  repeated string namespace = 2;
  optional string query = 3;
  optional google.protobuf.Value filter = 4;
  optional uint32 limit = 5;
  optional uint32 offset = 6;
}

message SearchMemoryResponse {
  repeated MemoryItem items = 1;
}

message PutCheckpointRequest {
  string thread_id = 1;
  optional string checkpoint_ns = 2;
  optional string checkpoint_id = 3;
  optional string parent_checkpoint_id = 4;
  google.protobuf.Value checkpoint = 5;
  google.protobuf.Value metadata = 6;
  repeated google.protobuf.Value writes = 7;
}

message GetCheckpointRequest {
  string thread_id = 1;
  optional string checkpoint_ns = 2;
  optional string checkpoint_id = 3;
}

message CheckpointResponse {
  string thread_id = 1;
  string checkpoint_ns = 2;
  string checkpoint_id = 3;
  optional string parent_checkpoint_id = 4;
  google.protobuf.Value checkpoint = 5;
  google.protobuf.Value metadata = 6;
  repeated google.protobuf.Value writes = 7;
}

message EventRecord {
  string stream_id = 1;
  uint64 version = 2;
  string event_type = 3;
  google.protobuf.Value data = 4;
  google.protobuf.Value metadata = 5;
  string event_id = 6;
  optional uint64 global_position = 7;
  optional int64 created_at_ms = 8;
}

message AppendEventRequest {
  string stream_id = 1;
  string event_type = 2;
  google.protobuf.Value data = 3;
  optional google.protobuf.Value metadata = 4;
  optional uint64 expected_version = 5;
  optional string event_id = 6;
}

message AppendEventResponse {
  EventRecord event = 1;
}

message ReplayEventsRequest {
  string stream_id = 1;
  optional uint64 after_version = 2;
  optional uint64 after_position = 3;
  optional uint32 limit = 4;
}

message ReplayEventsResponse {
  repeated EventRecord events = 1;
}
