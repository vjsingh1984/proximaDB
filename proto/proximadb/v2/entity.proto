// ProximaDB v2 Entity service.
//
// Self-contained `proximadb.v2` surface for the entity modality, mirroring the
// document (`document.proto`) and graph (`graph.proto`) v2 services. The entity
// body is carried as the canonical v2 `TypedValue` (full ProximaValue coverage)
// — NOT the legacy v1 `SqlValue` — so decimals, timestamps, UUIDs, and vectors
// survive losslessly. The server maps these messages to the neutral internal
// model only at the handler boundary; the engine never sees a wire type.
// Tenant isolation is structural (the `x-tenant-id` header namespaces the
// collection), never a per-request predicate.
//
// To regenerate the committed stubs after editing this file:
//   PROXIMADB_REGEN_PROTO=1 cargo build -p proximadb-proto

syntax = "proto3";

package proximadb.v2;

import "proximadb/v2/record.proto"; // TypedValue — the canonical v2 value type

// Entity represents a semantic unit with embeddings, metadata, and relationships.
// `flexible_metadata` uses the v2 `TypedValue` map for full ProximaValue coverage.
message Entity {
  string id = 1;
  repeated EmbeddingVersion embeddings = 2;
  TypedMetadata typed_metadata = 3;
  map<string, TypedValue> flexible_metadata = 4;  // v2 TypedValue (was SqlValue in v1)
  Provenance provenance = 5;
  repeated Relation relations = 6;
  TemporalInfo temporal = 7;
  string collection_id = 8;
}

// Embedding version with vector, model info, and modality.
// Note: `vector` is repeated float (v1 parity); native Arrow FloatArray is a
// future follow-up for zero-copy columnar path.
message EmbeddingVersion {
  string model_id = 1;
  string model_version = 2;
  repeated float vector = 3;
  uint32 dimension = 4;
  int64 created_at_ms = 5;  // Unix epoch milliseconds
  map<string, string> model_params = 6;
  EntityModality modality = 7;
}

// Entity modality (prefixed to avoid conflict with ColumnDataType enum values).
enum EntityModality {
  ENTITY_MODALITY_UNSPECIFIED = 0;
  ENTITY_MODALITY_TEXT = 1;
  ENTITY_MODALITY_IMAGE = 2;
  ENTITY_MODALITY_AUDIO = 3;
  ENTITY_MODALITY_VIDEO = 4;
  ENTITY_MODALITY_MULTIMODAL = 5;
}

// Typed metadata with strongly-typed fields (v1 parity, unchanged in v2).
message TypedMetadata {
  map<string, TypedField> fields = 1;
}

message TypedField {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    StringArray string_array = 5;
    int64 timestamp_value_ms = 6;  // Unix epoch milliseconds
  }
  bool indexed = 7;
  bool filterable = 8;
}

message StringArray {
  repeated string values = 1;
}

// Provenance tracking for entity extraction.
message Provenance {
  string source_id = 1;
  string chunk_id = 2;
  uint32 chunk_position = 3;
  string extraction_method = 4;
  int64 extracted_at_ms = 5;  // Unix epoch milliseconds
  map<string, string> metadata = 6;
}

// Temporal information for versioned entities.
message TemporalInfo {
  int64 created_at_ms = 1;  // Unix epoch milliseconds
  int64 valid_from_ms = 2;  // Unix epoch milliseconds
  int64 valid_to_ms = 3;    // Unix epoch milliseconds
  bool is_current = 4;
  repeated TemporalVersion versions = 5;
}

message TemporalVersion {
  int64 timestamp_ms = 1;  // Unix epoch milliseconds
  string version_id = 2;
  map<string, string> changes = 3;
}

// Relation between entities with typed weight and properties.
message Relation {
  string source_entity_id = 1;
  string target_entity_id = 2;
  string relation_type = 3;
  float weight = 4;
  int64 created_at_ms = 5;  // Unix epoch milliseconds
  map<string, string> properties = 6;
}

// ============================================================================
// Service definitions
// ============================================================================

service ProximaEntityService {
  // Entity CRUD operations
  rpc UpsertEntity(UpsertEntityRequest) returns (UpsertEntityResponse);
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);

  // Entity search with similarity and metadata filters
  rpc SearchEntities(SearchEntitiesRequest) returns (SearchEntitiesResponse);
}

// Upsert (insert or update) an entity. If the entity ID is empty, the server
// generates a UUID. `create_collection_if_missing` auto-creates the collection
// when true (v1 parity).
message UpsertEntityRequest {
  string collection_id = 1;
  Entity entity = 2;
  bool create_collection_if_missing = 3;
}

message UpsertEntityResponse {
  bool success = 1;
  string entity_id = 2;
  string message = 3;
}

// Get an entity by ID. Optional flags control inclusion of embeddings and
// relations (default: both included).
message GetEntityRequest {
  string collection_id = 1;
  string entity_id = 2;
  bool include_embeddings = 3;
  bool include_relations = 4;
}

message GetEntityResponse {
  Entity entity = 1;
}

// Delete an entity by ID. `hard_delete` removes from storage; soft delete marks
// as deleted (v1 parity semantics).
message DeleteEntityRequest {
  string collection_id = 1;
  string entity_id = 2;
  bool hard_delete = 3;
}

message DeleteEntityResponse {
  bool success = 1;
  string message = 2;
}

// Search entities by similarity (text or vector), with metadata filters,
// temporal clauses, and optional progressive result streaming (v1 parity).
message SearchEntitiesRequest {
  string collection_id = 1;
  SimilarQuery similar = 2;
  MetadataFilter filters = 3;
  TemporalClause temporal = 4;
  uint32 top_k = 5;
  bool progressive = 6;
}

message SearchEntitiesResponse {
  repeated EntityResult results = 1;
  uint32 total = 2;
  PageInfo page_info = 3;
  ProgressInfo progress = 4;
}

message EntityResult {
  Entity entity = 1;
  float score = 2;
  map<string, string> debug_info = 3;
}

// Vector data for similarity search (repeated float, v1 parity).
message VectorData {
  repeated float values = 1;
}

// Similarity query: text (embedding generated server-side) or raw vector.
message SimilarQuery {
  oneof query {
    string text = 1;
    VectorData vector = 2;
    bytes raw_data = 3;
  }
  string model_id = 4;
  EntityModality modality = 5;
}

// Metadata filter with clauses and logical operators (v1 parity).
message MetadataFilter {
  repeated FilterClause clauses = 1;
  EntityLogicalOp op = 2;
}

message FilterClause {
  string field = 1;
  EntityComparisonOp op = 2;
  oneof value {
    string string_value = 3;
    int64 int_value = 4;
    double double_value = 5;
    bool bool_value = 6;
  }
}

// Entity comparison operator (prefixed to avoid conflict with TypedFilterOperator).
enum EntityComparisonOp {
  ENTITY_COMPARISON_UNSPECIFIED = 0;
  ENTITY_COMPARISON_EQ = 1;
  ENTITY_COMPARISON_NE = 2;
  ENTITY_COMPARISON_GT = 3;
  ENTITY_COMPARISON_GTE = 4;
  ENTITY_COMPARISON_LT = 5;
  ENTITY_COMPARISON_LTE = 6;
  ENTITY_COMPARISON_IN = 7;
  ENTITY_COMPARISON_NOT_IN = 8;
  ENTITY_COMPARISON_CONTAINS = 9;
}

// Entity logical operator (prefixed to avoid conflict with FilterLogicOperator).
enum EntityLogicalOp {
  ENTITY_LOGICAL_UNSPECIFIED = 0;
  ENTITY_LOGICAL_AND = 1;
  ENTITY_LOGICAL_OR = 2;
  ENTITY_LOGICAL_NOT = 3;
}

// Temporal clause for time-bounded search (v1 parity).
message TemporalClause {
  oneof clause {
    int64 at_time_ms = 1;  // Unix epoch milliseconds
    TimeRange valid_between = 2;
  }
}

message TimeRange {
  int64 start_ms = 1;  // Unix epoch milliseconds
  int64 end_ms = 2;    // Unix epoch milliseconds
}

// Pagination info for progressive search (v1 parity).
message PageInfo {
  string cursor = 1;
  bool has_more = 2;
}

// Progress info for progressive search (v1 parity).
message ProgressInfo {
  uint32 stage = 1;
  uint32 total_stages = 2;
  bool complete = 3;
}
