syntax = "proto3";

package proximadb.v2;

// ProximaDB v2 native graph surface.
//
// This service is the canonical, v2-native graph API. It is intentionally
// self-contained: every message below is defined in this file (no `import`
// of v1 graph/entity types), so the v2 wire contract is stable and decoupled
// from the deprecated `proximadb.v1.GraphService`.
//
// Messages are prefixed `Graph*` because this file shares the `proximadb.v2`
// package (and therefore the generated Rust module) with `record.proto`; the
// prefix keeps type names unique across the merged package.
//
// Server handlers map these v2 messages onto the internal graph domain types
// at the handler boundary only (see `src/network/grpc/v2/graph_service.rs`);
// the backing `GraphOperationsService` is shared verbatim with the v1 adapter.
// Tenant isolation is structural: handlers derive the effective backing graph
// namespace from the request tenant (`x-tenant-id` / auth context), never as a
// per-query predicate.

// ============================================================================
// Core data model
// ============================================================================

// A vertex in the graph.
message GraphNode {
  // Unique identifier (UUID/ULID). Client-assigned or server-generated.
  string id = 1;
  // Labels/types for this node (e.g. ["Person", "Employee"]).
  repeated string labels = 2;
  // Arbitrary key/value properties.
  map<string, GraphPropertyValue> properties = 3;
  // Optional embedding vector for semantic-search integration.
  optional GraphEmbedding embedding = 4;
  // Unix epoch milliseconds. Server-populated on read.
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
}

// A directed relationship between two nodes.
message GraphEdge {
  string id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  // Relationship type (e.g. "KNOWS", "WORKS_FOR").
  string edge_type = 4;
  map<string, GraphPropertyValue> properties = 5;
  // Optional weight for weighted-graph algorithms (shortest path, etc.).
  optional double weight = 6;
  int64 created_at_ms = 7;
  int64 updated_at_ms = 8;
}

// Optional semantic embedding attached to a node.
message GraphEmbedding {
  repeated float vector = 1;
  uint32 dimension = 2;
  string model_id = 3;
  string model_version = 4;
}

// A polymorphic property value. The oneof keeps memory compact; nested arrays
// and maps allow document-shaped properties.
message GraphPropertyValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    GraphPropertyArray array_value = 6;
    GraphPropertyMap map_value = 7;
  }
}

message GraphPropertyArray {
  repeated GraphPropertyValue values = 1;
}

message GraphPropertyMap {
  map<string, GraphPropertyValue> fields = 1;
}

// A single property predicate for node/edge queries.
message GraphPropertyFilter {
  string key = 1;
  GraphPropertyFilterOperator operator = 2;
  GraphPropertyValue value = 3;
}

// Comparison operators. Ordinals are intentionally aligned with the internal
// graph filter operators so handler-boundary mapping is a direct cast.
enum GraphPropertyFilterOperator {
  GRAPH_PROPERTY_FILTER_OPERATOR_UNSPECIFIED = 0;
  GRAPH_PROPERTY_FILTER_OPERATOR_EQUALS = 1;
  GRAPH_PROPERTY_FILTER_OPERATOR_NOT_EQUALS = 2;
  GRAPH_PROPERTY_FILTER_OPERATOR_GREATER_THAN = 3;
  GRAPH_PROPERTY_FILTER_OPERATOR_LESS_THAN = 4;
  GRAPH_PROPERTY_FILTER_OPERATOR_GREATER_EQUAL = 5;
  GRAPH_PROPERTY_FILTER_OPERATOR_LESS_EQUAL = 6;
  GRAPH_PROPERTY_FILTER_OPERATOR_CONTAINS = 7;
  GRAPH_PROPERTY_FILTER_OPERATOR_STARTS_WITH = 8;
  GRAPH_PROPERTY_FILTER_OPERATOR_ENDS_WITH = 9;
}

// Traversal algorithms. Ordinals aligned with the internal traversal enum.
enum GraphTraversalAlgorithm {
  GRAPH_TRAVERSAL_ALGORITHM_UNSPECIFIED = 0;
  GRAPH_TRAVERSAL_ALGORITHM_BFS = 1;
  GRAPH_TRAVERSAL_ALGORITHM_DFS = 2;
  GRAPH_TRAVERSAL_ALGORITHM_PARALLEL_BFS = 3;
}

// Shortest-path algorithms. Ordinals aligned with the internal enum.
enum GraphShortestPathAlgorithm {
  GRAPH_SHORTEST_PATH_ALGORITHM_UNSPECIFIED = 0;
  GRAPH_SHORTEST_PATH_ALGORITHM_DIJKSTRA = 1;
  GRAPH_SHORTEST_PATH_ALGORITHM_ASTAR = 2;
}

// ============================================================================
// Node CRUD
// ============================================================================

message CreateGraphNodeRequest {
  // Logical graph name within the tenant (e.g. "default").
  string graph_id = 1;
  GraphNode node = 2;
}

message UpdateGraphNodeRequest {
  string graph_id = 1;
  GraphNode node = 2;
}

message GetGraphNodeRequest {
  string graph_id = 1;
  string node_id = 2;
}

message DeleteGraphNodeRequest {
  string graph_id = 1;
  string node_id = 2;
}

// Shared response for Create/Get/Update. `node` is absent when a Get misses.
message GraphNodeResponse {
  optional GraphNode node = 1;
}

message DeleteGraphNodeResponse {
  bool deleted = 1;
  // The node as it existed prior to deletion, when found.
  optional GraphNode node = 2;
}

// ============================================================================
// Edge CRUD
// ============================================================================

message CreateGraphEdgeRequest {
  string graph_id = 1;
  GraphEdge edge = 2;
}

message UpdateGraphEdgeRequest {
  string graph_id = 1;
  GraphEdge edge = 2;
}

message GetGraphEdgeRequest {
  string graph_id = 1;
  string edge_id = 2;
}

message DeleteGraphEdgeRequest {
  string graph_id = 1;
  string edge_id = 2;
}

message GraphEdgeResponse {
  optional GraphEdge edge = 1;
}

message DeleteGraphEdgeResponse {
  bool deleted = 1;
  optional GraphEdge edge = 2;
}

// ============================================================================
// Queries
// ============================================================================

message QueryGraphNodesRequest {
  string graph_id = 1;
  // Match nodes carrying ALL of these labels (empty = any).
  repeated string labels = 2;
  repeated GraphPropertyFilter filters = 3;
  optional uint32 limit = 4;
  optional uint32 offset = 5;
  // Opaque pagination cursor returned as `next_token`.
  optional string continuation_token = 6;
}

message QueryGraphNodesResponse {
  repeated GraphNode nodes = 1;
  // Present when more results are available.
  optional string next_token = 2;
}

message QueryGraphEdgesRequest {
  string graph_id = 1;
  optional string from_node_id = 2;
  optional string to_node_id = 3;
  repeated string edge_types = 4;
  repeated GraphPropertyFilter filters = 5;
  optional uint32 limit = 6;
  optional uint32 offset = 7;
  optional string continuation_token = 8;
}

message QueryGraphEdgesResponse {
  repeated GraphEdge edges = 1;
  optional string next_token = 2;
}

// ============================================================================
// Graph operations
// ============================================================================

message GetGraphNeighborsRequest {
  string graph_id = 1;
  string node_id = 2;
  // Restrict to a single edge type when set.
  optional string edge_type = 3;
}

message GetGraphNeighborsResponse {
  repeated GraphNode nodes = 1;
}

message TraverseGraphRequest {
  string graph_id = 1;
  string start_node_id = 2;
  uint32 max_depth = 3;
  // Edge types to follow (empty = all).
  repeated string edge_types = 4;
  // Node label filter (empty = all).
  repeated string node_labels = 5;
  repeated GraphPropertyFilter filters = 6;
  GraphTraversalAlgorithm algorithm = 7;
  optional uint32 limit = 8;
  optional uint32 timeout_ms = 9;
  // Optional cap on frontier size to bound memory.
  optional uint32 max_frontier = 10;
}

message TraverseGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  repeated GraphPath paths = 3;
  GraphTraversalStats stats = 4;
}

// A path as an ordered sequence of node IDs.
message GraphPath {
  repeated string node_ids = 1;
}

message GraphTraversalStats {
  uint32 nodes_visited = 1;
  uint32 edges_traversed = 2;
  uint32 max_depth_reached = 3;
  uint64 execution_time_microseconds = 4;
}

message GraphShortestPathRequest {
  string graph_id = 1;
  string start_node_id = 2;
  string target_node_id = 3;
  optional uint32 max_depth = 4;
  repeated string edge_types = 5;
  // Defaults to DIJKSTRA when unset.
  optional GraphShortestPathAlgorithm algorithm = 6;
  // When > 1, k-shortest paths (Yen's algorithm) are computed.
  optional uint32 k = 7;
  // Per-call prefetch overrides (v2-native; v1 carried these as gRPC metadata).
  optional bool enable_prefetch = 8;
  optional uint32 prefetch_budget = 9;
}

message GraphShortestPathResponse {
  // Path node IDs from start to target. Empty when no path exists.
  repeated string node_ids = 1;
  optional double total_weight = 2;
  // True when a path was found.
  bool found = 3;
}

message GetGraphStatsRequest {
  string graph_id = 1;
}

message GraphStats {
  uint64 total_nodes = 1;
  uint64 total_edges = 2;
  repeated GraphLabelStats label_stats = 3;
  repeated GraphEdgeTypeStats edge_type_stats = 4;
  uint64 total_properties = 5;
  uint64 memory_usage_bytes = 6;
  double average_degree = 7;
  uint32 max_degree = 8;
  uint32 connected_components = 9;
}

message GraphLabelStats {
  string label = 1;
  uint64 count = 2;
}

message GraphEdgeTypeStats {
  string edge_type = 1;
  uint64 count = 2;
}

// ============================================================================
// Streaming traversal (TD-124)
// ============================================================================

// One chunk of a server-streamed traversal. The backing engine materialises
// the traversal eagerly and emits a single terminal chunk (`done = true`)
// today; the chunked wire shape leaves room for incremental frontiers without
// a contract break.
message GraphTraversalChunk {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  repeated GraphPath paths = 3;
  // Present on the final chunk.
  optional GraphTraversalStats stats = 4;
  // True on the final chunk.
  bool done = 5;
}

// ============================================================================
// Analytics (TD-124)
// ============================================================================

message GraphConnectedComponentsRequest {
  string graph_id = 1;
}

message GraphConnectedComponentsResponse {
  repeated GraphComponent components = 1;
}

// A weakly-connected component as a set of node IDs.
message GraphComponent {
  repeated string node_ids = 1;
}

message GraphHasCycleRequest {
  string graph_id = 1;
}

message GraphHasCycleResponse {
  bool has_cycle = 1;
}

// ============================================================================
// Unique-constraint DDL (TD-124)
// ============================================================================

message GraphUniqueConstraintRequest {
  string graph_id = 1;
  // Node label the constraint applies to.
  string label = 2;
  // Property key required to be unique within `label`.
  string property = 3;
}

message GraphUniqueConstraintResponse {
  bool success = 1;
  optional string error_message = 2;
}

// ============================================================================
// Batch create (TD-124)
// ============================================================================

message BatchCreateGraphNodesRequest {
  string graph_id = 1;
  repeated GraphNode nodes = 2;
}

message BatchCreateGraphEdgesRequest {
  string graph_id = 1;
  repeated GraphEdge edges = 2;
}

message BatchCreateGraphNodesResponse {
  bool success = 1;
  repeated GraphNode nodes = 2;
  uint32 created_count = 3;
  optional string error_message = 4;
}

message BatchCreateGraphEdgesResponse {
  bool success = 1;
  repeated GraphEdge edges = 2;
  uint32 created_count = 3;
  optional string error_message = 4;
}

// ============================================================================
// Declarative query (Cypher) — TD-124
// ============================================================================

// Supported declarative query languages. Today only the openCypher subset is
// backed (single-node patterns and linear traversal chains with equality
// property constraints); GREMLIN is reserved.
enum GraphQueryLanguage {
  GRAPH_QUERY_LANGUAGE_UNSPECIFIED = 0;
  // Existing property-based API surface (QueryNodes/QueryEdges).
  GRAPH_QUERY_LANGUAGE_NATIVE = 1;
  // openCypher-compatible declarative query (supported subset).
  GRAPH_QUERY_LANGUAGE_CYPHER = 2;
  // Reserved; not yet backed.
  GRAPH_QUERY_LANGUAGE_GREMLIN = 3;
}

message ExecuteGraphQueryRequest {
  string graph_id = 1;
  GraphQueryLanguage language = 2;
  // Query text, e.g. "MATCH (n:Person) WHERE n.age = 30 RETURN n".
  string query = 3;
  // Optional per-call timeout.
  optional uint32 timeout_ms = 4;
}

// A single result row: column name -> scalar value. The backing graph subset
// engine returns node-shaped rows serialised as string columns; richer value
// types stay reserved on the v2 contract for a future engine expansion.
message ExecuteGraphQueryRow {
  map<string, GraphPropertyValue> columns = 1;
}

message ExecuteGraphQueryResponse {
  repeated ExecuteGraphQueryRow rows = 1;
  optional string error_message = 2;
}

// ============================================================================
// Service
// ============================================================================

// Canonical v2 graph service. Replaces the deprecated
// `proximadb.v1.GraphService` for SDK and external clients.
//
// TD-124 added the analytic/batch/constraint/streaming RPCs and the declarative
// `ExecuteQuery` (Cypher subset) below. Still deferred (only reachable on v1
// behind `enable_grpc_v1_compat`), because they are not backed by a v2-native
// surface: `ExecuteHybridQuery` (depends on the full vector+graph
// `UnifiedHandlers` and the large v1 vector message graph, which has no clean
// v2-native equivalent), and the retired/unimplemented `CreateGraphWithEngine`,
// `GetPulsarStats`, and the PULSAR/QUASAR shard RPCs.
service ProximaGraphService {
  // Node operations
  rpc CreateNode(CreateGraphNodeRequest) returns (GraphNodeResponse);
  rpc GetNode(GetGraphNodeRequest) returns (GraphNodeResponse);
  rpc UpdateNode(UpdateGraphNodeRequest) returns (GraphNodeResponse);
  rpc DeleteNode(DeleteGraphNodeRequest) returns (DeleteGraphNodeResponse);

  // Edge operations
  rpc CreateEdge(CreateGraphEdgeRequest) returns (GraphEdgeResponse);
  rpc GetEdge(GetGraphEdgeRequest) returns (GraphEdgeResponse);
  rpc UpdateEdge(UpdateGraphEdgeRequest) returns (GraphEdgeResponse);
  rpc DeleteEdge(DeleteGraphEdgeRequest) returns (DeleteGraphEdgeResponse);

  // Query operations
  rpc QueryNodes(QueryGraphNodesRequest) returns (QueryGraphNodesResponse);
  rpc QueryEdges(QueryGraphEdgesRequest) returns (QueryGraphEdgesResponse);

  // Graph operations
  rpc GetNeighbors(GetGraphNeighborsRequest) returns (GetGraphNeighborsResponse);
  rpc TraverseGraph(TraverseGraphRequest) returns (TraverseGraphResponse);
  rpc ShortestPath(GraphShortestPathRequest) returns (GraphShortestPathResponse);
  rpc GetGraphStats(GetGraphStatsRequest) returns (GraphStats);

  // Streaming traversal (TD-124)
  rpc StreamTraverse(TraverseGraphRequest) returns (stream GraphTraversalChunk);

  // Analytics (TD-124)
  rpc GetConnectedComponents(GraphConnectedComponentsRequest)
      returns (GraphConnectedComponentsResponse);
  rpc HasCycle(GraphHasCycleRequest) returns (GraphHasCycleResponse);

  // Unique-constraint DDL (TD-124)
  rpc AddUniqueConstraint(GraphUniqueConstraintRequest)
      returns (GraphUniqueConstraintResponse);
  rpc RemoveUniqueConstraint(GraphUniqueConstraintRequest)
      returns (GraphUniqueConstraintResponse);

  // Batch create (TD-124)
  rpc BatchCreateNodes(BatchCreateGraphNodesRequest)
      returns (BatchCreateGraphNodesResponse);
  rpc BatchCreateEdges(BatchCreateGraphEdgesRequest)
      returns (BatchCreateGraphEdgesResponse);

  // Declarative query — Cypher subset (TD-124)
  rpc ExecuteQuery(ExecuteGraphQueryRequest) returns (ExecuteGraphQueryResponse);
}
