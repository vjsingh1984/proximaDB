// ProximaDB v2 native embedding-model registry service.
//
// This is a transport facade over the tenant-scoped xCatalog lifecycle service.
// Tenant identity is resolved from authenticated gRPC metadata and is therefore
// deliberately absent from every request message.

syntax = "proto3";

package proximadb.v2;

option java_package = "com.proximadb.v2.modelregistry";
option go_package = "proximadb/v2;proximadbpb";

message ModelArtifactDescriptor {
  string uri = 1;
  string digest = 2;
  uint64 size_bytes = 3;
  string media_type = 4;
}

message EmbeddingInputContract {
  string model_revision = 1;
  string tokenizer_id = 2;
  string tokenizer_revision = 3;
  string tokenizer_fingerprint = 4;
  uint32 declared_context_limit = 5;
  uint32 effective_context_limit = 6;
  uint32 special_token_count = 7;
  string document_template = 8;
  string query_template = 9;
  map<string, string> document_parameters = 10;
  map<string, string> query_parameters = 11;
}

enum ModelAccess {
  MODEL_ACCESS_UNSPECIFIED = 0;
  MODEL_ACCESS_OPEN = 1;
  MODEL_ACCESS_GATED = 2;
  MODEL_ACCESS_UNREVIEWED = 3;
}

message ModelGovernance {
  string license_id = 1;
  ModelAccess access = 2;
  bool requires_remote_code = 3;
  repeated string approved_runtimes = 4;
}

enum LineageInputKind {
  LINEAGE_INPUT_KIND_UNSPECIFIED = 0;
  LINEAGE_INPUT_KIND_DATASET = 1;
  LINEAGE_INPUT_KIND_FEATURE_SET = 2;
  LINEAGE_INPUT_KIND_MODEL = 3;
  LINEAGE_INPUT_KIND_ARTIFACT = 4;
}

message ModelLineageInput {
  LineageInputKind kind = 1;
  string name = 2;
  string digest = 3;
}

message ModelLineage {
  optional string producer_execution_id = 1;
  optional string code_revision = 2;
  repeated ModelLineageInput inputs = 3;
}

enum DimensionPolicyKind {
  DIMENSION_POLICY_KIND_UNSPECIFIED = 0;
  DIMENSION_POLICY_KIND_FIXED = 1;
  DIMENSION_POLICY_KIND_DISCRETE = 2;
  DIMENSION_POLICY_KIND_RANGE = 3;
}

message EmbeddingOutputContract {
  uint32 native_dimension = 1;
  DimensionPolicyKind dimension_policy = 2;
  // Required only when dimension_policy is RANGE.
  optional uint32 range_minimum = 3;
  repeated uint32 supported_dimensions = 4;
  bool normalized = 5;
  string pooling = 6;
}

message EmbeddingModelVersion {
  uint64 version = 1;
  string provider_model_id = 2;
  ModelArtifactDescriptor artifact = 3;
  EmbeddingInputContract input = 4;
  EmbeddingOutputContract output = 5;
  ModelGovernance governance = 6;
  ModelLineage lineage = 7;
  int64 created_at_ms = 8;
  optional string source_run_id = 9;
}

message EvaluationEvidence {
  string evidence_id = 1;
  uint64 version = 2;
  string dataset_name = 3;
  string dataset_digest = 4;
  string evaluator = 5;
  map<string, double> metrics = 6;
  int64 created_at_ms = 7;
}

enum ModelDecisionKind {
  MODEL_DECISION_KIND_UNSPECIFIED = 0;
  MODEL_DECISION_KIND_APPROVED = 1;
  MODEL_DECISION_KIND_REJECTED = 2;
  MODEL_DECISION_KIND_DEPRECATED = 3;
}

message ModelDecision {
  string decision_id = 1;
  uint64 version = 2;
  ModelDecisionKind decision = 3;
  repeated string evidence_ids = 4;
  string principal = 5;
  int64 created_at_ms = 6;
}

message DeploymentBinding {
  string name = 1;
  uint64 version = 2;
  string artifact_digest = 3;
  string runtime = 4;
  string endpoint = 5;
  int64 updated_at_ms = 6;
}

message AliasEntry {
  string alias = 1;
  uint64 version = 2;
}

message ModelRegistry {
  uint32 schema_version = 1;
  uint64 revision = 2;
  string name = 3;
  repeated EmbeddingModelVersion versions = 4;
  repeated AliasEntry aliases = 5;
  repeated EvaluationEvidence evidence = 6;
  repeated ModelDecision decisions = 7;
  repeated DeploymentBinding deployments = 8;
  map<string, string> tags = 9;
}

message ModelRegistryRecord {
  string tenant_id = 1;
  uint64 asset_id = 2;
  ModelRegistry registry = 3;
}

message CreateModelRegistryRequest { string name = 1; }
message CreateModelRegistryResponse { ModelRegistryRecord record = 1; }

message GetModelRegistryRequest { string name = 1; }
message GetModelRegistryResponse { ModelRegistryRecord record = 1; }

message ListModelRegistriesRequest {}
message ListModelRegistriesResponse { repeated ModelRegistryRecord registries = 1; }

message SetModelAliasCommand {
  string alias = 1;
  uint64 version = 2;
}

message ApplyModelRegistryMutationRequest {
  string name = 1;
  uint64 expected_revision = 2;
  oneof mutation {
    EmbeddingModelVersion register_version = 3;
    SetModelAliasCommand set_alias = 4;
    EvaluationEvidence append_evidence = 5;
    ModelDecision record_decision = 6;
    DeploymentBinding upsert_deployment = 7;
  }
}

message ApplyModelRegistryMutationResponse { ModelRegistryRecord record = 1; }

message ResolveModelAliasRequest {
  string name = 1;
  string alias = 2;
  uint32 dimension = 3;
  optional string runtime = 4;
  bool require_approved = 5;
}

message ResolvedEmbeddingModel {
  uint64 asset_id = 1;
  string registry_name = 2;
  uint64 registry_revision = 3;
  string contract_sha256 = 4;
  EmbeddingModelVersion model = 5;
}

message ResolvedModelBinding {
  string model = 1;
  uint32 dimension = 2;
  uint64 model_asset_id = 3;
  uint64 model_version = 4;
  string contract_sha256 = 5;
  ResolvedEmbeddingModel snapshot = 6;
}

message ResolveModelAliasResponse { ResolvedModelBinding resolved = 1; }

service ProximaModelRegistryService {
  rpc CreateModelRegistry(CreateModelRegistryRequest) returns (CreateModelRegistryResponse);
  rpc GetModelRegistry(GetModelRegistryRequest) returns (GetModelRegistryResponse);
  rpc ListModelRegistries(ListModelRegistriesRequest) returns (ListModelRegistriesResponse);
  rpc ApplyModelRegistryMutation(ApplyModelRegistryMutationRequest) returns (ApplyModelRegistryMutationResponse);
  rpc ResolveModelAlias(ResolveModelAliasRequest) returns (ResolveModelAliasResponse);
}
