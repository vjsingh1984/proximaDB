syntax = "proto3";

package proximadb.explain.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vjsingh1984/proximadb/proto/proximadb/explain/v1;explain";

// ExplainPlan provides a unified explain format across all APIs
message ExplainPlan {
  // Query plan identifier
  string plan_id = 1;

  // Query type (SQL, UQL, Vector, Graph, Document, Hybrid)
  QueryType query_type = 2;

  // Original query string
  string query = 3;

  // Optimized query string (after rewriting)
  string optimized_query = 4;

  // Plan nodes in execution order
  repeated PlanNode plan_nodes = 5;

  // Performance statistics (after execution)
  ExecutionStats execution_stats = 6;

  // Warnings and suggestions
  repeated ExplainWarning warnings = 7;

  // Plan metadata
  PlanMetadata metadata = 8;
}

// QueryType enumerates supported query types
enum QueryType {
  QUERY_TYPE_UNKNOWN = 0;
  QUERY_TYPE_SQL = 1;
  QUERY_TYPE_UQL = 2;
  QUERY_TYPE_VECTOR_SEARCH = 3;
  QUERY_TYPE_GRAPH_QUERY = 4;
  QUERY_TYPE_DOCUMENT_QUERY = 5;
  QUERY_TYPE_HYBRID = 6;
  QUERY_TYPE_AGGREGATION = 7;
}

// PlanNode represents a single operation in the query plan
message PlanNode {
  // Unique node identifier
  string node_id = 1;

  // Node type
  NodeType node_type = 2;

  // Node display name
  string display_name = 3;

  // Node description
  string description = 4;

  // Parent node IDs (dependencies)
  repeated string parent_ids = 5;

  // Child node IDs (dependents)
  repeated string child_ids = 6;

  // Estimated cost (optimizer's cost estimate)
  double estimated_cost = 7;

  // Estimated rows
  int64 estimated_rows = 8;

  // Actual rows (after execution)
  int64 actual_rows = 9;

  // Node-specific details
  NodeDetails node_details = 10;

  // Performance metrics for this node
  NodeStats node_stats = 11;

  // Hints and suggestions
  repeated string hints = 12;
}

// NodeType enumerates plan node types
enum NodeType {
  NODE_TYPE_UNKNOWN = 0;

  // Data source nodes
  NODE_TYPE_SCAN = 1;
  NODE_TYPE_INDEX_SCAN = 2;
  NODE_TYPE_VECTOR_INDEX_SCAN = 3;
  NODE_TYPE_GRAPH_SCAN = 4;
  NODE_TYPE_DOCUMENT_SCAN = 5;

  // Processing nodes
  NODE_TYPE_FILTER = 10;
  NODE_TYPE_PROJECT = 11;
  NODE_TYPE_AGGREGATE = 12;
  NODE_TYPE_SORT = 13;
  NODE_TYPE_LIMIT = 14;
  NODE_TYPE_JOIN = 15;
  NODE_TYPE_UNION = 16;
  NODE_TYPE_DISTINCT = 17;

  // Vector operations
  NODE_TYPE_VECTOR_SEARCH = 20;
  NODE_TYPE_DISTANCE_COMPUTE = 21;
  NODE_TYPE_QUANTIZATION = 22;

  // Graph operations
  NODE_TYPE_GRAPH_TRAVERSAL = 30;
  NODE_TYPE_PATTERN_MATCH = 31;
  NODE_TYPE_PATH_FINDING = 32;

  // Distributed operations
  NODE_TYPE_DISTRIBUTED_SCAN = 40;
  NODE_TYPE_DISTRIBUTED_AGGREGATE = 41;
  NODE_TYPE_SHUFFLE = 42;
  NODE_TYPE_EXCHANGE = 43;

  // Multi-model operations
  NODE_TYPE_HYBRID_SEARCH = 50;
  NODE_TYPE_FILTER_CONTRACT = 51;
  NODE_TYPE_CANDIDATE_SET = 52;
  // Multi-phase rank pipeline (RERANK SRF surface, R-7c.4c.1)
  NODE_TYPE_RERANK = 53;

  // Utility nodes
  NODE_TYPE_MOCK = 99;
}

// NodeDetails contains node-specific information
message NodeDetails {
  oneof details {
    ScanDetails scan = 1;
    IndexScanDetails index_scan = 2;
    VectorIndexScanDetails vector_index_scan = 3;
    FilterDetails filter = 4;
    ProjectDetails project = 5;
    AggregateDetails aggregate = 6;
    JoinDetails join = 7;
    SortDetails sort = 8;
    GraphScanDetails graph_scan = 9;
    HybridSearchDetails hybrid_search = 10;
    RerankDetails rerank = 11;
  }

  // Additional metadata (for extensibility)
  google.protobuf.Struct additional_metadata = 100;
}

// ScanDetails describes a table/collection scan
message ScanDetails {
  string collection_name = 1;
  string collection_id = 2;
  repeated string columns = 3;
  string filter_pushed_down = 4;
  int64 estimated_bytes = 5;
  bool is_parallel = 6;
}

// IndexScanDetails describes an index scan operation
message IndexScanDetails {
  string index_name = 1;
  string index_id = 2;
  string index_type = 3;
  repeated string index_columns = 4;
  string index_condition = 5;
  bool is_covering = 6;
  int64 estimated_entries = 7;
}

// VectorIndexScanDetails describes a vector index scan
message VectorIndexScanDetails {
  string index_name = 1;
  string index_type = 2;  // HNSW, IVF, DiskANN, etc.
  int32 vector_dimension = 3;
  string distance_metric = 4;  // L2, Cosine, InnerProduct
  int32 top_k = 5;
  int32 ef = 6;  // For HNSW
  int32 nprobe = 7;  // For IVF

  // Filter information
  bool has_filter = 8;
  string filter_condition = 9;
  string filter_strategy = 10;  // Graph-first, Vector-first, Parallel

  // Performance hints
  double selectivity_estimate = 11;
  bool early_pruning_enabled = 12;
}

// FilterDetails describes a filter operation
message FilterDetails {
  string filter_condition = 1;
  repeated string filter_columns = 2;
  string filter_type = 3;  // Range, Equality, IN, LIKE, etc.
  double selectivity_estimate = 4;
  bool is_sargable = 5;  // Can use index
  string index_used = 6;  // If index scan
}

// ProjectDetails describes a projection operation
message ProjectDetails {
  repeated string projected_columns = 1;
  repeated string derived_columns = 2;
  repeated string project_expressions = 3;
}

// AggregateDetails describes an aggregation operation
message AggregateDetails {
  repeated string group_by_columns = 1;
  repeated AggregateFunction aggregate_functions = 2;
  string aggregate_strategy = 3;  // HashAggregate, SortAggregate, StreamingAggregate
}

// AggregateFunction describes a single aggregate function
message AggregateFunction {
  string function_name = 1;
  string column_name = 2;
  string alias = 3;
  bool is_distinct = 4;
}

// JoinDetails describes a join operation
message JoinDetails {
  string join_type = 1;  // Inner, Left, Right, Full, Cross, Semi, Anti
  string join_condition = 2;
  repeated string join_columns = 3;
  string join_algorithm = 4;  // HashJoin, MergeJoin, NestedLoop
  string build_side = 5;  // Left, Right
  int64 estimated_build_rows = 6;
  int64 estimated_probe_rows = 7;
}

// SortDetails describes a sort operation
message SortDetails {
  repeated SortKey sort_keys = 1;
  string sort_algorithm = 2;  // QuickSort, MergeSort, TopN
  bool is_order_preserving = 3;
  int64 sort_memory_bytes = 4;
}

// SortKey describes a single sort key
message SortKey {
  string column_name = 1;
  bool is_ascending = 2;
  bool nulls_first = 3;
}

// GraphScanDetails describes a graph scan operation
message GraphScanDetails {
  string graph_name = 1;
  string graph_id = 2;
  string start_node = 3;
  repeated string edge_types = 4;
  repeated string node_labels = 5;
  string traversal_direction = 6;  // Outgoing, Incoming, Both
  int32 max_depth = 7;
}

// HybridSearchDetails describes a hybrid vector+filter search
message HybridSearchDetails {
  string vector_index_name = 1;
  string filter_condition = 2;
  string execution_strategy = 3;  // FilterFirst, VectorFirst, Parallel, Auto

  // Performance metrics
  double filter_selectivity = 4;
  int32 total_candidates = 5;
  int32 filtered_candidates = 6;

  // Strategy breakdown
  StrategyMetrics vector_metrics = 7;
  StrategyMetrics filter_metrics = 8;
}

// StrategyMetrics describes performance of a single strategy
message StrategyMetrics {
  double latency_ms = 1;
  int32 candidates_found = 2;
  double recall = 3;
}

// RerankDetails describes a multi-phase rank-pipeline (RERANK SRF)
// plan node (R-7c.4c.1). Mirrors the SQL RERANK(collection,
// query_text, query_vector, k, rank_profile) surface — `rank_profile`
// is absent on the retrieval-only path.
message RerankDetails {
  string collection = 1;
  string query_text = 2;
  int32 k = 3;
  // Absent / empty when no profile is attached (retrieval-only path,
  // same shape the SQL parser emits as `Option<String>::None`).
  string rank_profile = 4;
  // Optional: which path the executor took at run time. One of
  // "first", "first_only", "second". Empty when EXPLAIN runs
  // without ANALYZE.
  string executed_phase = 5;
}

// NodeStats describes execution statistics for a single node
message NodeStats {
  // Execution time
  double wall_time_ms = 1;
  double cpu_time_ms = 2;
  double wait_time_ms = 3;

  // Memory usage
  int64 memory_bytes = 4;
  int64 peak_memory_bytes = 5;
  int64 spill_bytes = 6;

  // Data processing
  int64 rows_in = 7;
  int64 rows_out = 8;
  int64 bytes_in = 9;
  int64 bytes_out = 10;

  // Parallelism
  int32 threads_used = 11;
  double parallelism_efficiency = 12;

  // I/O statistics
  int64 bytes_read_from_disk = 13;
  int64 bytes_read_from_cache = 14;
  int64 cache_hits = 15;
  int64 cache_misses = 16;
}

// ExecutionStats describes overall execution statistics
message ExecutionStats {
  // Overall timing
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double total_wall_time_ms = 3;
  double total_cpu_time_ms = 4;

  // Resource usage
  int64 peak_memory_bytes = 5;
  double cpu_utilization_percent = 6;

  // Data processed
  int64 total_rows_in = 7;
  int64 total_rows_out = 8;
  int64 total_bytes_in = 9;
  int64 total_bytes_out = 10;

  // Query performance
  double rows_per_second = 11;
  double bytes_per_second = 12;

  // Cache performance
  int64 total_cache_hits = 13;
  int64 total_cache_misses = 14;
  double cache_hit_rate = 15;

  // Worker statistics
  int32 total_workers = 16;
  int32 active_workers = 17;
  double worker_utilization_percent = 18;
}

// ExplainWarning describes a warning or suggestion
message ExplainWarning {
  string warning_code = 1;
  string severity = 2;  // Info, Warning, Error
  string message = 3;
  string suggestion = 4;
  repeated string affected_nodes = 5;
}

// PlanMetadata describes plan metadata
message PlanMetadata {
  // Optimizer information
  string optimizer_version = 1;
  string optimization_level = 2;
  repeated string optimization_rules_applied = 3;
  int64 optimization_time_ms = 4;

  // Execution environment
  string execution_engine = 5;
  repeated string storage_engines_used = 6;
  string query_language = 7;

  // Feature flags
  repeated string enabled_features = 8;

  // Plan version (for plan stability)
  string plan_version = 9;
  string plan_hash = 10;

  // Additional metadata
  google.protobuf.Struct additional_metadata = 100;
}

// ExplainPlanRequest is the request for explaining a query
message ExplainPlanRequest {
  // Query to explain
  string query = 1;

  // Query type
  QueryType query_type = 2;

  // Explain format
  ExplainFormat format = 3;

  // Execution options
  ExplainOptions options = 4;

  // Session parameters
  google.protobuf.Struct session_params = 5;
}

// ExplainFormat enumerates supported explain output formats
enum ExplainFormat {
  EXPLAIN_FORMAT_UNKNOWN = 0;
  EXPLAIN_FORMAT_JSON = 1;
  EXPLAIN_FORMAT_TEXT = 2;
  EXPLAIN_FORMAT_GRAPHVIZ = 3;
  EXPLAIN_FORMAT_PROTOBUF = 4;
}

// ExplainOptions controls explain behavior
message ExplainOptions {
  bool analyze = 1;        // Execute the query to get actual stats
  bool verbose = 2;        // Include detailed node information
  bool costs = 3;          // Include cost estimates
  bool timing = 4;         // Include timing information
  bool buffers = 5;        // Include buffer usage information
  bool format = 6;         // Format output nicely
  bool summary = 7;        // Include summary information
  bool warnings = 8;       // Include warnings and suggestions
}

// ExplainPlanResponse is the response for explain queries
message ExplainPlanResponse {
  // Explain plan
  ExplainPlan plan = 1;

  // Output format (if format == TEXT)
  string formatted_output = 2;

  // Execution status
  bool success = 3;
  string error_message = 4;
  repeated string error_details = 5;
}
