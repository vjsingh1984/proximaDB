// Unified Catalog Service for ProximaDB
//
// Supports multiple catalog backends:
// - Native: ProximaDB's cloud-native catalog with object storage
// - AWS Glue: AWS Glue Data Catalog integration
// - Unity: Databricks Unity Catalog integration
// - Polaris: Apache Polaris (Iceberg REST Catalog)
// - Hive: Apache Hive Metastore (Thrift)
// - Iceberg: Generic Iceberg catalog (REST, JDBC, Hadoop)
//
// Design Principles:
// - Cloud-first: Object storage as primary, local as cache
// - Serverless-friendly: Stateless operations, external state
// - Lakehouse-native: Iceberg/Delta/Hudi table format support
// - Multi-tenant: Namespace isolation with RBAC

syntax = "proto3";

package proximadb.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "proximadb/v1/types.proto";

option java_package = "com.proximadb.proto.v1";
option java_multiple_files = true;

// =============================================================================
// CATALOG CONFIGURATION
// =============================================================================

// Catalog provider type
enum CatalogType {
  CATALOG_TYPE_UNSPECIFIED = 0;
  CATALOG_TYPE_NATIVE = 1;      // ProximaDB native catalog (cloud storage)
  CATALOG_TYPE_GLUE = 2;        // AWS Glue Data Catalog
  CATALOG_TYPE_UNITY = 3;       // Databricks Unity Catalog
  CATALOG_TYPE_POLARIS = 4;     // Apache Polaris (Iceberg REST)
  CATALOG_TYPE_HIVE = 5;        // Apache Hive Metastore
  CATALOG_TYPE_ICEBERG_REST = 6;// Generic Iceberg REST Catalog
  CATALOG_TYPE_ICEBERG_JDBC = 7;// Iceberg JDBC Catalog
  CATALOG_TYPE_ICEBERG_HADOOP = 8; // Iceberg Hadoop Catalog
  CATALOG_TYPE_DELTA = 9;       // Delta Lake catalog
}

// Catalog configuration
message CatalogConfig {
  string name = 1;                    // Catalog name (e.g., "production", "analytics")
  CatalogType catalog_type = 2;

  oneof config {
    NativeCatalogConfig native = 10;
    GlueCatalogConfig glue = 11;
    UnityCatalogConfig unity = 12;
    PolarisCatalogConfig polaris = 13;
    HiveCatalogConfig hive = 14;
    IcebergCatalogConfig iceberg = 15;
    DeltaCatalogConfig delta = 16;
  }

  // Common settings
  bool read_only = 20;                // Prevent DDL operations
  bool cache_enabled = 21;            // Enable local metadata cache
  int32 cache_ttl_seconds = 22;       // Cache TTL (default: 300)
  map<string, string> properties = 23;// Additional properties
}

// Native ProximaDB catalog (cloud-first)
message NativeCatalogConfig {
  string storage_url = 1;             // s3://bucket/catalog, adls://..., gcs://...
  string metadata_format = 2;         // "json", "avro", "parquet" (default: json)
  bool versioned = 3;                 // Enable schema versioning
  int32 max_versions = 4;             // Max versions to keep (default: 100)
  ReplicationConfig replication = 5;  // Cross-region replication
}

// AWS Glue Data Catalog
message GlueCatalogConfig {
  string region = 1;                  // AWS region (e.g., "us-east-1")
  string database_prefix = 2;         // Prefix for database names
  string role_arn = 3;                // IAM role ARN for cross-account
  string catalog_id = 4;              // AWS account ID (optional)
  bool use_lake_formation = 5;        // Enable Lake Formation permissions
}

// Databricks Unity Catalog
message UnityCatalogConfig {
  string workspace_url = 1;           // https://xxx.cloud.databricks.com
  string token = 2;                   // Personal access token or OAuth
  string catalog_name = 3;            // Unity catalog name
  string metastore_id = 4;            // Metastore ID (optional)
  bool use_external_locations = 5;    // Use external storage locations
}

// Apache Polaris (Iceberg REST Catalog)
message PolarisCatalogConfig {
  string uri = 1;                     // Polaris server URI
  string warehouse = 2;               // Warehouse name
  string credential = 3;              // Bearer token or OAuth client
  string oauth_server_uri = 4;        // OAuth2 server (optional)
  string scope = 5;                   // OAuth2 scope
}

// Apache Hive Metastore
message HiveCatalogConfig {
  string thrift_uri = 1;              // thrift://host:9083
  string kerberos_principal = 2;      // Kerberos principal (optional)
  string kerberos_keytab = 3;         // Keytab file path
  string database = 4;                // Default database
  bool use_ssl = 5;                   // Enable TLS
}

// Generic Iceberg Catalog (REST, JDBC, Hadoop)
message IcebergCatalogConfig {
  string catalog_impl = 1;            // Catalog implementation class
  string uri = 2;                     // Connection URI
  string warehouse = 3;               // Warehouse location
  map<string, string> properties = 4; // Iceberg catalog properties

  // For JDBC catalog
  string jdbc_driver = 10;
  string jdbc_user = 11;
  string jdbc_password = 12;

  // For Hadoop catalog
  string hadoop_conf_dir = 20;
}

// Delta Lake Catalog
message DeltaCatalogConfig {
  string storage_url = 1;             // s3://bucket/path, file:///path, abfs://...
  optional string aws_region = 2;     // AWS region (for S3 storage)
  optional string azure_storage_account = 3; // Azure storage account (for ADLS)
  optional string storage_options = 4; // JSON storage options (credentials, etc.)
  bool enable_checkpoint = 5;         // Enable Delta checkpointing
  optional int32 checkpoint_interval = 6; // Checkpoint every N commits
}

// Cross-region replication for native catalog
message ReplicationConfig {
  repeated string replica_urls = 1;   // Replica storage URLs
  ReplicationMode mode = 2;
  int32 sync_interval_seconds = 3;    // Sync frequency
}

enum ReplicationMode {
  REPLICATION_MODE_UNSPECIFIED = 0;
  REPLICATION_MODE_ASYNC = 1;         // Eventual consistency
  REPLICATION_MODE_SYNC = 2;          // Strong consistency (2PC)
  REPLICATION_MODE_QUORUM = 3;        // Quorum writes
}

// =============================================================================
// NAMESPACE (DATABASE/SCHEMA)
// =============================================================================

message Namespace {
  string catalog = 1;                 // Parent catalog name
  repeated string levels = 2;         // Namespace hierarchy (e.g., ["db", "schema"])
  map<string, string> properties = 3; // Namespace properties
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string owner = 6;                   // Owner principal
  string location = 7;                // Storage location (optional)
}

// =============================================================================
// TABLE SCHEMA
// =============================================================================

message TableSchema {
  string catalog = 1;                 // Catalog name
  repeated string namespace = 2;      // Namespace path
  string name = 3;                    // Table name

  repeated ColumnDefinition columns = 10;
  repeated PartitionSpec partitions = 11;
  repeated CatalogSortOrder sort_orders = 12;
  PrimaryKeySpec primary_key = 13;
  repeated CatalogIndexDefinition indexes = 14;

  TableFormat format = 20;            // Storage format
  TableType table_type = 21;
  string location = 22;               // Storage location
  map<string, string> properties = 23;

  // Metadata
  int64 schema_id = 30;               // Schema version ID
  google.protobuf.Timestamp created_at = 31;
  google.protobuf.Timestamp updated_at = 32;
  string owner = 33;
  int64 current_snapshot_id = 34;     // For Iceberg tables

  // ProximaDB-specific extensions
  VectorColumnConfig vector_config = 40;  // Vector column settings
  FullTextConfig fulltext_config = 41;    // Full-text search settings
}

// Column definition
message ColumnDefinition {
  int32 id = 1;                       // Column ID (stable across renames)
  string name = 2;
  DataType data_type = 3;
  bool nullable = 4;
  string default_value = 5;           // SQL expression
  string comment = 6;
  map<string, string> metadata = 7;   // Column metadata

  // For nested types
  repeated ColumnDefinition children = 10;
}

// SQL data types with vector extensions
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;

  // Primitive types
  DATA_TYPE_BOOLEAN = 1;
  DATA_TYPE_INT8 = 2;
  DATA_TYPE_INT16 = 3;
  DATA_TYPE_INT32 = 4;
  DATA_TYPE_INT64 = 5;
  DATA_TYPE_FLOAT32 = 6;
  DATA_TYPE_FLOAT64 = 7;
  DATA_TYPE_DECIMAL = 8;              // With precision/scale
  DATA_TYPE_STRING = 9;
  DATA_TYPE_BINARY = 10;
  DATA_TYPE_DATE = 11;
  DATA_TYPE_TIME = 12;
  DATA_TYPE_TIMESTAMP = 13;
  DATA_TYPE_TIMESTAMPTZ = 14;
  DATA_TYPE_UUID = 15;

  // Complex types
  DATA_TYPE_ARRAY = 20;
  DATA_TYPE_MAP = 21;
  DATA_TYPE_STRUCT = 22;
  DATA_TYPE_JSON = 23;

  // ProximaDB extensions
  DATA_TYPE_VECTOR = 30;              // Fixed-dimension float vector
  DATA_TYPE_SPARSE_VECTOR = 31;       // Sparse vector
  DATA_TYPE_BINARY_VECTOR = 32;       // Binary vector (bit-packed)
  DATA_TYPE_EMBEDDING = 33;           // Auto-generated embedding
}

// Table storage format
enum TableFormat {
  TABLE_FORMAT_UNSPECIFIED = 0;
  TABLE_FORMAT_PROXIMADB = 1;         // Native ProximaDB format
  TABLE_FORMAT_ICEBERG = 2;           // Apache Iceberg
  TABLE_FORMAT_DELTA = 3;             // Delta Lake
  TABLE_FORMAT_HUDI = 4;              // Apache Hudi
  TABLE_FORMAT_PARQUET = 5;           // Plain Parquet
}

// Table type
enum TableType {
  TABLE_TYPE_UNSPECIFIED = 0;
  TABLE_TYPE_MANAGED = 1;             // ProximaDB manages storage
  TABLE_TYPE_EXTERNAL = 2;            // External storage location
  TABLE_TYPE_VIEW = 3;                // Logical view
  TABLE_TYPE_MATERIALIZED_VIEW = 4;   // Materialized view
  TABLE_TYPE_TEMPORARY = 5;           // Session-scoped temp table
}

// Schema evolution request
message SchemaEvolutionRequest {
  repeated EvolutionChange changes = 1;

  message EvolutionChange {
    oneof change {
      AddColumnChange add_column = 1;
      DropColumnChange drop_column = 2;
      RenameColumnChange rename_column = 3;
      ModifyColumnChange modify_column = 4;
    }
  }
}

message AddColumnChange {
  ColumnDefinition column = 1;
  string after_column = 2;            // Insert after this column (optional)
}

message DropColumnChange {
  string column_name = 1;
}

message RenameColumnChange {
  string old_name = 1;
  string new_name = 2;
}

message ModifyColumnChange {
  ColumnDefinition column = 1;        // New column definition with same name
}

// Partition specification
message PartitionSpec {
  int32 spec_id = 1;
  repeated PartitionField fields = 2;
}

message PartitionField {
  int32 source_id = 1;                // Source column ID
  int32 field_id = 2;                 // Partition field ID
  string name = 3;
  PartitionTransform transform = 4;
}

enum PartitionTransform {
  PARTITION_TRANSFORM_UNSPECIFIED = 0;
  PARTITION_TRANSFORM_IDENTITY = 1;
  PARTITION_TRANSFORM_YEAR = 2;
  PARTITION_TRANSFORM_MONTH = 3;
  PARTITION_TRANSFORM_DAY = 4;
  PARTITION_TRANSFORM_HOUR = 5;
  PARTITION_TRANSFORM_BUCKET = 6;     // Hash bucket
  PARTITION_TRANSFORM_TRUNCATE = 7;   // Truncate string/number
}

// Sort order for data files (catalog-specific)
message CatalogSortOrder {
  int32 order_id = 1;
  repeated CatalogSortField fields = 2;
}

message CatalogSortField {
  int32 source_id = 1;
  SortDirection direction = 2;
  NullOrder null_order = 3;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

enum NullOrder {
  NULL_ORDER_UNSPECIFIED = 0;
  NULL_ORDER_NULLS_FIRST = 1;
  NULL_ORDER_NULLS_LAST = 2;
}

// Primary key specification
message PrimaryKeySpec {
  repeated int32 column_ids = 1;      // Column IDs in primary key
  bool auto_generate = 2;             // Auto-generate if not provided
}

// Secondary index definition (catalog-specific)
message CatalogIndexDefinition {
  string name = 1;
  IndexType index_type = 2;
  repeated int32 column_ids = 3;      // Indexed column IDs
  map<string, string> options = 4;    // Index-specific options

  // For vector indexes
  VectorIndexConfig vector_config = 10;
}

enum IndexType {
  INDEX_TYPE_UNSPECIFIED = 0;
  INDEX_TYPE_BTREE = 1;               // B-tree (range queries)
  INDEX_TYPE_HASH = 2;                // Hash (equality queries)
  INDEX_TYPE_BLOOM = 3;               // Bloom filter (membership)
  INDEX_TYPE_FULLTEXT = 4;            // Full-text search
  INDEX_TYPE_VECTOR_HNSW = 5;         // HNSW vector index
  INDEX_TYPE_VECTOR_IVF = 6;          // IVF vector index
  INDEX_TYPE_VECTOR_PQ = 7;           // Product quantization
  INDEX_TYPE_SPATIAL = 8;             // Geospatial (R-tree)
}

// Vector index configuration
message VectorIndexConfig {
  int32 dimension = 1;
  string distance_metric = 2;         // "l2", "cosine", "dot_product"

  // HNSW params
  int32 hnsw_m = 10;
  int32 hnsw_ef_construction = 11;

  // IVF params
  int32 ivf_nlist = 20;
  int32 ivf_nprobe = 21;

  // Quantization
  string quantization = 30;           // "none", "sq8", "pq", "binary"
}

// Vector column configuration
message VectorColumnConfig {
  string column_name = 1;
  int32 dimension = 2;
  string distance_metric = 3;
  bool auto_index = 4;                // Create vector index automatically
  string embedding_model = 5;         // For auto-embedding columns
}

// Full-text search configuration
message FullTextConfig {
  repeated string indexed_columns = 1;
  string analyzer = 2;                // "standard", "english", "chinese"
  bool enable_highlighting = 3;
}

// =============================================================================
// CATALOG SERVICE API
// =============================================================================

service CatalogService {
  // Catalog management
  rpc CreateCatalog(CreateCatalogRequest) returns (CreateCatalogResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse);
  rpc DropCatalog(DropCatalogRequest) returns (DropCatalogResponse);

  // Namespace management
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  rpc ListNamespaces(CatalogListNamespacesRequest) returns (CatalogListNamespacesResponse);
  rpc DropNamespace(DropNamespaceRequest) returns (DropNamespaceResponse);
  rpc UpdateNamespaceProperties(UpdateNamespacePropertiesRequest) returns (UpdateNamespacePropertiesResponse);

  // Table management
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
  rpc GetTable(GetTableRequest) returns (GetTableResponse);
  rpc ListTables(ListTablesRequest) returns (ListTablesResponse);
  rpc DropTable(DropTableRequest) returns (DropTableResponse);
  rpc RenameTable(RenameTableRequest) returns (RenameTableResponse);
  rpc AlterTable(AlterTableRequest) returns (AlterTableResponse);

  // Schema evolution
  rpc AddColumn(AddColumnRequest) returns (AddColumnResponse);
  rpc DropColumn(DropColumnRequest) returns (DropColumnResponse);
  rpc RenameColumn(RenameColumnRequest) returns (RenameColumnResponse);
  rpc UpdateColumnType(UpdateColumnTypeRequest) returns (UpdateColumnTypeResponse);

  // Index management
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);
  rpc DropIndex(DropIndexRequest) returns (DropIndexResponse);
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);

  // Statistics and metadata
  rpc GetTableStatistics(GetTableStatisticsRequest) returns (GetTableStatisticsResponse);
  rpc RefreshStatistics(RefreshStatisticsRequest) returns (RefreshStatisticsResponse);
}

// =============================================================================
// REQUEST/RESPONSE MESSAGES
// =============================================================================

// Catalog operations
message CreateCatalogRequest {
  CatalogConfig config = 1;
  bool if_not_exists = 2;
}

message CreateCatalogResponse {
  string catalog_name = 1;
  bool created = 2;                   // False if already exists
}

message GetCatalogRequest {
  string name = 1;
}

message GetCatalogResponse {
  CatalogConfig config = 1;
}

message ListCatalogsRequest {
  string pattern = 1;                 // Glob pattern (optional)
}

message ListCatalogsResponse {
  repeated CatalogConfig catalogs = 1;
}

message DropCatalogRequest {
  string name = 1;
  bool cascade = 2;                   // Drop all namespaces/tables
  bool if_exists = 3;
}

message DropCatalogResponse {
  bool dropped = 1;
}

// Namespace operations
message CreateNamespaceRequest {
  string catalog = 1;
  repeated string namespace = 2;      // Namespace path
  map<string, string> properties = 3;
  bool if_not_exists = 4;
}

message CreateNamespaceResponse {
  Namespace namespace = 1;
  bool created = 2;
}

message GetNamespaceRequest {
  string catalog = 1;
  repeated string namespace = 2;
}

message GetNamespaceResponse {
  Namespace namespace = 1;
}

message CatalogListNamespacesRequest {
  string catalog = 1;
  repeated string parent = 2;         // Parent namespace (empty for root)
}

message CatalogListNamespacesResponse {
  repeated Namespace namespaces = 1;
}

message DropNamespaceRequest {
  string catalog = 1;
  repeated string namespace = 2;
  bool cascade = 3;
  bool if_exists = 4;
}

message DropNamespaceResponse {
  bool dropped = 1;
}

message UpdateNamespacePropertiesRequest {
  string catalog = 1;
  repeated string namespace = 2;
  map<string, string> set_properties = 3;
  repeated string remove_properties = 4;
}

message UpdateNamespacePropertiesResponse {
  Namespace namespace = 1;
}

// Table operations
message CreateTableRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string name = 3;
  TableSchema schema = 4;
  bool if_not_exists = 5;
  bool or_replace = 6;                // Replace existing table
}

message CreateTableResponse {
  TableSchema table = 1;
  bool created = 2;
}

message GetTableRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string name = 3;
  bool include_statistics = 4;        // Include table stats
}

message GetTableResponse {
  TableSchema table = 1;
  TableStatistics statistics = 2;     // If requested
}

message ListTablesRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string pattern = 3;                 // Glob pattern (optional)
}

message ListTablesResponse {
  repeated TableSchema tables = 1;
}

message DropTableRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string name = 3;
  bool purge = 4;                     // Delete underlying data
  bool if_exists = 5;
}

message DropTableResponse {
  bool dropped = 1;
}

message RenameTableRequest {
  string catalog = 1;
  repeated string source_namespace = 2;
  string source_name = 3;
  repeated string target_namespace = 4;
  string target_name = 5;
}

message RenameTableResponse {
  TableSchema table = 1;
}

message AlterTableRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string name = 3;

  oneof alteration {
    SetTableProperties set_properties = 10;
    RemoveTableProperties remove_properties = 11;
    SetTableLocation set_location = 12;
  }
}

message SetTableProperties {
  map<string, string> properties = 1;
}

message RemoveTableProperties {
  repeated string keys = 1;
}

message SetTableLocation {
  string location = 1;
}

message AlterTableResponse {
  TableSchema table = 1;
}

// Schema evolution
message AddColumnRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  ColumnDefinition column = 4;
  string after_column = 5;            // Position after this column
}

message AddColumnResponse {
  TableSchema table = 1;
}

message DropColumnRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  string column = 4;
  bool if_exists = 5;
}

message DropColumnResponse {
  TableSchema table = 1;
}

message RenameColumnRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  string old_name = 4;
  string new_name = 5;
}

message RenameColumnResponse {
  TableSchema table = 1;
}

message UpdateColumnTypeRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  string column = 4;
  DataType new_type = 5;
}

message UpdateColumnTypeResponse {
  TableSchema table = 1;
}

// Index operations
message CreateIndexRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  CatalogIndexDefinition index = 4;
  bool if_not_exists = 5;
  bool async = 6;                     // Build index asynchronously
}

message CreateIndexResponse {
  CatalogIndexDefinition index = 1;
  bool created = 2;
  string job_id = 3;                  // For async builds
}

message DropIndexRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  string index_name = 4;
  bool if_exists = 5;
}

message DropIndexResponse {
  bool dropped = 1;
}

message ListIndexesRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
}

message ListIndexesResponse {
  repeated CatalogIndexDefinition indexes = 1;
}

// Statistics
message TableStatistics {
  int64 row_count = 1;
  int64 data_size_bytes = 2;
  int64 index_size_bytes = 3;
  int64 file_count = 4;
  google.protobuf.Timestamp last_updated = 5;
  map<string, ColumnStatistics> column_stats = 6;
}

message ColumnStatistics {
  int64 null_count = 1;
  int64 distinct_count = 2;
  SqlValue min_value = 3;
  SqlValue max_value = 4;
  double avg_length = 5;              // For string/binary columns
}

message GetTableStatisticsRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  repeated string columns = 4;        // Specific columns (empty = all)
}

message GetTableStatisticsResponse {
  TableStatistics statistics = 1;
}

message RefreshStatisticsRequest {
  string catalog = 1;
  repeated string namespace = 2;
  string table = 3;
  bool full_scan = 4;                 // Full vs sampled stats
  double sample_ratio = 5;            // Sample ratio if not full
}

message RefreshStatisticsResponse {
  TableStatistics statistics = 1;
}
