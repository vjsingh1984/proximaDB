syntax = "proto3";

package proximadb.v1;

import "proximadb/v1/types.proto";
import "proximadb/v1/document.proto";
import "proximadb/v1/observability.proto";

// Core unified record type for all data models in ProximaDB
// This abstraction enables unified storage, indexing, and query across:
// - Documents (JSON/BSON-like)
// - Graph nodes and edges
// - Vector records
// - Observability events (logs, metrics, traces)

// Record type discriminator
enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  RECORD_TYPE_DOCUMENT = 1;
  RECORD_TYPE_GRAPH_NODE = 2;
  RECORD_TYPE_GRAPH_EDGE = 3;
  RECORD_TYPE_VECTOR = 4;
  RECORD_TYPE_LOG = 5;
  RECORD_TYPE_METRIC = 6;
  RECORD_TYPE_TRACE = 7;
}

// Common metadata shared across all record types
message CommonMetadata {
  // Creation timestamp (nanoseconds since epoch)
  int64 created_at_ns = 1;

  // Last modification timestamp
  int64 updated_at_ns = 2;

  // Optional expiration timestamp for TTL
  optional int64 expires_at_ns = 3;

  // User-defined labels for filtering
  map<string, string> labels = 4;

  // System-generated tags
  repeated string tags = 5;

  // Source system identifier
  optional string source = 6;
}

// Unified record that can represent any data model
message UnifiedRecord {
  // Unique identifier within the container
  string id = 1;

  // Type discriminator
  RecordType record_type = 2;

  // Container (collection, graph, namespace) this record belongs to
  string container_id = 3;

  // Type-specific content
  oneof content {
    DocumentContent document = 10;
    GraphNodeContent graph_node = 11;
    GraphEdgeContent graph_edge = 12;
    VectorContent vector = 13;
    ObservabilityContent observability = 14;
  }

  // Shared metadata
  CommonMetadata metadata = 20;

  // Optimistic concurrency version
  uint64 version = 21;

  // Multi-tenant isolation
  optional string tenant_id = 22;
}

// Graph node content (references existing graph types)
message GraphNodeContent {
  // Node labels (e.g., "Person", "Company")
  repeated string labels = 1;

  // Node properties as SqlValue for nested support
  map<string, SqlValue> properties = 2;

  // Optional embedding for hybrid vector-graph queries
  repeated float embedding = 3;
}

// Graph edge content
message GraphEdgeContent {
  // Source node ID
  string source_id = 1;

  // Target node ID
  string target_id = 2;

  // Edge type (e.g., "KNOWS", "WORKS_AT")
  string edge_type = 3;

  // Edge properties
  map<string, SqlValue> properties = 4;

  // Edge weight for weighted graph algorithms
  optional double weight = 5;
}

// Vector content (references existing vector types)
message VectorContent {
  // The embedding vector
  repeated float vector = 1;

  // Dimension (for validation)
  uint32 dimension = 2;

  // Associated metadata for filtering
  map<string, SqlValue> metadata = 3;

  // Model that generated this embedding
  optional string model_id = 4;
}

// Batch operations for unified records
message BatchUnifiedRecordRequest {
  repeated UnifiedRecord records = 1;

  // Operation type
  BatchOperation operation = 2;

  // Container to operate on
  string container_id = 3;
}

enum BatchOperation {
  BATCH_OPERATION_UNSPECIFIED = 0;
  BATCH_OPERATION_INSERT = 1;
  BATCH_OPERATION_UPSERT = 2;
  BATCH_OPERATION_UPDATE = 3;
  BATCH_OPERATION_DELETE = 4;
}

message BatchUnifiedRecordResponse {
  // Number of records processed
  uint64 processed = 1;

  // Number of records that failed
  uint64 failed = 2;

  // Error details for failed records
  repeated BatchError errors = 3;

  // Processing time in milliseconds
  uint64 processing_time_ms = 4;
}

message BatchError {
  string record_id = 1;
  string error_message = 2;
  int32 error_code = 3;
}
