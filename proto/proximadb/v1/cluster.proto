syntax = "proto3";

package proximadb.cluster.v1;

import "proximadb/v1/vector_types.proto";

// ============================================================================
// CONSENSUS SERVICE - Raft Consensus Protocol
// ============================================================================

// ConsensusService implements the Raft consensus protocol for distributed
// coordination. This handles leader election, log replication, and membership
// changes for cluster metadata.
service ConsensusService {
    // RequestVote is called by candidates to gather votes during leader election.
    // Implements Raft Section 5.2: Leader Election
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

    // AppendEntries is called by the leader to replicate log entries and
    // serves as a heartbeat mechanism. Implements Raft Section 5.3: Log Replication
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

    // InstallSnapshot is called by the leader to send a snapshot to a follower
    // that has fallen too far behind. Implements Raft Section 7: Log Compaction
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);

    // PreVote implements the pre-vote extension to prevent disruption from
    // partitioned nodes rejoining the cluster. See Raft Section 9.6.
    rpc PreVote(PreVoteRequest) returns (PreVoteResponse);
}

// Request for the RequestVote RPC
message RequestVoteRequest {
    // Candidate's term
    uint64 term = 1;

    // Candidate requesting vote
    string candidate_id = 2;

    // Index of candidate's last log entry
    uint64 last_log_index = 3;

    // Term of candidate's last log entry
    uint64 last_log_term = 4;
}

// Response to the RequestVote RPC
message RequestVoteResponse {
    // Current term, for candidate to update itself
    uint64 term = 1;

    // True means candidate received vote
    bool vote_granted = 2;
}

// Request for the AppendEntries RPC
message AppendEntriesRequest {
    // Leader's term
    uint64 term = 1;

    // Leader ID so follower can redirect clients
    string leader_id = 2;

    // Index of log entry immediately preceding new ones
    uint64 prev_log_index = 3;

    // Term of prev_log_index entry
    uint64 prev_log_term = 4;

    // Log entries to store (empty for heartbeat)
    repeated LogEntry entries = 5;

    // Leader's commit index
    uint64 leader_commit = 6;
}

// Response to the AppendEntries RPC
message AppendEntriesResponse {
    // Current term, for leader to update itself
    uint64 term = 1;

    // True if follower contained entry matching prev_log_index and prev_log_term
    bool success = 2;

    // For fast log reconciliation: last known matching index
    // (optimization for faster catchup after rejection)
    optional uint64 match_index = 3;

    // For fast log reconciliation: conflicting entry's term (if any)
    optional uint64 conflict_term = 4;

    // For fast log reconciliation: first index of conflicting term
    optional uint64 conflict_index = 5;
}

// A log entry in the Raft log
message LogEntry {
    // Term when entry was received by leader
    uint64 term = 1;

    // Index of this entry in the log
    uint64 index = 2;

    // The command to apply to the state machine
    bytes command = 3;

    // Entry type for optimization
    LogEntryType entry_type = 4;
}

// Types of log entries
enum LogEntryType {
    LOG_ENTRY_TYPE_UNSPECIFIED = 0;
    // Normal command entry
    LOG_ENTRY_TYPE_COMMAND = 1;
    // No-op entry for leader establishment
    LOG_ENTRY_TYPE_NOOP = 2;
    // Configuration change entry
    LOG_ENTRY_TYPE_CONFIG = 3;
}

// Request for the InstallSnapshot RPC
message InstallSnapshotRequest {
    // Leader's term
    uint64 term = 1;

    // Leader ID so follower can redirect clients
    string leader_id = 2;

    // The snapshot replaces all entries up through and including this index
    uint64 last_included_index = 3;

    // Term of last_included_index
    uint64 last_included_term = 4;

    // Byte offset where chunk is positioned in the snapshot file
    uint64 offset = 5;

    // Raw bytes of the snapshot chunk
    bytes data = 6;

    // True if this is the last chunk
    bool done = 7;
}

// Response to the InstallSnapshot RPC
message InstallSnapshotResponse {
    // Current term, for leader to update itself
    uint64 term = 1;

    // Bytes successfully stored (for resume capability)
    uint64 bytes_stored = 2;
}

// Request for the PreVote RPC (Raft extension)
message PreVoteRequest {
    // Candidate's term (for the next term if it becomes candidate)
    uint64 term = 1;

    // Node requesting pre-vote
    string candidate_id = 2;

    // Index of candidate's last log entry
    uint64 last_log_index = 3;

    // Term of candidate's last log entry
    uint64 last_log_term = 4;
}

// Response to the PreVote RPC
message PreVoteResponse {
    // Current term
    uint64 term = 1;

    // True if the node would vote for this candidate
    bool vote_granted = 2;
}

// ============================================================================
// REPLICATION SERVICE - Data Replication
// ============================================================================

// ReplicationService handles data replication for shard replicas.
// This is separate from Raft consensus and handles the actual vector data
// replication with configurable consistency levels.
service ReplicationService {
    // Replicate sends a single replication entry to a replica
    rpc Replicate(ReplicateRequest) returns (ReplicateResponse);

    // ReplicateStream provides bidirectional streaming for high-throughput
    // replication. Client streams entries, server streams acknowledgments.
    rpc ReplicateStream(stream ReplicateRequest) returns (stream ReplicateResponse);

    // PullEntries allows a replica to pull entries it missed (catch-up replication)
    rpc PullEntries(PullEntriesRequest) returns (stream ReplicateRequest);

    // AckReplication acknowledges successful replication (for async replication)
    rpc AckReplication(AckReplicationRequest) returns (AckReplicationResponse);
}

// Request for the Replicate RPC
message ReplicateRequest {
    // Source node ID
    string source_node_id = 1;

    // Shard this entry belongs to
    string shard_id = 2;

    // Log sequence number for ordering
    uint64 lsn = 3;

    // Timestamp of the write (nanoseconds since epoch)
    int64 timestamp = 4;

    // Type of replication operation
    ReplicationOperationType operation = 5;

    // Serialized data (format depends on operation type)
    bytes data = 6;

    // CRC32 checksum for integrity verification
    uint32 checksum = 7;

    // Required consistency level for this entry
    ConsistencyLevel consistency = 8;

    // Request timeout in milliseconds
    uint32 timeout_ms = 9;
}

// Response to the Replicate RPC
message ReplicateResponse {
    // Node that processed the request
    string node_id = 1;

    // LSN that was acknowledged
    uint64 acked_lsn = 2;

    // Whether replication was successful
    bool success = 3;

    // Error message if failed
    optional string error = 4;

    // Processing latency in microseconds
    uint64 latency_us = 5;
}

// Types of replication operations
enum ReplicationOperationType {
    REPLICATION_OPERATION_TYPE_UNSPECIFIED = 0;
    // Insert new vectors
    REPLICATION_OPERATION_TYPE_INSERT = 1;
    // Update existing vectors
    REPLICATION_OPERATION_TYPE_UPDATE = 2;
    // Delete vectors
    REPLICATION_OPERATION_TYPE_DELETE = 3;
    // Flush memtable to disk
    REPLICATION_OPERATION_TYPE_FLUSH = 4;
    // Compaction operation
    REPLICATION_OPERATION_TYPE_COMPACT = 5;
    // Schema change
    REPLICATION_OPERATION_TYPE_SCHEMA_CHANGE = 6;
}

// Consistency levels for replication
enum ConsistencyLevel {
    CONSISTENCY_LEVEL_UNSPECIFIED = 0;
    // Only one node (primary) needs to acknowledge
    CONSISTENCY_LEVEL_ONE = 1;
    // Majority of nodes must acknowledge
    CONSISTENCY_LEVEL_QUORUM = 2;
    // All nodes must acknowledge
    CONSISTENCY_LEVEL_ALL = 3;
    // Local datacenter quorum
    CONSISTENCY_LEVEL_LOCAL_QUORUM = 4;
}

// Request for the PullEntries RPC
message PullEntriesRequest {
    // Node requesting entries
    string node_id = 1;

    // Shard to pull entries for
    string shard_id = 2;

    // Start LSN (exclusive)
    uint64 from_lsn = 3;

    // Maximum number of entries to return
    uint32 max_entries = 4;
}

// Request for the AckReplication RPC
message AckReplicationRequest {
    // Node acknowledging
    string node_id = 1;

    // Shard ID
    string shard_id = 2;

    // Highest LSN that was successfully applied
    uint64 acked_lsn = 3;
}

// Response to the AckReplication RPC
message AckReplicationResponse {
    // Whether acknowledgment was recorded
    bool success = 1;

    // Current primary's LSN (for lag detection)
    uint64 primary_lsn = 2;
}

// ============================================================================
// SEARCH FANOUT SERVICE - Distributed Query Execution
// ============================================================================

// SearchFanoutService handles distributed search and write forwarding.
// This implements the scatter-gather pattern for distributed queries.
service SearchFanoutService {
    // ShardSearch executes a search on a specific shard
    rpc ShardSearch(ShardSearchRequest) returns (ShardSearchResponse);

    // ShardSearchStream provides streaming results for large result sets
    rpc ShardSearchStream(ShardSearchRequest) returns (stream ShardSearchResult);

    // ForwardWrite forwards a write request to the primary of a shard
    rpc ForwardWrite(ForwardWriteRequest) returns (ForwardWriteResponse);

    // ForwardWriteBatch forwards a batch of writes for efficiency
    rpc ForwardWriteBatch(ForwardWriteBatchRequest) returns (ForwardWriteBatchResponse);
}

// Request for the ShardSearch RPC
message ShardSearchRequest {
    // Request ID for tracing
    string request_id = 1;

    // Collection to search
    string collection = 2;

    // Shard to search
    string shard_id = 3;

    // Query vector
    repeated float vector = 4;

    // Number of results to return
    uint32 top_k = 5;

    // Optional metadata filter (JSON-encoded)
    optional string filter = 6;

    // Search parameters
    SearchParams params = 7;

    // Request timeout in milliseconds
    uint32 timeout_ms = 8;

    // Whether to include vectors in response
    bool include_vectors = 9;

    // Tenant context for metadata-aware search
    optional string tenant_id = 10;

    // Domain context for domain-aware search
    optional string domain_id = 11;
}

// Search parameters for shard search
message SearchParams {
    // Distance metric to use
    proximadb.v1.DistanceMetric metric = 1;

    // Minimum similarity score threshold
    optional float min_score = 2;

    // EF search parameter for HNSW
    optional uint32 ef_search = 3;

    // Number of probes for IVF
    optional uint32 n_probes = 4;
}

// Response to the ShardSearch RPC
message ShardSearchResponse {
    // Request ID (echoed)
    string request_id = 1;

    // Shard that was searched
    string shard_id = 2;

    // Search results
    repeated ShardSearchResult results = 3;

    // Number of vectors scanned
    uint64 vectors_scanned = 4;

    // Search latency in microseconds
    uint64 latency_us = 5;

    // Whether search was truncated due to timeout
    bool truncated = 6;
}

// Individual search result from a shard
message ShardSearchResult {
    // Vector ID
    string id = 1;

    // Distance/similarity score
    float score = 2;

    // Optional vector data
    repeated float vector = 3;

    // Metadata (JSON-encoded)
    optional string metadata = 4;
}

// Request for the ForwardWrite RPC
message ForwardWriteRequest {
    // Request ID for tracing
    string request_id = 1;

    // Collection to write to
    string collection = 2;

    // Target shard
    string shard_id = 3;

    // Records to write
    repeated proximadb.v1.VectorRecord records = 4;

    // Required consistency level
    ConsistencyLevel consistency = 5;

    // Request timeout in milliseconds
    uint32 timeout_ms = 6;

    // Tenant context for tenant-aware writes
    optional string tenant_id = 7;

    // Domain context for domain-aware writes
    optional string domain_id = 8;
}

// Response to the ForwardWrite RPC
message ForwardWriteResponse {
    // Request ID (echoed)
    string request_id = 1;

    // Number of records written
    uint32 records_written = 2;

    // Number of replicas that acknowledged
    uint32 replicas_acked = 3;

    // Write latency in microseconds
    uint64 latency_us = 4;

    // Error message if partially failed
    optional string error = 5;
}

// Request for the ForwardWriteBatch RPC
message ForwardWriteBatchRequest {
    // Request ID for tracing
    string request_id = 1;

    // Batch of write requests (may target multiple shards)
    repeated ForwardWriteRequest requests = 2;
}

// Response to the ForwardWriteBatch RPC
message ForwardWriteBatchResponse {
    // Request ID (echoed)
    string request_id = 1;

    // Individual responses for each request
    repeated ForwardWriteResponse responses = 2;

    // Total records written across all shards
    uint32 total_records_written = 3;

    // Total latency in microseconds
    uint64 total_latency_us = 4;
}

// ============================================================================
// HEALTH SERVICE - Node Health and Liveness
// ============================================================================

// HealthService provides health checking for inter-node communication.
// This follows the gRPC Health Checking Protocol with extensions.
service HealthService {
    // Check performs a health check (compatible with grpc.health.v1.Health)
    rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

    // Status provides detailed node status information
    rpc Status(StatusRequest) returns (StatusResponse);

    // Watch provides streaming health updates
    rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}

// Request for health check
message HealthCheckRequest {
    // Service name to check (empty for overall node health)
    string service = 1;
}

// Response to health check
message HealthCheckResponse {
    // Health status
    ServingStatus status = 1;
}

// Serving status (compatible with grpc.health.v1)
enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    // Node is healthy and serving requests
    SERVING_STATUS_SERVING = 1;
    // Node is not serving requests
    SERVING_STATUS_NOT_SERVING = 2;
    // Service is unknown
    SERVING_STATUS_SERVICE_UNKNOWN = 3;
}

// Request for detailed status
message StatusRequest {
    // Include detailed metrics
    bool include_metrics = 1;

    // Include shard information
    bool include_shards = 2;
}

// Detailed status response
message StatusResponse {
    // Node identifier
    string node_id = 1;

    // Node role in the cluster
    NodeRole role = 2;

    // Current Raft term (if participating in consensus)
    uint64 current_term = 3;

    // Current leader ID (if known)
    optional string leader_id = 4;

    // Node uptime in seconds
    uint64 uptime_seconds = 5;

    // Number of active connections
    uint32 active_connections = 6;

    // Memory usage in bytes
    uint64 memory_bytes = 7;

    // CPU usage percentage (0-100)
    float cpu_percent = 8;

    // Shard status (if requested)
    repeated ShardStatus shards = 9;

    // Replication lag in milliseconds (if replica)
    optional uint64 replication_lag_ms = 10;
}

// Node roles
enum NodeRole {
    NODE_ROLE_UNSPECIFIED = 0;
    // Raft follower
    NODE_ROLE_FOLLOWER = 1;
    // Raft candidate
    NODE_ROLE_CANDIDATE = 2;
    // Raft leader
    NODE_ROLE_LEADER = 3;
    // Observer (non-voting member)
    NODE_ROLE_OBSERVER = 4;
}

// Status of a shard on this node
message ShardStatus {
    // Shard identifier
    string shard_id = 1;

    // Collection this shard belongs to
    string collection = 2;

    // Whether this node is primary for this shard
    bool is_primary = 3;

    // Shard state
    ShardState state = 4;

    // Current LSN for this shard
    uint64 current_lsn = 5;

    // Vector count in this shard
    uint64 vector_count = 6;

    // Disk usage in bytes
    uint64 disk_bytes = 7;
}

// Shard states
enum ShardState {
    SHARD_STATE_UNSPECIFIED = 0;
    // Shard is active and serving requests
    SHARD_STATE_ACTIVE = 1;
    // Shard is being created/initialized
    SHARD_STATE_INITIALIZING = 2;
    // Shard is catching up (replica behind primary)
    SHARD_STATE_CATCHING_UP = 3;
    // Shard is being relocated to another node
    SHARD_STATE_RELOCATING = 4;
    // Shard is inactive/offline
    SHARD_STATE_INACTIVE = 5;
}
