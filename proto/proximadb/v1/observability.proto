syntax = "proto3";

package proximadb.v1;

import "proximadb/v1/types.proto";
import "proximadb/v1/document.proto";

// Observability types for Cloud SIEM / Datadog-like capabilities
// Supports: Logs, Metrics, Traces with high-throughput ingestion
// Input formats: OTLP, Syslog (RFC 3164/5424), Fluent, CEF/LEEF, OCSF

// Observability event type discriminator
enum ObservabilityType {
  OBSERVABILITY_TYPE_UNSPECIFIED = 0;
  OBSERVABILITY_TYPE_LOG = 1;
  OBSERVABILITY_TYPE_METRIC = 2;
  OBSERVABILITY_TYPE_TRACE = 3;
  OBSERVABILITY_TYPE_EVENT = 4;
}

// Log severity levels (aligned with syslog)
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_TRACE = 1;      // Finest granularity
  SEVERITY_DEBUG = 2;
  SEVERITY_INFO = 3;
  SEVERITY_WARN = 4;
  SEVERITY_ERROR = 5;
  SEVERITY_FATAL = 6;      // Critical/Emergency
}

// Main observability content wrapper
message ObservabilityContent {
  // Type discriminator
  ObservabilityType obs_type = 1;

  // High-precision timestamp (nanoseconds since epoch)
  int64 timestamp_ns = 2;

  // Source identifier (hostname, IP, agent ID)
  string source = 3;

  // Service/application name
  string service = 4;

  // Log severity (for logs)
  optional Severity severity = 5;

  // Metric data (for metrics)
  optional MetricData metric = 6;

  // Trace data (for traces)
  optional TraceData trace = 7;

  // Structured fields (parsed from log message)
  map<string, SqlValue> fields = 8;

  // Raw message (original log line)
  optional string raw_message = 9;

  // Ingestion format for provenance
  optional IngestionFormat format = 10;
}

// Ingestion format for provenance tracking
enum IngestionFormat {
  INGESTION_FORMAT_UNSPECIFIED = 0;
  INGESTION_FORMAT_JSON = 1;
  INGESTION_FORMAT_OTLP = 2;
  INGESTION_FORMAT_SYSLOG_RFC3164 = 3;
  INGESTION_FORMAT_SYSLOG_RFC5424 = 4;
  INGESTION_FORMAT_FLUENT = 5;
  INGESTION_FORMAT_CEF = 6;      // ArcSight Common Event Format
  INGESTION_FORMAT_LEEF = 7;     // IBM Log Event Extended Format
  INGESTION_FORMAT_OCSF = 8;     // Open Cybersecurity Schema Framework
  INGESTION_FORMAT_NDJSON = 9;   // Newline-delimited JSON
}

// === Metric Types ===

message MetricData {
  // Metric name
  string name = 1;

  // Metric value
  oneof value {
    double gauge = 2;
    int64 counter = 3;
    HistogramValue histogram = 4;
    SummaryValue summary = 5;
  }

  // Metric unit (e.g., "bytes", "ms", "requests")
  optional string unit = 6;

  // Metric labels for dimensional queries
  map<string, string> labels = 7;

  // Aggregation temporality
  AggregationTemporality temporality = 8;
}

enum AggregationTemporality {
  AGGREGATION_TEMPORALITY_UNSPECIFIED = 0;
  AGGREGATION_TEMPORALITY_DELTA = 1;
  AGGREGATION_TEMPORALITY_CUMULATIVE = 2;
}

message HistogramValue {
  repeated double bucket_bounds = 1;
  repeated uint64 bucket_counts = 2;
  double sum = 3;
  uint64 count = 4;
  optional double min = 5;
  optional double max = 6;
}

message SummaryValue {
  repeated Quantile quantiles = 1;
  double sum = 2;
  uint64 count = 3;
}

message Quantile {
  double quantile = 1;  // 0.0 to 1.0
  double value = 2;
}

// === Trace Types ===

message TraceData {
  // Trace ID (128-bit as hex string)
  string trace_id = 1;

  // Span ID (64-bit as hex string)
  string span_id = 2;

  // Parent span ID (empty for root spans)
  optional string parent_span_id = 3;

  // Span name/operation
  string name = 4;

  // Span kind
  SpanKind kind = 5;

  // Start time (nanoseconds)
  int64 start_time_ns = 6;

  // End time (nanoseconds)
  int64 end_time_ns = 7;

  // Span status
  SpanStatus status = 8;

  // Span attributes
  map<string, SqlValue> attributes = 9;

  // Span events
  repeated SpanEvent events = 10;

  // Span links
  repeated SpanLink links = 11;
}

enum SpanKind {
  SPAN_KIND_UNSPECIFIED = 0;
  SPAN_KIND_INTERNAL = 1;
  SPAN_KIND_SERVER = 2;
  SPAN_KIND_CLIENT = 3;
  SPAN_KIND_PRODUCER = 4;
  SPAN_KIND_CONSUMER = 5;
}

message SpanStatus {
  SpanStatusCode code = 1;
  optional string message = 2;
}

enum SpanStatusCode {
  SPAN_STATUS_CODE_UNSET = 0;
  SPAN_STATUS_CODE_OK = 1;
  SPAN_STATUS_CODE_ERROR = 2;
}

message SpanEvent {
  int64 timestamp_ns = 1;
  string name = 2;
  map<string, SqlValue> attributes = 3;
}

message SpanLink {
  string trace_id = 1;
  string span_id = 2;
  map<string, SqlValue> attributes = 3;
}

// === Namespace Configuration ===

message ObservabilityNamespaceConfig {
  // Namespace name
  string name = 1;

  // Retention policies by tier
  RetentionConfig retention = 2;

  // Ingestion settings
  IngestionConfig ingestion = 3;

  // Alerting rules
  repeated AlertRule alert_rules = 4;

  // Access control
  optional ObservabilityAccessControl access = 5;
}

message RetentionConfig {
  // Hot tier retention (SST, fast queries)
  uint64 hot_retention_hours = 1;

  // Warm tier retention (SST, moderate latency)
  uint64 warm_retention_days = 2;

  // Cold tier retention (VIPER/Parquet)
  uint64 cold_retention_days = 3;

  // Archive tier (S3/GCS, query on demand)
  uint64 archive_retention_days = 4;
}

message IngestionConfig {
  // Maximum events per second (0 = unlimited)
  uint64 rate_limit_per_second = 1;

  // Maximum batch size
  uint32 max_batch_size = 2;

  // Enable parsing of structured fields
  bool parse_structured_fields = 3;

  // Timestamp field for parsing
  optional string timestamp_field = 4;

  // Severity field for parsing
  optional string severity_field = 5;
}

// === Alerting ===

message AlertRule {
  // Rule ID
  string id = 1;

  // Rule name
  string name = 2;

  // Alert condition
  AlertCondition condition = 3;

  // Notification channels
  repeated NotificationChannel notifications = 4;

  // Evaluation interval (seconds)
  uint32 evaluation_interval_seconds = 5;

  // Alert severity
  AlertSeverity severity = 6;

  // Labels to attach to alerts
  map<string, string> labels = 7;

  // Enabled flag
  bool enabled = 8;
}

message AlertCondition {
  oneof condition {
    ThresholdCondition threshold = 1;
    RateCondition rate = 2;
    PatternCondition pattern = 3;
    AnomalyCondition anomaly = 4;
  }
}

message ThresholdCondition {
  // Metric name or log query
  string query = 1;
  // Comparison operator
  ComparisonOperator operator = 2;
  // Threshold value
  double threshold = 3;
  // Duration to sustain threshold (seconds)
  uint32 for_seconds = 4;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_GT = 1;
  COMPARISON_OPERATOR_GTE = 2;
  COMPARISON_OPERATOR_LT = 3;
  COMPARISON_OPERATOR_LTE = 4;
  COMPARISON_OPERATOR_EQ = 5;
  COMPARISON_OPERATOR_NE = 6;
}

message RateCondition {
  // Query to count
  string query = 1;
  // Time window (seconds)
  uint32 window_seconds = 2;
  // Rate threshold
  double threshold = 3;
}

message PatternCondition {
  // Log query filter
  string filter = 1;
  // Pattern to match (regex)
  string pattern = 2;
  // Minimum occurrences in window
  uint32 min_occurrences = 3;
  // Time window (seconds)
  uint32 window_seconds = 4;
}

message AnomalyCondition {
  // Metric name
  string metric = 1;
  // Standard deviations for anomaly detection
  double std_dev_threshold = 2;
  // Training window (hours)
  uint32 training_window_hours = 3;
}

message NotificationChannel {
  oneof channel {
    WebhookNotification webhook = 1;
    SlackNotification slack = 2;
    PagerDutyNotification pagerduty = 3;
    EmailNotification email = 4;
  }
}

message WebhookNotification {
  string url = 1;
  map<string, string> headers = 2;
}

message SlackNotification {
  string webhook_url = 1;
  string channel = 2;
}

message PagerDutyNotification {
  string routing_key = 1;
}

message EmailNotification {
  repeated string recipients = 1;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_INFO = 1;
  ALERT_SEVERITY_WARNING = 2;
  ALERT_SEVERITY_CRITICAL = 3;
}

message ObservabilityAccessControl {
  // Required roles to access this namespace
  repeated string required_roles = 1;
  // Read-only roles
  repeated string read_only_roles = 2;
}

// === API Messages ===

// Create namespace
message CreateObservabilityNamespaceRequest {
  ObservabilityNamespaceConfig config = 1;
}

message CreateObservabilityNamespaceResponse {
  string namespace_id = 1;
  bool success = 2;
}

// Bulk log ingestion
message IngestLogsRequest {
  string namespace = 1;
  repeated LogEntry logs = 2;
  // Ingestion format hint
  optional IngestionFormat format = 3;
}

message LogEntry {
  int64 timestamp_ns = 1;
  Severity severity = 2;
  string message = 3;
  map<string, SqlValue> fields = 4;
  optional string source = 5;
  optional string service = 6;
}

message IngestLogsResponse {
  uint64 ingested = 1;
  uint64 failed = 2;
  repeated string errors = 3;
  uint64 processing_time_ms = 4;
}

// Bulk metrics ingestion
message IngestMetricsRequest {
  string namespace = 1;
  repeated MetricSample samples = 2;
}

message MetricSample {
  string name = 1;
  int64 timestamp_ns = 2;
  double value = 3;
  map<string, string> labels = 4;
}

message IngestMetricsResponse {
  uint64 ingested = 1;
  uint64 failed = 2;
  uint64 processing_time_ms = 3;
}

// Trace ingestion
message IngestTracesRequest {
  string namespace = 1;
  repeated TraceData traces = 2;
}

message IngestTracesResponse {
  uint64 ingested = 1;
  uint64 failed = 2;
  uint64 processing_time_ms = 3;
}

// Query logs
message QueryLogsRequest {
  string namespace = 1;
  // Time range
  int64 start_time_ns = 2;
  int64 end_time_ns = 3;
  // Filter query (Datadog-style or SQL-like)
  optional string query = 4;
  // Structured filter
  optional LogFilter filter = 5;
  // Pagination
  uint32 limit = 6;
  optional string cursor = 7;
  // Sort order (default: newest first)
  SortOrder sort = 8;
}

message LogFilter {
  repeated Severity severities = 1;
  repeated string services = 2;
  repeated string sources = 3;
  // Field filters
  repeated DocFilterCondition field_filters = 4;
}

message QueryLogsResponse {
  repeated LogEntry logs = 1;
  optional string next_cursor = 2;
  uint64 total_matched = 3;
  uint64 query_time_ms = 4;
}

// Aggregate metrics (PromQL-style)
message AggregateMetricsRequest {
  string namespace = 1;
  // Metric name
  string metric_name = 2;
  // Time range
  int64 start_time_ns = 3;
  int64 end_time_ns = 4;
  // Aggregation function
  MetricAggregation aggregation = 5;
  // Step/resolution (seconds)
  uint32 step_seconds = 6;
  // Label filters
  map<string, string> label_filters = 7;
  // Group by labels
  repeated string group_by = 8;
}

enum MetricAggregation {
  METRIC_AGGREGATION_UNSPECIFIED = 0;
  METRIC_AGGREGATION_AVG = 1;
  METRIC_AGGREGATION_SUM = 2;
  METRIC_AGGREGATION_MIN = 3;
  METRIC_AGGREGATION_MAX = 4;
  METRIC_AGGREGATION_COUNT = 5;
  METRIC_AGGREGATION_RATE = 6;
  METRIC_AGGREGATION_P50 = 7;
  METRIC_AGGREGATION_P90 = 8;
  METRIC_AGGREGATION_P95 = 9;
  METRIC_AGGREGATION_P99 = 10;
}

message AggregateMetricsResponse {
  repeated TimeSeriesResult series = 1;
  uint64 query_time_ms = 2;
}

message TimeSeriesResult {
  map<string, string> labels = 1;
  repeated DataPoint points = 2;
}

message DataPoint {
  int64 timestamp_ns = 1;
  double value = 2;
}

// Query traces
message QueryTracesRequest {
  string namespace = 1;
  // Time range
  int64 start_time_ns = 2;
  int64 end_time_ns = 3;
  // Filter by trace ID (exact)
  optional string trace_id = 4;
  // Filter by service
  optional string service = 5;
  // Filter by operation name
  optional string operation = 6;
  // Minimum duration (nanoseconds)
  optional int64 min_duration_ns = 7;
  // Status filter
  optional SpanStatusCode status = 8;
  // Pagination
  uint32 limit = 9;
  optional string cursor = 10;
}

message QueryTracesResponse {
  repeated TraceData traces = 1;
  optional string next_cursor = 2;
  uint64 query_time_ms = 3;
}

// Assemble full trace (all spans)
message GetTraceRequest {
  string namespace = 1;
  string trace_id = 2;
}

message GetTraceResponse {
  repeated TraceData spans = 1;
  bool complete = 2;  // All spans found
}

// Create/update alert rule
message UpsertAlertRuleRequest {
  string namespace = 1;
  AlertRule rule = 2;
}

message UpsertAlertRuleResponse {
  string rule_id = 1;
  bool created = 2;  // true = created, false = updated
}

// Delete alert rule
message DeleteAlertRuleRequest {
  string namespace = 1;
  string rule_id = 2;
}

message DeleteAlertRuleResponse {
  bool deleted = 1;
}

// List active alerts
message ListAlertsRequest {
  string namespace = 1;
  optional AlertSeverity min_severity = 2;
  optional bool include_resolved = 3;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

message Alert {
  string id = 1;
  string rule_id = 2;
  string rule_name = 3;
  AlertSeverity severity = 4;
  AlertState state = 5;
  int64 started_at_ns = 6;
  optional int64 resolved_at_ns = 7;
  map<string, string> labels = 8;
  string summary = 9;
}

enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  ALERT_STATE_PENDING = 1;
  ALERT_STATE_FIRING = 2;
  ALERT_STATE_RESOLVED = 3;
}

// === Additional request/response messages for gRPC service ===

// List namespaces
message ListNamespacesRequest {}

message ListNamespacesResponse {
  repeated NamespaceInfo namespaces = 1;
}

message NamespaceInfo {
  string name = 1;
  RetentionConfig retention = 2;
  uint64 log_count = 3;
  uint64 metric_count = 4;
  uint64 trace_count = 5;
}

// Delete namespace
message DeleteNamespaceRequest {
  string namespace = 1;
}

message DeleteNamespaceResponse {
  bool success = 1;
}

// Query metrics (simple query, not aggregated)
message QueryMetricsRequest {
  string namespace = 1;
  string metric_name = 2;
  int64 start_time_ns = 3;
  int64 end_time_ns = 4;
  map<string, string> labels = 5;
  uint32 limit = 6;
}

message QueryMetricsResponse {
  repeated MetricSample samples = 1;
  uint64 query_time_ms = 2;
}

// Observability gRPC service
service ObservabilityService {
  // Namespace management
  rpc CreateNamespace(CreateObservabilityNamespaceRequest) returns (CreateObservabilityNamespaceResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);

  // Log operations
  rpc IngestLogs(IngestLogsRequest) returns (IngestLogsResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
  rpc StreamLogs(QueryLogsRequest) returns (stream LogEntry);

  // Metric operations
  rpc IngestMetrics(IngestMetricsRequest) returns (IngestMetricsResponse);
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  rpc AggregateMetrics(AggregateMetricsRequest) returns (AggregateMetricsResponse);

  // Trace operations
  rpc IngestTraces(IngestTracesRequest) returns (IngestTracesResponse);
  rpc QueryTraces(QueryTracesRequest) returns (QueryTracesResponse);
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);

  // Alerting
  rpc UpsertAlertRule(UpsertAlertRuleRequest) returns (UpsertAlertRuleResponse);
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
}
