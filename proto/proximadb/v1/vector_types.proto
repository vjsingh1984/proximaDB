syntax = "proto3";

package proximadb.v1;

import "proximadb/v1/types.proto";
import "proximadb/v1/entity.proto"; // reuse SqlValue for metadata maps

// Strongly-typed enums for metrics and engines
enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  COSINE = 1;
  EUCLIDEAN = 2;
  DOT_PRODUCT = 3;
  HAMMING = 4;
  MANHATTAN = 5;
  JACCARD = 6;
  ANGULAR = 7;
  CHEBYSHEV = 8;
  CANBERRA = 9;
  MINKOWSKI = 10;
  BRAY_CURTIS = 11;
  HELLINGER = 12;
  CUSTOM = 13;
}

enum StorageEngine {
  STORAGE_ENGINE_UNSPECIFIED = 0;
  VIPER = 1;
  SST = 2;
  NOVA = 3;
  HELIX = 4;
  SWIFT = 5;
  RAPTOR = 6;
  MMAP = 7;
  HYBRID = 8;
}

enum IndexingAlgorithm {
  INDEXING_ALGORITHM_UNSPECIFIED = 0;
  HNSW = 1;
  IVF = 2;
  PQ = 3;
  FLAT = 4;
  ANNOY = 5;
  LSH = 6;
}

message IncludeFields {
  bool vector = 1;
  bool metadata = 2;
  // Additional fields for compatibility  
  bool score = 3;
  bool rank = 4;
  bool source = 5;
  map<string, bool> source_options = 6;
}

message MetadataItem {
  string key = 1;
  oneof value {
    string string_value = 2;
    double number_value = 3;
    bool bool_value = 4;
  }
}

message SearchQuery {
  repeated float vector = 1;
  // Simple equality filters using SqlValue (perfect for SQL WHERE clauses)
  map<string, SqlValue> filters = 2;
  // Advanced structured filters for complex queries (reuses entity.proto schema)
  optional MetadataFilter advanced_filter = 3;
}

message SearchParams {
  optional uint32 top_k = 1;
  optional double accuracy_threshold = 2;
  optional bool include_expired = 3;
  optional uint32 timeout_ms = 4;
  optional bool enable_two_stage = 5;
  optional bool enable_clustering_hint = 6;
  optional bool enable_metadata_filtering_hint = 7;
  // Simplified hints map
  map<string, SqlValue> custom_hints = 10;
}

message SearchOptimization {
  optional uint32 top_k = 1;
  optional double accuracy_threshold = 2;
  map<string, SqlValue> filters = 3;
}

message VectorSearchRequest {
  string collection_id = 1;
  repeated SearchQuery queries = 2;
  uint32 top_k = 3;
  optional IncludeFields include_fields = 4;
  optional SearchParams search_params = 5;
  optional uint32 distance_metric_override = 6;
  optional SearchOptimization search_optimization = 7;
}

message VectorRecord {
  string id = 1;
  repeated float vector = 2;
  map<string, SqlValue> metadata = 3;
  int64 timestamp = 4;
  optional int64 updated_at = 5;
  optional int64 expires_at = 6;
  optional uint32 version = 7;  // Version counter, 0-4B versions (realistically won't exceed 255)
  optional string source = 8;  // Original content that generated this vector
  // Note: quantized_vector field removed - quantization is now internalized during flush/compaction
  // and stored in ProximaDataBlock's QuantizedSection, not in input records
  // collection_id removed - causes initialization issues across codebase
}

message VectorBatchRequest {
  string collection_id = 1;
  repeated VectorRecord vectors = 2;
}

message VectorGetRequest {
  string collection_id = 1;
  string vector_id = 2;
  optional bool include_vector = 3;
  optional bool include_metadata = 4;
}

message OperationMetrics {
  int64 total_processed = 1;
  int64 successful_count = 2;
  int64 failed_count = 3;
  int64 updated_count = 4;
  int64 processing_time_us = 5;
  int64 wal_write_time_us = 6;
  int64 index_update_time_us = 7;
}

message SearchVectorRecord {
  string id = 1;
  double score = 2;
  repeated float vector = 3;
  map<string, SqlValue> metadata = 4;
  optional int64 version = 5;
  // Additional fields for compatibility
  optional float similarity = 6;
  optional int64 timestamp = 7;
  optional string source = 8;
  repeated string expanded_context = 9;
  optional float semantic_similarity = 10;
  optional string quantization_info = 11;
  map<string, string> engine_stats = 12;
  optional string index_path = 13;
}

message SearchResult {
  repeated SearchVectorRecord results = 1;
  int64 total_found = 2;
  optional string collection_id = 3;
}

message VectorOperationResponse {
  bool success = 1;
  int32 operation = 2;
  OperationMetrics metrics = 3;
  SearchResult results = 4;
  repeated string vector_ids = 5;
  optional string error_message = 6;
  optional string error_code = 7;
}

// Operation enums
enum VectorOperation {
  VECTOR_OPERATION_UNSPECIFIED = 0;
  VECTOR_BATCH = 1;      // Unified batch operation (insert/upsert/delete)
  VECTOR_SEARCH = 2;     // Vector search operation  
  VECTOR_GET = 3;        // Get single vector by ID
}

// Service operation enum (unique values to avoid conflicts)
enum VectorServiceOperation {
  VECTOR_SERVICE_OPERATION_UNSPECIFIED = 0;
  VS_BATCH = 1;
  VS_SEARCH = 2;
  VS_GET = 3;
}

// Filter operation enum (unique values to avoid conflicts)
enum FilterOperation {
  FILTER_OPERATION_UNSPECIFIED = 0;
  OP_EQUALS = 1;
  OP_NOT_EQUALS = 2;
  OP_GREATER_THAN = 3;
  OP_GREATER_THAN_OR_EQUAL = 4;
  OP_LESS_THAN = 5;
  OP_LESS_THAN_OR_EQUAL = 6;
  OP_IN = 7;
  OP_NOT_IN = 8;
  OP_CONTAINS = 9;
  OP_STARTS_WITH = 10;
  OP_ENDS_WITH = 11;
}

// Filter operator enum (unique values to avoid conflicts)
enum FilterOperator {
  FILTER_OPERATOR_UNSPECIFIED = 0;
  LOGICAL_AND = 1;
  LOGICAL_OR = 2;
  LOGICAL_NOT = 3;
}

// Quantization configuration
message QuantizationConfig {
  bool enabled = 1;
  Strategy strategy = 2;
  repeated QuantizationLevel custom_levels = 3;
  bool enable_progressive_search = 4;
  float binary_filter_selectivity = 5;
  float int8_ranking_selectivity = 6;
  float pq_ranking_selectivity = 7;
  uint32 training_sample_size = 8;
  float quality_threshold = 9;
  // Additional fields for compatibility
  bool enable_adaptive_training = 10;
  bool optimize_for_storage = 11;
  bool optimize_for_memory = 12;
  bool enable_simd_acceleration = 13;
  bool enable_binary = 14;
  bool enable_int8 = 15;
  bool enable_pq = 16;
  uint32 pq_segments = 17;
  uint32 pq_bits = 18;
  uint32 pq_codebooks = 19;
  float binary_threshold = 20;
  float int8_threshold = 21;
  float pq_threshold = 22;
  
  enum Strategy {
    SMART_DEFAULTS = 0;
    CUSTOM_LEVELS = 1; 
    MINIMAL = 2;
    AGGRESSIVE = 3;
  }
}

message QuantizationLevel {
  string level_id = 1;
  QuantizationType type = 2;
  uint32 bits = 3;
  // Additional fields for compatibility
  uint32 num_subvectors = 4;
  bool adaptive_subvectors = 5;
  float scale = 6;
  float offset = 7;
  bool clamp_values = 8;
  float threshold = 9;
  bool sign_based = 10;
  bool enable_in_storage = 11;
  bool enable_in_index = 12;
  uint32 search_priority = 13;
  float min_recall = 14;
  bool enable_validation = 15;
  
  enum QuantizationType {
    BINARY = 0;
    SCALAR = 1;
    PRODUCT = 2;
    UNIFORM = 3;
    NONE = 4;
  }
}

// Compression algorithms
enum CompressionAlgorithm {
  COMPRESSION_NONE = 0;
  COMPRESSION_ZSTD = 1;
  COMPRESSION_LZ4 = 2;
  COMPRESSION_SNAPPY = 3;
  COMPRESSION_GZIP = 4;
  COMPRESSION_BROTLI = 5;
  COMPRESSION_BZIP2 = 6;
  COMPRESSION_DEFLATE = 7;
  COMPRESSION_XZ = 8;
  COMPRESSION_ZLIB = 9;
  COMPRESSION_LZO = 10;
  COMPRESSION_LZ4HC = 11;
  COMPRESSION_LZMA = 12;
}

// Filterable data types
enum FilterableDataType {
  FILTERABLE_DATA_TYPE_UNSPECIFIED = 0;
  FILTERABLE_STRING = 1;
  FILTERABLE_INTEGER = 2;
  FILTERABLE_FLOAT = 3;
  FILTERABLE_BOOLEAN = 4;
  FILTERABLE_DATETIME = 5;
  FILTERABLE_ARRAY_STRING = 6;
  FILTERABLE_ARRAY_INTEGER = 7;
  FILTERABLE_ARRAY_FLOAT = 8;
}

// Filterable column specification
message FilterableColumnSpec {
  string name = 1;
  FilterableDataType data_type = 2;
  bool indexed = 3;
  bool supports_range = 4;
  optional uint32 estimated_cardinality = 5;
}

// Source content for provenance tracking
message SourceContent {
  oneof data {
    string text_content = 1;
    bytes binary_content = 2;
    string external_reference = 3;
  }
}

// Compression configuration
message CompressionConfig {
  CompressionAlgorithm algorithm = 1;
  optional uint32 level = 2;
  bool adaptive = 3;
  optional float min_ratio = 4;
  bool enable_quantization = 5;
  optional string quantization_type = 6;
  optional string normalization_method = 7;
  // Additional fields for compatibility
  uint32 block_size_kb = 8;
  bool dynamic_block_sizing = 9;
}

// Metadata value types
message MetadataValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

// Filter condition for metadata
message FilterCondition {
  string field_name = 1;
  int32 operation = 2;
  MetadataValue value = 3;
}

// Index configurations
message HnswConfig {
  uint32 m = 1;
  uint32 ef_construction = 2;
  uint32 ef_search = 3;
  uint32 max_partition_size = 4;
  bool adaptive_parameters = 5;
  bool use_simd = 6;
  uint32 memory_limit_mb = 7;
  bool lazy_loading = 8;
}

message IvfConfig {
  uint32 n_lists = 1;
  uint32 n_probe = 2;
  uint32 quantization_bits = 3;
  bool use_pq = 4;
  uint32 pq_subspaces = 5;
  bool train_on_insert = 6;
  uint32 min_train_size = 7;
}

message LshConfig {
  uint32 n_hash_tables = 1;
  uint32 n_hash_functions = 2;
  float bucket_width = 3;
  bool binary_vectors = 4;
  uint32 max_candidates = 5;
  int32 projection = 6; // RandomProjectionType enum
}

// Column encoding for VIPER
enum ColumnEncoding {
  COLUMN_ENCODING_UNSPECIFIED = 0;
  RLE = 1;
  DICTIONARY = 2; 
  DELTA = 3;
  PLAIN = 4;
}
