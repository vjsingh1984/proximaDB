syntax = "proto3";

package proximadb.v1;

// Removed google/protobuf/timestamp.proto - using int64 for serde compatibility
import "proximadb/v1/entity.proto";
import "proximadb/v1/relations.proto";
import "proximadb/v1/vector.proto"; // use v1 vector API types
import "proximadb/v1/vector_types.proto"; // use v1 vector types

// Core graph data model for ProximaDB's native graph database engine
// Follows proto-first design with zero-copy serialization for maximum performance

// Node represents a vertex in the graph with labels and properties
message Node {
  // Unique identifier for the node (UUID/ULID)
  string id = 1;
  
  // List of labels/types for this node (e.g., ["Person", "Employee"])
  repeated string labels = 2;
  
  // Properties as key-value pairs
  map<string, PropertyValue> properties = 3;
  
  // Optional embedding vector for semantic search integration
  optional EmbeddingVersion embedding = 4;
  
  // Metadata
  int64 created_at_ms = 5;  // Unix epoch milliseconds
  int64 updated_at_ms = 6;  // Unix epoch milliseconds
}

// Edge represents a directed relationship between two nodes
message Edge {
  // Unique identifier for the edge (UUID/ULID)
  string id = 1;
  
  // Source node ID
  string from_node_id = 2;
  
  // Target node ID  
  string to_node_id = 3;
  
  // Edge type/relationship name (e.g., "KNOWS", "WORKS_FOR")
  string edge_type = 4;
  
  // Properties as key-value pairs
  map<string, PropertyValue> properties = 5;
  
  // Optional weight for weighted graphs
  optional double weight = 6;
  
  // Metadata
  int64 created_at_ms = 7;  // Unix epoch milliseconds
  int64 updated_at_ms = 8;  // Unix epoch milliseconds
}

// PropertyValue supports various data types for flexible schema
// Keep oneof for memory efficiency - custom serde handles JSON serialization
message PropertyValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    PropertyArray array_value = 6;
    PropertyObject object_value = 7;
    VectorData vector_value = 8;  // Use VectorData message instead of repeated
  }
}

// Array of property values
message PropertyArray {
  repeated PropertyValue values = 1;
}

// Nested object property
message PropertyObject {
  map<string, PropertyValue> fields = 1;
}

// Graph traversal request
message TraversalRequest {
  // Graph ID
  string graph_id = 1;
  // Starting node ID
  string start_node_id = 2;
  
  // Maximum depth to traverse
  uint32 max_depth = 3;

  // Edge types to follow (empty = all types)
  repeated string edge_types = 4;

  // Node label filter
  repeated string node_labels = 5;

  // Property filters
  repeated PropertyFilter filters = 6;

  // Traversal algorithm
  TraversalAlgorithm algorithm = 7;

  // Maximum number of results
  optional uint32 limit = 8;

  // Optional timeout in milliseconds for traversal
  optional uint32 timeout_ms = 9;

  // Optional cap on frontier size to control memory usage
  optional uint32 max_frontier = 10;
}

// Property filter for graph queries
message PropertyFilter {
  string key = 1;
  PropertyFilterOperator operator = 2;
  PropertyValue value = 3;
}

// Supported property filter operators
enum PropertyFilterOperator {
  PROPERTY_FILTER_OPERATOR_UNSPECIFIED = 0;
  PROPERTY_FILTER_OPERATOR_EQUALS = 1;
  PROPERTY_FILTER_OPERATOR_NOT_EQUALS = 2;
  PROPERTY_FILTER_OPERATOR_GREATER_THAN = 3;
  PROPERTY_FILTER_OPERATOR_LESS_THAN = 4;
  PROPERTY_FILTER_OPERATOR_GREATER_EQUAL = 5;
  PROPERTY_FILTER_OPERATOR_LESS_EQUAL = 6;
  PROPERTY_FILTER_OPERATOR_CONTAINS = 7;
  PROPERTY_FILTER_OPERATOR_STARTS_WITH = 8;
  PROPERTY_FILTER_OPERATOR_ENDS_WITH = 9;
}

// Traversal algorithms
enum TraversalAlgorithm {
  TRAVERSAL_ALGORITHM_UNSPECIFIED = 0;
  TRAVERSAL_ALGORITHM_BFS = 1;
  TRAVERSAL_ALGORITHM_DFS = 2;
  TRAVERSAL_ALGORITHM_PARALLEL_BFS = 3;
}

// Graph traversal response
message TraversalResponse {
  // Visited nodes in traversal order
  repeated Node nodes = 1;
  
  // Edges traversed
  repeated Edge edges = 2;
  
  // Path information (node IDs in sequence)
  repeated GraphPath paths = 3;
  
  // Statistics
  TraversalStats stats = 4;
}

// NOTE: GraphPath is defined in relations.proto and imported above

// Traversal statistics
message TraversalStats {
  uint32 nodes_visited = 1;
  uint32 edges_traversed = 2;
  uint32 max_depth_reached = 3;
  uint64 execution_time_microseconds = 4;
}

// Node query request
message NodeQuery {
  // Graph ID
  string graph_id = 1;
  // Node labels to match
  repeated string labels = 2;
  
  // Property filters
  repeated PropertyFilter filters = 3;

  // Limit results
  optional uint32 limit = 4;

  // Skip/offset for pagination
  optional uint32 offset = 5;
  // Continuation token for pagination
  optional string continuation_token = 6;
}

// Edge query request
message EdgeQuery {
  // Graph ID
  string graph_id = 1;
  // Source node ID filter
  optional string from_node_id = 2;
  
  // Target node ID filter
  optional string to_node_id = 3;

  // Edge types to match
  repeated string edge_types = 4;

  // Property filters
  repeated PropertyFilter filters = 5;

  // Limit results
  optional uint32 limit = 6;

  // Skip/offset for pagination
  optional uint32 offset = 7;
  // Continuation token for pagination
  optional string continuation_token = 8;
}

// Batch operations for high-performance ingestion
message BatchNodeRequest {
  string graph_id = 1;
  repeated Node nodes = 2;
}

message BatchEdgeRequest {
  string graph_id = 1;
  repeated Edge edges = 2;
}

message BatchResponse {
  bool success = 1;
  repeated Node nodes = 2;
  repeated Edge edges = 3;
  optional string error_message = 4;
  // Continuation token for pagination
  optional string next_token = 10;
  // Legacy fields for backward compatibility
  optional uint32 created_count = 5;
  optional uint32 updated_count = 6;
  optional uint32 failed_count = 7;
  repeated string failed_ids = 8;
  repeated string error_messages = 9;
}

// Graph statistics and metadata

// Hybrid query request combining vector and graph components
message HybridSearchRequest {
  // Vector search component (v1)
  proximadb.v1.VectorSearchRequest vector_search_request = 1;
  
  // Graph traversal component
  TraversalRequest graph_traversal_request = 2;
  
  // Strategy for combining vector and graph results
  CombinationStrategy combination_strategy = 3;
  
  // Optional: Limit the number of results
  optional uint32 limit = 4;
  
  // Optional: Offset for pagination
  optional uint32 offset = 5;
}

// Strategy for combining vector and graph results
enum CombinationStrategy {
  COMBINATION_STRATEGY_UNSPECIFIED = 0;
  COMBINATION_STRATEGY_VECTOR_THEN_GRAPH = 1; // Perform vector search, then graph traversal from results
  COMBINATION_STRATEGY_GRAPH_THEN_VECTOR = 2; // Perform graph traversal, then vector search on results
  COMBINATION_STRATEGY_BALANCED = 3;          // Balance both components
}

// Hybrid query response
message HybridSearchResponse {
  // Combined results (nodes and edges)
  repeated Node nodes = 1;
  repeated Edge edges = 2;
  
  // Optional: Paths found during traversal
  repeated GraphPath paths = 3;
  
  // Statistics for the hybrid search
  HybridSearchStats stats = 4;

  // Vector search results (v1)
  repeated proximadb.v1.SearchVectorRecord vector_results = 5;
}

// Statistics for hybrid search
message HybridSearchStats {
  uint32 vector_results_count = 1;
  uint32 graph_traversal_count = 2;
  uint64 execution_time_microseconds = 3;
  // Add more detailed stats as needed
}

message GraphStats {
  uint64 total_nodes = 1;
  uint64 total_edges = 2;
  repeated LabelStats label_stats = 3;
  repeated EdgeTypeStats edge_type_stats = 4;
  uint64 total_properties = 5;
  uint64 memory_usage_bytes = 6;
  double average_degree = 7;
  uint32 max_degree = 8;
  uint32 connected_components = 9;
}

message LabelStats {
  string label = 1;
  uint64 count = 2;
}

message EdgeTypeStats {
  string edge_type = 1;
  uint64 count = 2;
}

// Additional request messages for gRPC service

message CreateNodeRequest {
  string graph_id = 1;
  Node node = 2;
}

message GetNodeRequest {
  string graph_id = 1;
  string node_id = 2;
}

message UpdateNodeRequest {
  string graph_id = 1;
  Node node = 2;
}

message DeleteNodeRequest {
  string graph_id = 1;
  string node_id = 2;
}

message CreateEdgeRequest {
  string graph_id = 1;
  Edge edge = 2;
}

message GetEdgeRequest {
  string graph_id = 1;
  string edge_id = 2;
}

message UpdateEdgeRequest {
  string graph_id = 1;
  Edge edge = 2;
}

message DeleteEdgeRequest {
  string graph_id = 1;
  string edge_id = 2;
}

message GetNeighborsRequest {
  string graph_id = 1;
  string node_id = 2;
  optional string edge_type = 3;
}

message GetStatsRequest {
  string graph_id = 1;
}

// Service definition for graph operations
service GraphService {
    // Node operations
    rpc CreateNode(CreateNodeRequest) returns (Node);
    rpc GetNode(GetNodeRequest) returns (Node);
    rpc UpdateNode(UpdateNodeRequest) returns (Node);
    rpc DeleteNode(DeleteNodeRequest) returns (Node);
    
    // Edge operations
    rpc CreateEdge(CreateEdgeRequest) returns (Edge);
    rpc GetEdge(GetEdgeRequest) returns (Edge);
    rpc UpdateEdge(UpdateEdgeRequest) returns (Edge);
    rpc DeleteEdge(DeleteEdgeRequest) returns (Edge);
    
    // Query operations
    rpc QueryNodes(NodeQuery) returns (BatchResponse);
    rpc QueryEdges(EdgeQuery) returns (BatchResponse);

    // Declarative query language support
    rpc ExecuteQuery(GraphQueryRequest) returns (GraphQueryResponse);

    // Graph operations
    rpc GetNeighbors(GetNeighborsRequest) returns (BatchResponse);
    rpc TraverseGraph(TraversalRequest) returns (TraversalResponse);
    // Server streaming traversal
    rpc StreamTraverse(TraversalRequest) returns (stream TraversalChunk);
    rpc GetGraphStats(GetStatsRequest) returns (GraphStats);
    // Shortest path between nodes
    rpc ShortestPath(ShortestPathRequest) returns (ShortestPathResponse);
    // Graph analysis
    rpc GetConnectedComponents(GetStatsRequest) returns (ConnectedComponentsResponse);
    rpc HasCycle(GetStatsRequest) returns (CycleCheckResponse);
    // Unique constraint DDL
    rpc AddUniqueConstraint(UniqueConstraintRequest) returns (UniqueConstraintResponse);
    rpc RemoveUniqueConstraint(UniqueConstraintRequest) returns (UniqueConstraintResponse);
    
    // Batch operations
    rpc BatchCreateNodes(BatchNodeRequest) returns (BatchResponse);
    rpc BatchCreateEdges(BatchEdgeRequest) returns (BatchResponse);

    // Hybrid operations
    rpc ExecuteHybridQuery(HybridSearchRequest) returns (HybridSearchResponse);
}

// Shortest path request/response
message ShortestPathRequest {
  string graph_id = 1;
  string start_node_id = 2;
  string target_node_id = 3;
  optional uint32 max_depth = 4;
  repeated string edge_types = 5;
  // Algorithm selection
  optional ShortestPathAlgorithm algorithm = 6; // default DIJKSTRA
  // Number of paths for k-shortest (if > 1, Yen's algorithm is used)
  optional uint32 k = 7;
}

message ShortestPathResponse {
  repeated string node_ids = 1;  // path nodes from start to target
  optional double total_weight = 2;
}

// Traversal streaming chunk
message TraversalChunk {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
  repeated GraphPath paths = 3;
  optional TraversalStats stats = 4; // present on final chunk
  bool done = 5; // true on final chunk
}

enum ShortestPathAlgorithm {
  SHORTEST_PATH_ALGORITHM_UNSPECIFIED = 0;
  SHORTEST_PATH_ALGORITHM_DIJKSTRA = 1;
  SHORTEST_PATH_ALGORITHM_ASTAR = 2;
}

// Unique constraint DDL
message UniqueConstraintRequest {
  string graph_id = 1;
  string label = 2;
  string property = 3;
}

message UniqueConstraintResponse {
  bool success = 1;
  optional string error_message = 2;
}

// Connected components response
message ConnectedComponentsResponse {
  repeated Component components = 1;
}

message Component {
  repeated string node_ids = 1;
}

// Cycle detection response
message CycleCheckResponse {
  bool has_cycle = 1;
}

// ===== Declarative Query Language Support =====

// Supported query languages for declarative graph queries
enum QueryLanguage {
  QUERY_LANGUAGE_UNSPECIFIED = 0;
  QUERY_LANGUAGE_NATIVE = 1;     // Existing property-based API (using NodeQuery, EdgeQuery, etc.)
  QUERY_LANGUAGE_CYPHER = 2;     // openCypher-compatible queries
  QUERY_LANGUAGE_GREMLIN = 3;    // Future: Gremlin support
}

// Graph query request using declarative query language
message GraphQueryRequest {
  // Graph ID to execute query against
  string graph_id = 1;

  // Query language (Cypher, Gremlin, or Native)
  QueryLanguage language = 2;

  // Query string (e.g., "MATCH (n:Person) WHERE n.age > 30 RETURN n")
  string query = 3;

  // Optional query parameters (for parameterized queries)
  map<string, PropertyValue> parameters = 4;

  // Optional query timeout in milliseconds
  optional uint32 timeout_ms = 5;

  // Optional execution options (e.g., explain, profile)
  optional QueryExecutionOptions options = 6;
}

// Query execution options
message QueryExecutionOptions {
  // Return query execution plan instead of results
  bool explain = 1;

  // Return query execution plan with profiling statistics
  bool profile = 2;

  // Read-only mode (prevents mutations)
  bool read_only = 3;

  // Maximum result rows to return
  optional uint32 max_rows = 4;
}

// Graph query response containing result rows
message GraphQueryResponse {
  // Result rows from query execution
  repeated ResultRow rows = 1;

  // Query execution statistics
  QueryExecutionStats stats = 2;

  // Optional execution plan (if explain=true or profile=true)
  optional QueryPlan query_plan = 3;

  // Optional error message if query failed
  optional string error_message = 4;
}

// A single result row with column bindings
message ResultRow {
  // Column values keyed by variable name or projection alias
  map<string, QueryValue> columns = 1;
}

// Value type for query results (supports nodes, edges, paths, primitives, lists)
message QueryValue {
  oneof value {
    // Graph element types
    Node node = 1;
    Edge edge = 2;
    GraphPath path = 3;

    // Primitive types
    PropertyValue property = 4;

    // Collection types
    QueryValueList list = 5;
    QueryValueMap map = 6;

    // Null value
    bool null = 7;  // true means NULL
  }
}

// List of query values
message QueryValueList {
  repeated QueryValue values = 1;
}

// Map of query values
message QueryValueMap {
  map<string, QueryValue> entries = 1;
}

// Query execution statistics
message QueryExecutionStats {
  // Execution time in microseconds
  uint64 execution_time_microseconds = 1;

  // Number of result rows returned
  uint32 rows_returned = 2;

  // Number of nodes accessed
  uint32 nodes_accessed = 3;

  // Number of edges traversed
  uint32 edges_traversed = 4;

  // Number of indexes used
  uint32 indexes_used = 5;

  // Compilation time (parsing + planning) in microseconds
  uint64 compilation_time_microseconds = 6;

  // Whether results were cached
  bool cache_hit = 7;
}

// Query execution plan (for EXPLAIN/PROFILE)
message QueryPlan {
  // Plan ID
  string plan_id = 1;

  // Root plan step
  PlanStep root_step = 2;

  // Estimated total cost
  double estimated_cost = 3;

  // Estimated result size
  uint32 estimated_result_size = 4;

  // Plan creation timestamp (milliseconds)
  int64 created_at_ms = 5;
}

// A step in the query execution plan
message PlanStep {
  // Step type (e.g., "NodeScan", "Expand", "Filter", "Project")
  string step_type = 1;

  // Step description (human-readable)
  string description = 2;

  // Estimated cost for this step
  double estimated_cost = 3;

  // Estimated cardinality (rows) for this step
  uint32 estimated_cardinality = 4;

  // Child plan steps
  repeated PlanStep children = 5;

  // Actual execution statistics (only present in PROFILE mode)
  optional PlanStepProfile profile = 6;
}

// Profiling statistics for a plan step (only available with profile=true)
message PlanStepProfile {
  // Actual execution time in microseconds
  uint64 actual_time_microseconds = 1;

  // Actual rows produced
  uint32 actual_rows = 2;

  // Number of times this step was executed
  uint32 executions = 3;
}
