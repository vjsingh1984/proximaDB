syntax = "proto3";

package proximadb.streaming.v1;

import "proximadb/v1/vector_types.proto";
import "proximadb/v1/types.proto";

// StreamingService provides real-time vector streaming capabilities
service StreamingService {
    // Bidirectional streaming for vector ingestion
    // Client sends vectors, server responds with acknowledgments and backpressure signals
    rpc StreamInsert(stream StreamInsertRequest) returns (stream StreamInsertResponse);

    // Server streaming for live query results
    // Subscribe to a query and receive updates when results change
    rpc SubscribeQuery(SubscribeRequest) returns (stream QueryUpdate);

    // Client streaming for batch ingestion with streaming acknowledgments
    rpc BatchStream(stream VectorBatch) returns (BatchStreamResponse);

    // Create a streaming session (for stateful streaming)
    rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

    // Close a streaming session
    rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

    // Get session status
    rpc GetSessionStatus(GetSessionStatusRequest) returns (GetSessionStatusResponse);
}

// Request message for StreamInsert RPC
message StreamInsertRequest {
    // Target collection name
    string collection = 1;

    // Vector records to insert
    repeated proximadb.v1.VectorRecord vectors = 2;

    // Client sequence number for ordering and acknowledgment
    uint64 sequence = 3;

    // Partition key for ordered delivery (optional)
    string partition_key = 4;

    // Session ID (optional, for stateful streaming)
    string session_id = 5;
}

// Response message for StreamInsert RPC
message StreamInsertResponse {
    // Acknowledged sequence numbers
    repeated uint64 acked_sequences = 1;

    // Backpressure signal
    BackpressureSignal backpressure = 2;

    // Server timestamp (nanoseconds since epoch)
    uint64 server_timestamp = 3;

    // Number of vectors successfully buffered
    uint32 vectors_buffered = 4;

    // Number of vectors dropped (buffer full)
    uint32 vectors_dropped = 5;
}

// Backpressure signal to control client send rate
message BackpressureSignal {
    // Backpressure level
    BackpressureLevel level = 1;

    // Suggested delay in milliseconds before next send
    uint32 suggested_delay_ms = 2;

    // Current buffer utilization percentage (0-100)
    uint32 buffer_percent = 3;

    // Estimated time to drain buffer in milliseconds
    uint32 drain_time_ms = 4;
}

// Backpressure levels
enum BackpressureLevel {
    BACKPRESSURE_LEVEL_UNSPECIFIED = 0;
    BACKPRESSURE_LEVEL_NONE = 1;
    BACKPRESSURE_LEVEL_LOW = 2;
    BACKPRESSURE_LEVEL_MEDIUM = 3;
    BACKPRESSURE_LEVEL_HIGH = 4;
    BACKPRESSURE_LEVEL_CRITICAL = 5;
}

// Request message for SubscribeQuery RPC
message SubscribeRequest {
    // Target collection name
    string collection = 1;

    // Query vector for similarity subscription
    repeated float vector = 2;

    // Number of results to track
    uint32 top_k = 3;

    // Minimum score change to trigger an update (0.0 = any change)
    float score_threshold = 4;

    // Metadata filter (optional)
    proximadb.v1.FilterCondition filter = 5;

    // Whether to include initial snapshot
    bool include_initial = 6;

    // Subscription ID (optional, for client tracking)
    string subscription_id = 7;

    // Maximum update frequency in milliseconds (rate limiting)
    uint32 max_update_interval_ms = 8;
}

// Update message for SubscribeQuery RPC
message QueryUpdate {
    // Type of update
    QueryUpdateType type = 1;

    // Full current top-k results (for INITIAL type)
    repeated proximadb.v1.SearchResult results = 2;

    // Changed result (for INSERT/REMOVE/UPDATE types)
    proximadb.v1.SearchResult changed = 3;

    // Position in result set (0-indexed)
    uint32 position = 4;

    // Server timestamp (nanoseconds since epoch)
    uint64 timestamp = 5;

    // Subscription ID (echoed from request)
    string subscription_id = 6;

    // Total result count
    uint32 total_count = 7;
}

// Types of query updates
enum QueryUpdateType {
    QUERY_UPDATE_TYPE_UNSPECIFIED = 0;
    // Initial snapshot of results
    QUERY_UPDATE_TYPE_INITIAL = 1;
    // New result entered top-k
    QUERY_UPDATE_TYPE_INSERT = 2;
    // Result left top-k
    QUERY_UPDATE_TYPE_REMOVE = 3;
    // Score or position changed significantly
    QUERY_UPDATE_TYPE_UPDATE = 4;
    // Heartbeat (keep-alive)
    QUERY_UPDATE_TYPE_HEARTBEAT = 5;
}

// Batch of vectors for BatchStream RPC
message VectorBatch {
    // Target collection name
    string collection = 1;

    // Vector records in this batch
    repeated proximadb.v1.VectorRecord vectors = 2;

    // Batch sequence number
    uint64 batch_sequence = 3;

    // Whether this is the last batch
    bool is_last = 4;

    // Partition key (optional)
    string partition_key = 5;
}

// Response for BatchStream RPC
message BatchStreamResponse {
    // Total batches received
    uint32 total_batches = 1;

    // Total vectors inserted
    uint64 total_vectors = 2;

    // Total vectors dropped
    uint64 vectors_dropped = 3;

    // Processing duration in milliseconds
    uint64 processing_time_ms = 4;

    // Errors encountered (if any)
    repeated BatchError errors = 5;
}

// Error in a batch
message BatchError {
    // Batch sequence that had the error
    uint64 batch_sequence = 1;

    // Error message
    string message = 2;

    // Number of vectors affected
    uint32 vectors_affected = 3;
}

// Request to create a streaming session
message CreateSessionRequest {
    // Target collection name
    string collection = 1;

    // Session configuration
    SessionConfig config = 2;

    // Client-provided session name (optional)
    string name = 3;
}

// Response for CreateSession
message CreateSessionResponse {
    // Server-assigned session ID
    string session_id = 1;

    // Actual buffer size allocated
    uint32 buffer_size = 2;

    // Session expiration time (seconds from now)
    uint32 expires_in_seconds = 3;
}

// Session configuration
message SessionConfig {
    // Buffer size (records)
    uint32 buffer_size = 1;

    // Rate limit (records/second, 0 = unlimited)
    uint64 rate_limit = 2;

    // Ordering mode
    OrderingMode ordering = 3;

    // Delivery semantics
    DeliverySemantics delivery = 4;

    // Flush interval in milliseconds
    uint32 flush_interval_ms = 5;

    // Session timeout in seconds
    uint32 timeout_seconds = 6;
}

// Ordering modes
enum OrderingMode {
    ORDERING_MODE_UNSPECIFIED = 0;
    // No ordering guarantees (fastest)
    ORDERING_MODE_UNORDERED = 1;
    // Ordered within partition
    ORDERING_MODE_PARTITION_ORDERED = 2;
    // Globally ordered (slowest)
    ORDERING_MODE_GLOBALLY_ORDERED = 3;
}

// Delivery semantics
enum DeliverySemantics {
    DELIVERY_SEMANTICS_UNSPECIFIED = 0;
    // May lose on failure
    DELIVERY_SEMANTICS_AT_MOST_ONCE = 1;
    // May duplicate on failure
    DELIVERY_SEMANTICS_AT_LEAST_ONCE = 2;
    // Exactly once (requires 2PC)
    DELIVERY_SEMANTICS_EXACTLY_ONCE = 3;
}

// Request to close a session
message CloseSessionRequest {
    // Session ID to close
    string session_id = 1;

    // Whether to wait for buffer drain
    bool drain = 2;
}

// Response for CloseSession
message CloseSessionResponse {
    // Final statistics
    SessionStats stats = 1;

    // Whether drain was successful
    bool drain_complete = 2;
}

// Request to get session status
message GetSessionStatusRequest {
    // Session ID
    string session_id = 1;
}

// Response for GetSessionStatus
message GetSessionStatusResponse {
    // Session ID
    string session_id = 1;

    // Target collection
    string collection = 2;

    // Current session state
    SessionState state = 3;

    // Session statistics
    SessionStats stats = 4;

    // Current backpressure level
    BackpressureLevel backpressure = 5;
}

// Session states
enum SessionState {
    SESSION_STATE_UNSPECIFIED = 0;
    SESSION_STATE_ACTIVE = 1;
    SESSION_STATE_PAUSED = 2;
    SESSION_STATE_DRAINING = 3;
    SESSION_STATE_CLOSED = 4;
    SESSION_STATE_ERROR = 5;
}

// Session statistics
message SessionStats {
    // Total records received
    uint64 records_received = 1;

    // Total records processed (flushed to storage)
    uint64 records_processed = 2;

    // Total records dropped
    uint64 records_dropped = 3;

    // Current buffer length
    uint32 buffer_length = 4;

    // Buffer capacity
    uint32 buffer_capacity = 5;

    // Session age in seconds
    uint64 age_seconds = 6;

    // Time since last activity in seconds
    uint64 idle_seconds = 7;

    // Average ingestion latency in microseconds
    uint64 avg_latency_us = 8;
}
