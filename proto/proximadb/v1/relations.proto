syntax = "proto3";

package proximadb.v1;

import "google/protobuf/empty.proto";
import "proximadb/v1/entity.proto";

option go_package = "github.com/proximadb/proto/go/proximadb/v1";

// NOTE: This file was synthesized based on the design document, as the exact content was not provided.

// Service for managing graph relationships between entities.
service RelationsService {
  // Creates a new relationship between two entities.
  rpc CreateRelation(CreateRelationRequest) returns (Relation);

  // Deletes a relationship between two entities.
  rpc DeleteRelation(DeleteRelationRequest) returns (google.protobuf.Empty);

  // Lists relations for a given entity.
  rpc ListRelations(ListRelationsRequest) returns (ListRelationsResponse);

  // Traverses the graph starting from a given entity.
  rpc Traverse(TraverseRequest) returns (TraverseResponse);
}

message CreateRelationRequest {
  string collection_id = 1;
  Relation relation = 2;
}

message DeleteRelationRequest {
  string collection_id = 1;
  string source_entity_id = 2;
  string target_entity_id = 3;
  string relation_type = 4;
}

message ListRelationsRequest {
  string collection_id = 1;
  string entity_id = 2;
  // Future: Add filters for relation type, properties, etc.
}

message ListRelationsResponse {
  repeated Relation relations = 1;
}

// Represents a single path in a graph traversal.
message GraphPath {
    repeated Entity entities = 1;
    repeated Relation relations = 2;
}

message TraverseRequest {
  string collection_id = 1;
  string start_entity_id = 2;
  uint32 max_depth = 3;
  // Future: Add filters for traversal.
}

message TraverseResponse {
  repeated GraphPath paths = 1;
}