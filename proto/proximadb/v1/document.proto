syntax = "proto3";

package proximadb.v1;

import "proximadb/v1/types.proto";
import "proximadb/v1/vector_types.proto";

// Document storage types for MongoDB-like JSON document capabilities
// Leverages existing SqlObject/SqlValue for nested document structure
// Reuses CompressionConfig/CompressionAlgorithm from vector_types.proto

// Document content wrapper
message DocumentContent {
  // The document data as nested SqlObject
  SqlObject document = 1;

  // Optional schema ID for validation
  optional string schema_id = 2;

  // JSON paths that should be indexed
  repeated string indexed_paths = 3;

  // Document type/kind for type-based queries
  optional string document_type = 4;
}

// Document collection configuration
message DocumentCollectionConfig {
  // Collection name
  string name = 1;

  // Optional JSON schema for validation
  optional string json_schema = 2;

  // Paths to create indexes on
  repeated IndexDefinition indexes = 3;

  // Enable full-text search (Tantivy)
  bool enable_fulltext = 4;

  // Paths to include in full-text search
  repeated string fulltext_paths = 5;

  // Time-to-live for documents (0 = no expiry)
  uint64 ttl_seconds = 6;

  // Compression settings
  CompressionConfig compression = 7;
}

// Index definition for document paths
message IndexDefinition {
  // JSON path expression (e.g., "$.user.email")
  string path = 1;

  // Index type
  DocIndexType index_type = 2;

  // Whether the index enforces uniqueness
  bool unique = 3;

  // Sparse index (only index documents with this field)
  bool sparse = 4;

  // Index name (auto-generated if not provided)
  optional string name = 5;
}

enum DocIndexType {
  DOC_INDEX_TYPE_UNSPECIFIED = 0;
  DOC_INDEX_TYPE_BTREE = 1;       // B+ tree for range queries
  DOC_INDEX_TYPE_HASH = 2;        // Hash for equality lookups
  DOC_INDEX_TYPE_INVERTED = 3;    // Inverted index for arrays
  DOC_INDEX_TYPE_FULLTEXT = 4;    // Full-text search index
  DOC_INDEX_TYPE_GEO = 5;         // Geospatial index (future)
}

// Note: CompressionConfig and CompressionAlgorithm are imported from vector_types.proto

// Document filter for queries
message DocumentFilter {
  // Filter conditions (AND logic)
  repeated DocFilterCondition conditions = 1;

  // Nested OR groups
  repeated DocumentFilter or_filters = 2;

  // Nested AND groups
  repeated DocumentFilter and_filters = 3;
}

message DocFilterCondition {
  // JSON path to filter on
  string path = 1;

  // Comparison operator
  DocFilterOperator operator = 2;

  // Value to compare against
  SqlValue value = 3;

  // For IN/NOT_IN operators
  repeated SqlValue values = 4;
}

enum DocFilterOperator {
  DOC_FILTER_OPERATOR_UNSPECIFIED = 0;
  DOC_FILTER_OPERATOR_EQ = 1;         // Equal
  DOC_FILTER_OPERATOR_NE = 2;         // Not equal
  DOC_FILTER_OPERATOR_GT = 3;         // Greater than
  DOC_FILTER_OPERATOR_GTE = 4;        // Greater than or equal
  DOC_FILTER_OPERATOR_LT = 5;         // Less than
  DOC_FILTER_OPERATOR_LTE = 6;        // Less than or equal
  DOC_FILTER_OPERATOR_IN = 7;         // In array
  DOC_FILTER_OPERATOR_NOT_IN = 8;     // Not in array
  DOC_FILTER_OPERATOR_CONTAINS = 9;   // Array contains value
  DOC_FILTER_OPERATOR_REGEX = 10;     // Regex match
  DOC_FILTER_OPERATOR_EXISTS = 11;    // Field exists
  DOC_FILTER_OPERATOR_TYPE = 12;      // Field is of type
  DOC_FILTER_OPERATOR_FULLTEXT = 13;  // Full-text search
}

// Document update operations
message DocumentUpdate {
  // Update operation type
  UpdateOperation operation = 1;

  // JSON path to update
  string path = 2;

  // Value for SET/PUSH/PULL operations
  optional SqlValue value = 3;
}

enum UpdateOperation {
  UPDATE_OPERATION_UNSPECIFIED = 0;
  UPDATE_OPERATION_SET = 1;       // Set field value
  UPDATE_OPERATION_UNSET = 2;     // Remove field
  UPDATE_OPERATION_INC = 3;       // Increment numeric field
  UPDATE_OPERATION_PUSH = 4;      // Push to array
  UPDATE_OPERATION_PULL = 5;      // Remove from array
  UPDATE_OPERATION_ADD_TO_SET = 6; // Add unique to array
  UPDATE_OPERATION_RENAME = 7;    // Rename field
}

// === API Messages ===

// Create document collection
message CreateDocumentCollectionRequest {
  DocumentCollectionConfig config = 1;
}

message CreateDocumentCollectionResponse {
  string collection_id = 1;
  bool success = 2;
}

// Insert document
message InsertDocumentRequest {
  string collection = 1;
  optional string id = 2;  // Auto-generated if not provided
  SqlObject document = 3;
}

message InsertDocumentResponse {
  string id = 1;
  uint64 version = 2;
}

// Get document by ID
message GetDocumentRequest {
  string collection = 1;
  string id = 2;
  // Projection: fields to include (empty = all)
  repeated string projection = 3;
}

message GetDocumentResponse {
  optional SqlObject document = 1;
  uint64 version = 2;
  bool found = 3;
}

// Update document
message UpdateDocumentRequest {
  string collection = 1;
  string id = 2;
  repeated DocumentUpdate updates = 3;
  // Optimistic locking: update only if version matches
  optional uint64 expected_version = 4;
}

message UpdateDocumentResponse {
  uint64 new_version = 1;
  bool success = 2;
}

// Delete document
message DeleteDocumentRequest {
  string collection = 1;
  string id = 2;
}

message DeleteDocumentResponse {
  bool deleted = 1;
}

// Query documents
message QueryDocumentsRequest {
  string collection = 1;
  DocumentFilter filter = 2;
  // Projection: fields to include
  repeated string projection = 3;
  // Sort order
  repeated SortField sort = 4;
  // Pagination
  uint32 limit = 5;
  uint32 offset = 6;
  // Include total count (slower)
  bool include_count = 7;
}

message SortField {
  string path = 1;
  SortOrder order = 2;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

message QueryDocumentsResponse {
  repeated DocumentResult documents = 1;
  optional uint64 total_count = 2;
  uint64 query_time_ms = 3;
}

message DocumentResult {
  string id = 1;
  SqlObject document = 2;
  uint64 version = 3;
  // Relevance score for full-text queries
  optional float score = 4;
}

// Aggregate documents
message AggregateDocumentsRequest {
  string collection = 1;
  DocumentFilter filter = 2;
  repeated AggregationStage pipeline = 3;
}

message AggregationStage {
  oneof stage {
    MatchStage match = 1;
    GroupStage group = 2;
    ProjectStage project = 3;
    SortStage sort = 4;
    LimitStage limit = 5;
    SkipStage skip = 6;
    UnwindStage unwind = 7;
    LookupStage lookup = 8;
  }
}

message MatchStage {
  DocumentFilter filter = 1;
}

message GroupStage {
  // Group key (JSON path or "_id" for all)
  string key = 1;
  // Aggregations to compute
  repeated Aggregation aggregations = 2;
}

message Aggregation {
  string output_field = 1;
  AggregationType type = 2;
  string input_path = 3;
}

enum AggregationType {
  AGGREGATION_TYPE_UNSPECIFIED = 0;
  AGGREGATION_TYPE_COUNT = 1;
  AGGREGATION_TYPE_SUM = 2;
  AGGREGATION_TYPE_AVG = 3;
  AGGREGATION_TYPE_MIN = 4;
  AGGREGATION_TYPE_MAX = 5;
  AGGREGATION_TYPE_FIRST = 6;
  AGGREGATION_TYPE_LAST = 7;
  AGGREGATION_TYPE_PUSH = 8;      // Collect into array
  AGGREGATION_TYPE_ADD_TO_SET = 9; // Collect unique
}

message ProjectStage {
  // Fields to include/exclude
  map<string, bool> fields = 1;
  // Computed fields
  map<string, string> computed = 2;
}

message SortStage {
  repeated SortField fields = 1;
}

message LimitStage {
  uint32 limit = 1;
}

message SkipStage {
  uint32 skip = 1;
}

message UnwindStage {
  // Array path to unwind
  string path = 1;
  // Preserve null/empty arrays
  bool preserve_null = 2;
}

// $lookup stage - perform left outer join with another collection
message LookupStage {
  // Foreign collection name to join with
  string from_collection = 1;
  // Field path in local documents to match
  string local_field = 2;
  // Field path in foreign documents to match
  string foreign_field = 3;
  // Output array field name for joined documents
  string as_field = 4;
}

message AggregateDocumentsResponse {
  repeated SqlObject results = 1;
  uint64 query_time_ms = 2;
}

// List document collections request
message ListDocumentCollectionsRequest {}

message ListDocumentCollectionsResponse {
  repeated DocumentCollectionInfo collections = 1;
}

message DocumentCollectionInfo {
  string name = 1;
  uint64 document_count = 2;
  uint64 storage_size_bytes = 3;
  repeated IndexDefinition indexes = 4;
}

// Delete collection request
message DeleteDocumentCollectionRequest {
  string collection = 1;
}

message DeleteDocumentCollectionResponse {
  bool success = 1;
}

// Document gRPC service
service DocumentService {
  // Collection operations
  rpc CreateCollection(CreateDocumentCollectionRequest) returns (CreateDocumentCollectionResponse);
  rpc ListCollections(ListDocumentCollectionsRequest) returns (ListDocumentCollectionsResponse);
  rpc DeleteCollection(DeleteDocumentCollectionRequest) returns (DeleteDocumentCollectionResponse);

  // Document CRUD
  rpc InsertDocument(InsertDocumentRequest) returns (InsertDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc UpdateDocument(UpdateDocumentRequest) returns (UpdateDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Query operations
  rpc QueryDocuments(QueryDocumentsRequest) returns (QueryDocumentsResponse);
  rpc AggregateDocuments(AggregateDocumentsRequest) returns (AggregateDocumentsResponse);
}
