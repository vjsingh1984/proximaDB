syntax = "proto3";

package proximadb.v1;

// Removed google/protobuf imports - using native types for serde compatibility
import "proximadb/v1/types.proto"; // For SqlValue

option go_package = "github.com/proximadb/proto/go/proximadb/v1";

// Entity represents a semantic unit with embeddings, metadata, and relationships
message Entity {
  string id = 1;
  repeated EmbeddingVersion embeddings = 2;
  TypedMetadata typed_metadata = 3;
  map<string, SqlValue> flexible_metadata = 4;  // Replace prost_types::Struct
  Provenance provenance = 5;
  repeated Relation relations = 6;
  TemporalInfo temporal = 7;
  string collection_id = 8;
}

message EmbeddingVersion {
  string model_id = 1;
  string model_version = 2;
  repeated float vector = 3;
  uint32 dimension = 4;
  int64 created_at_ms = 5;  // Unix epoch milliseconds
  map<string, string> model_params = 6;
  Modality modality = 7;
}

enum Modality {
  TEXT = 0;
  IMAGE = 1;
  AUDIO = 2;
  VIDEO = 3;
  MULTIMODAL = 4;
}

message TypedMetadata {
  map<string, TypedField> fields = 1;
}

message TypedField {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    StringArray string_array = 5;
    int64 timestamp_value_ms = 6;  // Unix epoch milliseconds
  }
  bool indexed = 7;
  bool filterable = 8;
}

message StringArray {
  repeated string values = 1;
}

message Provenance {
  string source_id = 1;
  string chunk_id = 2;
  uint32 chunk_position = 3;
  string extraction_method = 4;
  int64 extracted_at_ms = 5;  // Unix epoch milliseconds
  map<string, string> metadata = 6;
}

message TemporalInfo {
  int64 created_at_ms = 1;  // Unix epoch milliseconds
  int64 valid_from_ms = 2;  // Unix epoch milliseconds
  int64 valid_to_ms = 3;  // Unix epoch milliseconds
  bool is_current = 4;
  repeated TemporalVersion versions = 5;
}

message TemporalVersion {
  int64 timestamp_ms = 1;  // Unix epoch milliseconds
  string version_id = 2;
  map<string, string> changes = 3;
}

message Relation {
  string source_entity_id = 1;
  string target_entity_id = 2;
  string relation_type = 3;
  float weight = 4;
  int64 created_at_ms = 5;  // Unix epoch milliseconds
  map<string, string> properties = 6;
}

// Service definitions
service EntityService {
  rpc UpsertEntity(UpsertEntityRequest) returns (UpsertEntityResponse);
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);
  rpc SearchEntities(SearchEntitiesRequest) returns (SearchEntitiesResponse);
}

message UpsertEntityRequest {
  string collection_id = 1;
  Entity entity = 2;
  bool create_collection_if_missing = 3;
}

message UpsertEntityResponse {
  bool success = 1;
  string entity_id = 2;
  string message = 3;
}

message GetEntityRequest {
  string collection_id = 1;
  string entity_id = 2;
  bool include_embeddings = 3;
  bool include_relations = 4;
}

message GetEntityResponse {
  Entity entity = 1;
}

message DeleteEntityRequest {
  string collection_id = 1;
  string entity_id = 2;
  bool hard_delete = 3;
}

message DeleteEntityResponse {
  bool success = 1;
  string message = 2;
}

message SearchEntitiesRequest {
  string collection_id = 1;
  SimilarQuery similar = 2;
  MetadataFilter filters = 3;
  TemporalClause temporal = 4;
  uint32 top_k = 5;
  bool progressive = 6;
}

message SearchEntitiesResponse {
  repeated EntityResult results = 1;
  uint32 total = 2;
  PageInfo page_info = 3;
  ProgressInfo progress = 4;
}

message EntityResult {
  Entity entity = 1;
  float score = 2;
  map<string, string> debug_info = 3;
}

message VectorData {
  repeated float values = 1;
}

message SimilarQuery {
  oneof query {
    string text = 1;
    VectorData vector = 2;
    bytes raw_data = 3;
  }
  string model_id = 4;
  Modality modality = 5;
}

message MetadataFilter {
  repeated FilterClause clauses = 1;
  LogicalOp op = 2;
}

message FilterClause {
  string field = 1;
  ComparisonOp op = 2;
  oneof value {
    string string_value = 3;
    int64 int_value = 4;
    double double_value = 5;
    bool bool_value = 6;
  }
}

enum ComparisonOp {
  EQ = 0;
  NE = 1;
  GT = 2;
  GTE = 3;
  LT = 4;
  LTE = 5;
  IN = 6;
  NOT_IN = 7;
  CONTAINS = 8;
}

enum LogicalOp {
  AND = 0;
  OR = 1;
  NOT = 2;
}

message TemporalClause {
  oneof clause {
    int64 at_time_ms = 1;  // Unix epoch milliseconds
    TimeRange valid_between = 2;
  }
}

message TimeRange {
  int64 start_ms = 1;  // Unix epoch milliseconds
  int64 end_ms = 2;  // Unix epoch milliseconds
}

message PageInfo {
  string cursor = 1;
  bool has_more = 2;
}

message ProgressInfo {
  uint32 stage = 1;
  uint32 total_stages = 2;
  bool complete = 3;
}