syntax = "proto3";

package proximadb.v1;

import "google/protobuf/timestamp.proto";
import "proximadb/v1/collection_types.proto";
import "proximadb/v1/graph.proto";
import "proximadb/v1/vector_types.proto";

// Graph collection metadata and configuration
message GraphCollection {
  string graph_id = 1;                    // Unique identifier
  string name = 2;                        // Human-readable name
  string description = 3;                 // Documentation
  GraphSchema schema = 4;                 // Schema definitions
  GraphStorageConfig storage_config = 5;  // Storage settings
  GraphEngineConfig engine_config = 6;    // Engine selection/config
  AccessControl access_control = 7;       // Permissions
  optional GraphStats stats = 8;          // Statistics
  int64 created_at = 9;                   // Creation timestamp
  int64 updated_at = 10;                  // Last modification
}

// Schema definitions for graph structure validation
message GraphSchema {
  repeated NodeLabelSchema node_labels = 1;    // Allowed node types
  repeated EdgeTypeSchema edge_types = 2;      // Allowed edge types
  map<string, PropertySchema> properties = 3; // Property definitions
  repeated UniqueConstraint unique_constraints = 4; // Uniqueness rules
  bool strict_mode = 5;                        // Enforce schema strictly
}

// Schema for a specific node label
message NodeLabelSchema {
  string label = 1;                           // Label name (e.g., "Person")
  repeated string required_properties = 2;   // Must-have properties
  repeated string optional_properties = 3;   // Optional properties
  bool allow_additional_properties = 4;      // Schema flexibility
  map<string, PropertyConstraint> property_constraints = 5; // Property rules
}

// Schema for a specific edge type
message EdgeTypeSchema {
  string edge_type = 1;                      // Type name (e.g., "KNOWS")
  repeated string source_labels = 2;         // Valid source node labels
  repeated string target_labels = 3;         // Valid target node labels
  repeated string required_properties = 4;   // Must-have properties
  repeated string optional_properties = 5;   // Optional properties
  bool allow_additional_properties = 6;      // Schema flexibility
  Cardinality cardinality = 7;              // Relationship constraints
  map<string, PropertyConstraint> property_constraints = 8; // Property rules
}

// Property schema definition
message PropertySchema {
  string name = 1;                           // Property name
  PropertyType type = 2;                     // Data type
  bool required = 3;                         // Required flag
  PropertyValue default_value = 4;           // Default value
  repeated PropertyConstraint constraints = 5; // Validation rules
  string description = 6;                    // Documentation
}

// Property type enumeration
enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  STRING = 1;
  INTEGER = 2;
  FLOAT = 3;
  BOOLEAN = 4;
  DATETIME = 5;
  JSON = 6;
  ARRAY = 7;
  EMBEDDING = 8;                             // For vector properties
}

// Property constraints for validation
message PropertyConstraint {
  oneof constraint {
    StringConstraint string_constraint = 1;
    NumericConstraint numeric_constraint = 2;
    ArrayConstraint array_constraint = 3;
    RegexConstraint regex_constraint = 4;
  }
}

message StringConstraint {
  optional int32 min_length = 1;
  optional int32 max_length = 2;
  repeated string allowed_values = 3;        // Enumeration
}

message NumericConstraint {
  optional double min_value = 1;
  optional double max_value = 2;
  optional double multiple_of = 3;          // Must be multiple of this value
}

message ArrayConstraint {
  optional int32 min_items = 1;
  optional int32 max_items = 2;
  PropertyType item_type = 3;               // Type of array elements
}

message RegexConstraint {
  string pattern = 1;                       // Regular expression pattern
  string flags = 2;                         // Regex flags (i, m, s, etc.)
}

// Relationship cardinality constraints
enum Cardinality {
  CARDINALITY_UNSPECIFIED = 0;
  ONE_TO_ONE = 1;
  ONE_TO_MANY = 2;
  MANY_TO_ONE = 3;
  MANY_TO_MANY = 4;
}

// Unique constraint definition
message UniqueConstraint {
  string name = 1;                          // Constraint name
  repeated string node_labels = 2;          // Apply to these labels
  repeated string properties = 3;           // Properties that must be unique together
  string description = 4;                   // Documentation
}

// Storage configuration for the graph
message GraphStorageConfig {
  string engine_type = 1;                   // ORION, PULSAR, QUASAR
  string base_url = 2;                      // Storage location
  CompressionAlgorithm compression = 3;   // Compression setting
  bool enable_wal = 4;                      // Write-ahead logging
  int32 snapshot_interval_hours = 5;        // Snapshot frequency
  map<string, string> engine_specific_config = 6; // Engine-specific settings
}

// Engine configuration
message GraphEngineConfig {
  string engine_type = 1;                   // Engine selection
  int32 memory_pool_size_mb = 2;           // Memory allocation
  int32 csr_cache_size_mb = 3;             // CSR cache size
  bool enable_parallel_operations = 4;      // Parallel processing
  int32 max_traversal_depth = 5;           // Query depth limit
  map<string, string> advanced_config = 6; // Advanced settings
}

// Access control configuration
message AccessControl {
  repeated Permission permissions = 1;       // Permission list
  string owner = 2;                         // Graph owner
  repeated string admins = 3;               // Admin users
  repeated string readers = 4;              // Read-only users
  repeated string writers = 5;              // Read-write users
}

message Permission {
  string user_or_role = 1;                  // User ID or role name
  PermissionType type = 2;                  // Permission type
  repeated string scopes = 3;               // Specific scopes (labels, etc.)
}

enum PermissionType {
  PERMISSION_TYPE_UNSPECIFIED = 0;
  READ = 1;
  WRITE = 2;
  ADMIN = 3;
  DELETE = 4;
}

// Request to create a new graph collection
message CreateGraphRequest {
  string graph_id = 1;                      // Required: unique identifier
  optional string name = 2;                 // Optional: human-readable name
  optional string description = 3;          // Optional: documentation
  optional GraphSchema schema = 4;          // Optional: schema definition
  optional GraphStorageConfig storage_config = 5; // Optional: storage settings
  optional GraphEngineConfig engine_config = 6;   // Optional: engine config
  optional AccessControl access_control = 7;      // Optional: permissions
}

// Request to update graph schema
message UpdateSchemaRequest {
  string graph_id = 1;                      // Graph to update
  GraphSchema schema = 2;                   // New schema
  bool validate_existing_data = 3;          // Check existing data against schema
  bool force_migration = 4;                 // Force migration even if validation fails
}

// Response for schema validation
message SchemaValidationResult {
  bool valid = 1;                           // Overall validation result
  repeated ValidationError errors = 2;      // Validation errors
  repeated ValidationWarning warnings = 3;  // Non-blocking warnings
  int64 affected_nodes = 4;                 // Nodes that would be affected
  int64 affected_edges = 5;                 // Edges that would be affected
}

message ValidationError {
  string message = 1;                       // Error description
  string path = 2;                         // Location in schema
  string severity = 3;                     // ERROR, WARNING, INFO
}

message ValidationWarning {
  string message = 1;                       // Warning description
  string path = 2;                         // Location in schema
  string suggestion = 3;                   // Suggested fix
}