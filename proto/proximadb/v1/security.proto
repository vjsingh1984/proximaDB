syntax = "proto3";

package proximadb.v1;

import "google/protobuf/timestamp.proto";
import "proximadb/v1/types.proto";

// Security and RBAC service for ProximaDB
// Provides role-based access control, user management, and audit capabilities

// ============================================================================
// Role Management
// ============================================================================

// RBAC role definition
message Role {
  // Unique role identifier
  string role_id = 1;

  // Human-readable role name
  string role_name = 2;

  // Tenant ID (empty for system-wide roles)
  string tenant_id = 3;

  // List of permissions granted to this role
  repeated string permissions = 4;

  // Role description
  string description = 5;

  // True if this is a system role (cannot be deleted)
  bool is_system_role = 6;

  // Creation timestamp
  google.protobuf.Timestamp created_at = 7;

  // Creator user ID
  string created_by = 8;
}

// Create or update a role
message CreateRoleRequest {
  // Role details
  Role role = 1;

  // Caller authentication context
  AuthContext auth_context = 2;
}

message CreateRoleResponse {
  // Created role
  Role role = 1;
}

// List roles in a tenant
message ListRolesRequest {
  // Tenant ID (empty for system-wide roles)
  string tenant_id = 1;

  // Include system roles
  bool include_system_roles = 2;

  // Pagination
  int32 page_size = 3;
  string page_token = 4;
}

message ListRolesResponse {
  // List of roles
  repeated Role roles = 1;

  // Next page token
  string next_page_token = 2;
}

// Delete a role
message DeleteRoleRequest {
  // Role ID to delete
  string role_id = 1;

  // Caller authentication context
  AuthContext auth_context = 2;
}

message DeleteRoleResponse {
  // True if role was deleted
  bool success = 1;
}

// ============================================================================
// User Role Assignment
// ============================================================================

// User role assignment
message UserRoleAssignment {
  // User ID
  string user_id = 1;

  // Tenant ID
  string tenant_id = 2;

  // List of role IDs assigned to user
  repeated string roles = 3;

  // Assignment timestamp
  int64 assigned_at = 4;

  // Who made the assignment
  string assigned_by = 5;

  // Optional expiration timestamp
  google.protobuf.Timestamp expires_at = 6;
}

// Assign role to user
message AssignRoleRequest {
  // User ID
  string user_id = 1;

  // Tenant ID
  string tenant_id = 2;

  // Role IDs to assign
  repeated string roles = 3;

  // Caller authentication context
  AuthContext auth_context = 4;

  // Optional expiration
  google.protobuf.Timestamp expires_at = 5;
}

message AssignRoleResponse {
  // Updated role assignment
  UserRoleAssignment assignment = 1;
}

// Remove role from user
message RevokeRoleRequest {
  // User ID
  string user_id = 1;

  // Tenant ID
  string tenant_id = 2;

  // Role IDs to revoke
  repeated string roles = 3;

  // Caller authentication context
  AuthContext auth_context = 4;
}

message RevokeRoleResponse {
  // True if roles were revoked
  bool success = 1;
}

// List user roles
message ListUserRolesRequest {
  // User ID
  string user_id = 1;

  // Tenant ID
  string tenant_id = 2;
}

message ListUserRolesResponse {
  // User role assignments
  repeated UserRoleAssignment assignments = 1;
}

// ============================================================================
// Permission Validation
// ============================================================================

// RBAC validation request
message ValidateAccessRequest {
  // User ID
  string user_id = 1;

  // Tenant ID
  string tenant_id = 2;

  // Resource type (collection, graph, system, etc.)
  string resource_type = 3;

  // Resource ID (collection_id, graph_id, etc.)
  string resource_id = 4;

  // Operation (read, write, delete, admin, vector_search, etc.)
  string operation = 5;

  // Data model (vector, graph, document, observability)
  string data_model = 6;
}

// RBAC validation response
message ValidateAccessResponse {
  // True if access is allowed
  bool allowed = 1;

  // Reason for denial (if not allowed)
  string reason = 2;

  // Missing permissions (if not allowed)
  repeated string missing_permissions = 3;

  // Effective permissions checked
  repeated string checked_permissions = 4;
}

// Batch permission validation
message BatchValidateAccessRequest {
  repeated ValidateAccessRequest requests = 1;
}

message BatchValidateAccessResponse {
  repeated ValidateAccessResponse responses = 1;
}

// ============================================================================
// Audit and Events
// ============================================================================

// RBAC audit event
message RBACAuditEvent {
  // Event timestamp (nanoseconds since epoch)
  int64 timestamp_ns = 1;

  // User ID who performed the action
  string user_id = 2;

  // Tenant ID
  string tenant_id = 3;

  // Operation performed
  string operation = 4;

  // Resource type
  string resource_type = 5;

  // Resource ID
  string resource_id = 6;

  // True if access was allowed
  bool allowed = 7;

  // Reason for denial (if not allowed)
  string denial_reason = 8;

  // Session ID
  string session_id = 9;

  // IP address
  string ip_address = 10;

  // User agent
  string user_agent = 11;
}

// List audit events request
message ListAuditEventsRequest {
  // Tenant ID
  string tenant_id = 1;

  // Filter by user ID
  optional string user_id = 2;

  // Filter by resource type
  optional string resource_type = 3;

  // Filter by resource ID
  optional string resource_id = 4;

  // Time range (start)
  int64 start_time_ns = 5;

  // Time range (end)
  int64 end_time_ns = 6;

  // Only show denied access
  bool denied_only = 7;

  // Pagination
  int32 page_size = 8;
  string page_token = 9;
}

message ListAuditEventsResponse {
  // List of audit events
  repeated RBACAuditEvent events = 1;

  // Next page token
  string next_page_token = 2;

  // Total count
  int64 total_count = 3;
}

// ============================================================================
// Authentication Context
// ============================================================================

// Authentication context for requests
message AuthContext {
  // User ID
  string user_id = 1;

  // Tenant ID
  string tenant_id = 2;

  // Session ID
  string session_id = 3;

  // Authentication method (jwt, sso, api_key, etc.)
  string auth_method = 4;

  // Token expiration
  google.protobuf.Timestamp expires_at = 5;

  // Client IP address
  string ip_address = 6;

  // User agent
  string user_agent = 7;
}

// ============================================================================
// Tenant Security Configuration
// ============================================================================

// Security policy for a tenant
message TenantSecurityPolicy {
  // Tenant ID
  string tenant_id = 1;

  // Require MFA for all operations
  bool require_mfa = 2;

  // IP whitelist (CIDR ranges)
  repeated string allowed_ip_ranges = 3;

  // Session timeout in seconds
  int32 session_timeout_seconds = 4;

  // Require password for sensitive operations
  bool require_password_confirmation = 5;

  // Audit all operations
  bool audit_all_operations = 6;

  // Data encryption requirements
  DataEncryptionPolicy encryption_policy = 7;
}

// Data encryption policy
message DataEncryptionPolicy {
  // Encrypt data at rest
  bool encrypt_at_rest = 3;

  // Encrypt data in transit
  bool encrypt_in_transit = 4;

  // Encryption key ID
  string key_id = 5;

  // Key rotation interval in days
  int32 key_rotation_days = 6;
}

// ============================================================================
// Service Definition
// ============================================================================

// Security service for RBAC operations
service SecurityService {
  // Permission validation
  rpc ValidateAccess(ValidateAccessRequest) returns (ValidateAccessResponse);
  rpc BatchValidateAccess(BatchValidateAccessRequest) returns (BatchValidateAccessResponse);

  // Role management
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // User role assignments
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse);

  // Audit and compliance
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // Tenant security
  rpc GetTenantSecurityPolicy(GetTenantSecurityPolicyRequest) returns (GetTenantSecurityPolicyResponse);
  rpc SetTenantSecurityPolicy(SetTenantSecurityPolicyRequest) returns (SetTenantSecurityPolicyResponse);
}

// Get tenant security policy
message GetTenantSecurityPolicyRequest {
  string tenant_id = 1;
  AuthContext auth_context = 2;
}

message GetTenantSecurityPolicyResponse {
  TenantSecurityPolicy policy = 1;
}

// Set tenant security policy
message SetTenantSecurityPolicyRequest {
  TenantSecurityPolicy policy = 1;
  AuthContext auth_context = 2;
}

message SetTenantSecurityPolicyResponse {
  bool success = 1;
}
