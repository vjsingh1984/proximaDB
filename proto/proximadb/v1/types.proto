syntax = "proto3";

package proximadb.v1;

import "google/protobuf/struct.proto"; // For NullValue

// SQL EXECUTION (wire-efficient row encoding)

// Array wrapper for nested values (oneof cannot be repeated directly)
message SqlArray {
  repeated SqlValue values = 1;
}

// Object wrapper for nested key/value metadata
message SqlObject {
  map<string, SqlValue> fields = 1;
}

// Simple typed value for SQL parameters and row fields
// Keep oneof for memory efficiency, add custom serde implementation
message SqlValue {
  oneof value {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
    int64 int64_value = 4;
    bytes bytes_value = 5;
    google.protobuf.NullValue null_value = 6;
    SqlArray array_value = 7;
    SqlObject object_value = 8;
    bytes jsonb_value = 9;
  }
}

// Single SQL row field
message SqlRowField {
  string key = 1;
  SqlValue value = 2;
}

// SQL row with optional similarity score
message SqlRow {
  repeated SqlRowField fields = 1;
  optional float similarity = 2;
}

message ExecuteSqlRequest {
  string query = 1;
  repeated SqlValue parameters = 2;
  optional string collection = 3;  // Optional collection context
  optional uint32 limit = 4;        // Optional limit override
  optional uint32 offset = 5;       // Optional offset override
}

message ExecuteSqlResponse {
  repeated SqlRow rows = 1;
  uint64 rows_scanned = 2;
  uint64 rows_returned = 3;
  uint64 execution_time_ms = 4;
  repeated string columns = 5;
  repeated string column_types = 6;
}
