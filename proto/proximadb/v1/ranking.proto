// R-7c.4a — Wire schema for the multi-phase ranking pipeline.
//
// Mirrors the REST DTOs in src/network/rest/v1/rank.rs and the
// in-process types in proximadb_rank_core. Hand-written prost-derived
// Rust mirrors live in crates/foundation/proximadb-proto/src/ranking.rs
// until the next proto regeneration pass (which should consume this
// file as the source of truth).
//
// Spec: roadmap/RANKING_FRAMEWORK_SPEC_2026_05_23.md §4.9.2.

syntax = "proto3";

package proximadb.v1.ranking;

// One per-feature contribution to a ranking score. Producers attach
// these when match_features / summary_features are declared on the
// profile. `contribution` is typically `value * weight` but the
// producer decides — clients should treat it as opaque.
message ScoreComponent {
  string name = 1;
  double value = 2;
  double weight = 3;
  double contribution = 4;
}

// Multi-component score produced by the rank pipeline.
// `phase` mirrors PhaseId: 0 = FIRST, 1 = SECOND, 2 = GLOBAL.
// Empty components is the common case — populated only when the
// profile requests match-features.
message ScoreVector {
  float primary = 1;
  uint32 phase = 2;
  repeated ScoreComponent components = 3;
}

// Per-phase override knobs on top of the resolved profile.
// Each field is optional; absent fields keep profile defaults.
message PhaseOverride {
  optional uint32 rerank_count = 1;
  optional uint32 batch_size = 2;
}

message RankOverrides {
  optional PhaseOverride second_phase = 1;
  optional PhaseOverride global_phase = 2;
}

// Rank pipeline request — mirrors REST RankSearchRequest.
message RankSearchRequest {
  string collection = 1;
  repeated float query_vector = 2;
  // Optional text for the BM25 side of hybrid retrieval (R-7c.3.1).
  optional string query_text = 3;
  // Result count after the global phase.
  uint32 k = 4;
  // Named profile in the ProfileRegistry. Absent = retrieval-only path.
  optional string rank_profile = 5;
  optional RankOverrides rank_overrides = 6;
}

// One scored hit on the wire.
message ScoredHit {
  // Backend's original id when CandidateBatch.original_ids is set
  // (R-7c.3.2); otherwise stringified DocHandle.
  string id = 1;
  float score = 2;
  optional ScoreVector score_vector = 3;
  // Per-feature values requested via profile.match_features.
  map<string, double> match_features = 4;
  // Per-feature values requested via profile.summary_features.
  map<string, double> summary_features = 5;
}

// Rank pipeline response.
message RankSearchResponse {
  repeated ScoredHit hits = 1;
  bool phase_truncated = 2;
  optional string rank_profile = 3;
  optional uint32 rank_profile_version = 4;
}

// gRPC service — handler wiring lands in R-7c.4a.1.
service RankService {
  rpc RankSearch(RankSearchRequest) returns (RankSearchResponse);
}
