syntax = "proto3";

package proximadb;

import "google/protobuf/struct.proto";

// ============================================================================
// ProximaDB gRPC Protocol - Proto-First Architecture
// - Vector INSERT/UPSERT: Pure proto messages for type safety and performance
// - Vector UPDATE/DELETE/SEARCH: Native proto for consistency
// - Collection operations: Single unified endpoint for all metadata operations
// ============================================================================

service ProximaDB {
  // Collection management - single unified endpoint for flexibility
  rpc CollectionOperation(CollectionRequest) returns (CollectionResponse);
  
  // Vector operations - optimized batch operations
  rpc VectorBatch(VectorBatchRequest) returns (VectorOperationResponse);         // Unified batch: insert/upsert/delete
  rpc VectorSearch(VectorSearchRequest) returns (VectorOperationResponse);       // Search via gRPC
  rpc VectorGet(VectorGetRequest) returns (VectorOperationResponse);             // Get single vector by ID
  
  // Health and monitoring
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
}

// ============================================================================
// ENUMS - Aligned with Avro schema
// ============================================================================

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  COSINE = 1;
  EUCLIDEAN = 2;
  DOT_PRODUCT = 3;
  HAMMING = 4;
  MANHATTAN = 5;
  JACCARD = 6;
  CUSTOM = 7;
  CHEBYSHEV = 8;
  CANBERRA = 9;
  MINKOWSKI = 10;
  ANGULAR = 11;
  BRAY_CURTIS = 12;
  HELLINGER = 13;
}

enum StorageEngine {
  STORAGE_ENGINE_UNSPECIFIED = 0;
  VIPER = 1;
  SST = 2;
  MMAP = 3;
  HYBRID = 4;
  SWIFT = 5;    // Storage With Instant Fast Traversal - zero-overhead vector storage
  NOVA = 6;     // Next-gen Optimized Vector Analytics - columnar quantization
}

enum IndexingAlgorithm {
  INDEXING_ALGORITHM_UNSPECIFIED = 0;
  HNSW = 1;
  IVF = 2;
  PQ = 3;
  FLAT = 4;
  ANNOY = 5;
  LSH = 6;
}

enum CollectionOperation {
  COLLECTION_OPERATION_UNSPECIFIED = 0;
  COLLECTION_CREATE = 1;
  COLLECTION_UPDATE = 2;
  COLLECTION_GET = 3;
  COLLECTION_LIST = 4;
  COLLECTION_DELETE = 5;
  COLLECTION_MIGRATE = 6;
  COLLECTION_GET_ID_BY_NAME = 7;  // Get collection UUID by name
}

enum VectorOperation {
  VECTOR_OPERATION_UNSPECIFIED = 0;
  VECTOR_BATCH = 1;      // Unified batch operation (insert/upsert/delete via expires_at)
  VECTOR_SEARCH = 2;     // Vector search operation
  VECTOR_GET = 3;        // Get single vector by ID
}

// MutationType removed - using unified batch operations with expires_at for deletes

// ============================================================================
// CORE DATA TYPES - Aligned with Avro schema
// ============================================================================

// Metadata item with type-safe value storage
message MetadataItem {
  string key = 1;
  
  // Type-safe value storage using oneof
  oneof value {
    string string_value = 2;
    double number_value = 3;
    bool bool_value = 4;
    // Note: arrays and objects can be added later if needed
    // e.g., repeated string array_value = 5;
    // e.g., google.protobuf.Struct object_value = 6;
  }
}

// Input record for insert/update operations - optimized for storage
message VectorRecord {
  optional string id = 1;                    // Auto-generated if null
  repeated float vector = 2;                 // REQUIRED for inserts
  repeated MetadataItem metadata = 3;        // Efficient key-value metadata (no JSON parsing)
  uint32 timestamp = 4;                      // Record timestamp - seconds since epoch (compact, unsigned)
  optional uint32 updated_at = 5;            // Only set if different from timestamp (saves bytes when not updated)
  optional uint32 expires_at = 6;            // TTL support (seconds since epoch)
  optional uint32 version = 7;               // For optimistic concurrency (optional to save bytes)
  
  // Storage-optimized fields (directly serializable to SST/Parquet)
  optional bytes quantized_vector = 8;       // Pre-quantized vector data (avoids re-quantization)
}

// Output record for search results - optimized for client consumption
message SearchVectorRecord {
  string id = 1;                             // Vector ID (always present in results)
  repeated float vector = 2;                 // Vector data (if requested)
  repeated MetadataItem metadata = 3;        // Metadata (if requested)
  
  // Search-specific fields
  int32 rank = 4;                            // Search result rank (1-based)
  float score = 5;                           // Similarity score
  float distance = 6;                        // Distance value
  
  // Optional fields for detailed results
  optional uint32 version = 7;               // Version (if versioning enabled)
  optional uint32 timestamp = 8;             // When record was created
  optional string collection_id = 9;         // Source collection (for multi-collection search)
}

// Native typed metadata supporting multiple value types
message MetadataMap {
  map<string, MetadataValue> fields = 1;
}

message MetadataValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    StringArray string_array = 5;
    Int64Array int_array = 6;
    DoubleArray double_array = 7;
  }
}

message StringArray {
  repeated string values = 1;
}

message Int64Array {
  repeated int64 values = 1;
}

message DoubleArray {
  repeated double values = 1;
}

message CollectionConfig {
  // ============================================================================
  // CORE CONFIGURATION (Required)
  // ============================================================================
  string name = 1;                                      // Collection name (min 8 chars)
  int32 dimension = 2;                                  // Vector dimension
  DistanceMetric distance_metric = 3;                   // Distance metric for similarity
  
  // ============================================================================
  // STORAGE CONFIGURATION
  // ============================================================================
  StorageEngine storage_engine = 4;                     // Storage engine type (VIPER, SST, etc.)
  optional StorageConfig storage_config = 5;            // Complete storage configuration (renamed from storage_engine_config)
  
  // ============================================================================
  // INDEX CONFIGURATION
  // ============================================================================
  repeated IndexConfig index_configs = 6;               // Multiple index configurations
  optional string primary_index = 7;                    // Primary index name (renamed from primary_index_name)
  optional bool auto_index_selection = 8;               // Auto-select best index (renamed from enable_automatic_index_selection)
  
  // ============================================================================
  // SCHEMA CONFIGURATION
  // ============================================================================
  repeated FilterableColumnSpec filterable_columns = 9; // Metadata columns for filtering
  optional QuantizationConfig quantization = 10;        // Vector quantization (renamed from quantization_config)
  
  // ============================================================================
  // METADATA
  // ============================================================================
  optional string description = 11;                     // Human-readable description
  repeated string tags = 12;                            // Tags for categorization
  optional string owner = 13;                           // Owner/creator
  
  // Note: Removed separate compression field - it's now part of StorageConfig
  // Note: Removed storage_location - it's now part of StorageConfig
  // Note: Removed primary_indexing_algorithm - use index_configs instead
}

// Advanced index configuration with per-collection customization
message IndexConfig {
  string index_name = 1;                           // Unique name for this index
  IndexingAlgorithm algorithm = 2;                 // Algorithm for this specific index
  IndexUpdateMode update_mode = 3;                 // Sync/async index updates
  optional int64 async_update_timeout_ms = 4;      // Timeout for async updates
  optional int32 async_update_batch_size = 5;      // Batch size for async updates
  bool enable_background_optimization = 6;         // Background index optimization
  
  // Algorithm-specific configurations
  optional HnswConfig hnsw_config = 7;
  optional IvfConfig ivf_config = 8;
  optional FlatConfig flat_config = 9;             // Configuration for flat/brute-force index
  optional PqConfig pq_config = 10;                // Configuration for product quantization index
  optional AnnoyConfig annoy_config = 11;          // Configuration for Annoy index
  optional LshConfig lsh_config = 12;              // Configuration for LSH index
  
  // Performance tuning
  optional int32 build_concurrency = 13;           // Parallel index building
  optional int64 memory_limit_mb = 14;             // Memory limit per index
  optional int32 checkpoint_interval_ms = 15;      // Index checkpoint frequency
  
  // Index usage configuration
  bool is_primary = 16;                            // Whether this is the primary index
  repeated string use_cases = 17;                  // When to use this index (e.g., "high_recall", "fast_search")
  optional float selectivity_threshold = 18;       // Use this index when query selectivity is above threshold
  
  // Quantization configuration for this index
  // DEFAULT: When collection has quantization with progressive search enabled,
  //          index inherits same settings (perfect recall via progressive resolution)
  //          Otherwise, index uses FP32 for quality preservation
  // Progressive search: Binary filter → PQ ranking → FP32 reranking = 100% recall
  // NOTE: Distance metric ALWAYS inherited from collection for consistency
  optional bool use_quantization = 19;             // Default: inherit if progressive, else FP32
  optional QuantizationConfig quantization_override = 20; // Override specific quantization settings (rare)
  
  // AXIS queue consumption preferences (NEW: for queue-based indexing)
  optional VectorRepresentation queue_representation = 21; // What vector format to consume from queue
}

// Index update behavior modes
enum IndexUpdateMode {
  INDEX_UPDATE_MODE_UNSPECIFIED = 0;
  SYNCHRONOUS = 1;                                 // Block flush until index updated (default)
  ASYNCHRONOUS = 2;                                // Return from flush immediately
  HYBRID_MODE = 3;                                 // Sync for small batches, async for large
}

// Vector representation preference for AXIS queue consumption
// Enables indexes to specify what type of vectors they want from the queue
enum VectorRepresentation {
  VECTOR_REPRESENTATION_UNSPECIFIED = 0;          // Use system default
  FP32_ONLY = 1;                                   // Index wants full-precision FP32 vectors only
  QUANTIZED_ONLY = 2;                              // Index wants quantized vectors only (for performance)
  BOTH = 3;                                        // Index wants both FP32 and quantized (for hybrid approaches)
  AUTO = 4;                                        // Let system decide based on collection quantization config
}

// HNSW algorithm configuration
message HnswConfig {
  int32 m = 1;                                     // Number of bi-directional links (default: 16)
  int32 ef_construction = 2;                       // Size of candidate set during construction (default: 200)
  int32 ef_search = 3;                             // Search parameter for recall (default: 50)
  int32 max_partition_size = 4;                    // Maximum vectors per partition (default: 100000)
  bool adaptive_parameters = 5;                    // Dynamic parameter tuning (default: true)
  bool use_simd = 6;                              // SIMD optimizations (default: true)
  int32 memory_limit_mb = 7;                      // Memory limit per partition (default: 512)
  bool lazy_loading = 8;                          // Lazy loading for large partitions (default: true)
  int32 prune_connections = 9;                    // Connection pruning threshold (default: 0 = disabled)
  float level_multiplier = 10;                    // Level generation multiplier (default: 1/ln(2))
}

// IVF algorithm configuration
message IvfConfig {
  int32 n_lists = 1;                              // Number of clusters (default: sqrt(N))
  int32 n_probe = 2;                              // Number of clusters to search (default: 1)
  int32 quantization_bits = 3;                    // Bits for quantization (default: 8)
  bool use_pq = 4;                                // Use product quantization (default: false)
  int32 pq_subspaces = 5;                         // PQ subspaces (default: 8)
  bool train_on_insert = 6;                       // Retrain on every insert (default: false)
  int32 min_train_size = 7;                       // Minimum size to trigger training (default: 1000)
}

// Flat/Brute-force index configuration
message FlatConfig {
  bool enable_simd = 1;                           // Use SIMD optimizations (default: true)
  int32 batch_size = 2;                           // Batch size for distance calculations (default: 1000)
  bool enable_parallel_search = 3;                // Parallel search execution (default: true)
}

// Product Quantization index configuration
message PqConfig {
  int32 subvectors = 1;                           // Number of subvectors (default: 8)
  int32 bits_per_subvector = 2;                   // Bits per subvector (default: 8)
  int32 training_sample_count = 3;                // Training samples (default: 10000)
  bool enable_reranking = 4;                      // Enable full-precision reranking (default: true)
}

// Annoy index configuration  
message AnnoyConfig {
  int32 n_trees = 1;                              // Number of trees (default: 10)
  int32 search_k = 2;                             // Search parameter (default: -1)
  int32 max_leaf_size = 3;                        // Maximum leaf size (default: 100)
  bool enable_mmap = 4;                           // Memory-map index files (default: true)
}

// LSH index configuration
message LshConfig {
  int32 n_hash_tables = 1;                        // Number of hash tables (default: 10)
  int32 n_hash_functions = 2;                      // Hash functions per table (default: 8) 
  float bucket_width = 3;                         // Bucket width for LSH (default: 4.0)
  bool binary_vectors = 4;                        // Support binary vectors (default: false)
  int32 max_candidates = 5;                       // Max candidates to check (default: 100)
  RandomProjectionType projection = 6;            // Projection type (default: GAUSSIAN)
}

// Random projection types for LSH
enum RandomProjectionType {
  GAUSSIAN = 0;                                   // Gaussian random projection
  BINARY = 1;                                     // Binary random projection  
  SPARSE = 2;                                     // Sparse random projection
}

// ============================================================================
// COMPRESSION CONFIGURATION - Granular per-collection compression control
// ============================================================================

// Compression algorithms supported by storage engines
enum CompressionAlgorithm {
  COMPRESSION_NONE = 0;      // No compression
  COMPRESSION_ZSTD = 1;      // Zstandard compression (levels 1-22)
  COMPRESSION_LZ4 = 2;       // LZ4 fast compression
  COMPRESSION_SNAPPY = 3;    // Snappy balanced compression
  COMPRESSION_GZIP = 4;      // Gzip/Deflate compression (levels 1-9)
  COMPRESSION_BROTLI = 5;    // Brotli compression (levels 0-11)
  COMPRESSION_BZIP2 = 6;     // Bzip2 compression (levels 1-9)
  COMPRESSION_DEFLATE = 7;   // Raw deflate compression (levels 1-9)
  COMPRESSION_XZ = 8;        // XZ/LZMA2 compression (levels 0-9)
  COMPRESSION_ZLIB = 9;      // Zlib compression (levels 1-9)
  COMPRESSION_LZO = 10;      // LZO compression (fastest)
  COMPRESSION_LZ4HC = 11;    // LZ4 high compression variant
  COMPRESSION_LZMA = 12;     // LZMA compression (high ratio)
}

// Access patterns for optimization hints
enum AccessPattern {
  ACCESS_PATTERN_UNKNOWN = 0;
  ACCESS_PATTERN_WRITE_HEAVY = 1;  // High write throughput
  ACCESS_PATTERN_READ_HEAVY = 2;   // High read throughput
  ACCESS_PATTERN_BALANCED = 3;     // Mixed read/write
  ACCESS_PATTERN_ARCHIVE = 4;      // Rarely accessed, maximum compression
}

// Data density characteristics
enum DataDensity {
  DENSITY_UNKNOWN = 0;
  DENSITY_DENSE = 1;        // >80% non-zero values
  DENSITY_SPARSE = 2;       // <20% non-zero values  
  DENSITY_MIXED = 3;        // Mixed density
}

// Compression configuration for collections
message CompressionConfig {
  CompressionAlgorithm algorithm = 1;     // Compression algorithm to use
  optional int32 level = 2;               // Algorithm-specific level (e.g., ZSTD 1-22)
  bool adaptive = 3;                      // Enable adaptive compression based on data (default: false)
  optional float min_ratio = 4;           // Minimum compression ratio (e.g., 1.5 = 50% reduction)
  
  // VIPER-specific quantization for dual storage
  bool enable_quantization = 5;           // VIPER only - creates quantized column (default: false)
  optional string quantization_type = 6;  // "int8", "pq8", "pq4"
  optional string normalization_method = 7; // "mean", "trimmed_mean", "median" - for quantized only
  
  // SST-specific block sizing (KB format for better granularity)
  optional int32 block_size_kb = 8;       // SST block size in KB (256-16384, default 2048 = 2MB)
  optional bool dynamic_block_sizing = 9; // Auto-adjust based on vector dimensions (default: false)
}

// ============================================================================
// STORAGE CONFIGURATION - Complete storage settings for a collection
// ============================================================================
message StorageConfig {
  // Storage location and persistence
  optional string storage_location = 1;            // Override default storage path (e.g., "s3://bucket/path")
  optional bool persistent = 2;                    // Whether data persists after restart (default: true)
  
  // Compression configuration
  optional CompressionConfig compression = 3;      // Compression settings
  
  // Optimization hints to guide automatic configuration
  optional AccessPattern access_pattern = 4;       // Expected access pattern
  optional DataDensity data_density = 5;           // Data density characteristics
  optional bool frequent_updates = 6;              // Whether data is frequently updated
  optional int64 expected_size_gb = 7;             // Expected collection size in GB
  optional float read_write_ratio = 8;             // Read/write ratio (1.0 = balanced)
  
  // Quick presets for common use cases
  optional string preset = 9;  // "maximum_performance", "balanced", "memory_constrained", "cloud_optimized", "real_time", "archive"
  
  // Master optimization control
  optional bool enable_all_optimizations = 10;  // Master switch (default: true)
  
  // Specific configuration overrides (when you need fine control)
  optional ParquetWriterSettings parquet_writer = 11;   // Common to VIPER, NOVA
  optional FooterCacheSettings footer_cache = 12;       // Cloud storage optimization
  optional HybridWriterSettings hybrid_writer = 13;     // Adaptive writer strategy
  
  // Engine-specific settings
  optional SstEngineSettings sst_settings = 14;         // SST-specific
  optional ViperEngineSettings viper_settings = 15;     // VIPER-specific
  optional NovaEngineSettings nova_settings = 16;       // NOVA-specific
}

// Parquet writer settings - matches TOML configuration
message ParquetWriterSettings {
  optional int32 row_group_size = 1;
  optional int32 page_size = 2;
  optional bool enable_bloom_filters = 3;
  optional float bloom_filter_fpp = 4;
  repeated string bloom_filter_columns = 5;
  optional bool enable_column_statistics = 6;
  optional bool enable_page_index = 7;
  optional bool enable_column_index = 8;
  optional bool enable_offset_index = 9;
  optional int32 page_index_granularity = 10;
  optional bool enable_dictionary = 11;
  optional float dictionary_threshold = 12;
  optional bool enable_delta_encoding = 13;
  optional bool enable_byte_stream_split = 14;
  optional bool enable_pq_sorting = 15;
  optional int32 pq_sorting_segments = 16;
  optional int32 pq_sorting_codebook_size = 17;
  optional bool enable_native_metadata = 18;
  optional int32 metadata_inference_samples = 19;
  optional int32 write_batch_size = 20;
  optional bool id_less_storage = 21;
}

// Footer cache settings for cloud storage optimization
message FooterCacheSettings {
  optional bool enable = 1;
  optional int64 max_entries = 2;
  optional int64 ttl_seconds = 3;
  optional int64 time_to_idle_seconds = 4;
  optional bool enable_persistence = 5;
  optional string persistence_path = 6;
  optional bool enable_prefetch = 7;
  optional int64 prefetch_threshold = 8;
  optional int64 warming_interval_seconds = 9;
  optional bool enable_compression = 10;
  optional int32 compression_level = 11;
}

// Hybrid writer settings for adaptive performance
message HybridWriterSettings {
  optional bool enable = 1;
  optional string initial_mode = 2;  // "streaming", "batch", "adaptive"
  optional bool enable_auto_switch = 3;
  optional int32 mode_switch_threshold = 4;
  optional int32 pattern_window_size = 5;
  optional float streaming_threshold = 6;
  optional int32 batch_threshold = 7;
  optional int32 max_buffer_size = 8;
  optional int64 buffer_time_limit_seconds = 9;
  optional bool enable_concurrent_writes = 10;
  optional int32 max_concurrent_writers = 11;
  optional bool optimize_row_group_size = 12;
  optional int32 min_row_group_size = 13;
  optional int32 max_row_group_size = 14;
}

// SST-specific engine settings
message SstEngineSettings {
  optional bool enable_bloom_filters = 1;
  optional float bloom_filter_fpp = 2;
  optional CompressionAlgorithm compression = 3;
  optional int32 compression_level = 4;
  optional int64 write_buffer_size = 5;
  optional int32 max_write_buffers = 6;
  optional int32 block_size_kb = 7;
  optional bool dynamic_block_sizing = 8;
}

// VIPER-specific engine settings
message ViperEngineSettings {
  optional bool inherit_global_settings = 1;
  // Additional VIPER-specific overrides
  optional bool enable_columnar_compression = 2;
  optional bool enable_vector_quantization = 3;
  optional int32 vector_chunk_size = 4;
  optional bool enable_lazy_loading = 5;
}

// NOVA-specific engine settings
message NovaEngineSettings {
  optional bool inherit_global_settings = 1;
  // Additional NOVA-specific overrides
  optional bool enable_real_time_mode = 2;
  optional int32 streaming_buffer_size = 3;
  optional bool prefer_low_latency = 4;
}

// Comprehensive quantization configuration with storage-aware strategies
// DESIGN DECISION: Quantization is ON by default for 95% I/O reduction and 50-80% storage savings
// Uses same distance metric as CollectionConfig.distance_metric for consistency
message QuantizationConfig {
  // Quantization is enabled by default for I/O reduction and storage savings
  // Set enabled=false only if you have specific reasons (e.g., very small dimensions)
  bool enabled = 1;                               // Enable quantization (default: true in code)
  
  // Quantization method - PQ is most effective for high dimensions
  enum Method {
    PRODUCT_QUANTIZATION = 0;     // Product Quantization (default, best for d>=128)
    SCALAR_QUANTIZATION = 1;      // INT8 quantization (good for d<128)
    BINARY_QUANTIZATION = 2;      // Binary sketches (extreme compression)
    ADAPTIVE = 3;                 // Auto-select based on dimension
  }
  optional Method method = 2;                     // Quantization method (default: PRODUCT_QUANTIZATION)
  
  // PQ-specific settings (used when method=PRODUCT_QUANTIZATION)
  optional int32 num_subvectors = 3;              // Number of subvectors (default: dimension/4, min 8, max 64)
  optional int32 bits_per_subvector = 4;          // Bits per subvector (default: 8, options: 4,6,8)
  
  // Training settings
  optional int32 training_sample_size = 5;        // Samples for codebook training (default: 10000)
  optional float quality_threshold = 6;           // Min acceptable quality (default: 0.95)
  
  // Progressive search settings (for hierarchical SST layout)
  optional bool enable_progressive_search = 7;    // Use multi-tier filtering (default: true)
  optional float binary_filter_threshold = 8;     // Hamming threshold for first stage (default: 0.3)
  
  // NOTE: Distance metric is inherited from CollectionConfig.distance_metric
  // This ensures consistency between search and quantization
}

// Clean proto design - no legacy fields (Release 1)

message FilterableColumnSpec {
  string name = 1;                          // Column name
  FilterableDataType data_type = 2;         // Data type for Parquet schema
  bool indexed = 3;                         // Whether to create an index
  bool supports_range = 4;                  // Whether this column supports range queries
  optional int32 estimated_cardinality = 5; // Estimated cardinality for optimization
  optional ColumnEncoding encoding_hint = 6; // Column-specific encoding for VIPER (RLE, Dictionary, etc.)
}

// Column-specific encoding hints for VIPER Parquet storage
enum ColumnEncoding {
  ENCODING_AUTO = 0;        // Let Parquet decide based on data
  ENCODING_PLAIN = 1;       // No encoding, just compress
  ENCODING_DICTIONARY = 2;  // Dictionary encoding for low cardinality
  ENCODING_RLE = 3;         // Run-length encoding for repeated values
  ENCODING_DELTA = 4;       // Delta encoding for sequential values
  ENCODING_BITPACKED = 5;   // Bit-packing for small integers
}

enum FilterableDataType {
  FILTERABLE_DATA_TYPE_UNSPECIFIED = 0;
  FILTERABLE_STRING = 1;
  FILTERABLE_INTEGER = 2;
  FILTERABLE_FLOAT = 3;
  FILTERABLE_BOOLEAN = 4;
  FILTERABLE_DATETIME = 5;
  FILTERABLE_ARRAY_STRING = 6;
  FILTERABLE_ARRAY_INTEGER = 7;
  FILTERABLE_ARRAY_FLOAT = 8;
}

message Collection {
  string id = 1;
  CollectionConfig config = 2;
  CollectionStats stats = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
  optional StorageAssignment storage_assignment = 6;
}

message StorageAssignment {
  string base_location = 1;      // Base storage URL (e.g., "file:///data/disk1" or "s3://bucket/path")
  int64 assigned_at = 2;         // Assignment timestamp
  // Data will be at: {base_location}/{collection_id}/data
  // WAL will be at: {base_location}/{collection_id}/write_buffer
  // Indexes will be at: {base_location}/{collection_id}/indexes
}

message CollectionStats {
  int64 vector_count = 1;
  int64 index_size_bytes = 2;
  int64 data_size_bytes = 3;
}

// SearchResult directly contains search result fields (flattened from SearchVectorRecord)
message SearchResult {
  string id = 1;                             // Vector ID (always present in results)
  repeated float vector = 2;                 // Vector data (if requested)
  repeated MetadataItem metadata = 3;        // Metadata (if requested)
  
  // Search-specific fields
  int32 rank = 4;                            // Search result rank (1-based)
  float score = 5;                           // Similarity score
  float distance = 6;                        // Distance value
  
  // Optional fields for detailed results
  optional uint32 version = 7;               // Version (if versioning enabled)
  optional uint32 timestamp = 8;             // When record was created
  optional string collection_id = 9;         // Source collection (for multi-collection search)
}

// ============================================================================
// COLLECTION OPERATIONS - Unified flexible schema
// ============================================================================

message CollectionRequest {
  CollectionOperation operation = 1;
  optional string collection_id = 2;
  optional CollectionConfig collection_config = 3;
  map<string, string> query_params = 4;      // limit, offset, filters, etc.
  map<string, bool> options = 5;             // force, include_stats, etc.
  map<string, string> migration_config = 6;  // For MIGRATE operations
}

message CollectionResponse {
  bool success = 1;
  CollectionOperation operation = 2;
  optional Collection collection = 3;        // Single result (GET, CREATE)
  repeated Collection collections = 4;       // Multiple results (LIST)
  int64 affected_count = 5;                  // Items affected
  optional int64 total_count = 6;           // For pagination
  map<string, string> metadata = 7;         // Additional response data
  optional string error_message = 8;
  optional string error_code = 9;
  int64 processing_time_us = 10;
}

// ============================================================================
// VECTOR OPERATIONS - Performance-optimized schemas
// ============================================================================

// UNIFIED BATCH - Proto-first architecture with pure proto messages
// Pure proto vector records supporting: insert (new ID), upsert (existing ID), delete (expires_at set)
message VectorBatchRequest {
  string collection_id = 1;                 // Collection identifier
  repeated VectorRecord vectors = 2;        // Pure proto vector records (proto-first architecture)
  optional int64 batch_timeout_ms = 3;      // Optional batch processing timeout
  optional string request_id = 4;           // Optional request tracking ID
}

// VectorSelector and VectorUpdates removed - using unified VectorRecord batch operations

// FLEXIBLE SEARCH - Supports multiple query modes
message VectorSearchRequest {
  string collection_id = 1;
  repeated SearchQuery queries = 2;          // Batch search support
  int32 top_k = 3;
  optional DistanceMetric distance_metric_override = 4;
  SearchParameters search_params = 5;       // Algorithm-specific search parameters (HNSW, IVF, etc)
  IncludeFields include_fields = 6;
  optional SearchParams search_optimization = 7; // Unified search params aligned with native types
}

message VectorGetRequest {
  string collection_id = 1;
  string vector_id = 2;
  IncludeFields include_fields = 3;
}

// Native typed search parameters - no more string maps!
message SearchParameters {
  // HNSW parameters
  optional int32 ef_search = 1;              // HNSW search parameter
  optional int32 max_connections = 2;        // HNSW max connections
  
  // IVF parameters  
  optional int32 n_probe = 3;                // IVF clusters to probe
  optional bool enable_reranking = 4;        // IVF reranking
  
  // General parameters
  optional int32 batch_size = 5;             // Batch processing size
  optional int64 timeout_ms = 6;             // Search timeout
  optional float accuracy_threshold = 7;     // Minimum accuracy requirement
  
  // Advanced parameters
  optional bool enable_parallel_search = 8;  // Parallel search execution
  optional int32 thread_count = 9;           // Thread count for parallel search
}

message SearchQuery {
  repeated float vector = 1;                 // Query vector
  optional string id = 2;                   // Search by ID
  MetadataFilter metadata_filter = 3;       // Native typed metadata filtering
}

// Native typed metadata filtering - no more string-only filters!
message MetadataFilter {
  repeated FilterCondition conditions = 1;   // Multiple filter conditions
  FilterOperator operator = 2;               // AND, OR, NOT
}

message FilterCondition {
  string field_name = 1;                     // Metadata field name
  FilterOperation operation = 2;             // equals, gt, lt, in, etc.
  MetadataValue value = 3;                   // Native typed value
}

enum FilterOperator {
  FILTER_OPERATOR_UNSPECIFIED = 0;
  AND = 1;
  OR = 2;
  NOT = 3;
}

enum FilterOperation {
  FILTER_OPERATION_UNSPECIFIED = 0;
  EQUALS = 1;
  NOT_EQUALS = 2;
  GREATER_THAN = 3;
  LESS_THAN = 4;
  GREATER_THAN_OR_EQUAL = 5;
  LESS_THAN_OR_EQUAL = 6;
  IN = 7;
  NOT_IN = 8;
  CONTAINS = 9;
  STARTS_WITH = 10;
  ENDS_WITH = 11;
}

message IncludeFields {
  bool vector = 1;
  bool metadata = 2;
  bool score = 3;
  bool rank = 4;
}

// Quantization parameter types for SearchParams
message BinaryQuantizationParams {
  // No parameters needed for binary quantization
}

message ScalarQuantizationParams {
  uint32 bits = 1;  // 8 or 16
}

message ProductQuantizationParams {
  uint32 num_subvectors = 1;
  uint32 bits_per_code = 2;
}

message UniformQuantizationParams {
  float scale = 1;
  float offset = 2;
}

// Search optimization hints for performance tuning
// SearchParams aligned with core::search::SearchParams for zero-copy conversion
message SearchParams {
  // Required parameters  
  optional uint32 top_k = 1;                        // Number of results to return
  map<string, google.protobuf.Value> filters = 2;   // Metadata filters to apply
  optional float accuracy_threshold = 3;            // Accuracy threshold for search (0.0-1.0)
  optional bool include_expired = 4;                // Include expired vectors in results
  optional uint64 timeout_ms = 5;                   // Search timeout in milliseconds
  optional bool enable_two_stage = 6;               // Enable two-stage search with quantization
  
  // Quantization hint - directly maps to UnifiedQuantizationLevel
  oneof quantization_hint {
    bool no_quantization = 7;                      // FP32 - no quantization
    BinaryQuantizationParams binary = 8;           // Binary quantization
    ScalarQuantizationParams scalar = 9;           // INT8/INT16 quantization
    ProductQuantizationParams product = 10;        // Product quantization
    UniformQuantizationParams uniform = 11;        // Uniform quantization
  }
  
  // Optional optimization hints
  optional bool enable_clustering_hint = 12;       // Hint to enable/disable cluster optimization
  optional bool enable_metadata_filtering_hint = 13; // Hint to enable/disable metadata filtering optimization
  map<string, google.protobuf.Value> custom_hints = 14; // Custom optimization parameters
}


// UNIFIED RESPONSE - All vector operations with optimized data transfer
message VectorOperationResponse {
  bool success = 1;
  VectorOperation operation = 2;
  OperationMetrics metrics = 3;
  
  // Optimized result transfer - choose based on data size and operation
  oneof result_payload {
    SearchResultsCompact compact_results = 4;    // Small results: regular gRPC
    bytes avro_results = 5;                      // Large results: Avro binary for zero-copy
  }
  
  repeated string vector_ids = 6;               // Generated/affected IDs
  optional string error_message = 7;
  optional string error_code = 8;
  
  // Result metadata for client decision making
  ResultMetadata result_info = 9;
}

// Compact results for small datasets (< 1MB typical)
message SearchResultsCompact {
  repeated SearchVectorRecord results = 1;      // Direct use of SearchVectorRecord
  int64 total_found = 2;
  optional string search_algorithm_used = 3;
}

// Metadata about the result payload
message ResultMetadata {
  int64 result_count = 1;
  int64 estimated_size_bytes = 2;
  bool is_avro_binary = 3;                      // True if using avro_results field
  string avro_schema_version = 4;               // For Avro compatibility checking
}

message OperationMetrics {
  int64 total_processed = 1;
  int64 successful_count = 2;
  int64 failed_count = 3;
  int64 updated_count = 4;                   // For UPSERT
  int64 processing_time_us = 5;
  int64 wal_write_time_us = 6;
  int64 index_update_time_us = 7;
}

// ============================================================================
// HEALTH AND MONITORING
// ============================================================================

message HealthRequest {}

message HealthResponse {
  string status = 1;                         // "healthy", "degraded", "unhealthy"
  string version = 2;
  int64 uptime_seconds = 3;
  int32 active_connections = 4;
  int64 memory_usage_bytes = 5;
  int64 storage_usage_bytes = 6;
}

message MetricsRequest {
  optional string collection_id = 1;         // Filter by collection
  repeated string metric_names = 2;          // Specific metrics to retrieve
}

message MetricsResponse {
  map<string, double> metrics = 1;           // metric_name -> value
  int64 timestamp = 2;                       // When metrics were collected
}

// Collection snapshot for checkpoint/recovery
message CollectionSnapshot {
  repeated Collection collections = 1;        // All collections in the snapshot
  int32 version = 2;                         // Snapshot format version
  int64 timestamp = 3;                       // When snapshot was created (microseconds)
}