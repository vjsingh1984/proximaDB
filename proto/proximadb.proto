syntax = "proto3";

package proximadb;

import "google/protobuf/struct.proto";

// ============================================================================
// ProximaDB gRPC Protocol - Proto-First Architecture
// - Vector INSERT/UPSERT: Pure proto messages for type safety and performance
// - Vector UPDATE/DELETE/SEARCH: Native proto for consistency
// - Collection operations: Single unified endpoint for all metadata operations
// ============================================================================

service ProximaDB {
  // Collection management - single unified endpoint for flexibility
  rpc CollectionOperation(CollectionRequest) returns (CollectionResponse);
  
  // Vector operations - optimized batch operations
  rpc VectorBatch(VectorBatchRequest) returns (VectorOperationResponse);         // Unified batch: insert/upsert/delete
  rpc VectorSearch(VectorSearchRequest) returns (VectorOperationResponse);       // Search via gRPC
  rpc VectorGet(VectorGetRequest) returns (VectorOperationResponse);             // Get single vector by ID
  
  // Health and monitoring
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
}

// ============================================================================
// ENUMS - Aligned with Avro schema
// ============================================================================

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  COSINE = 1;
  EUCLIDEAN = 2;
  DOT_PRODUCT = 3;
  HAMMING = 4;
  MANHATTAN = 5;
  JACCARD = 6;
  CUSTOM = 7;
  CHEBYSHEV = 8;
  CANBERRA = 9;
  MINKOWSKI = 10;
  ANGULAR = 11;
  BRAY_CURTIS = 12;
  HELLINGER = 13;
}

enum StorageEngine {
  STORAGE_ENGINE_UNSPECIFIED = 0;
  VIPER = 1;
  SST = 2;
  MMAP = 3;
  HYBRID = 4;
  SWIFT = 5;    // Storage With Instant Fast Traversal - zero-overhead vector storage
  NOVA = 6;     // Next-gen Optimized Vector Analytics - columnar quantization
}

enum IndexingAlgorithm {
  INDEXING_ALGORITHM_UNSPECIFIED = 0;
  HNSW = 1;
  IVF = 2;
  PQ = 3;
  FLAT = 4;
  ANNOY = 5;
  LSH = 6;
}

enum CollectionOperation {
  COLLECTION_OPERATION_UNSPECIFIED = 0;
  COLLECTION_CREATE = 1;
  COLLECTION_UPDATE = 2;
  COLLECTION_GET = 3;
  COLLECTION_LIST = 4;
  COLLECTION_DELETE = 5;
  COLLECTION_MIGRATE = 6;
  COLLECTION_GET_ID_BY_NAME = 7;  // Get collection UUID by name
}

enum VectorOperation {
  VECTOR_OPERATION_UNSPECIFIED = 0;
  VECTOR_BATCH = 1;      // Unified batch operation (insert/upsert/delete via expires_at)
  VECTOR_SEARCH = 2;     // Vector search operation
  VECTOR_GET = 3;        // Get single vector by ID
}

// MutationType removed - using unified batch operations with expires_at for deletes

// ============================================================================
// CORE DATA TYPES - Aligned with Avro schema
// ============================================================================

// Metadata item with type-safe value storage
message MetadataItem {
  string key = 1;
  
  // Type-safe value storage using oneof
  oneof value {
    string string_value = 2;
    double number_value = 3;
    bool bool_value = 4;
    // Note: arrays and objects can be added later if needed
    // e.g., repeated string array_value = 5;
    // e.g., google.protobuf.Struct object_value = 6;
  }
}

