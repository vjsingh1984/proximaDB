<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <!-- Clean ProximaDB gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle background -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>

    <!-- Clean shadow -->
    <filter id="cleanShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Clean background -->
  <rect width="1000" height="400" fill="url(#backgroundGradient)"/>

  <!-- Main content container -->
  <rect x="50" y="50" width="900" height="300" fill="rgba(255,255,255,0.95)" rx="12" filter="url(#cleanShadow)" stroke="rgba(30,136,229,0.2)" stroke-width="1"/>

  <!-- Header section -->
  <g id="header">

    <!-- Clean logo -->
    <g transform="translate(80, 100)">
      <!-- Simple database symbol -->
      <ellipse cx="25" cy="15" rx="15" ry="4" fill="url(#primaryGradient)"/>
      <rect x="10" y="15" width="30" height="12" fill="url(#primaryGradient)"/>
      <ellipse cx="25" cy="27" rx="15" ry="4" fill="url(#primaryGradient)"/>

      <!-- Vector intelligence nodes -->
      <circle cx="45" cy="12" r="2" fill="#64b5f6"/>
      <circle cx="45" cy="21" r="2" fill="#64b5f6"/>
      <circle cx="45" cy="30" r="2" fill="#64b5f6"/>

      <!-- Connection lines -->
      <line x1="40" y1="15" x2="43" y2="12" stroke="#64b5f6" stroke-width="1"/>
      <line x1="40" y1="21" x2="43" y2="21" stroke="#64b5f6" stroke-width="1"/>
      <line x1="40" y1="27" x2="43" y2="30" stroke="#64b5f6" stroke-width="1"/>
    </g>

    <!-- Clean title -->
    <text x="150" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="600" fill="url(#primaryGradient)">ProximaDB Enterprise</text>
    <text x="150" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#666666">AI-Powered Vector Intelligence Platform</text>

    <!-- Enterprise badge -->
    <rect x="700" y="100" width="180" height="30" fill="#4caf50" rx="15"/>
    <text x="790" y="120" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">Enterprise Production Ready</text>
  </g>

  <!-- Key capabilities -->
  <g id="capabilities" transform="translate(0, 180)">

    <!-- AI Intelligence -->
    <g id="ai-capability">
      <rect x="100" y="20" width="160" height="60" fill="rgba(30,136,229,0.1)" rx="8" stroke="#1e88e5" stroke-width="1"/>
      <text x="180" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1e88e5" text-anchor="middle">AI Intelligence</text>
      <text x="180" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Natural Language Business Intelligence</text>
      <text x="180" y="65" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">9 LLM Providers</text>
    </g>

    <!-- Multi-Tenant Security -->
    <g id="security-capability">
      <rect x="280" y="20" width="160" height="60" fill="rgba(76,175,80,0.1)" rx="8" stroke="#4caf50" stroke-width="1"/>
      <text x="360" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#4caf50" text-anchor="middle">Enterprise Security</text>
      <text x="360" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Complete Multi-Tenant Isolation</text>
      <text x="360" y="65" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">SOC 2 Compliance Ready</text>
    </g>

    <!-- Performance Excellence -->
    <g id="performance-capability">
      <rect x="460" y="20" width="160" height="60" fill="rgba(255,152,0,0.1)" rx="8" stroke="#ff9800" stroke-width="1"/>
      <text x="540" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#ff9800" text-anchor="middle">Performance Excellence</text>
      <text x="540" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">7 Specialized Storage Engines</text>
      <text x="540" y="65" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Production Benchmarking</text>
    </g>

    <!-- Deployment Automation -->
    <g id="deployment-capability">
      <rect x="640" y="20" width="160" height="60" fill="rgba(156,39,176,0.1)" rx="8" stroke="#9c27b0" stroke-width="1"/>
      <text x="720" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#9c27b0" text-anchor="middle">Deployment Excellence</text>
      <text x="720" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">One-Click Enterprise Setup</text>
      <text x="720" y="65" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Multi-Platform Support</text>
    </g>
  </g>

  <!-- Enterprise value proposition -->
  <g id="value-proposition" transform="translate(0, 280)">
    <text x="500" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#333" text-anchor="middle">
      The only comprehensive AI-powered vector intelligence platform built for enterprise scale
    </text>

    <!-- Clean call-to-action -->
    <rect x="400" y="45" width="200" height="35" fill="url(#primaryGradient)" rx="17"/>
    <text x="500" y="67" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Learn More</text>
  </g>

</svg>