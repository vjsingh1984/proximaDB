<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Enterprise gradient -->
    <linearGradient id="enterpriseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3f51b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Performance accent -->
    <linearGradient id="performanceAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8bc34a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Security accent -->
    <linearGradient id="securityAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    
    <!-- Monitoring accent -->
    <linearGradient id="monitoringAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main logo container -->
  <g id="proximadb-enterprise-logo">
    
    <!-- Core database symbol with enterprise styling -->
    <g id="database-core">
      <!-- Primary database cylinder -->
      <ellipse cx="50" cy="35" rx="25" ry="8" fill="url(#enterpriseGradient)" opacity="0.9"/>
      <rect x="25" y="35" width="50" height="20" fill="url(#enterpriseGradient)"/>
      <ellipse cx="50" cy="55" rx="25" ry="8" fill="url(#enterpriseGradient)"/>
      
      <!-- Enterprise data layers -->
      <ellipse cx="50" cy="40" rx="22" ry="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <ellipse cx="50" cy="45" rx="22" ry="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="50" cy="50" rx="22" ry="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    </g>
    
    <!-- Vector intelligence indicators -->
    <g id="vector-intelligence">
      <!-- Vector nodes around database -->
      <circle cx="25" cy="25" r="3" fill="url(#performanceAccent)"/>
      <circle cx="75" cy="25" r="3" fill="url(#performanceAccent)"/>
      <circle cx="20" cy="45" r="3" fill="url(#performanceAccent)"/>
      <circle cx="80" cy="45" r="3" fill="url(#performanceAccent)"/>
      <circle cx="25" cy="65" r="3" fill="url(#performanceAccent)"/>
      <circle cx="75" cy="65" r="3" fill="url(#performanceAccent)"/>
      
      <!-- Connection lines showing unified intelligence -->
      <line x1="25" y1="25" x2="50" y2="35" stroke="url(#performanceAccent)" stroke-width="1.5" opacity="0.7"/>
      <line x1="75" y1="25" x2="50" y2="35" stroke="url(#performanceAccent)" stroke-width="1.5" opacity="0.7"/>
      <line x1="20" y1="45" x2="50" y2="45" stroke="url(#performanceAccent)" stroke-width="1.5" opacity="0.7"/>
      <line x1="80" y1="45" x2="50" y2="45" stroke="url(#performanceAccent)" stroke-width="1.5" opacity="0.7"/>
    </g>
    
    <!-- Security shield -->
    <g id="security-shield">
      <path d="M90 20 L95 15 L105 15 L110 20 L110 35 L100 45 L90 35 Z" 
            fill="url(#securityAccent)" opacity="0.8"/>
      <text x="100" y="33" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">✓</text>
    </g>
    
    <!-- Performance indicator -->
    <g id="performance-indicator">
      <rect x="15" y="70" width="8" height="4" fill="url(#performanceAccent)" rx="2"/>
      <rect x="25" y="65" width="8" height="9" fill="url(#performanceAccent)" rx="2"/>
      <rect x="35" y="60" width="8" height="14" fill="url(#performanceAccent)" rx="2"/>
      <text x="31" y="85" font-family="Arial, sans-serif" font-size="6" fill="#4caf50" text-anchor="middle">2847+ QPS</text>
    </g>
    
    <!-- Monitoring dashboard icon -->
    <g id="monitoring-dashboard">
      <rect x="85" y="65" width="20" height="15" fill="url(#monitoringAccent)" rx="2" opacity="0.8"/>
      <rect x="87" y="67" width="4" height="3" fill="white" opacity="0.9"/>
      <rect x="92" y="67" width="4" height="3" fill="white" opacity="0.9"/>
      <rect x="97" y="67" width="6" height="3" fill="white" opacity="0.9"/>
      <rect x="87" y="72" width="16" height="2" fill="white" opacity="0.7"/>
      <text x="95" y="85" font-family="Arial, sans-serif" font-size="6" fill="#9c27b0" text-anchor="middle">8 Tabs</text>
    </g>
    
    <!-- Company name -->
    <text x="130" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="url(#enterpriseGradient)">ProximaDB</text>
    <text x="130" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#666">Enterprise</text>
    
    <!-- Tagline -->
    <text x="130" y="70" font-family="Arial, sans-serif" font-size="9" fill="#888">Unified Intelligence Platform</text>
    
    <!-- Production certification badge -->
    <g id="certification-badge">
      <rect x="310" y="25" width="85" height="16" fill="#4caf50" rx="8"/>
      <text x="352" y="36" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">✓ 100% PRODUCTION READY</text>
    </g>
    
    <!-- Performance metrics -->
    <g id="metrics-display">
      <text x="130" y="85" font-family="Arial, sans-serif" font-size="7" fill="#4caf50" font-weight="600">2,847+ QPS</text>
      <text x="180" y="85" font-family="Arial, sans-serif" font-size="7" fill="#2196f3" font-weight="600">94.2% Cache</text>
      <text x="230" y="85" font-family="Arial, sans-serif" font-size="7" fill="#ff9800" font-weight="600">95/100 Security</text>
      <text x="285" y="85" font-family="Arial, sans-serif" font-size="7" fill="#9c27b0" font-weight="600">7 Engines</text>
    </g>
    
    <!-- Capabilities indicators -->
    <g id="capabilities">
      <circle cx="340" cy="50" r="4" fill="#4caf50"/>
      <text x="346" y="53" font-family="Arial, sans-serif" font-size="6" fill="#4caf50">Vector</text>
      
      <circle cx="340" cy="60" r="4" fill="#2196f3"/>
      <text x="346" y="63" font-family="Arial, sans-serif" font-size="6" fill="#2196f3">Graph</text>
      
      <circle cx="340" cy="70" r="4" fill="#ff9800"/>
      <text x="346" y="73" font-family="Arial, sans-serif" font-size="6" fill="#ff9800">Knowledge</text>
    </g>
    
  </g>
</svg>