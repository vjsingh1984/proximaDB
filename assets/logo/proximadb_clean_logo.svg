<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <!-- ProximaDB primary gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Clean logo design -->
  <g id="proximadb-logo">

    <!-- Simple, clean database symbol -->
    <g id="database-symbol">
      <!-- Primary database cylinder -->
      <ellipse cx="40" cy="25" rx="20" ry="6" fill="url(#primaryGradient)"/>
      <rect x="20" y="25" width="40" height="16" fill="url(#primaryGradient)"/>
      <ellipse cx="40" cy="41" rx="20" ry="6" fill="url(#primaryGradient)"/>

      <!-- Clean data layer indicators -->
      <ellipse cx="40" cy="30" rx="16" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <ellipse cx="40" cy="36" rx="16" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Vector intelligence indicator -->
    <g id="vector-nodes">
      <!-- Clean geometric nodes -->
      <circle cx="70" cy="20" r="2" fill="#64b5f6"/>
      <circle cx="70" cy="33" r="2" fill="#64b5f6"/>
      <circle cx="70" cy="46" r="2" fill="#64b5f6"/>

      <!-- Simple connection lines -->
      <line x1="60" y1="25" x2="68" y2="20" stroke="#64b5f6" stroke-width="1" opacity="0.8"/>
      <line x1="60" y1="33" x2="68" y2="33" stroke="#64b5f6" stroke-width="1" opacity="0.8"/>
      <line x1="60" y1="41" x2="68" y2="46" stroke="#64b5f6" stroke-width="1" opacity="0.8"/>
    </g>

    <!-- Company name with clean typography -->
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="url(#primaryGradient)">ProximaDB</text>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#666666">AI-Powered Enterprise Platform</text>

  </g>
</svg>