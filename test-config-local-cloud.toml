# ProximaDB test configuration for local cloud storage emulators

[server]
host = "0.0.0.0"
rest_port = 5678
grpc_port = 5679

[storage]
# Single metadata URL
metadata_url = "file:///tmp/proximadb-test-cloud/metadata"

# Multiple storage locations with local cloud emulators
[[storage.storage_locations]]
url = "s3://proximadb-test"
weight = 1
tags = ["s3", "minio", "cloud"]
# S3-specific config passed via environment or dedicated section

[[storage.storage_locations]]
url = "azblob://proximadb-test"
weight = 1
tags = ["azure", "azurite", "cloud"]
# Azure-specific config passed via environment or dedicated section

[[storage.storage_locations]]
url = "gs://proximadb-test"
weight = 1
tags = ["gcs", "fake-gcs", "cloud"]
# GCS-specific config passed via environment or dedicated section

[[storage.storage_locations]]
url = "file:///tmp/proximadb-test-cloud/local"
weight = 2  # Higher weight for local storage
tags = ["local", "fast"]

# Assignment configuration
[storage.assignment_config]
strategy = "weighted"  # Use weighted distribution across cloud providers
affinity = true

# Storage engine settings
default_engine = "viper"
mmap_enabled = true
cache_size_mb = 256
bloom_filter_bits = 10

[storage.lsm_config]
memtable_size_mb = 8
memory_flush_size_bytes = 2097152  # 2MB
compression = "snappy"

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = true
cleanup_temp_on_startup = true

# Local MinIO (S3-compatible) configuration
[storage.s3]
endpoint = "http://localhost:9000"
region = "us-east-1"
access_key = "minioadmin"
secret_key = "minioadmin"
bucket = "proximadb-test"
use_path_style = true

# Local Azurite (Azure Storage) configuration
[storage.azure]
account_name = "devstoreaccount1"
account_key = "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
container = "proximadb-test"
endpoint = "http://127.0.0.1:10000/devstoreaccount1"

# Local fake-gcs-server configuration
[storage.gcs]
endpoint = "http://localhost:4443"
project_id = "test-project"
bucket = "proximadb-test"
# For local testing, credentials can be empty
credentials_json = """
{
  "type": "service_account",
  "project_id": "test-project",
  "private_key_id": "key-id",
  "private_key": "-----BEGIN RSA PRIVATE KEY-----\\ntest\\n-----END RSA PRIVATE KEY-----\\n",
  "client_email": "test@test-project.iam.gserviceaccount.com",
  "client_id": "123456789",
  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
  "token_uri": "https://oauth2.googleapis.com/token",
  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
  "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/test%40test-project.iam.gserviceaccount.com"
}
"""

[logging]
level = "debug"
format = "json"