# Simple ProximaDB Configuration for Testing

[server]
node_id = "test-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "/tmp/proximadb-test"

[storage]
# Single metadata URL
metadata_url = "file:///tmp/proximadb-test/metadata"

# Single storage location for simple setup
[[storage.storage_locations]]
url = "file:///tmp/proximadb-test"
weight = 1
tags = ["local", "test"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Storage engine settings
mmap_enabled = true
cache_size_mb = 256
bloom_filter_bits = 10

[storage.lsm_config]
memtable_size_mb = 8
memory_flush_size_bytes = 2097152  # 2MB
compression = "snappy"

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 32
timeout_seconds = 30

[monitoring]
metrics_enabled = true
log_level = "debug"

[consensus]
node_id = 1
cluster_peers = []

# Example directory structure:
# /tmp/proximadb-test/
# ├── metadata/           # Metadata storage
# └── collection1/        # Example collection
#     ├── wal/           # WAL data
#     ├── data/          # Storage engine data
#     └── index/         # Index data