[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "proximadb"
version = "0.2.0"
description = "ProximaDB - High-performance vector database with embedded mode"
authors = [
    {name = "Vijaykumar Singh", email = "singhvjd@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.adoc"
requires-python = ">=3.8"
keywords = ["vector", "database", "embedded", "similarity", "search", "ml", "ai", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.280",
]

[project.urls]
Homepage = "https://github.com/vjsingh1984/proximadb"
Documentation = "https://github.com/vjsingh1984/proximadb#readme"
Repository = "https://github.com/vjsingh1984/proximadb"
Issues = "https://github.com/vjsingh1984/proximadb/issues"

[tool.maturin]
# Build settings - use PyO3 bindings (not CFFI)
features = ["python"]
# Module name must match the #[pymodule] function name in src/embedded/python.rs
module-name = "proximadb.proximadb"
bindings = "pyo3"

# Strip release builds for smaller size
strip = true

# Compatibility settings
compatibility = "manylinux2014"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py38"
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
