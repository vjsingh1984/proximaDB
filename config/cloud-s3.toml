# ProximaDB Cloud-Optimized Configuration (S3, GCS, Azure)
#
# Goal: Minimize I/O operations and leverage high throughput.
# Strategy: Use larger block and page sizes to amortize first-byte latency.

[storage]
# SST, SWIFT, and HELIX use ProximaBlocks. A larger block size is better for S3.
# This reduces the number of GET requests for sequential scans and is efficient
# when the engine's high-level pruning (e.g., HELIX's Hilbert curves) is effective.
[storage.sst_config]
block_size_kb = 4096  # 4MB blocks - good for throughput-oriented reads

# For Parquet-based engines (VIPER, NOVA), larger row groups and pages
# improve compression and are more efficient to read from object storage.
[storage.viper_config]
row_group_size = 262144      # ~256k vectors, results in ~128MB row groups (128*256*4)
page_size = 2097152         # 2MB pages for better compression
