# ProximaDB SIMD Optimization Configuration

# Global SIMD settings
enabled = true
min_vectors_for_simd = 100
min_dimension_for_transpose = 64
parallel_encoding = true
encoding_threads = 8  # Set to 0 for auto-detection

# Memory pool configuration
[memory_pool]
enabled = true
max_pool_size_mb = 256
alignment_bytes = 64  # Cache line alignment
pre_allocate = true
pre_allocate_count = 10

# Engine-specific settings
[engine_settings.helix]
spatial_clustering = true
spatial_block_size = 1024
pca_preprocessing = false
preferred_layout = "TransposeFieldEncodedAndCompressedVector"

[engine_settings.sst]
max_compression = true
aggressive_threshold = 0.7
multi_pass = false
preferred_layout = "TransposeFieldEncodedAndCompressedVector"

[engine_settings.swift]
hierarchical_optimization = true
dimension_group_size = 32
low_latency_mode = true
preferred_layout = "GroupedFieldEncodedAndCompressedVector"

# Encoding algorithm preferences
[encoding_preferences]
pfor_delta = true
zigzag = true
simple8b = true
vbyte = true
double_delta = true
run_length = true
hybrid = false  # Experimental
auto_select = true

# Performance monitoring
[monitoring]
enabled = false  # Enable for debugging
track_compression = true
track_timing = true
track_memory = false
log_level = "info"