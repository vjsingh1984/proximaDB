# ProximaDB Unified Storage Configuration Example
# Demonstrates the new collection-first storage architecture

[server]
node_id = "proximadb-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "/data/proximadb"

[storage]
# Single metadata URL for consistency
metadata_url = "file:///fast-ssd/proximadb/metadata"

# Storage locations with heterogeneous filesystems
[[storage.storage_locations]]
url = "file:///nvme1/proximadb"
weight = 3  # Higher weight for fast local NVMe
tags = ["fast", "local", "nvme"]

[[storage.storage_locations]]
url = "file:///ssd1/proximadb"  
weight = 2  # Medium weight for SSD
tags = ["local", "ssd"]

[[storage.storage_locations]]
url = "s3://my-bucket/proximadb"
weight = 1  # Lower weight for cloud storage
tags = ["cloud", "s3", "archive"]

[[storage.storage_locations]]
url = "gs://gcs-bucket/proximadb"
weight = 1
tags = ["cloud", "gcs", "backup"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"     # Options: "hash", "round-robin", "weighted"
affinity = true       # Keep all collection data together

# Storage engine configuration
mmap_enabled = true
cache_size_mb = 2048
bloom_filter_bits = 12

[storage.lsm_config]
memtable_size_mb = 1024  # 1GB to reduce small file creation
level_count = 7
compaction_threshold = 5  # Minimum 5 files before compaction
block_size_kb = 64
compression = "snappy"

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = true
cleanup_temp_on_startup = true

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 64
timeout_seconds = 30

[monitoring]
metrics_enabled = true
log_level = "info"

# Example of how collections will be stored:
# Collection "products" assigned to location 0 (hash % 4 = 0):
# /nvme1/proximadb/products/wal/
# /nvme1/proximadb/products/data/
# /nvme1/proximadb/products/index/
#
# Collection "users" assigned to location 2 (hash % 4 = 2):
# s3://my-bucket/proximadb/users/wal/
# s3://my-bucket/proximadb/users/data/
# s3://my-bucket/proximadb/users/index/