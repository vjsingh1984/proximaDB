# Minimal ProximaDB Configuration for Testing

[server]
node_id = "proximadb-local"
bind_address = "127.0.0.1"
port = 5678
data_dir = "/tmp/proximadb/data"

[storage]
metadata_url = "file:///tmp/proximadb/metadata"

[[storage.storage_locations]]
url = "file:///tmp/proximadb/data"
weight = 1
tags = ["local", "fast"]

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 64
timeout_seconds = 30
enable_tls = false

[monitoring]
metrics_enabled = false
log_level = "info"

# [security]
# enabled = false
# mode = "development"

[cache]
total_memory_mb = 128
enable_warming = false

[cache.rebalancing]
enabled = false
interval_seconds = 300
min_hit_rate_threshold = 0.1

[cache.eviction]
enabled = true
check_interval_seconds = 60
batch_size = 100
memory_threshold_percent = 90
policies = [
    { type = "lru", max_items = 1000, batch_size = 100 },
    { type = "ttl", max_age_seconds = 3600, cleanup_interval_seconds = 300 }
]

[cache.types.vector]
initial_allocation_mb = 64
min_allocation_mb = 16
max_allocation_mb = 128

[cache.types.query]
initial_allocation_mb = 32
min_allocation_mb = 8
max_allocation_mb = 64

[cache.types.metadata]
initial_allocation_mb = 16
min_allocation_mb = 4
max_allocation_mb = 32

[cache.types.index]
initial_allocation_mb = 8
min_allocation_mb = 2
max_allocation_mb = 16

[cache.types.filter]
initial_allocation_mb = 8
min_allocation_mb = 2
max_allocation_mb = 16

[cache.warming]
strategies = ["popularity"]
warm_on_startup = false
warm_batch_size = 100
popularity_threshold = 10
time_window_hours = 24
