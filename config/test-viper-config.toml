# Test configuration for VIPER metadata filtering

[server]
host = "0.0.0.0"
rest_port = 5678
grpc_port = 5679
enable_auth = false
enable_tls = false
log_level = "debug"

[storage]
data_directory = "/tmp/proximadb-viper-test"
max_memory_usage = 1073741824  # 1GB
storage_locations = [
    { url = "file:///tmp/proximadb-viper-test/storage1", weight = 1 }
]

[write_buffer]
enabled = true
batch_size = 10  # Very small batch size
flush_interval_ms = 1000  # 1 second flush interval
max_batch_memory = 1048576  # 1MB - very low to trigger flush quickly

[compaction]
enable_auto_compaction = true
min_files_for_compaction = 2  # Only need 2 files to trigger compaction
max_files_for_compaction = 10
target_file_size_mb = 1  # Very small file size to trigger more flushes

[indexing]
default_algorithm = "hnsw"
enable_parallel_building = true

[viper]
enable_compression = true
compression_codec = "SNAPPY"
enable_ml_clustering = false
enable_simd_processing = true

[lsm]
memtable_size_mb = 1024  # 1GB to reduce small file creation
block_size_kb = 4
bloom_filter_bits_per_key = 10

[monitoring]
enable_metrics = true
metrics_port = 9090