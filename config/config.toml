# ProximaDB Test Configuration

[server]
node_id = "test-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "./test_data"

[storage]
# Single metadata URL for consistency
metadata_url = "file:///home/vsingh/code/proximaDB/test_data/metadata"

# Storage locations
[[storage.storage_locations]]
url = "file:///home/vsingh/code/proximaDB/test_data/storage"
weight = 1
tags = ["local", "test"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Storage engine settings
mmap_enabled = true
cache_size_mb = 512
bloom_filter_bits = 10

[storage.lsm_config]
memtable_size_mb = 8
level_count = 7
compaction_threshold = 4
block_size_kb = 32
memory_flush_size_bytes = 2097152  # 2MB
memtable_type = "BTree"
compaction_strategy = "leveled"
compression = "snappy"
cache_size_mb = 128
write_buffer_size_mb = 32
max_files_per_level = 10
level_size_multiplier = 10.0
max_levels = 7
background_thread_count = 4
sync_mode = "perbatch"
enable_wal = true
write_buffer_directory = "./test_data/lsm_wal"
data_directory = "./test_data/lsm_data"
mmap_enabled = true
prefetch_enabled = true
prefetch_size_kb = 64

[storage.bloom_filter_config]
bits_per_key = 10
enabled = true

# WAL configuration - URLs now derived from storage_locations
# WAL settings moved to appropriate sections

# Storage layout configuration removed - now part of storage_locations

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

# Metadata backend configuration removed - metadata_url is now in main storage section

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 32
timeout_seconds = 30
enable_tls = false

[monitoring]
metrics_enabled = false
log_level = "info"

[consensus]
node_id = 1
cluster_peers = []
election_timeout_ms = 5000
heartbeat_interval_ms = 1000
snapshot_threshold = 10

[performance]
sync_mode = "PerBatch"