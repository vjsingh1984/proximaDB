# ProximaDB Test Configuration

[server]
node_id = "test-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "./test_data"

[storage]
# Single metadata URL for consistency
metadata_url = "file:///home/vsingh/code/proximaDB/test_data/metadata"

# Storage locations
[[storage.storage_locations]]
url = "file:///home/vsingh/code/proximaDB/test_data/storage"
weight = 1
tags = ["local", "test"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Storage engine settings
mmap_enabled = true
cache_size_mb = 512
bloom_filter_bits = 10

[storage.write_buffer_config]
write_buffer_size_mb = 8192  # 8GB total across all collections
memory_flush_size_bytes = 16777216  # 16MB per collection (aggregate of all unflushed batches)
vector_count_threshold = 20000  # 20k vectors per collection
memtable_type = "BTree"
sync_mode = "perbatch"
write_buffer_directory = "./test_data/write_buffer"
enable_wal = true

[storage.sst_config]
level_count = 7
compaction_threshold = 5  # Minimum 5 files before compaction
block_size_kb = 8192  # 8MB blocks for optimal ZSTD compression
compaction_strategy = "leveled"
compression = "zstd"  # ZSTD for better compression ratio
compression_enabled = true  # Enable compression by default
compression_level = 3  # Balanced speed/compression (1-22)
cache_size_mb = 128
max_files_per_level = 10
level_size_multiplier = 10.0
max_levels = 7
background_thread_count = 4
data_directory = "./test_data/sst_data"
mmap_enabled = true
prefetch_enabled = true
prefetch_size_kb = 64

[storage.bloom_filter_config]
bits_per_key = 10
enabled = true

[storage.viper_config]
row_group_size = 100000
compression = "zstd"  # ZSTD for columnar data
compression_enabled = true  # Enable compression by default
compression_level = 3  # Balanced speed/compression (1-22)
enable_statistics = true
data_directory = "./test_data/viper_data"
cache_size_mb = 512

# WAL configuration - URLs now derived from storage_locations
# WAL settings moved to appropriate sections

# Storage layout configuration removed - now part of storage_locations

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

# Metadata backend configuration removed - metadata_url is now in main storage section

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 32
timeout_seconds = 30
enable_tls = false

[monitoring]
metrics_enabled = false
log_level = "info"

[consensus]
node_id = 1
cluster_peers = []
election_timeout_ms = 5000
heartbeat_interval_ms = 1000
snapshot_threshold = 10

[performance]
sync_mode = "PerBatch"