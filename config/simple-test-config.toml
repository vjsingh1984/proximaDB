# Simple Test Configuration
[server]
node_id = "proximadb-test"
bind_address = "127.0.0.1"
port = 5678
data_dir = "./data"

[storage]
# Single metadata URL
metadata_url = "file:///home/vsingh/code/proximaDB/data/metadata"

# Storage location
[[storage.storage_locations]]
url = "file:///home/vsingh/code/proximaDB/data"
weight = 1
tags = ["local", "test"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Storage engine configuration
mmap_enabled = true
cache_size_mb = 1024
bloom_filter_bits = 10

[storage.lsm_config]
memtable_size_mb = 1024  # 1GB to reduce small file creation
memory_flush_size_bytes = 16777216  # 16MB to reduce small file creation
memtable_type = "BTree"
level_count = 7
compaction_threshold = 5  # Minimum 5 files before compaction
compaction_strategy = "leveled"
compression = "snappy"
block_size_mb = 3
cache_size_mb = 128
write_buffer_size_mb = 8192  # 8GB for global write buffer
max_files_per_level = 10
level_size_multiplier = 10.0
max_levels = 7
background_thread_count = 4
sync_mode = "perbatch"
enable_wal = true
write_buffer_directory = "./data/lsm_wal"
data_directory = "./data/lsm_data"
mmap_enabled = true
prefetch_enabled = true
prefetch_size_kb = 64

[storage.bloom_filter_config]
bits_per_key = 10
enabled = true

# Removed storage_layout - now handled by storage_locations

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

# Removed metadata_backend - now using metadata_url in main storage section

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 32
timeout_seconds = 30
enable_tls = false

[monitoring]
metrics_enabled = true
log_level = "debug"

[consensus]
node_id = 1
cluster_peers = []
election_timeout_ms = 5000
heartbeat_interval_ms = 1000
snapshot_threshold = 1000