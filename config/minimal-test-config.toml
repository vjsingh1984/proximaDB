# ProximaDB Minimal Test Configuration

[server]
node_id = "test-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "./test_data_minimal"

[storage]
metadata_url = "file:///home/vsingh/code/proximaDB/test_data_minimal/metadata"

[[storage.storage_locations]]
url = "file:///home/vsingh/code/proximaDB/test_data_minimal"
weight = 1
tags = ["local", "test"]

[storage.write_buffer_config]
write_buffer_size_mb = 8192  # 8GB total across all collections
memory_flush_size_bytes = 16777216  # 16MB per batch
vector_count_threshold = 20000  # 20k vectors per collection

[storage.sst_config]
compaction_threshold = 5  # Minimum 5 files before compaction
compression = "snappy"

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 64
timeout_seconds = 30

[monitoring]
metrics_enabled = false
log_level = "info"