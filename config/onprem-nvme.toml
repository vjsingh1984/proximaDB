# ProximaDB On-Premise Optimized Configuration (Local NVMe SSD)
#
# Goal: Leverage low-latency random access for highly selective queries.
# Strategy: Use smaller block and page sizes to minimize data read.

[storage]
# For SST, SWIFT, and HELIX, smaller blocks allow for more granular reads,
# which is ideal for "needle-in-a-haystack" queries where I/O latency is not a bottleneck.
[storage.sst_config]
block_size_kb = 256  # 256KB blocks for fast random access

# For Parquet-based engines (VIPER, NOVA), smaller row groups and pages
# allow for more granular pruning and less data read on point queries.
[storage.viper_config]
row_group_size = 65536       # ~65k vectors, results in ~32MB row groups
page_size = 524288          # 512KB pages
