# ProximaDB Compression Configuration Example
# 
# This file demonstrates how to configure compression for both SST and VIPER engines
# Both engines support compression control via configuration settings

# SST Engine Configuration
[storage.sst_config]
# SST block size - larger blocks improve ZSTD compression effectiveness
# Recommended values:
# - 1MB (1024): Standard workloads, good balance
# - 4MB (4096): High compression effectiveness (default)
# - 8MB (8192): Maximum compression, higher memory usage
block_size_mb = 3

# Compression algorithm: "zstd", "snappy", "lz4", "none"
compression = "zstd"

# Enable/disable compression globally for SST engine
compression_enabled = true

# Compression level (1-22 for ZSTD)
# - 1: Fastest, least compression
# - 3: Balanced (default)
# - 6: Better compression, slower
# - 9+: Maximum compression, significantly slower
compression_level = 3

# Other SST settings...
level_count = 7
compaction_threshold = 5
cache_size_mb = 128

# VIPER Engine Configuration
[storage.viper_config]
# Row group size affects Parquet compression efficiency
# Larger groups = better compression but more memory usage
row_group_size = 100000

# Compression algorithm: "zstd", "snappy", "lz4", "gzip", "none"
compression = "zstd"

# Enable/disable compression globally for VIPER engine
compression_enabled = true

# Compression level (1-22 for ZSTD)
compression_level = 3

# Enable Parquet statistics for query optimization
enable_statistics = true

# Other VIPER settings...
data_directory = "./viper_data"
cache_size_mb = 512

# Performance Recommendations:
#
# 1. ZSTD vs Snappy:
#    - ZSTD: 40-60% compression ratio, 200-400 MB/s throughput
#    - Snappy: 20-30% compression ratio, 500-1000 MB/s throughput
#
# 2. Block/Row Group Size Impact:
#    - Larger blocks: Better compression, higher latency
#    - Smaller blocks: Lower latency, worse compression
#
# 3. Compression Level Guidelines:
#    - Real-time workloads: Level 1-3
#    - Balanced workloads: Level 3-6
#    - Archival/batch: Level 6-9
#
# 4. Disable compression for:
#    - Ultra-low latency requirements (<1ms)
#    - Pre-compressed data
#    - Small vectors (<128 dimensions)

# Example: High-compression archival configuration
# [storage.sst_config]
# block_size_mb = 3
# compression = "zstd"
# compression_enabled = true
# compression_level = 9
#
# [storage.viper_config]
# row_group_size = 200000
# compression = "zstd"
# compression_enabled = true  
# compression_level = 9

# Example: Low-latency real-time configuration
# [storage.sst_config]
# block_size_mb = 3
# compression = "lz4"
# compression_enabled = true
# compression_level = 1
#
# [storage.viper_config]
# row_group_size = 50000
# compression = "snappy"
# compression_enabled = true
# compression_level = 1