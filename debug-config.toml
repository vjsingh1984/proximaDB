[server]
host = "0.0.0.0"
port = 5678
data_dir = "./proximadb-debug"

[grpc]
host = "0.0.0.0"
port = 5679

[logging]
level = "debug"
file_path = "./proximadb-debug/proximadb.log"

[storage]
data_dir = "./proximadb-debug/data"
wal_dir = "./proximadb-debug/wal"
memtable_size_mb = 8
memory_flush_size_bytes = 2097152

[storage.wal_config]
strategy = "Bincode"
sync_mode = "PerBatch"
url = "file://./proximadb-debug/wal"