# oapi-codegen configuration for the generated ProximaDB REST transport (TD-126 Phase 2).
#
# This generates the low-level typed REST client (models + per-operation request
# methods) into internal/genrest. The hand-written ergonomic facade in
# proximadb/internal/rest/adapter.go calls into this generated client; the public
# Go SDK API (the `proximadb` package) is unchanged.
#
# Regenerate with:  make gen-go-sdk   (from the repo root)
# Tool version is pinned in clients/go/codegen/tools.go (oapi-codegen v2.4.1).
#
# The input is a 3.0 down-conversion of the published 3.1 OpenAPI spec
# (docs/openapi/proximadb-openapi.yaml). The spec itself is generated + drift-gated
# by Phase 1 and is never hand-edited; the down-conversion happens only at
# generation time (scripts/openapi_31_to_30.py) because oapi-codegen / kin-openapi
# does not yet support OpenAPI 3.1 `type: [T, "null"]` nullables.
package: genrest
generate:
  models: true
  client: true
# Several component schemas are named like the response-wrapper types
# oapi-codegen would otherwise emit for the `ClientWithResponses` variant
# (e.g. an `InsertRecordsResponse` schema vs. the wrapper for `insertRecords`).
# A suffix on the wrapper types avoids the redeclaration collision. The facade
# uses the raw `Client` (which returns *http.Response), so these wrappers are
# unused, but generating them keeps the output identical to a default-config run.
compatibility:
  always-prefix-enum-values: false
output-options:
  skip-prune: true
  response-type-suffix: HTTPResp
  # Keep the generated surface deterministic across oapi-codegen patch releases.
  skip-fmt: false
