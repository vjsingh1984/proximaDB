# Isolated crate for the OpenAPI -> Rust code generator (TD-126 Phase 4).
#
# Keeping the generator in its own crate (excluded from the workspace) means the
# SDK crate (proximadb-sdk) only depends on the small generated-code runtime
# (reqwest + serde, already its deps) — the heavy generator toolchain
# (progenitor, openapiv3, prettyplease, syn) stays out of the SDK's dependency
# closure. `make gen-rust-sdk` runs this generator; the progenitor version below
# is the single pin. Bumping it is a deliberate, reviewable change: edit the
# require line, run `make gen-rust-sdk`, and commit the regenerated client
# (clients/rust/src/genrest.rs) together with the version bump. The CI drift gate
# `rust-sdk-codegen-drift` regenerates and `git diff --exit-code`s the result, so
# the generated client cannot silently diverge from the published OpenAPI spec.
[package]
name = "proximadb-genrest-codegen"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Excluded from the parent workspace (see clients/rust is itself a standalone
# crate); built only by gen.sh.
[workspace]

[[bin]]
name = "gen"
path = "src/main.rs"

[dependencies]
# Pinned generator (single source of truth for the generator version).
progenitor = "=0.14.0"
openapiv3 = "2.0.0"
serde_json = "1.0"
serde_yaml = "0.9"
prettyplease = "0.2"
syn = { version = "2.0", features = ["full"] }
