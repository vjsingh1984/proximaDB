[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Exclusions (server-internal tests that don't belong in SDK test suite)
# - test_persistence_wal.py: Server WAL/persistence tests (moved to server tests)

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --capture=no
    --ignore=tests/test_persistence_wal.py

# Note: timeout configuration requires pytest-timeout plugin

# Markers definition
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring a running ProximaDB server
    server_required: marks tests that require a running server (auto-skipped in CI)
    unit: marks tests as unit tests (can run without server)
    storage: marks tests related to storage functionality
    search: marks tests related to search functionality
    performance: marks tests that measure performance
    e2e: marks end-to-end tests
    large_data: marks tests that work with large datasets
    grpc: marks tests that require gRPC endpoint
    rest: marks tests that require REST endpoint
    embedding: marks tests that require embedding models (BERT, etc.)
    asyncio: marks tests that use asyncio

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
[coverage:run]
source = src/proximadb
omit = 
    */tests/*
    */proximadb_pb2.py
    */proximadb_pb2_grpc.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: