[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --capture=no

# Timeout for tests (in seconds)
timeout = 300

# Markers definition
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring a running ProximaDB server
    unit: marks tests as unit tests (can run without server)
    storage: marks tests related to storage functionality
    search: marks tests related to search functionality
    performance: marks tests that measure performance
    e2e: marks end-to-end tests
    large_data: marks tests that work with large datasets
    grpc: marks tests that require gRPC endpoint
    rest: marks tests that require REST endpoint
    embedding: marks tests that require embedding models (BERT, etc.)

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
[coverage:run]
source = src/proximadb
omit = 
    */tests/*
    */proximadb_pb2.py
    */proximadb_pb2_grpc.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: