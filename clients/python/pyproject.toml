[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "proximadb-python"
version = "0.2.0"
description = "Python client SDK for ProximaDB - Cloud-native vector database engineered for AI-first applications"
authors = [
    {name = "Vijaykumar Singh", email = "singhvjd@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vector", "database", "similarity", "search", "ml", "ai", "embeddings", "proximity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.24.0",
    "h2>=4.0.0",  # Required for HTTP/2 support in httpx
    "pydantic>=2.0.0",
    "numpy>=1.21.0",
    "typing-extensions>=4.0.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "protobuf>=4.21.0",
    "asyncio-mqtt>=0.13.0",
    "tenacity>=8.0.0",
    "orjson>=3.8.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# LLM integration via Victor framework
llm = [
    "victor-ai>=0.2.0",  # Victor AI framework for embeddings and LLM
    "sentence-transformers>=2.2.0",  # Local embedding models
]

# Code chunking with tree-sitter (requires Python 3.10+)
code-chunking = [
    "tree-sitter>=0.24.0",
    "tree-sitter-language-pack>=0.13.0",
]

langchain = [
    "langchain-core>=0.1.0",
]

victor = [
    "victor-ai>=0.2.0",
]

crewai = [
    "crewai>=0.80.0",
]

langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.1.0",
]

dspy = [
    "dspy>=2.5.0",
]

autogen = [
    "autogen-agentchat>=0.4.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.0.0",
    "sentence-transformers>=2.2.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "ruff>=0.0.280",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.0.0",
    "sentence-transformers>=2.2.0",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

performance = [
    "uvloop>=0.17.0",
    "aiodns>=3.0.0",
    "cchardet>=2.1.0",
]

[project.scripts]
proximadb-cli = "proximadb_sdk.cli:main"
pdb-cli = "proximadb_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/vjsingh1984/proximadb"
Documentation = "https://github.com/vjsingh1984/proximadb#readme"
Repository = "https://github.com/vjsingh1984/proximadb"
Issues = "https://github.com/vjsingh1984/proximadb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"proximadb_sdk" = ["py.typed", "*.pyi"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | v1
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["proximadb"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true

# Ignore errors in generated proto files
[[tool.mypy.overrides]]
module = ["proximadb_sdk.v1.*"]
ignore_errors = true

# Strict checking for well-typed core modules
[[tool.mypy.overrides]]
module = [
    "proximadb_sdk.models",
    "proximadb_sdk.models_v2",
    "proximadb_sdk.config",
    "proximadb_sdk.filters",
    "proximadb_sdk.auth",
    "proximadb_sdk.exceptions",
    "proximadb_sdk.integrations.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=proximadb_sdk",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--html=reports/report.html",
    "--self-contained-html",
    "-v"
]
markers = [
    "integration: marks tests as integration tests (may require running server)",
    "performance: marks tests as performance tests (may take longer to run)",
    "large_scale: marks tests as large-scale tests with significant data volumes",
    "grpc: marks tests as gRPC-specific tests", 
    "rest: marks tests as REST-specific tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
minversion = "7.0"

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM118", # in-dict-keys
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]