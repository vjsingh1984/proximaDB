# Sample YAML file for testing code chunking.
#
# This file contains various YAML constructs to test parsing.

---
# Document metadata
metadata:
  version: "1.0.0"
  author: "ProximaDB Team"
  description: "Sample configuration for testing"
  created_at: 2025-01-01T00:00:00Z

# Constants
constants:
  max_retries: 3
  default_timeout: 30.0
  environment: production

# Server configuration
server:
  host: localhost
  port: 5678
  bind_address: "0.0.0.0"

  # TLS configuration
  tls:
    enabled: true
    cert_file: /etc/ssl/certs/server.crt
    key_file: /etc/ssl/private/server.key
    ca_file: /etc/ssl/certs/ca.crt

  # Timeouts
  timeouts:
    read: 30s
    write: 30s
    idle: 120s

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_second: 1000
    burst_size: 100

# Database configuration
database:
  # Primary database
  primary:
    driver: postgres
    host: localhost
    port: 5432
    database: proximadb
    username: admin
    password: ${DB_PASSWORD}  # Environment variable
    pool:
      min_connections: 10
      max_connections: 100
      idle_timeout: 30m

  # Read replicas
  replicas:
    - host: replica1.db.local
      port: 5432
      weight: 50
    - host: replica2.db.local
      port: 5432
      weight: 50

# Storage engines
storage:
  engines:
    sst:
      enabled: true
      compression: lz4
      block_size: 4096

    helix:
      enabled: true
      hilbert_order: 16
      cache_size: 1GB

    viper:
      enabled: true
      parquet:
        row_group_size: 1000000
        compression: snappy

# User configuration
users:
  - id: "user_1"
    name: "Test User"
    email: test@example.com
    roles:
      - admin
      - developer
    metadata:
      department: Engineering
      location: Remote

  - id: "user_2"
    name: "Admin User"
    email: admin@example.com
    roles:
      - super_admin
    metadata:
      department: IT
      location: Headquarters

# Service definitions
services:
  user_service:
    enabled: true
    endpoints:
      - path: /api/v1/users
        methods: [GET, POST]
      - path: /api/v1/users/{id}
        methods: [GET, PUT, DELETE]
    health_check:
      endpoint: /health
      interval: 30s
      timeout: 5s

  vector_service:
    enabled: true
    endpoints:
      - path: /api/v1/vectors
        methods: [POST]
      - path: /api/v1/search
        methods: [POST]
    batch_size: 1000

# Logging configuration
logging:
  level: info
  format: json

  outputs:
    - type: console
      level: debug

    - type: file
      level: info
      path: /var/log/proximadb/app.log
      rotation:
        max_size: 100MB
        max_age: 7d
        max_backups: 5

    - type: syslog
      level: warn
      facility: local0

# Monitoring and metrics
monitoring:
  prometheus:
    enabled: true
    port: 9090
    path: /metrics

  tracing:
    enabled: true
    provider: jaeger
    endpoint: http://jaeger:14268/api/traces
    sampling_rate: 0.1

# Feature flags
features:
  new_search_algorithm: true
  experimental_caching: false
  advanced_analytics: true

  rollout:
    gradual_rollout:
      enabled: true
      percentage: 25

# Multiline strings
templates:
  welcome_message: |
    Welcome to ProximaDB!

    This is a sample configuration file that demonstrates
    various YAML features for testing the parser.

    Features include:
    - Nested structures
    - Arrays
    - Anchors and aliases
    - Multiline strings

  error_template: >
    An error occurred while processing your request.
    Please try again later or contact support.

# Anchors and aliases
defaults: &defaults
  timeout: 30
  retries: 3
  backoff: exponential

http_client:
  <<: *defaults
  base_url: https://api.example.com

grpc_client:
  <<: *defaults
  address: grpc.example.com:443
  tls: true

# Complex nested structure
workflow:
  name: "Data Processing Pipeline"
  steps:
    - id: fetch
      action: fetch_data
      params:
        url: ${DATA_URL}
        timeout: 60
      on_success: transform
      on_failure: alert

    - id: transform
      action: transform_data
      params:
        operations:
          - type: filter
            condition: "status == 'active'"
          - type: map
            fields: [id, name, value]
      on_success: store

    - id: store
      action: store_results
      params:
        destination: database
        batch_size: 1000

    - id: alert
      action: send_alert
      params:
        channel: slack
        message: "Pipeline failed"

# Environment-specific overrides
environments:
  development:
    database:
      primary:
        host: localhost
    logging:
      level: debug

  staging:
    database:
      primary:
        host: staging-db.local
    features:
      experimental_caching: true

  production:
    database:
      primary:
        host: prod-db.cluster.local
    monitoring:
      tracing:
        sampling_rate: 0.01
