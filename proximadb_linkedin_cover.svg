<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2a4a" />
      <stop offset="100%" style="stop-color:#3a1a4a" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#6a0dad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a1a4a;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="100%" height="100%" fill="url(#backgroundGradient)" />

  <!-- Subtle "star-like" specks (simplified) -->
  <circle cx="100" cy="50" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="250" cy="120" r="0.8" fill="#ffffff" opacity="0.2" />
  <circle cx="50" cy="200" r="1.2" fill="#ffffff" opacity="0.4" />
  <circle cx="300" cy="300" r="0.9" fill="#ffffff" opacity="0.25" />
  <circle cx="150" cy="350" r="1.1" fill="#ffffff" opacity="0.35" />
  <circle cx="1400" cy="80" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="1250" cy="180" r="0.8" fill="#ffffff" opacity="0.2" />
  <circle cx="1500" cy="250" r="1.2" fill="#ffffff" opacity="0.4" />
  <circle cx="1300" cy="320" r="0.9" fill="#ffffff" opacity="0.25" />
  <circle cx="1450" cy="30" r="1.1" fill="#ffffff" opacity="0.35" />


  <!-- Central Motif (Abstracted Database/Core) -->
  <circle cx="300" cy="198" r="80" fill="#4a0d6a" />
  <circle cx="300" cy="198" r="100" fill="url(#coreGlow)" />

  <!-- Vector/Data Flow Lines -->
  <line x1="300" y1="198" x2="450" y2="100" stroke="#00ffff" stroke-width="3" opacity="0.7" />
  <line x1="300" y1="198" x2="480" y2="250" stroke="#00ffff" stroke-width="3" opacity="0.7" />
  <line x1="300" y1="198" x2="400" y2="350" stroke="#00ffff" stroke-width="3" opacity="0.7" />
  <line x1="300" y1="198" x2="150" y2="150" stroke="#00ffff" stroke-width="3" opacity="0.7" />
  <line x1="300" y1="198" x2="120" y2="280" stroke="#00ffff" stroke-width="3" opacity="0.7" />

  <!-- ProximaDB Logo/Text -->
  <text x="800" y="180" font-family="Arial, sans-serif" font-size="80" fill="#ffffff" font-weight="bold">ProximaDB</text>
  <text x="800" y="240" font-family="Arial, sans-serif" font-size="30" fill="#cccccc">High-Performance Vector Database</text>

</svg>