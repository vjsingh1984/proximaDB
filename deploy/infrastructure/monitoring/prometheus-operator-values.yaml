# Prometheus Operator Configuration for ProximaDB
#
# Purpose: Complete monitoring stack for ProximaDB cloud infrastructure
# Components: Prometheus, Grafana, Alertmanager, Node Exporter, Kube-State-Metrics
#
# Installation:
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm repo update
# helm install prometheus prometheus-community/kube-prometheus-stack -f prometheus-operator-values.yaml

# Default Scrape Configuration
prometheus:
  enabled: true

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: true

    # Scrape interval
    interval: 15s

    # Scrape timeout
    scrapeTimeout: 10s

  # Prometheus configuration
  prometheusSpec:
    # Service account for Prometheus
    serviceAccountName: prometheus

    # Retention time
    retention: 15d

    # Resource limits
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # External labels
    externalLabels:
      cluster: proximadb-production
      environment: production

    # Service monitor selector
    serviceMonitorSelector:
      matchLabels:
        release: prometheus

    # Service monitor namespace selector
    serviceMonitorNamespaceSelector:
      any: true

    # Pod monitor selector
    podMonitorSelector:
      matchLabels:
        release: prometheus

    # Rule selector
    ruleSelector:
      matchLabels:
        release: prometheus

    # Alertmanager configuration
    alertingEndpoints:
      - namespace: monitoring
        name: prometheus-operated
        port: web
        scheme: http

    # Additional scrape configurations
    additionalScrapeConfigs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'proximadb-metrics'
        kubernetes_sd_configs:
          - role: pod
          namespaces:
            names:
              - proximadb
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: proximadb
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9090

# Grafana Configuration
grafana:
  enabled: true

  # Admin credentials
  adminPassword: prom-operator  # CHANGE THIS IN PRODUCTION

  # Service configuration
  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  # Ingress
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - grafana.proximadb.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.proximadb.example.com

  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3-encrypted
    size: 20Gi

  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://grafana.proximadb.example.com
    auth.generic_oauth:
      enabled: false
    database:
      type: postgres
      host: postgresql.monitoring.svc:5432
      name: grafana
      user: grafana
      password: ${GRAFANA_DB_PASSWORD}

  # Dashboards
  dashboards:
    default:
      # ProximaDB dashboards
      proximadb-overview:
        gnetId: 0  # Custom dashboard
        revision: 1
        datasource: Prometheus

      proximadb-performance:
        gnetId: 0  # Custom dashboard
        revision: 1
        datasource: Prometheus

      # Kubernetes dashboards
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

      kubernetes-pods:
        gnetId: 7362
        revision: 1
        datasource: Prometheus

      # Node exporter dashboards
      node-exporter-full:
        gnetId: 1860
        revision: 25
        datasource: Prometheus

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-operated.monitoring.svc:9090
          isDefault: true
          editable: true

        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc:3100
          editable: true

        - name: Jaeger
          type: jaeger
          access: proxy
          url: http://jaeger-query.monitoring.svc:16686
          editable: true

# Alertmanager Configuration
alertmanager:
  enabled: true

  # Alertmanager configuration
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    route:
      receiver: 'default-receiver'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: true

        - match:
            severity: warning
          receiver: 'warning-receiver'

    receivers:
      - name: 'default-receiver'
        slack_configs:
          - channel: '#proximadb-alerts'
            title: 'ProximaDB Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

      - name: 'critical-receiver'
        slack_configs:
          - channel: '#proximadb-critical'
            color: 'danger'
            title: 'CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        pagerduty_configs:
          - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
            description: '{{ .GroupLabels.alertname }}'

      - name: 'warning-receiver'
        slack_configs:
          - channel: '#proximadb-warnings'
            color: 'warning'
            title: 'WARNING: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3-encrypted
    size: 5Gi

# Node Exporter
nodeExporter:
  enabled: true
  serviceMonitor:
    relabelings:
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
        action: replace

# Kube-State-Metrics
kubeStateMetrics:
  enabled: true

# Kubelet Service Monitor
kubelet:
  enabled: true
  serviceMonitor:
    interval: 15s

# Kubernetes Controller Manager
kubeControllerManager:
  enabled: true

# Kubernetes Scheduler
kubeScheduler:
  enabled: true

# Kubernetes etcd
kubeEtcd:
  enabled: false

# Kubernetes Proxy
kubeProxy:
  enabled: true

# Kubernetes API Server
kubeApiServer:
  enabled: true

# Additional Promtail Rules
promtail:
  enabled: false

# Additional Loki
loki:
  enabled: false
