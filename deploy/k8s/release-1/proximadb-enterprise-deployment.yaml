# Historical enterprise release example only.
# Not a supported OSS deployment contract. Do not apply without reconciling
# against docs/SUPPORTED_SURFACE.adoc and the canonical chart at
# deploy/helm/proximadb.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proximadb-enterprise
  namespace: proximadb-enterprise
  labels:
    app: proximadb-enterprise
    version: release-1.0.0
    tier: enterprise
spec:
  replicas: 5  # Multi-tenant enterprise scale
  selector:
    matchLabels:
      app: proximadb-enterprise
  template:
    metadata:
      labels:
        app: proximadb-enterprise
        version: release-1.0.0
        tier: enterprise
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: proximadb-enterprise
        image: proximadb/proximadb-enterprise:release-1.0.0
        ports:
        - containerPort: 5678
          name: rest-api
        - containerPort: 5679
          name: grpc-api
        - containerPort: 9090
          name: metrics
        env:
        # Enterprise Release 1 Configuration
        - name: PROXIMADB_RELEASE_VERSION
          value: "1.0.0"
        - name: PROXIMADB_ENTERPRISE_MODE
          value: "true"
        - name: PROXIMADB_MULTI_TENANT_ENABLED
          value: "true"
        - name: PROXIMADB_MAX_TENANTS
          value: "${TENANT_COUNT}"
        - name: PROXIMADB_COMPLIANCE_MODE
          value: "${COMPLIANCE_MODE}"
        
        # Multi-Tenant Performance Configuration
        - name: PROXIMADB_TENANT_ISOLATION_ENABLED
          value: "true"
        - name: PROXIMADB_DOMAIN_INTELLIGENCE_ENABLED
          value: "true"
        - name: PROXIMADB_CROSS_DOMAIN_COMPOSITION_ENABLED
          value: "true"
        - name: PROXIMADB_BUSINESS_CONTEXT_OPTIMIZATION
          value: "true"
        
        # Enhanced RBAC Configuration
        - name: PROXIMADB_ENHANCED_RBAC_ENABLED
          value: "true"
        - name: PROXIMADB_MULTI_LEVEL_PERMISSIONS
          value: "true"
        - name: PROXIMADB_FIELD_LEVEL_SECURITY
          value: "true"
        
        # SSO Integration Configuration
        - name: PROXIMADB_SSO_ENABLED
          value: "true"
        - name: PROXIMADB_AWS_IAM_INTEGRATION
          value: "true"
        - name: PROXIMADB_AZURE_AD_INTEGRATION
          value: "true"
        - name: PROXIMADB_FEDERATED_IDENTITY_DELEGATION
          value: "true"
        
        # Regulatory Compliance Configuration
        - name: PROXIMADB_COMPREHENSIVE_AUDIT_ENABLED
          value: "true"
        - name: PROXIMADB_REGULATORY_COMPLIANCE_AUTOMATION
          value: "true"
        - name: PROXIMADB_BASEL_III_FRAMEWORK
          value: "true"
        - name: PROXIMADB_SOX_COMPLIANCE
          value: "true"
        - name: PROXIMADB_HIPAA_COMPLIANCE
          value: "true"
        
        # Performance and Resource Configuration
        - name: PROXIMADB_MEMORY_LIMIT
          value: "16Gi"
        - name: PROXIMADB_CPU_LIMIT
          value: "8"
        - name: PROXIMADB_CACHE_SIZE
          value: "8Gi"
        - name: PROXIMADB_TENANT_RESOURCE_ISOLATION
          value: "true"
        
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
            ephemeral-storage: "10Gi"
          limits:
            memory: "16Gi"
            cpu: "8"
            ephemeral-storage: "50Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          
        readinessProbe:
          httpGet:
            path: /health
            port: 5678
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          
        volumeMounts:
        - name: enterprise-config
          mountPath: /etc/proximadb/enterprise
        - name: sso-config
          mountPath: /etc/proximadb/sso
        - name: compliance-config
          mountPath: /etc/proximadb/compliance
        - name: enterprise-data
          mountPath: /data/enterprise
          
      volumes:
      - name: enterprise-config
        configMap:
          name: proximadb-enterprise-config
      - name: sso-config
        secret:
          secretName: proximadb-sso-config
      - name: compliance-config
        configMap:
          name: proximadb-compliance-config
      - name: enterprise-data
        persistentVolumeClaim:
          claimName: proximadb-enterprise-data
          
      # Enterprise security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        
      # Node affinity for enterprise workloads
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: proximadb.com/tier
                operator: In
                values: ["enterprise"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["proximadb-enterprise"]
              topologyKey: kubernetes.io/hostname
