# Historical enterprise release example only.
# Not a supported OSS deployment contract. Do not apply without reconciling
# against docs/SUPPORTED_SURFACE.adoc and the canonical chart at
# deploy/helm/proximadb.
apiVersion: v1
kind: Service
metadata:
  name: proximadb-enterprise
  namespace: proximadb-enterprise
  labels:
    app: proximadb-enterprise
    version: release-1.0.0
    tier: enterprise
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - name: rest-api
    port: 5678
    targetPort: 5678
    protocol: TCP
  - name: grpc-api
    port: 5679
    targetPort: 5679
    protocol: TCP
  - name: enterprise-dashboard
    port: 8080
    targetPort: 5678
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: proximadb-enterprise
    
---
apiVersion: v1
kind: Service
metadata:
  name: proximadb-enterprise-internal
  namespace: proximadb-enterprise
  labels:
    app: proximadb-enterprise
    version: release-1.0.0
    tier: enterprise-internal
spec:
  type: ClusterIP
  ports:
  - name: rest-api-internal
    port: 5678
    targetPort: 5678
    protocol: TCP
  - name: grpc-api-internal
    port: 5679
    targetPort: 5679
    protocol: TCP
  - name: inter-service
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: proximadb-enterprise
