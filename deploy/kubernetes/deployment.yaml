apiVersion: apps/v1
kind: Deployment
metadata:
  name: proximadb
  namespace: proximadb
  labels:
    app.kubernetes.io/name: proximadb
    app.kubernetes.io/version: "0.1.4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proximadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proximadb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: proximadb
          image: proximadb/proximadb:0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 5678
              protocol: TCP
            - name: grpc
              containerPort: 5679
              protocol: TCP
            - name: arrow-ipc
              containerPort: 5680
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: proximadb-config
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: proximadb-data
      terminationGracePeriodSeconds: 30
