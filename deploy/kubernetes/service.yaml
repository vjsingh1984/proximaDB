apiVersion: v1
kind: Service
metadata:
  name: proximadb
  namespace: proximadb
  labels:
    app.kubernetes.io/name: proximadb
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 5678
      targetPort: rest
      protocol: TCP
    - name: grpc
      port: 5679
      targetPort: grpc
      protocol: TCP
    - name: arrow-ipc
      port: 5680
      targetPort: arrow-ipc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: proximadb
---
# Headless service for StatefulSet-like DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: proximadb-headless
  namespace: proximadb
  labels:
    app.kubernetes.io/name: proximadb
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: rest
      port: 5678
      targetPort: rest
    - name: grpc
      port: 5679
      targetPort: grpc
  selector:
    app.kubernetes.io/name: proximadb
