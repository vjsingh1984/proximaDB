apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proximadb-data
  namespace: proximadb
  labels:
    app.kubernetes.io/name: proximadb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  # Uncomment and set appropriate storage class for your cluster
  # storageClassName: gp3        # AWS EBS
  # storageClassName: managed-csi # Azure
  # storageClassName: premium-rwo # GCP
