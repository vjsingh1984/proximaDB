apiVersion: v1
kind: Service
metadata:
  name: {{ include "proximadb.fullname" . }}
  labels:
    {{- include "proximadb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.rest.port }}
      targetPort: rest
      protocol: TCP
      name: rest
    - port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.service.arrowIpc.port }}
      targetPort: arrow-ipc
      protocol: TCP
      name: arrow-ipc
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "proximadb.selectorLabels" . | nindent 4 }}
---
{{- if .Values.service.type | eq "ClusterIP" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proximadb.fullname" . }}-headless
  labels:
    {{- include "proximadb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.rest.port }}
      targetPort: rest
      protocol: TCP
      name: rest
    - port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "proximadb.selectorLabels" . | nindent 4 }}
{{- end }}
