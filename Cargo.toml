[package]
name = "proximadb"
version = "0.1.4"
edition = "2024"
authors = ["Vijaykumar Singh <singhvjd@gmail.com>"]
description = "ProximaDB - Cloud-native vector database engineered for AI-first applications"
license = "Apache-2.0"
repository = "https://github.com/vjsingh1984/proximadb"
homepage = "https://github.com/vjsingh1984/proximadb"
keywords = ["vector", "database", "ai", "ml", "proximity", "similarity-search"]
categories = ["database-implementations", "science"]
rust-version = "1.88"

[workspace]
members = [
    ".",
]

[[bin]]
name = "proximadb-server"
path = "src/bin/server.rs"

[[bin]]
name = "proximadb-bench"
path = "src/bin/proximadb-bench-consolidated.rs"



[dependencies]
# Core async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
# tokio-util = "0.7"  # Unused - no imports found in codebase
# tokio-stream = "0.1"  # Unused - no imports found in codebase

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytemuck = { version = "1.14", features = ["derive"] }

# SQL Parsing
sqlparser = "0.44"

# Async recursion support
async-recursion = "1.0"

# Checksums
crc32fast = "1.4"  # Used for SST codebook checksum

# System information
libc = "0.2"

# Data structures
# art-tree = "0.2.0"  # Disabled - x86_64 specific, incompatible with ARM64
# Alternative: Use HashMap for ART implementation (already done in art.rs)
once_cell = "1.19"
lazy_static = "1.5"
# dashmap = "6.1.0"     # High-performance concurrent hashmap for ART alternative (already defined below)

# Networking & gRPC
tonic = { version = "0.10", features = ["gzip"] }
tonic-build = "0.10"
tonic-reflection = "0.10"
prost = "0.12"
prost-types = { version = "0.12" }
hyper = "0.14"  # Used internally by axum and tonic
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace", "fs", "compression-full", "decompression-full"] }
url = "2.4"
reqwest = { version = "0.11", features = ["json"] }

# Storage & Memory Management
memmap2 = "0.9"
rocksdb = { version = "0.21", optional = true }  # Optional for metadata backend
tempfile = "3.0"
rayon = "1.10"  # Parallel processing for search optimization
# # glob = "0.3"  # Replaced with internal glob implementation - replaced with internal implementation
# Parquet and Arrow dependencies - using v56+ for improved performance
parquet = { version = "56.1", default-features = false, features = ["arrow", "zstd", "lz4", "snap", "brotli", "flate2", "flate2-rust_backened"] }
# Arrow dependencies matching parquet v56
arrow = { version = "56.1", features = ["prettyprint"] }
arrow-array = { version = "56.1", default-features = false }
arrow-buffer = { version = "56.1", default-features = false }
arrow-schema = { version = "56.1", default-features = false }
arrow-data = { version = "56.1", default-features = false }
arrow-ipc = { version = "56.1", default-features = false }
arrow-select = { version = "56.1", default-features = false }
arrow-ord = { version = "56.1", default-features = false }

# Advanced compression for recovery-optimized WAL
lz4_flex = "0.11"        # Faster LZ4 implementation
snap = "1.1"             # Snappy compression
zstd = "0.13"            # Zstandard compression
flate2 = { version = "1.0", default-features = true }  # Gzip/Deflate/Zlib compression
brotli = "6.0"           # Brotli compression - Updated from 3.5
bzip2 = "0.5"            # Bzip2 compression - Updated from 0.4
xz2 = "0.1"              # XZ/LZMA2 compression
# proxima = "0.2"        # Removed - replaced with internal ProximaDB encoding

# System monitoring
sysinfo = "0.30"

# Avro serialization with schema evolution
apache-avro = "0.16"
# serde_bytes = "0.11"  # Unused - no imports found in codebase
bytes = "1.5"

# Cloud storage SDKs (optional for testing)
aws-config = { version = "1.0", optional = true }
aws-sdk-s3 = { version = "1.0", optional = true }
azure_storage = { version = "0.19", optional = true }
azure_storage_blobs = { version = "0.19", optional = true }
google-cloud-storage = { version = "0.15", optional = true }

# ML clustering algorithms for VIPER (unused - basic clustering implemented)
# linfa = "0.7"
# linfa-clustering = "0.7"
# smartcore = "0.3"

# Consensus (temporarily disabled for testing)
# raft = "0.7"
# raft-proto = "0.7"

# Vector operations & SIMD
# ndarray = "0.15"  # Unused - no imports found, only referenced in logs
nalgebra = "0.32"  # For PCA eigendecomposition in HELIX engine
# faiss = { version = "0.11", optional = true }  # Unused - no FAISS integration implemented
# hnsw = "0.11"  # Unused - ProximaDB has custom HNSW implementation in src/index/axis/indexes/hnsw_index.rs

# CPU optimization
num_cpus = "1.16"
raw-cpuid = "11.0"  # CPU feature detection for x86_64

# Random number generation
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"  # For generating realistic probability distributions

# Fast non-cryptographic hashing
# fasthash = "0.4"  # Has ARM64 compatibility issues
# ahash = "0.8"  # Using internal XXHash instead - already optimized and stable

# Cryptographic hashing
sha2 = "0.10"

# GPU acceleration (removed - was placeholder code)

# Intel MKL (optional) - Disabled on ARM64
# intel-mkl-src = { version = "0.8", features = ["mkl-static-lp64-iomp"], optional = true }

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
prometheus = "0.13"
metrics = "0.21"
# metrics-prometheus = "0.6"  # Unused - using prometheus crate directly

# Configuration
config = "0.13"
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"

# Benchmarking (HTML reports available via `cargo bench`)

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }  # Required for JWT token generation
jsonwebtoken = "9.2"  # JWT token creation and validation
# # blake3 = "1.5"  # Replaced with internal hash implementation - replaced with internal implementation
chrono = { version = "0.4.31", features = ["serde"] }  # Updated for Arrow 51 compatibility
# base64 = "0.21"  # Using internal implementation in utils::encoding
crossbeam = "0.8"
crossbeam-epoch = "0.9"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
regex = "1.10"
nom = "7"

# slog = "2.7"  # Unused - using tracing instead
# slog-stdlog = "4.1"  # Unused - using tracing instead

# REST API
axum = { version = "0.6", features = ["json"] }
# axum-macros = "0.3"  # Unused - no imports found in codebase
urlencoding = "2.1.3"
# # crossbeam-skiplist = "0.1.3"  # Replaced with internal skiplist implementation  # Replaced with internal implementation
dashmap = "6.1.0"
# # bplustree = "0.1.0"  # Replaced with internal btree implementation  # Replaced with internal implementation
# # lru = "0.12"  # Replaced with internal cache implementation  # Replaced with internal implementation
moka = { version = "0.12", features = ["future"] }
# # roaring = "0.10"  # Replaced with internal bitmap implementation - replaced with internal implementation

# Lock-free data structures for Phase 2 optimization
# arc-swap = "1.7"  # Unused - no imports found in codebase

# GPU acceleration dependencies (platform-specific)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
metal = { version = "0.27", optional = true }  # Metal GPU acceleration for Apple Silicon

# Build dependencies
[build-dependencies]
tonic-build = "0.10"
apache-avro = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Development dependencies
[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tempdir = "0.3"
reqwest = { version = "0.11", features = ["json"] }
env_logger = "0.10"

[features]
default = ["sql_frontend"]
distributed = []
standalone = []
rocksdb = ["dep:rocksdb"]  # RocksDB metadata backend support

# Cloud storage features (optional to avoid linking issues during testing)
aws = ["dep:aws-config", "dep:aws-sdk-s3"]
azure = ["dep:azure_storage", "dep:azure_storage_blobs"] 
gcp = ["dep:google-cloud-storage"]

# Test gating (keeps default test runs lean)
comprehensive_tests = []
perf_tests = []
cloud-full = ["aws", "azure", "gcp"]

# SQL frontend feature flag (default on). When disabled, the server uses legacy sql_engine path.
sql_frontend = []

# Hardware acceleration features
gpu = []  # GPU acceleration support (CUDA, ROCm, MPS, OpenCL)
# SIMD optimizations - ARM64 has NEON, not AVX
simd = []  # Placeholder - would need ARM NEON implementation
debug-filters = []  # Enable debug filtering for search operations

# CPU optimizations - Disabled Intel MKL on ARM64
# cpu-optimized = ["intel-mkl"]
# intel-mkl = ["intel-mkl-src"]

# GPU acceleration (removed - was placeholder code)

# External libraries
# faiss-cpu = ["faiss"]  # Unused - no FAISS integration
# faiss-gpu = ["faiss"]  # Unused - no FAISS integration

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Test configuration
[[test]]
name = "integration"
path = "tests/rust/mod.rs"

# Release build profile optimized for production
[profile.release-server]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = true

# Development build with tests
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true

# Test profile
[profile.test]
opt-level = 1
debug = true
incremental = true

# Benchmark configuration - Organized by functional categories

# 1. COMPUTE & DISTANCE BENCHMARKS (01-03)
