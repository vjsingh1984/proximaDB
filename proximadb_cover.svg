<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant background gradient matching logo -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="25%" style="stop-color:#1e293b" />
      <stop offset="50%" style="stop-color:#1e1b4b" />
      <stop offset="75%" style="stop-color:#2e1065" />
      <stop offset="100%" style="stop-color:#312e81" />
    </linearGradient>
    
    <!-- Main brand gradient -->
    <linearGradient id="proximaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="25%" style="stop-color:#6366f1" />
      <stop offset="50%" style="stop-color:#8b5cf6" />
      <stop offset="75%" style="stop-color:#a855f7" />
      <stop offset="100%" style="stop-color:#c084fc" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="50%" style="stop-color:#14b8a6" />
      <stop offset="100%" style="stop-color:#10b981" />
    </linearGradient>
    
    <!-- Glow effects -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#backgroundGradient)"/>
  
  <!-- Grid pattern for tech feel -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.5"/>
    </pattern>
    <rect width="1584" height="396" fill="url(#grid)"/>
  </g>
  
  <!-- Background stars/nodes -->
  <g opacity="0.4">
    <circle cx="100" cy="80" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="150" r="1" fill="#06b6d4">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="320" r="1.2" fill="#10b981">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="100" r="1.3" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1480" cy="250" r="1" fill="#f59e0b">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1350" cy="350" r="1.5" fill="#ef4444">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left side: Multi-Engine Architecture Visualization -->
  <g transform="translate(200, 198)">
    <!-- Central hexagon -->
    <path d="M -60 -35 L 0 -70 L 60 -35 L 60 35 L 0 70 L -60 35 Z" 
          fill="none" stroke="url(#proximaGradient)" stroke-width="3" opacity="0.6"/>
    
    <!-- Inner hexagon -->
    <path d="M -40 -23 L 0 -46 L 40 -23 L 40 23 L 0 46 L -40 23 Z" 
          fill="url(#coreGlow)" opacity="0.3"/>
    
    <!-- Storage Engine Nodes -->
    <!-- SST (top-left) -->
    <g transform="translate(-80, -60)">
      <circle r="25" fill="#10b981" opacity="0.2" filter="url(#softGlow)"/>
      <circle r="18" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
      <circle r="14" fill="#0f172a"/>
      <text y="5" text-anchor="middle" font-size="14" fill="#10b981" font-weight="bold">SST</text>
    </g>
    
    <!-- VIPER (top) -->
    <g transform="translate(0, -90)">
      <circle r="25" fill="#8b5cf6" opacity="0.2" filter="url(#softGlow)"/>
      <circle r="18" fill="#8b5cf6" opacity="0.8" filter="url(#glow)"/>
      <circle r="14" fill="#0f172a"/>
      <text y="5" text-anchor="middle" font-size="14" fill="#8b5cf6" font-weight="bold">VIPER</text>
    </g>
    
    <!-- NOVA (top-right) -->
    <g transform="translate(80, -60)">
      <circle r="25" fill="#f59e0b" opacity="0.2" filter="url(#softGlow)"/>
      <circle r="18" fill="#f59e0b" opacity="0.8" filter="url(#glow)"/>
      <circle r="14" fill="#0f172a"/>
      <text y="5" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="bold">NOVA</text>
    </g>
    
    <!-- SWIFT (bottom-right) -->
    <g transform="translate(80, 60)">
      <circle r="25" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)"/>
      <circle r="18" fill="#06b6d4" opacity="0.8" filter="url(#glow)"/>
      <circle r="14" fill="#0f172a"/>
      <text y="5" text-anchor="middle" font-size="14" fill="#06b6d4" font-weight="bold">SWIFT</text>
    </g>
    
    <!-- RAPTOR (bottom) -->
    <g transform="translate(0, 90)">
      <circle r="25" fill="#ef4444" opacity="0.2" filter="url(#softGlow)"/>
      <circle r="18" fill="#ef4444" opacity="0.8" filter="url(#glow)"/>
      <circle r="14" fill="#0f172a"/>
      <text y="5" text-anchor="middle" font-size="12" fill="#ef4444" font-weight="bold">RAPTOR</text>
    </g>
    
    <!-- PRISM (bottom-left) -->
    <g transform="translate(-80, 60)">
      <circle r="25" fill="#a855f7" opacity="0.2" filter="url(#softGlow)"/>
      <circle r="18" fill="#a855f7" opacity="0.8" filter="url(#glow)"/>
      <circle r="14" fill="#0f172a"/>
      <text y="5" text-anchor="middle" font-size="14" fill="#a855f7" font-weight="bold">PRISM</text>
    </g>
    
    <!-- Connection lines -->
    <g stroke="url(#accentGradient)" stroke-width="2" opacity="0.4" fill="none">
      <path d="M -60 -45 L 0 0 L 60 -45"/>
      <path d="M -60 45 L 0 0 L 60 45"/>
      <path d="M -60 -45 L 0 0 L -60 45"/>
      <path d="M 60 -45 L 0 0 L 60 45"/>
    </g>
    
    <!-- Central core -->
    <circle r="30" fill="url(#proximaGradient)" opacity="0.8" filter="url(#glow)"/>
    <circle r="24" fill="#0f172a"/>
    <text y="8" text-anchor="middle" font-size="28" fill="url(#proximaGradient)" font-weight="bold">P</text>
    
    <!-- Animated data flow -->
    <circle r="3" fill="#06b6d4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="30;60;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center/Right: Text and Tagline -->
  <g transform="translate(792, 198)">
    <!-- Main title -->
    <text y="-20" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
          font-size="90" font-weight="700" fill="#ffffff">
      Proxima<tspan fill="url(#proximaGradient)">DB</tspan>
    </text>
    
    <!-- Primary tagline -->
    <text y="30" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
          font-size="28" font-weight="400" fill="#94a3b8">
      DISTRIBUTED VECTOR DATABASE PLATFORM
    </text>
    
    <!-- Feature highlights -->
    <text y="70" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
          font-size="20" font-weight="300" fill="#64748b">
      Multi-Engine Architecture • Storage Optimized • Built from Ground Up
    </text>
    
    <!-- Key metrics -->
    <g transform="translate(-200, 120)" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
      <!-- Performance -->
      <g transform="translate(0, 0)">
        <rect x="-5" y="-20" width="120" height="40" rx="8" fill="url(#proximaGradient)" opacity="0.1"/>
        <text x="55" y="0" text-anchor="middle" font-size="14" fill="#10b981" font-weight="600">2.5x Faster</text>
        <text x="55" y="15" text-anchor="middle" font-size="10" fill="#64748b">Search Performance</text>
      </g>
      
      <!-- Storage -->
      <g transform="translate(140, 0)">
        <rect x="-5" y="-20" width="120" height="40" rx="8" fill="url(#proximaGradient)" opacity="0.1"/>
        <text x="55" y="0" text-anchor="middle" font-size="14" fill="#06b6d4" font-weight="600">45% Less</text>
        <text x="55" y="15" text-anchor="middle" font-size="10" fill="#64748b">Memory Usage</text>
      </g>
      
      <!-- Engines -->
      <g transform="translate(280, 0)">
        <rect x="-5" y="-20" width="120" height="40" rx="8" fill="url(#proximaGradient)" opacity="0.1"/>
        <text x="55" y="0" text-anchor="middle" font-size="14" fill="#a855f7" font-weight="600">6 Engines</text>
        <text x="55" y="15" text-anchor="middle" font-size="10" fill="#64748b">Specialized Storage</text>
      </g>
    </g>
  </g>

  <!-- Right side decoration: Data flow visualization -->
  <g transform="translate(1350, 198)" opacity="0.6">
    <g stroke="url(#accentGradient)" stroke-width="1" fill="none">
      <path d="M 0 0 Q 50 -50, 100 0 T 200 0">
        <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -30 Q 50 -80, 100 -30 T 200 -30">
        <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 30 Q 50 80, 100 30 T 200 30">
        <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>