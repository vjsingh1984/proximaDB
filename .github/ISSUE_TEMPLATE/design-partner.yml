name: MVP design-partner workload
description: Evaluate a real context-serving workload against the supported ProximaDB corridor
title: "design-partner: "
labels:
  - design-partner
  - mvp
body:
  - type: markdown
    attributes:
      value: |
        Share workload shape, not private data or credentials. This intake is for co-design:
        correctness and economics are measured before a feature or adoption decision is made.
  - type: textarea
    id: outcome
    attributes:
      label: Application outcome
      description: What user-visible operation are you trying to make simpler, safer, or cheaper?
      placeholder: Assemble filtered support context for an agent without joining a vector service back to PostgreSQL.
    validations:
      required: true
  - type: textarea
    id: current_stack
    attributes:
      label: Current data path
      description: Which systems, joins, queues, caches, and operational steps are involved today?
    validations:
      required: true
  - type: dropdown
    id: scale
    attributes:
      label: Record scale
      options:
        - Under 100K
        - 100K–1M
        - 1M–10M
        - 10M–100M
        - Over 100M
    validations:
      required: true
  - type: input
    id: rates
    attributes:
      label: Write and query rates
      description: Approximate sustained and peak writes/s and queries/s.
      placeholder: 200 writes/s sustained, 2K peak; 50 filtered queries/s
    validations:
      required: true
  - type: textarea
    id: query_mix
    attributes:
      label: Query and filter mix
      description: Vector dimensions, top-k, metadata predicates/selectivity, and freshness expectations.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Storage/deployment target
      options:
        - Local development
        - AWS / S3
        - Azure Blob
        - Google Cloud Storage
        - Undecided
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: Non-negotiable correctness and recovery boundary
      description: Isolation, durability, restart, deletion, latency, and availability expectations.
    validations:
      required: true
  - type: checkboxes
    id: evidence
    attributes:
      label: Co-design evidence agreement
      options:
        - label: I can run the canonical MVP smoke against non-sensitive representative data.
          required: true
        - label: I can share anonymized workload shape, configuration, failures, and benchmark results.
          required: true
        - label: I have not included secrets, credentials, customer data, or regulated data in this issue.
          required: true
