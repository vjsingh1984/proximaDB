# ProximaDB Infrastructure CI/CD Pipeline
#
# Purpose: Automate Terraform and Helm deployments
# Triggered by: Push to main, manual workflow dispatch, or PR comments
#
# Environments:
# - dev: Development environment (auto-deploy on push to main)
# - staging: Staging environment (manual approval required)
# - production: Production environment (manual approval required)
#
# NOTE: This workflow is DISABLED for v0.2.0 release
# Terraform and Helm infrastructure deployment is not needed for Rust library release
# Re-enable this workflow when infrastructure deployment is required

name: Infrastructure Deploy (DISABLED)

on:
  # Manual trigger only (single workflow_dispatch — GitHub rejects duplicate keys).
  workflow_dispatch:
    inputs:
      enable_infrastructure_deploy:
        description: 'Enable infrastructure deployment (not needed for library release)'
        required: true
        type: boolean
        default: false
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: '1.5.7'
  HELM_VERSION: '3.12.0'
  KUBECTL_VERSION: '1.29.0'

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded
  # runs on feature/PR branches, but let protected-branch runs finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

jobs:
  # ============================================================================
  # NOTE: All infrastructure deployment jobs are DISABLED for v0.2.0 release
  # Terraform and Helm deployment is not needed for Rust library release
  # ============================================================================
  # ============================================================================
  # Terraform Validation
  # ============================================================================
  terraform-validate:
    if: false  # DISABLED - not needed for library release
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -recursive -check

      - name: Terraform Init (Dev)
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform Validate (Dev)
        working-directory: infrastructure/terraform/environments/dev
        run: terraform validate

      - name: Terraform Init (Staging)
        working-directory: infrastructure/terraform/environments/staging
        run: terraform init -backend=false

      - name: Terraform Validate (Staging)
        working-directory: infrastructure/terraform/environments/staging
        run: terraform validate

      - name: Terraform Init (Production)
        working-directory: infrastructure/terraform/environments/production
        run: terraform init -backend=false

      - name: Terraform Validate (Production)
        working-directory: infrastructure/terraform/environments/production
        run: terraform validate

      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: cli
          soft_fail: false

  # ============================================================================
  # Helm Chart Validation
  # ============================================================================
  helm-validate:
    if: false  # DISABLED - not needed for library release
    name: Helm Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm Lint
        working-directory: infrastructure/helm/proximadb
        run: helm lint .

      - name: Helm Template (Dry Run)
        working-directory: infrastructure/helm/proximadb
        run: helm template test . --debug

      - name: Helm Unit Tests
        working-directory: infrastructure/helm/proximadb
        run: |
          # Install helm-unit-test plugin
          helm plugin install https://github.com/quintush/helm-unittest
          helm unittest .

  # ============================================================================
  # Terraform Plan (Dev)
  # ============================================================================
  terraform-plan-dev:
    if: false  # DISABLED - not needed for library release
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [terraform-validate, helm-validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform/environments/dev
        run: terraform plan -out=tfplan -no-color

      - name: Save Plan Output
        working-directory: infrastructure/terraform/environments/dev
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan-dev
          path: infrastructure/terraform/environments/dev/plan.txt

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/environments/dev/plan.txt', 'utf8');
            const output = `#### Terraform Plan (Dev) 📖
            <details><summary>Show Plan</summary>
            \`\`\`terraform
            ${plan}
            \`\`\`
            </details>
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ============================================================================
  # Terraform Apply (Dev)
  # ============================================================================
  terraform-apply-dev:
    if: false  # DISABLED - not needed for library release
    name: Terraform Apply (Dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: terraform-plan-dev
    environment:
      name: dev
      url: https://proximadb-dev.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name proximadb-dev \
            --region ${{ env.AWS_REGION }}

      - name: Deploy ProximaDB Helm Chart
        working-directory: infrastructure/helm/proximadb
        run: |
          helm upgrade --install proximadb . \
            --namespace proximadb \
            --create-namespace \
            --values ../../terraform/environments/dev/helm-values.yaml \
            --wait \
            --timeout 10m

      - name: Verify Deployment
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=proximadb \
            -n proximadb \
            --timeout=300s

      - name: Health Check
        run: |
          kubectl port-forward svc/proximadb 5678:5678 -n proximadb &
          sleep 10
          curl -f http://localhost:5678/health || exit 1

  # ============================================================================
  # Terraform Plan (Staging)
  # ============================================================================
  terraform-plan-staging:
    if: false  # DISABLED - not needed for library release
    name: Terraform Plan (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [terraform-validate, helm-validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/staging
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=environments/staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform/environments/staging
        run: terraform plan -out=tfplan -no-color

      - name: Save Plan Output
        working-directory: infrastructure/terraform/environments/staging
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan-staging
          path: infrastructure/terraform/environments/staging/plan.txt

  # ============================================================================
  # Terraform Apply (Staging)
  # ============================================================================
  terraform-apply-staging:
    if: false  # DISABLED - not needed for library release
    name: Terraform Apply (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: terraform-plan-staging
    environment:
      name: staging
      url: https://proximadb-staging.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/staging
        run: |
          terraform init \
