      - name: Health Check
        run: |
          kubectl port-forward svc/proximadb 5678:5678 -n proximadb &
          sleep 10
          curl -f http://localhost:5678/health || exit 1

      - name: Run Smoke Tests
        run: |
          # TODO: Add smoke tests
          echo "Running smoke tests..."

  # ============================================================================
  # Post-Deploy Monitoring
  # ============================================================================
  post-deploy-monitoring:
    if: false  # DISABLED - not needed for library release
    name: Post-Deploy Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [terraform-apply-dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name proximadb-dev \
            --region ${{ env.AWS_REGION }}

      - name: Check Pod Health
        run: |
          kubectl get pods -n proximadb
          kubectl top pods -n proximadb

      - name: Check Service Health
        run: |
          kubectl get svc -n proximadb

      - name: Check HPA Status
        run: |
          kubectl get hpa -n proximadb

      - name: Check Events
        run: |
          kubectl get events -n proximadb --sort-by='.lastTimestamp' | tail -20

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            core.warning('Post-deployment monitoring detected issues. Please check the logs.')
