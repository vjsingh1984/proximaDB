            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/staging
        run: terraform apply -auto-approve tfplan

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name proximadb-staging \
            --region ${{ env.AWS_REGION }}

      - name: Deploy ProximaDB Helm Chart
        working-directory: infrastructure/helm/proximadb
        run: |
          helm upgrade --install proximadb . \
            --namespace proximadb \
            --create-namespace \
            --values ../../terraform/environments/staging/helm-values.yaml \
            --wait \
            --timeout 10m

  # ============================================================================
  # Terraform Plan (Production)
  # ============================================================================
  terraform-plan-production:
    if: false  # DISABLED - not needed for library release
    name: Terraform Plan (Production)
    runs-on: ubuntu-latest
