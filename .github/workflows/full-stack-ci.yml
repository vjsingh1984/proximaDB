name: Full Stack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build and test the Rust server first
  rust-server:
    name: Rust Server
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config

    - name: Build ProximaDB server
      run: cargo build --release --bin proximadb-server

    - name: Upload server binary
      uses: actions/upload-artifact@v3
      with:
        name: proximadb-server
        path: target/release/proximadb-server
        retention-days: 1

  # Test Python SDK against the built server
  python-integration:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    needs: rust-server
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Download server binary
      uses: actions/download-artifact@v3
      with:
        name: proximadb-server
        path: ./

    - name: Make server executable
      run: chmod +x proximadb-server

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install Python dependencies
      working-directory: clients/python
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Generate protobuf files
      run: |
        python -m grpc_tools.protoc \
          --proto_path=proto \
          --python_out=clients/python/src/proximadb \
          --grpc_python_out=clients/python/src/proximadb \
          proto/proximadb.proto

    - name: Start ProximaDB server
      run: |
        ./proximadb-server --config demo/docker-config.toml &
        echo $! > server.pid
        sleep 5  # Wait for server to start

    - name: Wait for server to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:5678/health; do sleep 1; done'

    - name: Run Python integration tests
      working-directory: clients/python
      run: |
        PROXIMADB_URL=http://localhost:5678 PROXIMADB_GRPC_URL=http://localhost:5679 \
        pytest tests/integration/ -v --tb=short
      continue-on-error: true

    - name: Run Python SDK examples
      working-directory: clients/python
      run: |
        PROXIMADB_URL=http://localhost:5678 PROXIMADB_GRPC_URL=http://localhost:5679 \
        python examples/basic_usage.py
      continue-on-error: true

    - name: Stop server
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi

  # Demo validation
  demo-validation:
    name: Demo Validation
    runs-on: ubuntu-latest
    needs: rust-server
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Download server binary
      uses: actions/download-artifact@v3
      with:
        name: proximadb-server
        path: ./

    - name: Make server executable
      run: chmod +x proximadb-server

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install Python dependencies
      working-directory: clients/python
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Generate protobuf files
      run: |
        python -m grpc_tools.protoc \
          --proto_path=proto \
          --python_out=clients/python/src/proximadb \
          --grpc_python_out=clients/python/src/proximadb \
          proto/proximadb.proto

    - name: Start ProximaDB server
      run: |
        ./proximadb-server --config demo/docker-config.toml &
        echo $! > server.pid
        sleep 5

    - name: Wait for server to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:5678/health; do sleep 1; done'

    - name: Run ecommerce demo
      working-directory: demo
      run: |
        PROXIMADB_URL=http://localhost:5678 PROXIMADB_GRPC_URL=http://localhost:5679 \
        timeout 60 python ecommerce_demo.py || echo "Demo completed or timed out"

    - name: Run feature showcase
      working-directory: demo
      run: |
        PROXIMADB_URL=http://localhost:5678 PROXIMADB_GRPC_URL=http://localhost:5679 \
        timeout 60 python feature_showcase.py || echo "Feature showcase completed or timed out"

    - name: Stop server
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi

  # Documentation validation
  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install AsciiDoc tools
      run: |
        sudo apt-get update
        sudo apt-get install -y asciidoctor

    - name: Validate AsciiDoc files
      run: |
        find docs -name "*.adoc" -exec asciidoctor --dry-run {} \;

    - name: Check for broken links in documentation
      run: |
        # Basic check for obvious broken references
        grep -r "link:" docs/ | grep -v "http" | while read line; do
          file=$(echo "$line" | cut -d':' -f1)
          link=$(echo "$line" | sed 's/.*link:\([^[]*\).*/\1/')
          if [ ! -f "docs/$link" ] && [ ! -f "$link" ]; then
            echo "Potential broken link in $file: $link"
          fi
        done || true

  # Performance benchmark (basic)
  performance:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: rust-server
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download server binary
      uses: actions/download-artifact@v3
      with:
        name: proximadb-server
        path: ./

    - name: Make server executable
      run: chmod +x proximadb-server

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq

    - name: Start ProximaDB server
      run: |
        ./proximadb-server --config demo/docker-config.toml &
        echo $! > server.pid
        sleep 5

    - name: Wait for server to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:5678/health; do sleep 1; done'

    - name: Basic performance test
      run: |
        # Create a collection
        curl -X POST http://localhost:5678/collections \
          -H "Content-Type: application/json" \
          -d '{"name": "perf_test", "dimension": 128, "engine": "viper"}'
        
        # Insert some vectors and measure time
        start_time=$(date +%s%N)
        for i in {1..100}; do
          curl -X POST http://localhost:5678/collections/perf_test/vectors \
            -H "Content-Type: application/json" \
            -d "{\"vectors\": [{\"id\": \"vec_$i\", \"vector\": $(python3 -c "import random; print([random.random() for _ in range(128)])")}]}" \
            >/dev/null 2>&1
        done
        end_time=$(date +%s%N)
        
        duration=$((($end_time - $start_time) / 1000000))  # Convert to milliseconds
        echo "Inserted 100 vectors in ${duration}ms"
        
        # Basic search test
        search_start=$(date +%s%N)
        curl -X POST http://localhost:5678/collections/perf_test/search \
          -H "Content-Type: application/json" \
          -d "{\"vector\": $(python3 -c "import random; print([random.random() for _ in range(128)])"), \"top_k\": 10}" \
          >/dev/null 2>&1
        search_end=$(date +%s%N)
        
        search_duration=$((($search_end - $search_start) / 1000000))
        echo "Search completed in ${search_duration}ms"

    - name: Stop server
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi