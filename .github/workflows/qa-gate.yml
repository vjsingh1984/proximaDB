name: QA Gate

# The qa branch is the promotion gate between develop and main:
#   develop --(PR)--> qa --(PR)--> main
# This workflow runs the heavier integration + coverage gates that the qa branch
# is responsible for. Its job names are wired as REQUIRED status checks on `qa`
# (and `main`) via branch protection.

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: qa-gate-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # false (not true): a develop→qa promotion PR has head=develop, so every push
  # to develop fires a `synchronize` event landing in the SAME per-PR group —
  # with cancel-in-progress:true that killed the in-flight run before TPC-H/DS
  # could finish (the promotion never completed during develop churn). false lets
  # the in-flight run finish; GitHub still keeps only the newest *pending* run per
  # group (older pendings are auto-dropped), so there is no runaway stacking.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: every job only checks out and runs tests/ratchets — none
# writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  # Enforce the promotion path: main may only be promoted FROM qa.
  promotion-source-guard:
    name: Promotion Source Guard (main <- qa only)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: main PRs must originate from qa
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "qa" ]; then
            echo "::error::main can only be promoted from 'qa' (got '$HEAD_REF'). Flow is develop -> qa -> main."
            exit 1
          fi
          echo "ok: main PR originates from qa"

  # SINGLE combined job: compile all pgwire + recall test binaries ONCE on this
  # runner, then run them. Same runner => the compiled target/ is reused across
  # the runs (cargo sees its own artifacts as up-to-date, no recompile between
  # suites). The previous separate-jobs design (a `build` job + per-suite
  # `needs:[build]` jobs) wasted a ~40m build job because Swatinem/rust-cache
  # cannot reliably ferry target/ ACROSS runners — cargo recompiled each suite
  # from scratch on its own runner. Building once here and running sequentially
  # eliminates both the redundant compiles and the cross-runner cache misses.
  # The e2e tests embed the server (tokio::spawn), so they link the lib; a shared
  # compiled target/ is the lever, not a pre-built server binary. The PAX recall
  # step is the storage-format mandate (#8/#10) recall@k ratchet (≥0.90 vs f32).
  # Sequential runs (not parallel) for reliability: clear per-suite pass/fail and
  # no cross-suite memory contention on the materialize-heavy pgwire suites.
  pgwire-recall-tests:
    name: Integration tests (TPC-H/DS pgwire + PAX recall)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-integration"
      - name: Build all integration test binaries (once)
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo test --test tpch_pgwire_e2e --test tpcds_pgwire_e2e --no-run
          cargo test -p proximadb-block-format --lib --no-run
          cargo test --test embedded_flush_recovery --no-run
          # TD-182 P0b: previously-orphaned vector recall ratchets (gate them here).
          cargo test --test vector_ann_recall_e2e --test nova_cold_search_recall_test \
            --test td112_postflush_recall_e2e --test raptor_recall_test \
            --test helix_cold_search_recall_test --no-run
      - name: Run TPC-H over pgwire
        env:
          # 8MB worker stack: correlated subqueries (Q2/Q20-Q22) produce
          # deep-but-finite async call chains that overflow the default ~2MB.
          RUST_MIN_STACK: "8388608"
        run: cargo test --test tpch_pgwire_e2e -- --nocapture
      - name: Run TPC-DS over pgwire
        run: cargo test --test tpcds_pgwire_e2e -- --nocapture
      - name: Run PAX recall ratchets
        run: cargo test -p proximadb-block-format --lib recall -- --nocapture
      - name: Run cold-read recall ratchet (TD-163/TD-165)
        # Guards the SST cold-read path TD-163 now relies on (free_wal=true): after a
        # flush+reopen, recall@k must not regress the hot memtable path. Catches the
        # cold-read ranking regression the vec_0-only assertion in
        # sst_block_serialization_roundtrip missed (why TD-165 was marked Resolved
        # prematurely). Well-separated seeded vectors → recall@10 = 1.0 on both paths.
        run: cargo test --test embedded_flush_recovery recall -- --nocapture
      # TD-182 P0b: vector-recall ratchets that previously ran in NO CI tier
      # (orphaned). Each asserts recall@k / exact-match vs an f32 baseline. The
      # td112 suite runs only its `recall` test here; its `axis_index_rebuilt_*`
      # test is a separate pre-existing AXIS-rebuild regression tracked as TD-184.
      - name: Run vector ANN recall ratchet (TD-182 P0b)
        run: cargo test --test vector_ann_recall_e2e -- --nocapture
      - name: Run NOVA bounds-prune recall ratchet (TD-182 P0b)
        run: cargo test --test nova_cold_search_recall_test -- --nocapture
      - name: Run HELIX cold-search recall ratchet (TD-182 P0b)
        run: cargo test --test helix_cold_search_recall_test -- --nocapture
      - name: Run RAPTOR recall-after-reopen ratchet (TD-182 P0b)
        run: cargo test --test raptor_recall_test -- --nocapture
      - name: Run TD-112 post-flush recall ratchet (TD-182 P0b)
        run: cargo test --test td112_postflush_recall_e2e recall -- --nocapture

  # Validate the object-store access-tier cost lever (TD-168/TD-173) against REAL
  # cloud APIs via emulators — Azurite (Azure), MinIO (S3), fake-gcs (GCP) — the
  # "develop→qa upfront validation" for the cold-payload tier. The default CI only
  # exercises put_with_tier on memory:// (where the tier degrades to a plain put),
  # so a native-class mapping regression that a real cloud API would 4xx is
  # invisible there; this job runs the tier path end-to-end. Azure + S3 are strict
  # (PUT-with-tier accepted + round-trip); GCS is best-effort (the test self-skips
  # on a fake-gcs/object_store incompatibility). All orchestration lives in
  # scripts/run_cloud_emulator_tests.sh so the CI path == `make cloud-emulator-test`.
  cloud-emulator-object-store:
    name: Cloud object-store emulators (Azurite/MinIO/fake-gcs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-cloud-emulator"
      - name: Validate Cool tier against Azure/S3/GCS emulators
        # docker + aws/az CLIs are preinstalled on ubuntu-latest runners.
        run: bash scripts/run_cloud_emulator_tests.sh

  sdk-coverage-ratchet:
    name: SDK Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install SDK + coverage deps
        working-directory: clients/python
        run: pip install -e ".[dev]" pytest-cov pyarrow pandas jsonschema psutil
      - name: Run SDK tests with coverage
        working-directory: clients/python
        env:
          PROXIMADB_EMBEDDED: "0"
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
          PROXIMADB_TEST_FORCE_FALLBACK_EMBEDDINGS: "1"
        run: |
          # Coverage needs a single aggregating process; tolerate the known
          # _cov sys.modules-leak failures (the ratchet measures coverage, not
          # pass/fail — the per-file isolation gate in ci.yml owns correctness).
          # Run OFFLINE unit tests only: filter out `integration` (needs a running
          # server) and `live` (needs an external dependency / network, e.g. the
          # `victor` package). The victor test self-skips via importorskip + `live`.
          pytest tests/unit/ -q -p no:cacheprovider --timeout=120 \
            --cov=proximadb_sdk --cov-report=json:/tmp/sdk-cov.json \
            -m "not integration and not live" \
            --ignore=tests/unit/test_chunking_code_cov.py \
            --continue-on-collection-errors || true
          test -f /tmp/sdk-cov.json
      - name: Ratchet check
        run: |
          python3 scripts/coverage_ratchet.py normalize --sdk /tmp/sdk-cov.json -o /tmp/sdk-current.json
          python3 scripts/coverage_ratchet.py check \
            --baseline docs/_internal/roadmap/COVERAGE_BASELINE.json \
            --current /tmp/sdk-current.json

  rust-coverage-ratchet:
    name: Rust Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # FIRST CUT: cargo-llvm-cov over the full workspace is heavy. 60m was too
    # tight — it timed out mid-lib-test-run (deep into the graph/index tests),
    # so the seed artifact was never produced. 90m lets it complete + emit the
    # seed (rust-coverage-seed.json), the prerequisite to baseline rust:* in
    # COVERAGE_BASELINE.json. Still non-blocking (continue-on-error); flip to
    # required (remove continue-on-error) only AFTER a clean run seeds the
    # baseline AND it stays green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - name: Install system deps + cargo-llvm-cov
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
          cargo install cargo-llvm-cov --locked
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-qa-llvmcov"
      - name: Coverage (lib) + ratchet
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo llvm-cov --lib --no-report -p proximadb
          cargo llvm-cov report --json --output-path /tmp/llvm-cov.json
          python3 scripts/coverage_ratchet.py normalize --rust /tmp/llvm-cov.json -o /tmp/rust-current.json
          # Seed the baseline if absent (first run), else ratchet-check.
          if python3 -c "import json,sys; d=json.load(open('docs/_internal/roadmap/COVERAGE_BASELINE.json')); sys.exit(0 if any(k.startswith('rust:') for k in d) else 1)"; then
            python3 scripts/coverage_ratchet.py check \
              --baseline docs/_internal/roadmap/COVERAGE_BASELINE.json \
              --current /tmp/rust-current.json
          else
            echo "::warning::no rust baseline yet — emitting current as artifact to seed it"
            cp /tmp/rust-current.json rust-coverage-seed.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: |
            /tmp/llvm-cov.json
            rust-coverage-seed.json
          if-no-files-found: ignore
