name: TDD Test Suite

on:
  push:
    branches: [main, feature/**, "cicd-enhancement"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========================================
  # Unit Tests with TDD methodology
  # ========================================
  unit-tests:
    name: Unit Tests (TDD)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
        # Only test nightly on main branch
        include:
          - rust: nightly
            test_on: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          cache: false  # Use custom cache strategy

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: |
          cargo install cargo-llvm-cov
          cargo install cargo-nextest

      - name: Run unit tests (TDD-first)
        run: |
          # Run tests with test executor for better performance
          cargo nextest run --lib --verbose

      - name: Run tests multiple times (catch flaky tests)
        run: |
          for i in {1..3}; do
            echo "Test run $i/3"
            cargo test --lib || exit 1
          done

      - name: Check test coverage
        run: |
          cargo llvm-cov --lib --html --output-dir coverage
          echo "Coverage report generated"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        if: matrix.rust == 'stable'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Run clippy (warnings as errors)
        run: |
          cargo clippy --all-targets -- -D warnings
          echo "Clippy checks passed"

      - name: Check formatting
        run: |
          cargo fmt -- --check
          echo "Code is properly formatted"

      - name: Check documentation
        run: |
          cargo doc --no-deps --all-features
          echo "Documentation builds successfully"

  # ========================================
  # Integration Tests (TDD)
  # ========================================
  integration-tests:
    name: Integration Tests (TDD)
    runs-on: ubuntu-latest
    needs: unit-tests  # Run after unit tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run TDD integration tests
        run: |
          # Run TDD integration tests sequentially
          cargo test --test tdd --verbose -- --test-threads=1

      - name: Run API handler tests
        run: |
          cargo test --test api_handlers --verbose -- --test-threads=1

      - name: Run multi-model integration tests
        run: |
          cargo test --test hybrid_search_tests -- --test-threads=1
          cargo test --test timeseries_tests -- --test-threads=1
          cargo test --test event_sourcing_tests -- --test-threads=1

  # ========================================
  # Python SDK Tests
  # ========================================
  python-sdk-tests:
    name: Python SDK Tests (TDD)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            clients/python/.venv
          key: ${{ runner.os }}-python-${{ hashFiles('clients/python/requirements*.txt') }}

      - name: Install Python development dependencies
        run: |
          cd clients/python
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python TDD tests
        run: |
          cd clients/python
          pytest tests/tdd/ -v --tb=short --cov=proximadb_sdk --cov-report=html --cov-report=term

      - name: Upload Python coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: python-coverage-report
          path: clients/python/htmlcov/
          retention-days: 7

  # ========================================
  # Benchmark Regression Detection
  # ========================================
  benchmark-regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch history for comparison

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install critcmp
        run: |
          cargo install critcmp
          echo "critcmp installed"

      - name: Run benchmarks
        run: |
          cargo bench -- --output-format bencher | tee benchmark-new.txt

      - name: Compare with main branch
        run: |
          git checkout main
          cargo bench -- --output-format bencher | tee benchmark-main.txt
          git checkout -

      - name: Check for performance regression
        run: |
          # Simple regression check: >5% regression is failure
          # (This is a placeholder - can be enhanced with critcmp)
          echo "Checking for >5% performance regression..."
          # TODO: Implement automated comparison logic
          echo "Benchmark regression checks not yet implemented"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: |
            benchmark-new.txt
            benchmark-main.txt
          retention-days: 30

  # ========================================
  # TDD Compliance Check
  # ========================================
  tdd-compliance:
    name: TDD Compliance Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install coverage tools
        run: |
          cargo install cargo-llvm-cov

      - name: Run coverage analysis
        run: |
          cargo llvm-cov --lib --html

      - name: Check coverage thresholds
        run: |
          # Parse coverage report and enforce thresholds
          # TODO: Implement automated threshold checking
          # Current targets:
          # - Core modules (storage, compute, query, graph): >80%
          # - API handlers: >90%
          # - Overall: >70%
          echo "Coverage threshold checks not yet automated"

      - name: Verify TDD methodology compliance
        run: |
          # Check that tests exist for new features
          # (This is a placeholder for more sophisticated checks)
          echo "Checking TDD methodology compliance..."
          echo "TDD compliance checks not yet fully implemented"

      - name: Check for test pollution
        run: |
          # Verify tests don't depend on execution order
          cargo test --lib --shuffle
          echo "Tests passed with random execution order"

  # ========================================
  # Security Audit
  # ========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: |
          cargo install cargo-audit

      - name: Run security audit
        run: |
          cargo audit
          echo "Security audit passed"

      - name: Check for unsafe code
        run: |
          # Count unsafe blocks and ensure they're documented
          echo "Checking unsafe code usage..."
          # TODO: Implement automated unsafe code checking
          echo "Unsafe code checks not yet implemented"

  # ========================================
  # Summary Report
  # ========================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, python-sdk-tests, tdd-compliance, security-audit]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate summary report
        run: |
          echo "# Test Summary Report" > summary.md
          echo "" >> summary.md
          echo "## Build Status" >> summary.md
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> summary.md
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> summary.md
          echo "- Python SDK Tests: ${{ needs.python-sdk-tests.result }}" >> summary.md
          echo "- TDD Compliance: ${{ needs.tdd-compliance.result }}" >> summary.md
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> summary.md
          echo "" >> summary.md
          echo "Generated at: $(date -u)" >> summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: summary.md

      - name: Fail if any job failed
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.python-sdk-tests.result }}" != "success" ] || \
             [ "${{ needs.tdd-compliance.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
