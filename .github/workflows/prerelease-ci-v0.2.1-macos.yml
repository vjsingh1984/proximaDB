# =============================================================================
# ProximaDB Pre-Release CI Workflow - v0.2.1 macOS Support
# =============================================================================
#
# MODIFICATIONS FOR v0.2.1:
#   - Enable macOS aarch64 (Apple Silicon) build with Metal feature
#   - Update validation to expect 3 binaries (linux, windows, macos)
#   - Enable DMG installer build
#
# TRIGGERS:
#   1. Push to main branch
#   2. Push to development branch
#   3. Manual dispatch with optional version input
#
# WORKFLOW STAGES:
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │  1. VERSION-CHECK    Validate version consistency                        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  2. PREPARE          Extract version                                    │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  3. BUILD (parallel)                                                     │
#   │     ├── build-binaries    3 platform targets (v0.2.1)                   │
#   │     └── build-sdist       Source distributions                          │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  4. VALIDATE          Verify all artifacts built                        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  5. BUILD PLATFORM PACKAGES (parallel)                                  │
#   │     ├── build-rpm         RPM package (fpm)                             │
#   │     ├── build-deb         DEB package (fpm)                             │
#   │     ├── build-dmg         DMG installer (create-dmg)                    │
#   │     └── build-msi         MSI installer (WiX v4)                        │
#   ├─────────────────────────────────────────────────────────────────────────┤
#   │  6. SUMMARY          Generate release-ready.json artifact               │
#   └─────────────────────────────────────────────────────────────────────────┘
#
# NOTE: v0.2.1 adds macOS aarch64 support with Metal (MPS) for GPU acceleration.
#
# =============================================================================

# This is a documentation file showing the changes needed for v0.2.1
# Apply these changes to .github/workflows/prerelease-ci.yml and release.yml

