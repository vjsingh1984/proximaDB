name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs'
        required: false
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

# ============================================================================
# This consolidated CI workflow combines:
# - Rust builds, tests, and quality checks
# - Python SDK tests across multiple versions
# - Integration tests between server and SDK
# - Docker container builds and health checks
# - Performance benchmarks (optional)
# - Documentation validation
#
# The workflow uses a dependency graph to minimize build times:
#   quality-checks (parallel) -> rust-build -> integration-tests
#                             -> docker-build
# ============================================================================

jobs:
  # ============================================================================
  # CHANGES DETECTION - Determine what to build/test
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      proto: ${{ steps.filter.outputs.proto }}
      # Granular Rust component detection for targeted testing
      query_changes: ${{ steps.filter.outputs.query_changes }}
      storage_changes: ${{ steps.filter.outputs.storage_changes }}
      graph_changes: ${{ steps.filter.outputs.graph_changes }}
      core_changes: ${{ steps.filter.outputs.core_changes }}
      network_changes: ${{ steps.filter.outputs.network_changes }}
      # SDK change detection
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      nodejs_sdk: ${{ steps.filter.outputs.nodejs_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/**'
              - 'benches/**'
            python:
              - 'clients/python/**'
              - 'clients/python-embedded/**'
              - 'proto/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
            docs:
              - 'docs/**'
              - '*.adoc'
              - '*.md'
            proto:
              - 'proto/**'
            # Granular Rust component filters for targeted testing
            query_changes:
              - 'src/query/**'
              - 'tests/*query*'
              - 'tests/*federated*'
            storage_changes:
              - 'src/storage/**'
              - 'tests/*storage*'
              - 'tests/*sst*'
              - 'tests/*wal*'
            graph_changes:
              - 'src/graph/**'
              - 'tests/*graph*'
            core_changes:
              - 'src/core/**'
              - 'src/compute/**'
              - 'src/lib.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
            network_changes:
              - 'src/network/**'
              - 'src/api_handlers/**'
              - 'proto/**'
            # SDK filters
            go_sdk:
              - 'clients/go/**'
              - 'clients/go-embedded/**'
            nodejs_sdk:
              - 'clients/nodejs-embedded/**'
            rust_sdk:
              - 'clients/rust/**'
            java_sdk:
              - 'clients/java-embedded/**'

  # ============================================================================
  # QUALITY CHECKS - Run in parallel, fast feedback
  # ============================================================================
  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-clippy"
      - run: cargo clippy --all-targets -- -D warnings

  rust-security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install Dependencies
        working-directory: clients/python
        run: |
          pip install -e ".[dev]"
          pip install flake8
      - name: Run Black (formatter check)
        working-directory: clients/python
        run: black --check --diff src tests

      - name: Run isort (import order check)
        working-directory: clients/python
        run: isort --check-only --diff src tests

      - name: Run flake8 (style check)
        working-directory: clients/python
        run: flake8 src tests --max-line-length=88 --extend-ignore=E501

      - name: Run mypy (type check)
        working-directory: clients/python
        run: mypy src --ignore-missing-imports

  # Go SDK Linting
  go-lint:
    name: Go SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: clients/go/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: clients/go
          args: --timeout=5m
      - name: Run go vet
        working-directory: clients/go
        run: go vet ./...
      - name: Check go mod tidy
        working-directory: clients/go
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Node.js/TypeScript SDK Linting
  nodejs-lint:
    name: Node.js SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nodejs_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: clients/nodejs-embedded
        run: npm ci
      - name: TypeScript Compile Check
        working-directory: clients/nodejs-embedded
        run: npx tsc --noEmit
      - name: Run ESLint
        working-directory: clients/nodejs-embedded
        run: npx eslint src/ --ext .ts,.js || echo "ESLint not configured, skipping"

  # Rust SDK Linting
  rust-sdk-lint:
    name: Rust SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Format
        working-directory: clients/rust
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: clients/rust
        run: cargo clippy -- -D warnings

  # SDK Security Scanning with Trivy
  sdk-security-scan:
    name: SDK Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.go_sdk == 'true' ||
      needs.changes.outputs.nodejs_sdk == 'true' ||
      needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Python SDK
        if: needs.changes.outputs.python == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/python'
          format: 'sarif'
          output: 'python-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Go SDK
        if: needs.changes.outputs.go_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/go'
          format: 'sarif'
          output: 'go-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Node.js SDK
        if: needs.changes.outputs.nodejs_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/nodejs-embedded'
          format: 'sarif'
          output: 'nodejs-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Rust SDK
        if: needs.changes.outputs.rust_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/rust'
          format: 'sarif'
          output: 'rust-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Python Trivy Results
        if: needs.changes.outputs.python == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'python-trivy-results.sarif'
          category: 'python-sdk-security'
        continue-on-error: true

      - name: Upload Go Trivy Results
        if: needs.changes.outputs.go_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'go-trivy-results.sarif'
          category: 'go-sdk-security'
        continue-on-error: true

      - name: Upload Node.js Trivy Results
        if: needs.changes.outputs.nodejs_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'nodejs-trivy-results.sarif'
          category: 'nodejs-sdk-security'
        continue-on-error: true

      - name: Upload Rust Trivy Results
        if: needs.changes.outputs.rust_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'rust-trivy-results.sarif'
          category: 'rust-sdk-security'
        continue-on-error: true

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install AsciiDoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor
      - name: Validate AsciiDoc
        run: find docs -name "*.adoc" -exec asciidoctor --dry-run {} \;

  # ============================================================================
  # RUST BUILD & TEST - Core build pipeline
  # ============================================================================
  rust-build:
    name: Rust Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [changes, rust-format]
    if: needs.changes.outputs.rust == 'true' && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: dev
            args: ""
          - profile: release
            args: "--release"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.profile }}"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build All Binaries
        run: |
          cargo build ${{ matrix.args }} \
            --bin proximadb-server \
            --bin proximadb-bench \
            --bin proximadb-migrate

      - name: Upload Server Binary
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: target/release/proximadb-server
          retention-days: 1

  rust-test:
    name: Rust Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: "!inputs.skip_tests"
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: unit
            args: "--lib"
            threads: 4
          - test-type: doc
            args: "--doc"
            threads: 4
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-dev"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Tests
        run: cargo test ${{ matrix.args }} -- --test-threads=${{ matrix.threads }}

  # Targeted integration tests based on changed components
  rust-integration-test-storage:
    name: Rust Integration Tests (storage)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.storage_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Run Storage Integration Tests
        run: |
          # Run tests matching storage patterns
          cargo test --test '*' -- --test-threads=1 -q 2>&1 | grep -E "(sst|storage|wal)" || true
          # Run explicitly named storage test files
          for test_file in tests/*sst*.rs tests/*storage*.rs tests/*wal*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-query:
    name: Rust Integration Tests (query)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.query_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Run Query Integration Tests
        run: |
          for test_file in tests/*query*.rs tests/*federated*.rs tests/*cache*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-graph:
    name: Rust Integration Tests (graph)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.graph_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Run Graph Integration Tests
        run: |
          for test_file in tests/*graph*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-cluster:
    name: Rust Integration Tests (cluster)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.network_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Run Cluster Integration Tests
        run: |
          for test_file in tests/*cluster*.rs tests/*distributed*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [rust-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-coverage"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          cargo install cargo-tarpaulin
      - name: Generate Coverage
        run: |
          cargo tarpaulin --release --timeout 600 \
            --out xml --out html \
            --output-dir coverage \
            --skip-clean \
            --fail-under 60
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: true

  # ============================================================================
  # PYTHON TESTS - SDK testing across versions
  # ============================================================================
  python-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.proto == 'true') && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev,test]"

      # Cache generated protobuf files to speed up builds
      - name: Cache Generated Protobuf Files
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: |
            clients/python/src/proximadb/*_pb2.py
            clients/python/src/proximadb/*_pb2_grpc.py
          key: python-proto-${{ matrix.python-version }}-${{ hashFiles('proto/**/*.proto') }}
          restore-keys: |
            python-proto-${{ matrix.python-version }}-

      - name: Generate Protobuf
        if: steps.proto-cache.outputs.cache-hit != 'true'
        run: |
          echo "Generating Python protobuf files..."
          mkdir -p clients/python/src/proximadb
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb.proto
          echo "Protobuf generation complete"

      - name: Verify Protobuf Files Exist
        run: |
          # Ensure protobuf files exist (either from cache or generation)
          if [ ! -f "clients/python/src/proximadb/proximadb_pb2.py" ]; then
            echo "::error::Protobuf files not found! Regenerating..."
            python -m grpc_tools.protoc \
              --proto_path=proto \
              --python_out=clients/python/src/proximadb \
              --grpc_python_out=clients/python/src/proximadb \
              proto/proximadb.proto
          fi
          ls -la clients/python/src/proximadb/*_pb2*.py || echo "No protobuf files found"

      - name: Run Unit Tests
        working-directory: clients/python
        run: pytest tests/unit/ -v --tb=short

  # ============================================================================
  # INTEGRATION TESTS - Full stack testing
  # ============================================================================
  integration-test:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, rust-build, python-test]
    if: |
      always() &&
      !inputs.skip_tests &&
      needs.rust-build.result == 'success' &&
      (needs.python-test.result == 'success' || needs.python-test.result == 'skipped') &&
      (needs.changes.outputs.python == 'true' ||
       needs.changes.outputs.network_changes == 'true' ||
       needs.changes.outputs.proto == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Download Server Binary
        uses: actions/download-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: ./

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev,test]"

      # Cache generated protobuf files to speed up builds
      - name: Cache Generated Protobuf Files
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: |
            clients/python/src/proximadb/*_pb2.py
            clients/python/src/proximadb/*_pb2_grpc.py
          key: python-proto-3.11-${{ hashFiles('proto/**/*.proto') }}
          restore-keys: |
            python-proto-3.11-

      - name: Generate Protobuf
        if: steps.proto-cache.outputs.cache-hit != 'true'
        run: |
          echo "Generating Python protobuf files..."
          mkdir -p clients/python/src/proximadb
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb.proto
          echo "Protobuf generation complete"

      - name: Verify Protobuf Files Exist
        run: |
          if [ ! -f "clients/python/src/proximadb/proximadb_pb2.py" ]; then
            echo "::error::Protobuf files not found! Regenerating..."
            python -m grpc_tools.protoc \
              --proto_path=proto \
              --python_out=clients/python/src/proximadb \
              --grpc_python_out=clients/python/src/proximadb \
              proto/proximadb.proto
          fi

      - name: Prepare Server
        run: chmod +x proximadb-server

      - name: Start Server
        run: |
          ./proximadb-server --config demo/docker-config.toml &
          echo $! > server.pid
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:5678/health; do sleep 1; done'
          echo "Server is ready"

      - name: Run Integration Tests
        working-directory: clients/python
        run: |
          PROXIMADB_URL=http://localhost:5678 \
          PROXIMADB_GRPC_URL=http://localhost:5679 \
          pytest tests/integration/ -v --tb=short --timeout=120

      - name: Collect Server Logs on Failure
        if: failure()
        run: |
          echo "=== Server process status ==="
          ps aux | grep proximadb || true
          echo "=== Server logs (if available) ==="
          cat /tmp/proximadb*.log 2>/dev/null || echo "No log files found"

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            pid=$(cat server.pid)
            if kill -0 "$pid" 2>/dev/null; then
              echo "Stopping server (PID: $pid)..."
              kill "$pid" 2>/dev/null || true
              sleep 2
              # Force kill if still running
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

  # ============================================================================
  # DOCKER BUILD - Container testing
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: proximadb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health
        run: |
          docker run -d --name test-container \
            -p 5678:5678 -p 5679:5679 \
            proximadb:test

          timeout 120 bash -c 'until curl -sf http://localhost:5678/health; do sleep 2; done'
          curl -s http://localhost:5678/health | jq .

          docker stop test-container
          docker rm test-container

  # ============================================================================
  # BENCHMARKS - Performance testing (optional)
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [rust-build]
    if: |
      inputs.run_benchmarks ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-bench"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Benchmarks
        run: |
          cargo bench --bench bench_21_query_cache -- --noplot 2>&1 | tee bench-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ============================================================================
  # SUMMARY - Final status check
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - rust-format
      - rust-clippy
      - rust-security
      - rust-build
      - rust-test
      - rust-integration-test-storage
      - rust-integration-test-query
      - rust-integration-test-graph
      - rust-integration-test-cluster
      - rust-coverage
      - python-lint
      - python-test
      - integration-test
      - docker-build
      - docs-validation
      # SDK linting and security
      - go-lint
      - nodejs-lint
      - rust-sdk-lint
      - sdk-security-scan
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          results="${{ toJSON(needs.*.result) }}"

          if echo "$results" | grep -q '"failure"'; then
            echo "::error::One or more CI jobs failed"
            echo "Some jobs failed. Check the workflow run for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "All required CI checks passed!" >> $GITHUB_STEP_SUMMARY
