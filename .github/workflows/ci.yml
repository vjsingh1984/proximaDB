name: CI

on:
  push:
    branches: [main, development, develop, qa]
  pull_request:
    branches: [main, development, develop, qa]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs'
        required: false
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        type: boolean
        default: false

concurrency:
  # Dedup push+PR of the same branch into one group; cancel superseded runs
  # on feature/PR branches, but let protected-branch validation finish.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

# ============================================================================
# This consolidated CI workflow combines:
# - Rust builds, tests, and quality checks
# - Python SDK tests across multiple versions
# - Integration tests between server and SDK
# - Docker container builds and health checks
# - Performance benchmarks (optional)
# - Documentation validation
#
# The workflow uses a dependency graph to minimize build times:
#   quality-checks (parallel) -> rust-build -> integration-tests
#                             -> docker-build
# ============================================================================

# Least-privilege default GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Read-only is sufficient: no job here writes to the repo, posts comments, or uses OIDC.
permissions:
  contents: read

jobs:
  # ============================================================================
  # CHANGES DETECTION - Determine what to build/test
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # Three-tier CI (feat -> develop -> qa -> main):
      #   * feat -> develop = LIGHT: compile + fmt/clippy + layering + proto +
      #     panic-policy + capability + security-audit + lints + docs. Fast inner
      #     loop so development merges quickly and stays unblocked.
      #   * develop -> qa = MEDIUM (`test_tier`): LIGHT + the core correctness
      #     suites — rust-test, the 4 rust-integration-test-* engines, feature-matrix.
      #   * qa -> main = FULL (`extensive`): MEDIUM + docker-build, coverage,
      #     python multi-version, cross integration-test, benchmarks. The heaviest,
      #     pre-promotion gate.
      # `test_tier` is true for base qa or main (and pushes to those); `extensive`
      # is true only for base main (and pushes to main).
      test_tier: ${{ github.base_ref == 'qa' || github.base_ref == 'main' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main' }}
      extensive: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      proto: ${{ steps.filter.outputs.proto }}
      panic_policy: ${{ steps.filter.outputs.panic_policy }}
      # Granular Rust component detection for targeted testing
      query_changes: ${{ steps.filter.outputs.query_changes }}
      storage_changes: ${{ steps.filter.outputs.storage_changes }}
      graph_changes: ${{ steps.filter.outputs.graph_changes }}
      core_changes: ${{ steps.filter.outputs.core_changes }}
      network_changes: ${{ steps.filter.outputs.network_changes }}
      # SDK change detection
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      nodejs_sdk: ${{ steps.filter.outputs.nodejs_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
      openapi_spec: ${{ steps.filter.outputs.openapi_spec }}
      src_connectors: ${{ steps.filter.outputs.src_connectors }}
      spark_jni: ${{ steps.filter.outputs.spark_jni }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so dorny/paths-filter can reach the merge-base across a
          # large develop→main gap (shallow --deepen fails: "shallow file has changed").
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/**'
              - 'benches/**'
            python:
              - 'clients/python/**'
              - 'clients/python-embedded/**'
              - 'proto/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
            docs:
              - 'docs/**'
              - '*.adoc'
              - '*.md'
            proto:
              - 'proto/**'
            panic_policy:
              - 'src/**'
              - 'scripts/count_panic_patterns.sh'
              - 'docs/_internal/roadmap/PANIC_POLICY_BASELINE.json'
            query_changes:
              - 'src/query/**'
              - 'tests/*query*'
              - 'tests/*federated*'
            storage_changes:
              - 'src/storage/**'
              - 'tests/*storage*'
              - 'tests/*sst*'
              - 'tests/*wal*'
            graph_changes:
              - 'src/graph/**'
              - 'tests/*graph*'
            core_changes:
              - 'src/core/**'
              - 'src/compute/**'
              - 'src/lib.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
            network_changes:
              - 'src/network/**'
              - 'src/api_handlers/**'
              - 'proto/**'
            # SDK filters
            go_sdk:
              - 'clients/go/**'
              - 'clients/go-embedded/**'
            nodejs_sdk:
              - 'clients/nodejs-embedded/**'
            rust_sdk:
              - 'clients/rust/**'
            java_sdk:
              - 'clients/java-embedded/**'
            openapi_spec:
              - 'docs/openapi/**'
            src_connectors:
              - 'src/connectors/**'
              - 'tests/connectors_openapi_contract.rs'
              - 'tests/connectors_flight_contract.rs'
              - 'tests/openapi_helpers.rs'
            spark_jni:
              - 'crates/binding/proximadb-spark-jni/**'
              - 'clients/jvm/spark-connector/**'
              - 'src/connectors/spark.rs'

  # ============================================================================
  # QUALITY CHECKS - Run in parallel, fast feedback
  # ============================================================================
  hygiene-check:
    name: Hygiene Guardrails
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked artifact files
        run: |
          bad_files=$(git ls-files | grep -E '(^|/)\.victor($|/)|\.bak[0-9]*$|\.disabled$' || true)
          if [ -n "$bad_files" ]; then
            echo "::error::Forbidden tracked artifacts detected:"
            echo "$bad_files"
            exit 1
          fi
          echo "No tracked artifact files detected."

  deterministic-commit-contract:
    name: Deterministic Commit Contract
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - name: Validate deterministic guard wiring
        run: python3 scripts/check_deterministic_commit_contract.py

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check

  capability-matrix:
    name: Capability Matrix
    runs-on: ubuntu-latest
    needs: changes
    # Run on rust changes (evidence refs point at source) AND on docs changes:
    # the validator now also guards the maturity-contract reconciliation in
    # SUPPORTED_SURFACE / TECHNICAL_DEBT / PRD / VISION, so a docs-only PR that
    # weakens those banners must trip this gate too.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate capability matrix
        run: python3 scripts/validate_capability_matrix.py
      # Benchmark evidence ledger: keeps perf/capability claims tied to a runnable
      # bench + (for 'measured') dated provenance, and bites if a claim is cited at
      # a doc:line that no longer exists.
      - name: Validate benchmark evidence ledger
        run: python3 scripts/validate_benchmark_evidence.py

  # T4.2 (pre-release foundations) — Proto compatibility gate.
  # Runs `make proto-check`: cargo-checks the proximadb-proto crate AND
  # runs the Python gRPC proto-drift + OpenAPI contract tests. Catches
  # non-additive proto edits (field removal, type change, tag reuse) that
  # would silently break Python SDK or REST contract consumers.
  # Also fails if the committed generated proto sources have hand-edited
  # drift from `git`.
  proto-compat:
    name: Proto Compatibility (T4.2)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python SDK (editable) and test deps
        run: |
          cd clients/python
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest grpcio grpcio-tools protobuf pyyaml jsonschema httpx requests
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-proto-compat"
      - name: Run proto compatibility gate
        env:
          PYTHON: python
        run: make proto-check
      - name: Fail on uncommitted drift in generated proto sources
        run: |
          git diff --exit-code -- \
            crates/foundation/proximadb-proto/src/proto/ \
            src/proto/ \
            || (echo "::error::Generated proto sources have drifted from committed copy. Run scripts/regenerate-proto.sh and commit the result." && exit 1)

  # TD-126 Phase 1: the published REST contract (docs/openapi/proximadb-openapi.yaml)
  # is GENERATED from the annotated axum handlers (src/network/rest/openapi.rs),
  # not hand-maintained. This job regenerates it and fails if the committed copy
  # has drifted from the handler code — the same generated-artifact pattern as
  # the proto-sync gate above. Regenerate locally with:
  #   UPDATE_OPENAPI_SPEC=1 cargo test -p proximadb --test openapi_spec_gen
  openapi-spec-drift:
    name: OpenAPI Spec From Code (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-openapi-spec-drift"
      - name: Regenerate OpenAPI spec from handlers (drift gate)
        run: cargo test -p proximadb --test openapi_spec_gen -- --nocapture
      - name: Fail on uncommitted drift in generated OpenAPI spec
        run: |
          git diff --exit-code -- docs/openapi/proximadb-openapi.yaml \
            || (echo "::error::docs/openapi/proximadb-openapi.yaml has drifted from the annotated REST handlers. Run 'UPDATE_OPENAPI_SPEC=1 cargo test -p proximadb --test openapi_spec_gen' and commit the result." && exit 1)

  # TD-126 Phase 2 (spec-driven SDK pilot, Go): the Go REST transport's wire
  # plumbing (clients/go/proximadb/internal/genrest) is GENERATED from the
  # published OpenAPI spec via oapi-codegen (pinned in clients/go/codegen/go.mod).
  # This job regenerates it and fails if the committed copy has drifted from the
  # spec — the same generated-artifact pattern as openapi-spec-drift / proto-sync.
  # Regenerate locally with: make gen-go-sdk
  go-sdk-codegen-drift:
    name: Go SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps for the 3.1->3.0 down-conversion
        run: python -m pip install --upgrade pip pyyaml
      - name: Regenerate the Go REST transport from the OpenAPI spec
        env:
          PYTHON: python
        run: make gen-go-sdk
      - name: Fail on uncommitted drift in the generated Go client
        run: |
          git diff --exit-code -- clients/go/proximadb/internal/genrest/ \
            || (echo "::error::clients/go/proximadb/internal/genrest has drifted from the OpenAPI spec. Run 'make gen-go-sdk' and commit the result." && exit 1)

  # TD-126 Phase 4 (spec-driven SDK pilot, TypeScript): the TS REST transport's
  # wire types (clients/nodejs-embedded/src/generated) are GENERATED from the
  # published OpenAPI spec via openapi-typescript (pinned in the SDK
  # package.json). This job regenerates them and fails if the committed copy has
  # drifted from the spec — the same generated-artifact pattern as
  # go-sdk-codegen-drift / openapi-spec-drift. Regenerate locally with:
  # make gen-ts-sdk
  ts-sdk-codegen-drift:
    name: TS SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nodejs_sdk == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: clients/nodejs-embedded
        run: npm ci
      - name: Regenerate the TypeScript REST transport from the OpenAPI spec
        run: make gen-ts-sdk
      - name: Fail on uncommitted drift in the generated TS client
        run: |
          git diff --exit-code -- clients/nodejs-embedded/src/generated/ \
            || (echo "::error::clients/nodejs-embedded/src/generated has drifted from the OpenAPI spec. Run 'make gen-ts-sdk' and commit the result." && exit 1)

  # TD-126 Phase 4 (spec-driven SDK, Rust): the Rust REST transport's wire
  # plumbing (clients/rust/src/genrest.rs) is GENERATED from the published
  # OpenAPI spec via progenitor (pinned in clients/rust/codegen/Cargo.toml),
  # behind the unchanged hand-written ergonomic facade (clients/rust/src/client.rs).
  # This job regenerates it and fails if the committed copy has drifted from the
  # spec — the same generated-artifact pattern as go-sdk-codegen-drift /
  # openapi-spec-drift / proto-sync. Regenerate locally with: make gen-rust-sdk
  rust-sdk-codegen-drift:
    name: Rust SDK Codegen Drift (TD-126)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true' || needs.changes.outputs.openapi_spec == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps for the 3.1->3.0 down-conversion
        run: python -m pip install --upgrade pip pyyaml
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-sdk-codegen-drift"
          workspaces: clients/rust/codegen
      - name: Regenerate the Rust REST transport from the OpenAPI spec
        env:
          PYTHON: python
        run: make gen-rust-sdk
      - name: Fail on uncommitted drift in the generated Rust client
        run: |
          git diff --exit-code -- clients/rust/src/genrest.rs \
            || (echo "::error::clients/rust/src/genrest.rs has drifted from the OpenAPI spec. Run 'make gen-rust-sdk' and commit the result." && exit 1)

  panic-policy-report:
    name: Panic Policy Report (WS-2 Stage 1)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Generate panic-policy metrics report
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode report \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --write artifacts/panic_policy/panic_policy_report.json \
            --format text
      - name: Upload panic-policy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: panic-policy-report
          path: artifacts/panic_policy/panic_policy_report.json
          retention-days: 14

  panic-policy-no-regression:
    name: Panic Policy No Regression (WS-2 Stage 2)
    runs-on: ubuntu-latest
    needs: [changes, panic-policy-report]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no-regression baseline
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode no-regression \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --write artifacts/panic_policy/panic_policy_no_regression.json \
            --format text

  panic-policy-module-guard:
    name: Panic Policy Critical Modules (WS-2 Stage 3)
    runs-on: ubuntu-latest
    needs: [changes, panic-policy-report]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce critical module guardrails
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode module-guard \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --critical-modules network_rest,api_handlers,graph,query \
            --write artifacts/panic_policy/panic_policy_module_guard.json \
            --format text

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-clippy-nightly"
      # Clippy is authoritative. TD-079 retired the accumulated root-crate
      # lint debt (2026-05-28); any new warning fails CI. If a new lint
      # surfaces from a dependency or toolchain update, prefer fixing it
      # over re-adding `-A warnings`. Targeted `#[allow(...)]` with an
      # inline rationale is acceptable for genuinely infallible / large
      # blast-radius edge cases.
      # Only lint lib+bins to stay within CI memory limits (--all-targets OOMs).
      - name: Run clippy (-D warnings)
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo clippy --lib --bins -- -D warnings

  # Feature-gated code paths that DEFAULT CI never compiles. This is the job
  # that would have caught the cloud-full `ObjectStoreExt` compile-rot (the
  # AnvaiOps ADLS CrashLoopBackOff) at PR time instead of in production:
  # aws/azure/gcp/onnx/cluster/catalog code is gated, so the default build
  # skips it and rot accumulates invisibly. `cargo check` (no link/test) keeps
  # this cheap while still surfacing E0599-class errors. Each combo runs on its
  # own runner (fail-fast: false) so one feature's break doesn't mask others.
  feature-matrix:
    name: Feature Matrix (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.test_tier == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two combos the published images actually ship (PR #78):
          - { label: "cloud-full",          pkg: proximadb-server, feats: "cloud-full" }
          - { label: "cloud-full,onnx",     pkg: proximadb-server, feats: "cloud-full,onnx" }
          # Other gated surfaces invisible to default CI:
          - { label: "cluster",             pkg: proximadb,        feats: "cluster" }
          - { label: "enterprise-catalogs", pkg: proximadb,        feats: "enterprise-catalogs" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install System Dependencies
        # g++ provides libstdc++ for the onnxruntime (ort) build script.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler g++
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-feature-matrix"
          shared-key: ${{ matrix.label }}
      - name: cargo check -p ${{ matrix.pkg }} --features ${{ matrix.feats }}
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo check -p ${{ matrix.pkg }} --features ${{ matrix.feats }}

  rust-security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        continue-on-error: true
        run: cargo audit || echo "::warning::Security audit found vulnerabilities - review required"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install SDK Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev]"

      # Python SDK linting
      - name: Run Black (SDK)
        working-directory: clients/python
        run: black --check --diff src tests

      - name: Run isort (SDK)
        working-directory: clients/python
        run: isort --check-only --diff src tests

      - name: Run Ruff (SDK - syntax errors)
        working-directory: clients/python
        run: ruff check src tests --select=E9,F63,F7 --exclude="*_pb2*.py"

      - name: Run mypy (SDK - core modules)
        working-directory: clients/python
        run: |
          mypy \
            src/proximadb_sdk/proto_conversion.py \
            src/proximadb_sdk/integrations/ \
            || echo "::warning::mypy type checking found issues"

  go-lint:
    name: Go SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run go vet
        working-directory: clients/go
        run: go vet ./...
      - name: Check go fmt
        working-directory: clients/go
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::Go files not formatted: $files"
            exit 1
          fi

  nodejs-lint:
    name: Node.js SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nodejs_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: clients/nodejs-embedded
        run: npm ci
      - name: Run lint
        working-directory: clients/nodejs-embedded
        run: npm run lint

  rust-sdk-lint:
    name: Rust SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: clients/rust
        run: cargo fmt -- --check
      - name: Run clippy
        working-directory: clients/rust
        run: cargo clippy -- -D warnings

  # ===========================================================================
  # SDK OpenAPI CONTRACT GATES (added 2026-05-30, TD-079 follow-up)
  #
  # One job per SDK runs that SDK's contract-gate tests against the
  # canonical spec at `docs/openapi/proximadb-openapi.yaml`. Any drift
  # (SDK calls a path the spec doesn't declare, sends a body without the
  # spec's required keys, uses the wrong verb, etc.) fails the matrix
  # cell — fast feedback to the contributor without waiting for the full
  # integration-test matrix.
  #
  # Triggered by changes to either the SDK source OR the OpenAPI spec.
  # Python's gate is already covered by the `proto-compat` job (which
  # runs `make proto-check` → `test_openapi_contract.py`), so the matrix
  # below covers the three SDKs that gained their gates this round.
  # ===========================================================================
  sdk-contract-gates:
    name: SDK OpenAPI Contract Gate (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.openapi_spec == 'true' ||
      needs.changes.outputs.rust_sdk == 'true' ||
      needs.changes.outputs.go_sdk == 'true' ||
      needs.changes.outputs.nodejs_sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: rust
            setup: rust
          - sdk: go
            setup: go
          - sdk: typescript
            setup: node
    steps:
      - uses: actions/checkout@v4

      # Toolchain setup — one branch per matrix cell
      - if: matrix.setup == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.setup == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-sdk-contract-rust"
          workspaces: "clients/rust -> target"

      - if: matrix.setup == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - if: matrix.setup == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/nodejs-embedded/package-lock.json

      # Per-SDK contract gate runs
      - name: Rust contract gate
        if: matrix.sdk == 'rust'
        run: |
          cargo test --manifest-path clients/rust/Cargo.toml --test openapi_contract \
            -- --nocapture

      - name: Go contract gate
        if: matrix.sdk == 'go'
        working-directory: clients/go
        run: |
          go test -v -count=1 -run '^TestOpenAPIContract|MatchesSpec|AllV2OperationsCovered' \
            ./proximadb/internal/rest/...

      - name: TypeScript contract gate
        if: matrix.sdk == 'typescript'
        working-directory: clients/nodejs-embedded
        run: |
          npm ci
          npm test

  # ===========================================================================
  # CONNECTORS — OpenAPI + Flight contract gates (added 2026-05-30, TD-095 follow-up)
  #
  # The 4 Rust connectors at src/connectors/ (DuckDB, Spark, Hadoop, Trino)
  # were scaffolded against /api/v1 paths and never wired to the real REST
  # / Flight surface. After commit a30544f3b the REST-using connectors
  # (DuckDB bind/search/insert + Hadoop flush_now) post spec-correct
  # bodies against /api/v2 endpoints; the Flight-using connector
  # (Trino) has its ticket + descriptor shapes contract-guarded even
  # though the live FlightClient mount is still TD-097 work.
  #
  # Triggered when the OpenAPI spec OR any connector source / test
  # changes. Two cells — REST + Flight — so a Flight-only proto bump
  # doesn't spuriously fail the REST gate and vice versa.
  # ===========================================================================
  connectors-contract-gates:
    name: Connectors Contract Gate (${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.openapi_spec == 'true' ||
      needs.changes.outputs.src_connectors == 'true'
    strategy:
      fail-fast: false
      matrix:
        kind: [rest, flight]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-connectors-contract"

      - name: REST contract gate
        if: matrix.kind == 'rest'
        run: |
          cargo test --test connectors_openapi_contract -- --nocapture

      - name: Flight contract gate
        if: matrix.kind == 'flight'
        run: |
          cargo test --test connectors_flight_contract -- --nocapture

  # ===========================================================================
  # SPARK CONNECTOR JNI SMOKE (added 2026-05-31, TD-097 follow-up)
  #
  # End-to-end gate for the Spark connector JNI wire layer:
  #   1. Build the `proximadb-spark-jni` cdylib
  #   2. javac the Java JNI shim + smoke harness
  #   3. java -Djava.library.path=target/debug … NativeProximaDBTest
  #
  # The smoke harness exits non-zero on any failure. Covers all 9 jni_*
  # exports for type-correctness; placeholder return shapes are part of
  # the contract (TD-097 follow-up replaces them with real
  # ConnectorStorageAdapter calls).
  #
  # Triggers when either the Rust JNI crate, the JVM test harness, or
  # the underlying scaffolds in src/connectors/spark.rs change.
  # ===========================================================================
  spark-jni-smoke:
    name: Spark Connector JNI Smoke (TD-097)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.spark_jni == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-spark-jni-smoke"
          workspaces: ". -> target"
      - name: Run JNI smoke harness
        run: |
          chmod +x clients/jvm/spark-connector/run-smoke.sh
          clients/jvm/spark-connector/run-smoke.sh

  sdk-security-scan:
    name: SDK Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.go_sdk == 'true' ||
      needs.changes.outputs.nodejs_sdk == 'true' ||
      needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Python SDK
        if: needs.changes.outputs.python == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/python'
          format: 'sarif'
          output: 'python-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Go SDK
        if: needs.changes.outputs.go_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/go'
          format: 'sarif'
          output: 'go-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Node.js SDK
        if: needs.changes.outputs.nodejs_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/nodejs-embedded'
          format: 'sarif'
          output: 'nodejs-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Rust SDK
        if: needs.changes.outputs.rust_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/rust'
          format: 'sarif'
          output: 'rust-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Python Trivy Results
        if: needs.changes.outputs.python == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'python-trivy-results.sarif'
          category: 'python-sdk-security'
        continue-on-error: true

      - name: Upload Go Trivy Results
        if: needs.changes.outputs.go_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'go-trivy-results.sarif'
          category: 'go-sdk-security'
        continue-on-error: true

      - name: Upload Node.js Trivy Results
        if: needs.changes.outputs.nodejs_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'nodejs-trivy-results.sarif'
          category: 'nodejs-sdk-security'
        continue-on-error: true

      - name: Upload Rust Trivy Results
        if: needs.changes.outputs.rust_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'rust-trivy-results.sarif'
          category: 'rust-sdk-security'
        continue-on-error: true

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        run: |
          echo "Checking for broken links in documentation..."
          find docs -name "*.md" -o -name "*.adoc" | head -20 || true
          echo "Documentation validation complete"

  # ============================================================================
  # BUILD - Compile Rust binaries
  # ============================================================================
  rust-build:
    name: Rust Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && !inputs.skip_tests
    strategy:
      matrix:
        include:
          - profile: dev
            args: ""
          - profile: release
            args: "--release"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-${{ matrix.profile }}"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Build All Binaries
        # TD-079 retired the root-crate lint debt 2026-05-28 — no
        # `-A warnings` override needed. Cargo build doesn't fail on
        # warnings by default; the rust-clippy job is the authoritative
        # lint gate.
        run: |
          cargo build ${{ matrix.args }} \
            -p proximadb-server \
            -p proximadb-bench \
            -p proximadb-migrate

      - name: Upload Server Binary
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: target/release/proximadb-server
          retention-days: 1

  rust-test:
    name: Rust Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.test_tier == 'true' && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: unit
            args: "--lib"
            threads: 4
          - test-type: doc
            args: "--doc"
            threads: 4
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      # Unit tests run under nextest for process-per-test isolation: the suite
      # has tests that touch process-global statics (WAL registry, metadata
      # provider, request-id counter) and race under libtest's shared-process
      # parallelism. nextest gives each test its own process. Doc tests stay on
      # `cargo test` (nextest does not run doc tests).
      - name: Install nextest
        if: matrix.test-type == 'unit'
        uses: taiki-e/install-action@nextest

      - name: Run Tests
        run: |
          if [ "${{ matrix.test-type }}" = "unit" ]; then
            # CARGO_BUILD_JOBS=1: the root `proximadb` crate's test binary
            # (8400+ tests) is memory-heavy to compile; serializing crate
            # compilation keeps the 16GB hosted runner from OOMing (it was
            # being killed mid-link with exit 143 / "runner received a shutdown
            # signal"). --test-threads bounds nextest's run-phase memory too.
            CARGO_BUILD_JOBS=1 cargo nextest run --lib --profile unit --test-threads=2
          else
            cargo test ${{ matrix.args }} -- --test-threads=${{ matrix.threads }}
          fi

  # Targeted integration tests based on changed components
  rust-integration-test-storage:
    name: Rust Integration Tests (storage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.storage_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Storage Integration Tests
        run: |
          # Run only explicitly named storage test files (avoids compiling all tests)
          for test_file in tests/*sst*.rs tests/*storage*.rs tests/*wal*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-query:
    name: Rust Integration Tests (query)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.query_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Query Integration Tests
        run: |
          for test_file in tests/*query*.rs tests/*federated*.rs tests/*cache*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-graph:
    name: Rust Integration Tests (graph)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.graph_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Graph Integration Tests
        run: |
          for test_file in tests/*graph*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-cluster:
    name: Rust Integration Tests (cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      needs.changes.outputs.test_tier == 'true' &&
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.network_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Cluster Integration Tests
        run: |
          for test_file in tests/*cluster*.rs tests/*distributed*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # FULL tier only (qa -> main). rust-test runs at the MEDIUM tier (qa), but
    # coverage is expensive, so gate it to the main-promotion gate explicitly.
    needs: [changes, rust-test]
    if: needs.changes.outputs.extensive == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-coverage"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
          cargo install cargo-tarpaulin
      - name: Generate Coverage
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          # Serialize crate compilation: the root crate's instrumented test
          # binary OOM-kills the 16GB runner (exit 143) during the build phase,
          # before the `|| echo continuing` fallback can run. Same peak-rustc
          # -memory issue mitigated in the unit-test job.
          CARGO_BUILD_JOBS: 1
        run: |
          # Use --lib only and limit parallelism to avoid OOM on CI runners
          cargo tarpaulin --lib --timeout 600 \
            --out xml --out html \
            --output-dir coverage \
            --skip-clean \
            --jobs 2 \
            --fail-under 60 || echo "Coverage generation failed (may be OOM), continuing"
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  # ============================================================================
  # PYTHON SDK TESTS
  # ============================================================================
  python-test:
    name: Python SDK Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Defense-in-depth: the suite runs in ~5min. If a future test leaks a
    # non-daemon thread / unshutdown pool, the interpreter's atexit join can hang
    # the job for hours. Cap it so a leak fails fast instead of stalling CI.
    timeout-minutes: 20
    needs: changes
    strategy:
      matrix:
        # 3.9 dropped: the package declares requires-python ">=3.10".
        python-version: ["3.10", "3.11", "3.12"]
    if: ${{ !inputs.skip_tests && needs.changes.outputs.extensive == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install dependencies
        working-directory: clients/python
        run: |
          # Optional-feature deps exercised by *_cov tests (arrow/pandas/openapi
          # contract/process metrics). Without them those modules fail to import
          # and pytest aborts at collection.
          pip install -e ".[dev]" pyarrow pandas jsonschema psutil
      # Cache the sentence-transformers model so repeated runs don't re-hit the HF
      # Hub (a 429 there previously aborted pytest collection). tests/embedding_utils
      # falls back to deterministic vectors if the model is still unavailable, so
      # neither the cache miss nor the prefetch failure can break the suite.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}
      - name: Pre-fetch embedding model (best-effort)
        continue-on-error: true
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')" || true
      - name: Run SDK unit tests
        working-directory: clients/python
        env:
          PROXIMADB_EMBEDDED: "0"
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
        run: |
          # Per-file process isolation for the SDK unit suite.
          #
          # Several *_cov tests stub heavy optional deps (sentence_transformers,
          # torch, openai, ...) into sys.modules — some at MODULE/collection level,
          # some via monkeypatch. These leak across files in a shared interpreter
          # and break later REAL tests (e.g. test_embedding_providers_v2 getting a
          # fake sentence_transformers). The leak is MULTI-FILE emergent (not
          # pairwise-reducible) and collection-time, so neither xdist/forked nor
          # excluding a known subset is airtight. Running EACH file in its own
          # process is the only guaranteed fix — a file's stubs cannot escape its
          # process. Parallelized for speed; failures print with ::error::.
          #
          # Permanently skipped (not isolation-related):
          #   victor_cov     -> imports the internal, unpublished `victor` package
          #   chunking_code  -> needs tree-sitter grammars not installed in CI
          set -u
          SKIP_RE='test_integrations_victor_cov|test_chunking_code_cov'
          # Run one file in its own process. exit 0 = ok, 5 = no tests collected
          # (e.g. a whole module importorskip-skipped) -> ok; anything else fails.
          test_one() {
            o=$(pytest "$1" -q --timeout=120 -p no:cacheprovider 2>&1); r=$?
            if [ "$r" -ne 0 ] && [ "$r" -ne 5 ]; then
              echo "::error::FAILED $1 (exit $r)"; echo "$o" | tail -25; return 1
            fi
            echo "ok: $1"; return 0
          }
          export -f test_one
          # `xargs -n1 bash -c 'test_one "$0"'` passes each file as $0 (no -I
          # substitution, so no BSD/GNU command-length quirk). xargs exits non-zero
          # (123) if any invocation failed -> the step fails.
          find tests/unit -name 'test_*.py' | sort | grep -vE "$SKIP_RE" | \
            xargs -P 4 -n 1 bash -c 'test_one "$0"'

  # ============================================================================
  # INTEGRATION TESTS - Server + Python SDK
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, rust-build, python-test]
    if: ${{ !inputs.skip_tests && needs.changes.outputs.extensive == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Download Server Binary
        uses: actions/download-artifact@v4
        with:
          name: proximadb-server-linux-x64

      - name: Install SDK Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev]"

      - name: Generate Protobuf Stubs (if needed)
        run: |
          pip install grpcio-tools
          mkdir -p clients/python/src/proximadb/v1
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb/v1/*.proto || echo "Protobuf generation skipped"
          echo "Protobuf generation complete"

      - name: Verify Protobuf Files Exist
        run: |
          if ls clients/python/src/proximadb/v1/*_pb2*.py 1>/dev/null 2>&1 || \
             ls clients/python/src/proximadb/*_pb2*.py 1>/dev/null 2>&1; then
            echo "Protobuf files found"
          else
            echo "::warning::No protobuf files found - using pre-compiled stubs"
          fi

      - name: Prepare Server
        run: chmod +x proximadb-server

      - name: Start Server
        run: |
          ./proximadb-server --config config/config.toml &
          echo $! > server.pid
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:5678/health; do sleep 1; done'
          echo "Server is ready"

      - name: Run Integration Tests
        working-directory: clients/python
        run: |
          set +e
          # Skip tests requiring native embedded bindings (PyO3 not built in CI)
          timeout 900 bash -c '
            PROXIMADB_URL=http://localhost:5678 \
            PROXIMADB_GRPC_URL=http://localhost:5679 \
            pytest tests/integration/ -v --tb=short --timeout=120 \
              --ignore=tests/integration/test_batching_real_server.py \
              --ignore=tests/integration/test_connection_pools.py \
              --ignore=tests/integration/test_grpc_sync_real_server.py \
              --ignore=tests/integration/test_operation_router_integration.py \
              --ignore=tests/integration/test_entity_store_comprehensive.py \
              --ignore=tests/integration/test_entity_store_extended.py \
              --ignore=tests/integration/test_sks_graph_first_integration.py \
              --ignore=tests/integration/test_sks_semantic_graph_and_vector.py \
              --ignore=tests/integration/test_sql_integration.py \
              --ignore=tests/integration/test_semantic_chunking_integration.py \
              --ignore=tests/integration/test_integration.py \
              --ignore=tests/integration/test_multilang_code_indexing.py \
              --ignore=tests/integration/test_chunking_embedding_integration.py \
              --ignore=tests/integration/test_chunking_embedding_benchmark.py \
              --ignore=tests/integration/test_graph_operations.py \
              --ignore=tests/integration/test_code_indexing_integration.py \
              --ignore=tests/integration/test_response_cache_integration.py 2>&1 | tee pytest_output.txt
          '
          exit_code=${PIPESTATUS[0]:-$?}
          set -e
          # Handle pytest daemon thread hang (exit 124 = timeout killed)
          if [ "$exit_code" -eq 124 ]; then
            if grep -qE "[0-9]+ passed" pytest_output.txt; then
              echo "WARNING: pytest hung after completion (daemon thread cleanup), treating as completed"
              # Still exit with failure if tests failed, success if all passed
              if grep -qE "[0-9]+ failed|[0-9]+ error" pytest_output.txt; then
                exit 1
              fi
              exit 0
            fi
          fi
          exit ${exit_code}

      - name: Collect Server Logs on Failure
        if: failure()
        run: |
          echo "=== Server process status ==="
          ps aux | grep proximadb || true
          echo "=== Server logs (if available) ==="
          cat /tmp/proximadb*.log 2>/dev/null || echo "No log files found"

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            pid=$(cat server.pid)
            if kill -0 "$pid" 2>/dev/null; then
              echo "Stopping server (PID: $pid)..."
              kill "$pid" 2>/dev/null || true
              sleep 2
              # Force kill if still running
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

  # ============================================================================
  # DOCKER BUILD - Container testing
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: (needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true') && needs.changes.outputs.extensive == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        # Build the image we actually publish (deploy/docker/Dockerfile,
        # target `runtime`) so CI exercises the shipped OSS server, not the
        # demo image. The published artifact comes from publish-image.yml.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: proximadb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health
        run: |
          docker run -d --name test-container \
            -p 5678:5678 -p 5679:5679 \
            proximadb:test

          echo "Waiting for ProximaDB server to start..."
          if timeout 180 bash -c 'until curl -sf http://localhost:5678/health; do sleep 3; done'; then
            echo "=== Health Check Passed ==="
            curl -s http://localhost:5678/health | jq .
          else
            echo "=== Health Check Failed - Container Logs ==="
            docker logs test-container 2>&1 | tail -100
            docker stop test-container || true
            docker rm test-container || true
            exit 1
          fi

          docker stop test-container
          docker rm test-container

  # ============================================================================
  # BENCHMARKS - Performance testing (optional)
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [rust-build]
    if: |
      inputs.run_benchmarks ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-bench"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Run Benchmarks
        run: |
          cargo bench --bench bench_21_query_cache -- --noplot 2>&1 | tee bench-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ============================================================================
  # SUMMARY - Final status check
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - deterministic-commit-contract
      - rust-format
      - capability-matrix
      - proto-compat
      - panic-policy-report
      - panic-policy-no-regression
      - panic-policy-module-guard
      - rust-clippy
      - feature-matrix
      - rust-security
      - rust-build
      - rust-test
      - rust-integration-test-storage
      - rust-integration-test-query
      - rust-integration-test-graph
      - rust-integration-test-cluster
      - rust-coverage
      - python-lint
      - python-test
      - integration-test
      - docker-build
      - docs-validation
      # SDK linting and security
      - go-lint
      - go-sdk-codegen-drift
      - rust-sdk-codegen-drift
      - nodejs-lint
      - ts-sdk-codegen-drift
      - rust-sdk-lint
      - sdk-security-scan
      - sdk-contract-gates
      - connectors-contract-gates
      - spark-jni-smoke
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          results="${{ toJSON(needs.*.result) }}"

          if echo "$results" | grep -q '"failure"'; then
            echo "::error::One or more CI jobs failed"
            echo "Some jobs failed. Check the workflow run for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "All required CI checks passed!" >> $GITHUB_STEP_SUMMARY
