name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs'
        required: false
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

# ============================================================================
# This consolidated CI workflow combines:
# - Rust builds, tests, and quality checks
# - Python SDK tests across multiple versions
# - Integration tests between server and SDK
# - Docker container builds and health checks
# - Performance benchmarks (optional)
# - Documentation validation
#
# The workflow uses a dependency graph to minimize build times:
#   quality-checks (parallel) -> rust-build -> integration-tests
#                             -> docker-build
# ============================================================================

jobs:
  # ============================================================================
  # CHANGES DETECTION - Determine what to build/test
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/**'
              - 'benches/**'
            python:
              - 'clients/python/**'
              - 'clients/python-embedded/**'
              - 'proto/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
            docs:
              - 'docs/**'
              - '*.adoc'
              - '*.md'
            proto:
              - 'proto/**'

  # ============================================================================
  # QUALITY CHECKS - Run in parallel, fast feedback
  # ============================================================================
  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-clippy"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true  # Don't fail on clippy warnings for now

  rust-security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install Dependencies
        working-directory: clients/python
        run: |
          pip install -e ".[dev]"
      - name: Run Linters
        working-directory: clients/python
        run: |
          black --check --diff src tests || true
          isort --check-only --diff src tests || true
          flake8 src tests || true
          mypy src || true

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install AsciiDoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor
      - name: Validate AsciiDoc
        run: find docs -name "*.adoc" -exec asciidoctor --dry-run {} \;

  # ============================================================================
  # RUST BUILD & TEST - Core build pipeline
  # ============================================================================
  rust-build:
    name: Rust Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [changes, rust-format]
    if: needs.changes.outputs.rust == 'true' && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: dev
            args: ""
          - profile: release
            args: "--release"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-action@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.profile }}"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build All Binaries
        run: |
          cargo build ${{ matrix.args }} \
            --bin proximadb-server \
            --bin proximadb-bench \
            --bin proximadb-migrate

      - name: Upload Server Binary
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: target/release/proximadb-server
          retention-days: 1

  rust-test:
    name: Rust Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    needs: [rust-build]
    if: "!inputs.skip_tests"
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: unit
            args: "--lib"
            threads: 4
          - test-type: integration
            args: "--test '*'"
            threads: 1
          - test-type: doc
            args: "--doc"
            threads: 4
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-action@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-dev"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Tests
        run: cargo test ${{ matrix.args }} -- --test-threads=${{ matrix.threads }}
        continue-on-error: ${{ matrix.test-type == 'integration' }}

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [rust-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          cargo install cargo-tarpaulin
      - name: Generate Coverage
        run: cargo tarpaulin --release --timeout 600 --out xml
        continue-on-error: true
      - uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  # ============================================================================
  # PYTHON TESTS - SDK testing across versions
  # ============================================================================
  python-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev,test]"

      - name: Generate Protobuf
        run: |
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb.proto

      - name: Run Unit Tests
        working-directory: clients/python
        run: pytest tests/unit/ -v --tb=short

  # ============================================================================
  # INTEGRATION TESTS - Full stack testing
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-build, python-test]
    if: |
      always() &&
      !inputs.skip_tests &&
      (needs.rust-build.result == 'success' || needs.rust-build.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download Server Binary
        uses: actions/download-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: ./
        continue-on-error: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          chmod +x proximadb-server 2>/dev/null || true
          cd clients/python && pip install -e ".[dev,test]"

      - name: Generate Protobuf
        run: |
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb.proto

      - name: Start Server
        if: hashFiles('proximadb-server') != ''
        run: |
          ./proximadb-server --config demo/docker-config.toml &
          echo $! > server.pid
          timeout 30 bash -c 'until curl -sf http://localhost:5678/health; do sleep 1; done'

      - name: Run Integration Tests
        if: hashFiles('proximadb-server') != ''
        working-directory: clients/python
        run: |
          PROXIMADB_URL=http://localhost:5678 \
          PROXIMADB_GRPC_URL=http://localhost:5679 \
          pytest tests/integration/ -v --tb=short
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          [ -f server.pid ] && kill $(cat server.pid) 2>/dev/null || true

  # ============================================================================
  # DOCKER BUILD - Container testing
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: proximadb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health
        run: |
          docker run -d --name test-container \
            -p 5678:5678 -p 5679:5679 \
            proximadb:test

          timeout 120 bash -c 'until curl -sf http://localhost:5678/health; do sleep 2; done'
          curl -s http://localhost:5678/health | jq .

          docker stop test-container
          docker rm test-container

  # ============================================================================
  # BENCHMARKS - Performance testing (optional)
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [rust-build]
    if: |
      inputs.run_benchmarks ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-action@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-bench"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Benchmarks
        run: |
          cargo bench --bench bench_21_query_cache -- --noplot 2>&1 | tee bench-results.txt
        continue-on-error: true

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ============================================================================
  # SUMMARY - Final status check
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - rust-format
      - rust-clippy
      - rust-security
      - rust-build
      - rust-test
      - python-lint
      - python-test
      - integration-test
      - docker-build
      - docs-validation
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          results="${{ toJSON(needs.*.result) }}"

          if echo "$results" | grep -q '"failure"'; then
            echo "::error::One or more CI jobs failed"
            echo "Some jobs failed. Check the workflow run for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "All required CI checks passed!" >> $GITHUB_STEP_SUMMARY
