name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs'
        required: false
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

# ============================================================================
# This consolidated CI workflow combines:
# - Rust builds, tests, and quality checks
# - Python SDK tests across multiple versions
# - Integration tests between server and SDK
# - Docker container builds and health checks
# - Performance benchmarks (optional)
# - Documentation validation
#
# The workflow uses a dependency graph to minimize build times:
#   quality-checks (parallel) -> rust-build -> integration-tests
#                             -> docker-build
# ============================================================================

jobs:
  # ============================================================================
  # CHANGES DETECTION - Determine what to build/test
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      proto: ${{ steps.filter.outputs.proto }}
      panic_policy: ${{ steps.filter.outputs.panic_policy }}
      # Granular Rust component detection for targeted testing
      query_changes: ${{ steps.filter.outputs.query_changes }}
      storage_changes: ${{ steps.filter.outputs.storage_changes }}
      graph_changes: ${{ steps.filter.outputs.graph_changes }}
      core_changes: ${{ steps.filter.outputs.core_changes }}
      network_changes: ${{ steps.filter.outputs.network_changes }}
      # SDK change detection
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      nodejs_sdk: ${{ steps.filter.outputs.nodejs_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      java_sdk: ${{ steps.filter.outputs.java_sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'tests/**'
              - 'benches/**'
            python:
              - 'clients/python/**'
              - 'clients/python-embedded/**'
              - 'proto/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
            docs:
              - 'docs/**'
              - '*.adoc'
              - '*.md'
            proto:
              - 'proto/**'
            panic_policy:
              - 'scripts/count_panic_patterns.sh'
              - 'docs/_internal/roadmap/PANIC_POLICY_BASELINE.json'
              - 'Makefile'
            # Granular Rust component filters for targeted testing
            query_changes:
              - 'src/query/**'
              - 'tests/*query*'
              - 'tests/*federated*'
            storage_changes:
              - 'src/storage/**'
              - 'tests/*storage*'
              - 'tests/*sst*'
              - 'tests/*wal*'
            graph_changes:
              - 'src/graph/**'
              - 'tests/*graph*'
            core_changes:
              - 'src/core/**'
              - 'src/compute/**'
              - 'src/lib.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
            network_changes:
              - 'src/network/**'
              - 'src/api_handlers/**'
              - 'proto/**'
            # SDK filters
            go_sdk:
              - 'clients/go/**'
              - 'clients/go-embedded/**'
            nodejs_sdk:
              - 'clients/nodejs-embedded/**'
            rust_sdk:
              - 'clients/rust/**'
            java_sdk:
              - 'clients/java-embedded/**'

  # ============================================================================
  # QUALITY CHECKS - Run in parallel, fast feedback
  # ============================================================================
  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check

  capability-matrix:
    name: Capability Matrix
    runs-on: ubuntu-latest
    needs: changes
    if: false  # DISABLED for v0.2.0 release - script issues
    steps:
      - uses: actions/checkout@v4
      - name: Validate capability matrix
        run: python3 scripts/validate_capability_matrix.py

  panic-policy-report:
    name: Panic Policy Report (WS-2 Stage 1)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Generate panic-policy metrics report
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode report \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --write artifacts/panic_policy/panic_policy_report.json \
            --format text
      - name: Upload panic-policy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: panic-policy-report
          path: artifacts/panic_policy/panic_policy_report.json
          retention-days: 14

  panic-policy-no-regression:
    name: Panic Policy No Regression (WS-2 Stage 2)
    runs-on: ubuntu-latest
    needs: [changes, panic-policy-report]
    if: false  # DISABLED for v0.2.0 release - baseline issues
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no-regression baseline
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode no-regression \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --write artifacts/panic_policy/panic_policy_no_regression.json \
            --format text

  panic-policy-module-guard:
    name: Panic Policy Critical Modules (WS-2 Stage 3)
    runs-on: ubuntu-latest
    needs: [changes, panic-policy-no-regression]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.panic_policy == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce critical module guardrails
        run: |
          mkdir -p artifacts/panic_policy
          bash scripts/count_panic_patterns.sh \
            --mode module-guard \
            --baseline docs/_internal/roadmap/PANIC_POLICY_BASELINE.json \
            --critical-modules network_rest,api_handlers,graph,query \
            --write artifacts/panic_policy/panic_policy_module_guard.json \
            --format text

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-clippy-nightly"
      # Note: Clippy is advisory only. The main codebase has accumulated
      # lint warnings that should be addressed in a dedicated cleanup PR.
      # Only lint lib+bins to stay within CI memory limits (--all-targets OOMs).
      - name: Run clippy (advisory)
        continue-on-error: true
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo clippy --lib --bins 2>&1 | tee clippy-output.txt || true
          echo "Clippy found the following issues (advisory only):"
          grep -E "^(warning|error)" clippy-output.txt | head -50 || true

  rust-security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        continue-on-error: true
        run: cargo audit || echo "::warning::Security audit found vulnerabilities - review required"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install SDK Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev]"

      # Python SDK linting
      - name: Run Black (SDK)
        working-directory: clients/python
        run: black --check --diff src tests

      - name: Run isort (SDK)
        working-directory: clients/python
        run: isort --check-only --diff src tests

      - name: Run Ruff (SDK - syntax errors)
        working-directory: clients/python
        run: ruff check src tests --select=E9,F63,F7 --exclude="*_pb2*.py"

      - name: Run mypy (SDK - core modules)
        working-directory: clients/python
        run: |
          mypy \
            src/proximadb_sdk/proto_conversion.py \
            src/proximadb_sdk/integrations/ \
            --ignore-missing-imports

      # Embedded Python module linting
      - name: Install Embedded Dependencies
        run: pip install black isort ruff mypy numpy

      - name: Run Black (Embedded)
        working-directory: clients/python-embedded
        run: black --check --diff src tests

      - name: Run isort (Embedded)
        working-directory: clients/python-embedded
        run: isort --check-only --diff src tests

      - name: Run Ruff (Embedded)
        working-directory: clients/python-embedded
        run: ruff check src tests

      - name: Run mypy (Embedded)
        working-directory: clients/python-embedded
        run: mypy src --ignore-missing-imports

  # Go SDK Linting
  go-lint:
    name: Go SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: clients/go/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: clients/go
          args: --timeout=5m
      - name: Run go vet
        working-directory: clients/go
        run: go vet ./...
      - name: Check go mod tidy
        working-directory: clients/go
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Node.js/TypeScript SDK Linting
  nodejs-lint:
    name: Node.js SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.nodejs_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: clients/nodejs-embedded
        run: npm ci
      - name: TypeScript Compile Check
        working-directory: clients/nodejs-embedded
        run: npx tsc --noEmit
      - name: Run ESLint
        working-directory: clients/nodejs-embedded
        run: npx eslint src/ --ext .ts,.js || echo "ESLint not configured, skipping"

  # Rust SDK Linting
  rust-sdk-lint:
    name: Rust SDK Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Check Format
        working-directory: clients/rust
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: clients/rust
        run: cargo clippy -- -D warnings

  # SDK Security Scanning with Trivy
  sdk-security-scan:
    name: SDK Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.go_sdk == 'true' ||
      needs.changes.outputs.nodejs_sdk == 'true' ||
      needs.changes.outputs.rust_sdk == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Python SDK
        if: needs.changes.outputs.python == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/python'
          format: 'sarif'
          output: 'python-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Go SDK
        if: needs.changes.outputs.go_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/go'
          format: 'sarif'
          output: 'go-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Node.js SDK
        if: needs.changes.outputs.nodejs_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/nodejs-embedded'
          format: 'sarif'
          output: 'nodejs-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Rust SDK
        if: needs.changes.outputs.rust_sdk == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'clients/rust'
          format: 'sarif'
          output: 'rust-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Python Trivy Results
        if: needs.changes.outputs.python == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'python-trivy-results.sarif'
          category: 'python-sdk-security'
        continue-on-error: true

      - name: Upload Go Trivy Results
        if: needs.changes.outputs.go_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'go-trivy-results.sarif'
          category: 'go-sdk-security'
        continue-on-error: true

      - name: Upload Node.js Trivy Results
        if: needs.changes.outputs.nodejs_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'nodejs-trivy-results.sarif'
          category: 'nodejs-sdk-security'
        continue-on-error: true

      - name: Upload Rust Trivy Results
        if: needs.changes.outputs.rust_sdk == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'rust-trivy-results.sarif'
          category: 'rust-sdk-security'
        continue-on-error: true

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install AsciiDoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor
      - name: Validate AsciiDoc
        run: find docs -name "*.adoc" -exec asciidoctor --dry-run {} \;

  # ============================================================================
  # RUST BUILD & TEST - Core build pipeline
  # ============================================================================
  rust-build:
    name: Rust Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: dev
            args: ""
          - profile: release
            args: "--release"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-${{ matrix.profile }}"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Build All Binaries
        # Note: We allow warnings for now to unblock CI. The warnings should
        # be addressed in a dedicated cleanup PR.
        run: |
          RUSTFLAGS="-A warnings" cargo build ${{ matrix.args }} \
            --bin proximadb-server \
            --bin proximadb-bench \
            --bin proximadb-migrate

      - name: Upload Server Binary
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: target/release/proximadb-server
          retention-days: 1

  rust-test:
    name: Rust Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: "!inputs.skip_tests"
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-type: unit
            args: "--lib"
            threads: 4
          - test-type: doc
            args: "--doc"
            threads: 4
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Run Tests
        run: RUSTFLAGS="-A warnings" cargo test ${{ matrix.args }} -- --test-threads=${{ matrix.threads }}

  # Targeted integration tests based on changed components
  rust-integration-test-storage:
    name: Rust Integration Tests (storage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.storage_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Storage Integration Tests
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          # Run only explicitly named storage test files (avoids compiling all tests)
          for test_file in tests/*sst*.rs tests/*storage*.rs tests/*wal*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1 || true
            fi
          done

  rust-integration-test-query:
    name: Rust Integration Tests (query)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.query_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Query Integration Tests
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          for test_file in tests/*query*.rs tests/*federated*.rs tests/*cache*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-graph:
    name: Rust Integration Tests (graph)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.graph_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Graph Integration Tests
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          for test_file in tests/*graph*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-integration-test-cluster:
    name: Rust Integration Tests (cluster)
    runs-on: ubuntu-latest
    needs: [changes, rust-build]
    if: |
      !inputs.skip_tests &&
      (needs.changes.outputs.network_changes == 'true' ||
       needs.changes.outputs.core_changes == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-dev"
          shared-key: "build"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
      - name: Run Cluster Integration Tests
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          for test_file in tests/*cluster*.rs tests/*distributed*.rs; do
            if [ -f "$test_file" ]; then
              test_name=$(basename "$test_file" .rs)
              echo "Running $test_name..."
              cargo test --test "$test_name" -- --test-threads=1
            fi
          done

  rust-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [rust-test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-coverage"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler
          cargo install cargo-tarpaulin
      - name: Generate Coverage
        env:
          RUSTFLAGS: "-A warnings"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          # Use --lib only and limit parallelism to avoid OOM on CI runners
          cargo tarpaulin --lib --timeout 600 \
            --out xml --out html \
            --output-dir coverage \
            --skip-clean \
            --jobs 2 \
            --fail-under 60 || echo "Coverage generation failed (may be OOM), continuing"
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  # ============================================================================
  # PYTHON TESTS - SDK testing across versions
  # ============================================================================
  python-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.proto == 'true') && !inputs.skip_tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev,test]"

      # Cache generated protobuf files to speed up builds
      - name: Cache Generated Protobuf Files
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: |
            clients/python/src/proximadb/*_pb2.py
            clients/python/src/proximadb/*_pb2_grpc.py
          key: python-proto-${{ matrix.python-version }}-${{ hashFiles('proto/**/*.proto') }}
          restore-keys: |
            python-proto-${{ matrix.python-version }}-

      - name: Generate Protobuf
        if: steps.proto-cache.outputs.cache-hit != 'true'
        run: |
          echo "Generating Python protobuf files..."
          cd clients/python
          python scripts/generate_protos.py || echo "Protobuf generation skipped (files may already exist)"
          echo "Protobuf generation complete"

      - name: Verify Protobuf Files Exist
        run: |
          # Check if protobuf files exist (generated or pre-committed)
          if ls clients/python/src/proximadb/v1/*_pb2*.py 1>/dev/null 2>&1 || \
             ls clients/python/src/proximadb/*_pb2*.py 1>/dev/null 2>&1; then
            echo "Protobuf files found"
            ls -la clients/python/src/proximadb/v1/*_pb2*.py 2>/dev/null || true
            ls -la clients/python/src/proximadb/*_pb2*.py 2>/dev/null || true
          else
            echo "::warning::No protobuf files found - tests will use pre-compiled stubs"
          fi

      - name: Run Unit Tests
        working-directory: clients/python
        timeout-minutes: 12
        run: |
          # Run only tests that don't require native embedded module
          # Skip tests that depend on embedded Rust bindings (ProximaDB class)
          echo "=== Starting Python Unit Tests ==="
          # pytest may hang after tests complete due to daemon thread cleanup;
          # capture output and check results even if timeout kills the process
          set +e
          timeout 540 pytest tests/unit/ -v --tb=short --timeout=120 --timeout-method=signal \
            --ignore=tests/unit/test_batching.py \
            --ignore=tests/unit/test_collection_operations.py \
            --ignore=tests/unit/test_embedding_interface.py \
            --ignore=tests/unit/test_operation_router.py \
            --ignore=tests/unit/test_protocol_selector.py \
            --ignore=tests/unit/test_response_cache.py \
            --ignore=tests/unit/test_semantic_chunking.py \
            --ignore=tests/unit/test_chunking_refactored.py 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "=== Python Unit Tests Completed (exit code: ${exit_code}) ==="
          # If timeout killed pytest (exit 124) but all tests passed, treat as success
          if [ "$exit_code" -eq 124 ]; then
            if grep -qE "[0-9]+ passed" pytest_output.txt && ! grep -qE "[0-9]+ failed" pytest_output.txt; then
              echo "WARNING: pytest hung after completion (daemon thread cleanup), but all tests passed"
              exit 0
            fi
          fi
          exit ${exit_code}

      - name: Run Multi-Model Tests
        working-directory: clients/python
        timeout-minutes: 10
        run: |
          # Run multi-model API tests (Document, Hybrid, Time-Series)
          echo "=== Starting Multi-Model Tests ==="
          set +e
          timeout 480 pytest tests/test_document_api.py tests/test_hybrid_api.py tests/test_timeseries_api.py -v --tb=short --timeout=120 --timeout-method=signal 2>&1 | tee multimodel_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "=== Multi-Model Tests Completed (exit code: ${exit_code}) ==="
          # Handle timeout similarly to unit tests
          if [ "$exit_code" -eq 124 ]; then
            if grep -qE "[0-9]+ passed" multimodel_output.txt && ! grep -qE "[0-9]+ failed" multimodel_output.txt; then
              echo "WARNING: Multi-model tests hung after completion, but all tests passed"
              exit 0
            fi
          fi
          exit ${exit_code}

      - name: Test Summary
        if: always()
        working-directory: clients/python
        run: |
          echo "=== Python Test Job Summary ==="
          echo "Python Version: ${{ matrix.python-version }}"
          echo "Job Status: ${{ job.status }}"
          echo "Tests completed. Check above for detailed results."

  # ============================================================================
  # INTEGRATION TESTS - Full stack testing
  # ============================================================================
  integration-test:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, rust-build, python-test]
    if: |
      always() &&
      !inputs.skip_tests &&
      needs.rust-build.result == 'success' &&
      (needs.python-test.result == 'success' || needs.python-test.result == 'skipped') &&
      (needs.changes.outputs.python == 'true' ||
       needs.changes.outputs.network_changes == 'true' ||
       needs.changes.outputs.proto == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Download Server Binary
        uses: actions/download-artifact@v4
        with:
          name: proximadb-server-linux-x64
          path: ./

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python Dependencies
        working-directory: clients/python
        run: pip install -e ".[dev,test]"

      # Cache generated protobuf files to speed up builds
      - name: Cache Generated Protobuf Files
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: |
            clients/python/src/proximadb/*_pb2.py
            clients/python/src/proximadb/*_pb2_grpc.py
          key: python-proto-3.11-${{ hashFiles('proto/**/*.proto') }}
          restore-keys: |
            python-proto-3.11-

      - name: Generate Protobuf
        if: steps.proto-cache.outputs.cache-hit != 'true'
        run: |
          echo "Generating Python protobuf files..."
          mkdir -p clients/python/src/proximadb/v1
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=clients/python/src/proximadb \
            --grpc_python_out=clients/python/src/proximadb \
            proto/proximadb/v1/*.proto || echo "Protobuf generation skipped"
          echo "Protobuf generation complete"

      - name: Verify Protobuf Files Exist
        run: |
          if ls clients/python/src/proximadb/v1/*_pb2*.py 1>/dev/null 2>&1 || \
             ls clients/python/src/proximadb/*_pb2*.py 1>/dev/null 2>&1; then
            echo "Protobuf files found"
          else
            echo "::warning::No protobuf files found - using pre-compiled stubs"
          fi

      - name: Prepare Server
        run: chmod +x proximadb-server

      - name: Start Server
        run: |
          ./proximadb-server --config config/config.toml &
          echo $! > server.pid
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:5678/health; do sleep 1; done'
          echo "Server is ready"

      - name: Run Integration Tests
        working-directory: clients/python
        run: |
          set +e
          # Skip tests requiring native embedded bindings (PyO3 not built in CI)
          timeout 900 bash -c '
            PROXIMADB_URL=http://localhost:5678 \
            PROXIMADB_GRPC_URL=http://localhost:5679 \
            pytest tests/integration/ -v --tb=short --timeout=120 \
              --ignore=tests/integration/test_batching_real_server.py \
              --ignore=tests/integration/test_connection_pools.py \
              --ignore=tests/integration/test_grpc_sync_real_server.py \
              --ignore=tests/integration/test_operation_router_integration.py \
              --ignore=tests/integration/test_entity_store_comprehensive.py \
              --ignore=tests/integration/test_entity_store_extended.py \
              --ignore=tests/integration/test_sks_graph_first_integration.py \
              --ignore=tests/integration/test_sks_semantic_graph_and_vector.py \
              --ignore=tests/integration/test_sql_integration.py \
              --ignore=tests/integration/test_semantic_chunking_integration.py \
              --ignore=tests/integration/test_integration.py \
              --ignore=tests/integration/test_multilang_code_indexing.py \
              --ignore=tests/integration/test_chunking_embedding_integration.py \
              --ignore=tests/integration/test_chunking_embedding_benchmark.py \
              --ignore=tests/integration/test_graph_operations.py \
              --ignore=tests/integration/test_code_indexing_integration.py \
              --ignore=tests/integration/test_response_cache_integration.py 2>&1 | tee pytest_output.txt
          '
          exit_code=${PIPESTATUS[0]:-$?}
          set -e
          # Handle pytest daemon thread hang (exit 124 = timeout killed)
          if [ "$exit_code" -eq 124 ]; then
            if grep -qE "[0-9]+ passed" pytest_output.txt; then
              echo "WARNING: pytest hung after completion (daemon thread cleanup), treating as completed"
              # Still exit with failure if tests failed, success if all passed
              if grep -qE "[0-9]+ failed|[0-9]+ error" pytest_output.txt; then
                exit 1
              fi
              exit 0
            fi
          fi
          exit ${exit_code}

      - name: Collect Server Logs on Failure
        if: failure()
        run: |
          echo "=== Server process status ==="
          ps aux | grep proximadb || true
          echo "=== Server logs (if available) ==="
          cat /tmp/proximadb*.log 2>/dev/null || echo "No log files found"

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            pid=$(cat server.pid)
            if kill -0 "$pid" 2>/dev/null; then
              echo "Stopping server (PID: $pid)..."
              kill "$pid" 2>/dev/null || true
              sleep 2
              # Force kill if still running
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

  # ============================================================================
  # DOCKER BUILD - Container testing
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: proximadb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health
        run: |
          docker run -d --name test-container \
            -p 5678:5678 -p 5679:5679 \
            proximadb:test

          echo "Waiting for ProximaDB server to start..."
          if timeout 180 bash -c 'until curl -sf http://localhost:5678/health; do sleep 3; done'; then
            echo "=== Health Check Passed ==="
            curl -s http://localhost:5678/health | jq .
          else
            echo "=== Health Check Failed - Container Logs ==="
            docker logs test-container 2>&1 | tail -100
            docker stop test-container || true
            docker rm test-container || true
            exit 1
          fi

          docker stop test-container
          docker rm test-container

  # ============================================================================
  # BENCHMARKS - Performance testing (optional)
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [rust-build]
    if: |
      inputs.run_benchmarks ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-nightly-bench"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler

      - name: Run Benchmarks
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          cargo bench --bench bench_21_query_cache -- --noplot 2>&1 | tee bench-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ============================================================================
  # SUMMARY - Final status check
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - rust-format
      - panic-policy-report
      - panic-policy-no-regression
      - panic-policy-module-guard
      - rust-clippy
      - rust-security
      - rust-build
      - rust-test
      - rust-integration-test-storage
      - rust-integration-test-query
      - rust-integration-test-graph
      - rust-integration-test-cluster
      - rust-coverage
      - python-lint
      - python-test
      - integration-test
      - docker-build
      - docs-validation
      # SDK linting and security
      - go-lint
      - nodejs-lint
      - rust-sdk-lint
      - sdk-security-scan
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          results="${{ toJSON(needs.*.result) }}"

          if echo "$results" | grep -q '"failure"'; then
            echo "::error::One or more CI jobs failed"
            echo "Some jobs failed. Check the workflow run for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "All required CI checks passed!" >> $GITHUB_STEP_SUMMARY
