# Publish the ProximaDB OSS server container image to Azure Container Registry.
#
# This is the OSS *base* image (`<registry>/proximadb`). AnvaiOps' commercial
# pipeline (anvaiops/.github/workflows/build-commercial-image.yml) consumes it
# as `FROM` to bake pricing tiers, and AKS pulls it directly via the AcrPull
# role wired in anvaiops/infra/terraform/azure/anvaiops/acr_attach.tf.
#
# Auth is OIDC-federated (no long-lived secrets): the workflow requests a
# short-lived GitHub OIDC token (`id-token: write`) and `azure/login` exchanges
# it for an Azure AD token via a federated credential on an app/identity that
# holds AcrPush on the registry. Convention matches anvaiops' workflows:
#   - secrets: AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   - variable: ACR_REGISTRY  (login-server FQDN, e.g. anvaiopsmvp1234.azurecr.io)
# See deploy/docker/ACR_PUBLISH.md for the one-time identity/role setup.
#
# Image built: deploy/docker/Dockerfile, target `runtime` — the minimal,
# Python-free, non-root debian-slim OSS server (glibc). Tag scheme is
# version + sha + latest (latest only on release tags / promoted builds).
name: Publish Image (ACR)

on:
  push:
    # Release tags publish the immutable version + latest.
    tags:
      - "v*"
    # Pushes to the integration branch publish a rolling sha-tagged image
    # (no `latest`) so downstream environments can pin a known-good build.
    branches:
      - develop
    paths:
      - "src/**"
      - "crates/**"
      - "apps/**"
      - "clients/**"
      - "proto/**"
      - "config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/docker/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      tag_latest:
        description: "Also tag :latest (use for a promoted build)"
        type: boolean
        default: false
      target:
        description: "Dockerfile runtime target"
        type: choice
        options: [runtime, runtime-full]
        default: runtime

concurrency:
  # One publish per ref at a time; never cancel an in-flight push (a partially
  # pushed manifest is worse than a queued one).
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # required for OIDC federated login to Azure

jobs:
  build-and-push:
    name: Build & push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No-op when ACR is unconfigured (forks / OSS contributors) so the workflow
    # skips cleanly rather than failing on a missing registry.
    if: ${{ vars.ACR_REGISTRY != '' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.vars.outputs.version }}
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      IMAGE_REPO: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_IMAGE_NAME || 'proximadb' }}
      TARGET: ${{ github.event.inputs.target || 'runtime' }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version + tags
        id: vars
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # Tag list per trigger:
          #  - release tag v*  -> <version>, sha-<sha>, latest
          #  - develop push    -> develop, sha-<sha>            (rolling, no latest)
          #  - manual dispatch -> <version>, sha-<sha> [, latest if requested]
          # The `-full` target gets a parallel suffixed tag namespace.
          SUFFIX=""
          if [ "${TARGET}" = "runtime-full" ]; then SUFFIX="-full"; fi
          TAGS=""
          add() { TAGS="${TAGS}${TAGS:+,}${IMAGE_REPO}:$1"; }

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            add "${VERSION}${SUFFIX}"
            add "sha-${SHORT_SHA}${SUFFIX}"
            add "latest${SUFFIX}"
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            add "develop${SUFFIX}"
            add "sha-${SHORT_SHA}${SUFFIX}"
          else
            add "${VERSION}${SUFFIX}"
            add "sha-${SHORT_SHA}${SUFFIX}"
            if [ "${{ github.event.inputs.tag_latest }}" = "true" ]; then
              add "latest${SUFFIX}"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        # Extract the registry name from the FQDN, matching anvaiops convention.
        run: az acr login --name "${ACR_REGISTRY%%.*}"

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ env.TARGET }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=proximadb
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published \`${TARGET}\` image"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.vars.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo ""
            echo "> AnvaiOps pins this base by digest per ADR-0016. To promote:"
            echo "> set \`PROXIMADB_BASE=${IMAGE_REPO}\` and"
            echo "> \`PROXIMADB_VERSION=@${{ steps.build.outputs.digest }}\` in"
            echo "> anvaiops/deploy/docker/Dockerfile.commercial."
          } >> "$GITHUB_STEP_SUMMARY"

  # Reclaim registry storage: purge dangling untagged manifests and keep only
  # the most recent tagged images. Runs server-side as an ACR task (no pulls).
  prune:
    name: Prune old images
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ACR_REGISTRY != '' }}
    permissions:
      contents: read
      id-token: write
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      IMAGE_NAME: ${{ vars.ACR_IMAGE_NAME || 'proximadb' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Purge untagged + stale tags (keep most recent)
        run: |
          set -euo pipefail
          # acr purge runs inside the registry: delete manifests older than the
          # window but always keep the newest KEEP regardless of age, then sweep
          # dangling untagged manifests left behind by re-pushed mutable tags.
          PURGE_CMD="acr purge --filter '${IMAGE_NAME}:.*' --ago ${ACR_PURGE_AGO:-30d} --keep ${ACR_PURGE_KEEP:-10} --untagged"
          az acr run \
            --registry "${ACR_REGISTRY%%.*}" \
            --cmd "${PURGE_CMD}" \
            /dev/null
        env:
          ACR_PURGE_AGO: ${{ vars.ACR_PURGE_AGO }}
          ACR_PURGE_KEEP: ${{ vars.ACR_PURGE_KEEP }}
