# Release workflow for the ProximaDB Python packages — independent of the binary/crates
# `release.yml` (which owns `v*` tags). Follows the per-package tag convention used across
# the workspace (`sdk-v*`, `victor-codegraph-v*`).
#
# Publishes TWO separate PyPI projects from ONE release event (the right shape: the pure
# SDK is a universal wheel, the embedded engine is native PyO3 wheels — they cannot be one
# distribution):
#   - proximadb           pure-Python client SDK (clients/python)      universal wheel + sdist
#   - proximadb_embedded  native in-process engine (root maturin pkg)  platform wheels + sdist
#
# Triggers:
#   - Push tag: python-v*  (e.g. python-v0.2.0)
#   - Manual dispatch (dry_run to build without publishing; publish_testpypi for a TestPyPI run)
#
# Publishing uses PyPI Trusted Publishing (OIDC) — NO API token secret. Configure one
# trusted publisher PER PyPI project (one-time):
#   https://pypi.org/manage/account/publishing/ -> add a GitHub publisher with
#     owner=vjsingh1984  repo=proximaDB  workflow=release-python.yml  environment=pypi
#   Repeat for projects `proximadb` and `proximadb_embedded` (and environment `testpypi`).
# TestPyPI is advisory/optional (continue-on-error) — PyPI never waits on it.

name: Release Python

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, do not publish'
        required: false
        default: false
        type: boolean
      publish_testpypi:
        description: 'Publish to TestPyPI (advisory)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ---- Pure-Python SDK: proximadb (universal wheel + sdist) --------------------------
  build-sdk:
    name: Build SDK (proximadb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel + sdist
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: clients/python/dist/*

  # ---- Native engine: proximadb_embedded (platform wheels via maturin) ---------------
  build-embedded-wheels:
    name: Build embedded wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # proximadb_embedded links the full Rust engine. It is unix-native (the
        # storage layer uses unix syscalls + memmap2), so Linux AND macOS build;
        # only Windows is blocked (proximadb-storage-common: no MSVC port —
        # std::os::unix / libc / mmap across dozens of files; tracked as an
        # engine-portability effort in TD-EMBED-1, NOT a build-config fix).
        # Each target builds NATIVELY on its own runner (no cross-toolchain):
        # the engine's C deps (aws-lc-sys rustls crypto, vendored OpenSSL) don't
        # cross-compile cleanly, but compile the same way natively per-arch.
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Native ARM runner (not cross-compile): the engine's C deps —
          # aws-lc-sys (rustls crypto) and vendored OpenSSL — fail to
          # cross-compile to aarch64 (aws-lc bcm.c under aarch64-gcc). Building
          # natively on an ARM runner compiles them the same way x86_64 does,
          # avoiding the cross-toolchain entirely.
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          # macOS aarch64 (Apple Silicon) — native arm64 runner. Intel macOS is
          # intentionally NOT built: Apple ships only Apple-Silicon hardware, so
          # x86_64-apple-darwin is no longer a produced target. Watch for the ring
          # 0.17.x aarch64 CAPS_STATIC const-assertion (documented on the macos-14
          # runner in ci.yml's GPU job); fail-fast:false keeps the Linux wheels
          # flowing if it bites, and it surfaces as its own portability follow-up.
          - os: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Build the native `proximadb_embedded` wheel from the ROOT maturin package.
      # (The crate's abi3 setting governs how many Python versions one wheel covers.)
      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist --features python
          # `openssl/vendored` (enabled by the python feature — openssl-sys is
          # transitive via sqlx/reqwest) builds OpenSSL from source inside the
          # manylinux container. openssl-src's Configure needs Perl's IPC::Cmd,
          # which the stock manylinux2014 image lacks. Install it (yum or dnf,
          # whichever the image ships) before the build. Linux-only hook; macOS/
          # Windows system Perl already carries these modules.
          before-script-linux: |
            # perl-core = the full Perl stdlib (IPC::Cmd, Time::Piece,
            # Data::Dumper, Getopt::Long, File::Compare … all of which
            # openssl 3.x's Configure needs). Verified in the manylinux2014
            # container that perl-core supplies every module the build requires.
            if command -v yum >/dev/null 2>&1; then
              yum install -y perl-core
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y perl-core
            elif command -v microdnf >/dev/null 2>&1; then
              microdnf install -y perl-core
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-embedded-sdist:
    name: Build embedded sdist (proximadb_embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist (maturin, root package)
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-sdist
          path: dist/*.tar.gz

  # ---- TestPyPI (advisory/optional) --------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI (advisory)
    needs: [build-sdk, build-embedded-wheels, build-embedded-sdist]
    if: ${{ github.event.inputs.dry_run != 'true' && (github.event.inputs.publish_testpypi == 'true' || startsWith(github.ref, 'refs/tags/python-v')) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Stage all distributions
        run: |
          mkdir -p dist
          find staging -name '*.whl' -exec cp {} dist/ \;
          find staging -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ---- PyPI (authoritative): proximadb SDK ------------------------------------------
  publish-sdk-pypi:
    name: Publish proximadb (SDK) to PyPI
    needs: [build-sdk]
    if: ${{ github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/python-v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proximadb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ---- PyPI (authoritative): proximadb_embedded native package ----------------------
  publish-embedded-pypi:
    name: Publish proximadb_embedded to PyPI
    needs: [build-embedded-wheels, build-embedded-sdist]
    if: ${{ github.event.inputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/python-v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proximadb-embedded/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Stage embedded wheels + sdist
        run: |
          mkdir -p dist
          find staging -path '*embedded-wheels*' -name '*.whl' -exec cp {} dist/ \;
          find staging -path '*embedded-sdist*' -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
