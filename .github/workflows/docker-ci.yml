name: Docker Container CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to Docker registry'
        required: false
        default: 'false'
        type: boolean

env:
  # Primary registry: GitHub Container Registry (free, unlimited public images)
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/proximadb-unified
  
  # Alternative registries for maximum reach:
  # REGISTRY: docker.io  # Docker Hub (free: 1 private repo, unlimited public)
  # REGISTRY: quay.io    # Red Hat Quay (free: unlimited public repos)

jobs:
  # Build unified Docker container
  docker-build:
    name: Build Unified Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and test Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Test container health
      run: |
        # Start container in background
        docker run -d --name proximadb-test \
          -p 5678:5678 -p 5679:5679 -p 8080:8080 \
          --health-interval=10s --health-timeout=5s --health-retries=3 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

        # Wait for container to be healthy
        echo "Waiting for container to be healthy..."
        timeout 120 bash -c 'while [[ "$(docker inspect --format="{{.State.Health.Status}}" proximadb-test)" != "healthy" ]]; do 
          echo "Container status: $(docker inspect --format="{{.State.Health.Status}}" proximadb-test)"
          sleep 5
        done'

        # Test REST API health
        echo "Testing REST API..."
        timeout 30 bash -c 'until curl -f http://localhost:5678/health; do sleep 2; done'
        curl -s http://localhost:5678/health | jq .

        # Test web UI accessibility
        echo "Testing Web UI..."
        timeout 30 bash -c 'until curl -f -I http://localhost:8080; do sleep 2; done'
        curl -I http://localhost:8080

        # Basic API functionality test
        echo "Testing basic API functionality..."
        curl -X POST http://localhost:5678/collections \
          -H "Content-Type: application/json" \
          -d '{"name": "ci_test", "dimension": 4, "engine": "viper"}' | jq .

        # List collections to verify creation
        curl -s http://localhost:5678/collections | jq .

        echo "Container health tests passed!"

    - name: Stop test container
      if: always()
      run: |
        docker stop proximadb-test || true
        docker rm proximadb-test || true

    - name: Push to registry
      if: |
        github.event_name != 'pull_request' && 
        (github.ref == 'refs/heads/main' || 
         startsWith(github.ref, 'refs/tags/') ||
         github.event.inputs.push_to_registry == 'true')
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Container scan (security)
      if: github.event_name != 'pull_request'
      uses: anchore/scan-action@v3
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        fail-build: false
        severity-cutoff: high

    - name: Generate container summary
      if: always()
      run: |
        echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tags**: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ **Build Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Health Check**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **API Test**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Web UI**: Accessible" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build Status**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Usage" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "# Pull and run the container" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "docker run -p 5678:5678 -p 5679:5679 -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Access services" >> $GITHUB_STEP_SUMMARY
        echo "# Web UI: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
        echo "# REST API: http://localhost:5678" >> $GITHUB_STEP_SUMMARY
        echo "# gRPC API: localhost:5679" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Output container info
      run: |
        echo "Built container: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.tags }}"
        echo "Version: ${{ steps.meta.outputs.version }}"

  # Multi-architecture build for releases
  docker-release:
    name: Release Multi-Arch Build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: docker-build
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract release metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push multi-arch release
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate release notes
      run: |
        echo "## 🚀 ProximaDB Docker Release" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Multi-architecture**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "**Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Quick Start" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "docker run -p 5678:5678 -p 5679:5679 -p 8080:8080 \\" >> $GITHUB_STEP_SUMMARY
        echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Features in this release" >> $GITHUB_STEP_SUMMARY
        echo "- 🏗️ Unified container with ProximaDB server + Web UI" >> $GITHUB_STEP_SUMMARY
        echo "- 🚀 Multi-architecture support (AMD64 + ARM64)" >> $GITHUB_STEP_SUMMARY
        echo "- 🔧 Production-ready configuration" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 Built-in monitoring and health checks" >> $GITHUB_STEP_SUMMARY
        echo "- 🎯 HTTP/2 support for enhanced performance" >> $GITHUB_STEP_SUMMARY

  # Optional: Deploy to staging environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker-build
    environment: staging
    
    steps:
    - name: Deploy placeholder
      run: |
        echo "This job would deploy to staging environment"
        echo "Container: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
        echo "Add your deployment logic here (e.g., kubectl, docker-compose, etc.)"