[package]
name = "proximadb-cdc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Change-Data-Capture event types + runtime — extracted from the root crate (TD-DECOMP-7)"

[lib]
name = "proximadb_cdc"
path = "src/lib.rs"

[features]
# Kafka sink uses rdkafka when enabled; stubs otherwise (mirrors root's cdc-kafka feature).
cdc-kafka = []

[dependencies]
# `event` uses serde (derive) + serde_json (Value/ser) + rand (event-id gen).
# Connector/sink/transform slices (later) add tokio/async-trait/prost/etc.
# Integration-tier: may depend only on foundation/horizontal/contracts.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
proximadb-config.workspace = true
# sinks: async-trait (CdcSink trait), tracing (logging), reqwest (webhook HTTP).
async-trait.workspace = true
tracing.workspace = true
reqwest = { version = "0.11", features = ["json"] }
# outbound: uuid (position/event IDs), regex (event filtering).
uuid = { version = "1.0", features = ["v4"] }
regex.workspace = true


[dev-dependencies]
tempfile.workspace = true
