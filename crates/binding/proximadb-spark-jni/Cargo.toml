[package]
name = "proximadb-spark-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "JNI bindings exposing ProximaDB's Spark connector helpers as a C-ABI cdylib for JVM loaders."

# cdylib only. The main `proximadb` crate is rlib-only because cdylib breaks
# its inline test discovery (ADR-006); this satellite crate isolates the
# native-library output so the JVM can `System.loadLibrary("proximadb_spark_jni")`
# without affecting the upstream crate's test layout.
[lib]
crate-type = ["cdylib"]

[dependencies]
proximadb = { path = "../../..", default-features = false, features = ["sql_frontend", "graph-first-sks", "unified-facade-routing", "canonical-document-store"] }
jni = "0.21"
