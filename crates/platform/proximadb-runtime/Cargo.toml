[package]
name = "proximadb-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform runtime composition helpers for ProximaDB"

[lib]
name = "proximadb_runtime"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
proximadb-graph-query = { path = "../../query/proximadb-graph-query" }
proximadb-hardware = { path = "../../foundation/proximadb-hardware" }
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-data-model = { path = "../../foundation/proximadb-data-model" }
proximadb-config = { path = "../../foundation/proximadb-config" }
proximadb-proto.workspace = true
num_cpus = "1.16"
sysinfo = "0.30"
thiserror.workspace = true
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"

[features]
default = []
# Distributed cluster bootstrap support. When enabled, exposes the
# `ClusterServerConfig` re-export and the cluster-related fields on
# `MultiServerConfig`. The root `proximadb` crate forwards its own
# `cluster` feature here. Without this, `#[cfg(feature = "cluster")]`
# in `bootstrap_config.rs` would unexpected-cfg-condition-value lint.
cluster = []
