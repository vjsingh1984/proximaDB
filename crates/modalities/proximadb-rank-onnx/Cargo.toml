[package]
name = "proximadb-rank-onnx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/vjsingh1984/proximadb"
description = "Shared ONNX scorer primitives for ProximaDB ranking: ScorerSession, OnnxModelCache (LRU+refcount), BatchedScorer, ModelRegistry. See roadmap/RANKING_FRAMEWORK_SPEC_2026_05_23.md (R-5)."

[lib]
name = "proximadb_rank_onnx"
path = "src/lib.rs"

[features]
default = []
# R-5b: real ort-backed ScorerSession (`OrtScorerSession`). Gated so the
# default build stays light — the mock-driven session primitives from
# R-5 are sufficient for unit-testing the cache / batch / LRU
# semantics. Enable this in production deployments that need live
# cross-encoder inference.
real-onnx = ["dep:ort", "dep:ndarray"]

[dependencies]
proximadb-rank-core = { workspace = true }
proximadb-kernel = { workspace = true }
async-trait.workspace = true
dashmap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# Real ONNX runtime — version + features pinned to match
# crates/modalities/proximadb-embedding so both crates link against
# the same ort native library at runtime (avoids dual-load of
# onnxruntime which destabilises the EP registry).
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "ndarray",
    "tls-rustls",
    "half",
] }
ndarray = { version = "0.17", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
