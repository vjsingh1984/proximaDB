[package]
name = "proximadb-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/vjsingh1984/proximadb"
description = "ProximaDB tiered persistent queue — memory + disk + object-store tiers with per-tenant partitioning and group-commit fsync"

[lib]
name = "proximadb_queue"
path = "src/lib.rs"

[features]
default = []
# Object-store archival tier. Off by default in tests so the crate compiles
# without bringing in cloud-storage credential plumbing.
object-tier = []

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "macros", "fs"] }
async-trait.workspace = true

# Lock-free bounded queues for the memory tier
crossbeam-queue = "0.3"

# Singleton + concurrent maps
once_cell = "1.19"
dashmap = "6.1.0"

# Stable hashing for partition selection
twox-hash = "1.6"

# Serialization for message envelopes + offset metadata
serde.workspace = true
serde_json.workspace = true
bincode = "1.3"

# Errors + tracing + metrics
anyhow.workspace = true
thiserror.workspace = true
tracing = "0.1"
prometheus = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util", "rt-multi-thread"] }
tempfile.workspace = true
