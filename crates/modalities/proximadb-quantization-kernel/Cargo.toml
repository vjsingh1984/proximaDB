[package]
name = "proximadb-quantization-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ProximaDB vector-quantization kernel (SQ8/PQ/Binary/TurboQuant encode·decode, codebook store, in-memory quantized engine)"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
proximadb-hardware = { workspace = true }
proximadb-vector = { workspace = true }
proximadb-quantization-types = { workspace = true }
proximadb-distance-kernel = { workspace = true }

[features]
# Mirrors the root crate's TurboQuant gate (ADR-021). The SIMD/store kernels live
# in proximadb-vector and the config types in proximadb-quantization-types; this
# forwards the feature so the turboquant_store_registry module + its deps compile.
experimental-turboquant = [
    "proximadb-vector/experimental-turboquant",
    "proximadb-quantization-types/experimental-turboquant",
]
