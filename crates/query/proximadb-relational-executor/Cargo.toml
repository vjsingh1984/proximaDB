[package]
name = "proximadb-relational-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Volcano-style executor for ProximaDB's relational query path (ADR-019 L4/S3)"

[lib]
name = "proximadb_relational_executor"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
proximadb-data-model = { workspace = true }
proximadb-relational-types = { workspace = true }
proximadb-relational-algebra = { workspace = true }
proximadb-relational-reader = { workspace = true }
proximadb-relational-planner = { workspace = true }
proximadb-functions = { workspace = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1.37", features = ["full"] }
