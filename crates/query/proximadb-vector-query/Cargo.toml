[package]
name = "proximadb-vector-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared ProximaDB vector query IR contracts"

[lib]
name = "proximadb_vector_query"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
proximadb-distance-types.workspace = true
proximadb-kernel = { path = "../../foundation/proximadb-kernel" }
proximadb-records = { workspace = true }
# NOTE: this crate intentionally does NOT depend on proximadb-proto.
# See docs/12-design/adr/ADR-014-vector-query-2-shape.adoc — keeping this
# crate proto-clean is what lets the Phase 3 modality-extracted runtime
# `crates/modalities/proximadb-vector::VectorServiceImpl` implement
# `VectorQueryService` without coupling back to the wire layer. The
# orchestration-plane proto→Rust conversion lives at the call site
# (`src/network/multi_protocol_handler.rs`).
