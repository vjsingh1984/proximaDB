[package]
name = "proximadb-relational-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Writable in-memory relational engine — first reference implementation of ProximaDB's read+write contracts (ADR-019 L5/S5b)"

[lib]
name = "proximadb_relational_engine"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
parking_lot.workspace = true
proximadb-data-model = { workspace = true }
proximadb-relational-types = { workspace = true }
proximadb-relational-algebra = { workspace = true }
proximadb-relational-reader = { workspace = true }
proximadb-relational-executor = { workspace = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proximadb-relational-planner = { workspace = true }
proximadb-relational-frontend = { workspace = true }
tokio = { version = "1.37", features = ["full"] }
