[package]
name = "proximadb-serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vector serialization utilities for ProximaDB: bytemuck fixed-length encoding, streaming serialization, and multi-codec (zstd/gzip/bzip2/xz) compression"

[lib]
name = "proximadb_serialization"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
bincode.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
# Compression codecs (distinct dependency profile — the reason this is its own crate)
brotli.workspace = true
bzip2.workspace = true
flate2.workspace = true
lz4_flex.workspace = true
snap.workspace = true
xz2.workspace = true
zstd.workspace = true
bytemuck = { version = "1.14", features = ["derive"] }
num_cpus = "1.16"
proximadb-kernel.workspace = true
proximadb-compression-types.workspace = true
proximadb-runtime-common.workspace = true

[lints]
workspace = true
