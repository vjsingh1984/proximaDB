[package]
name = "proximadb-iceberg-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Object-store ObjectStoreBridge implementation (Parquet/Iceberg base tier) for the ProximaDB warehouse (F2)"

[lib]
name = "proximadb_iceberg_engine"
path = "src/lib.rs"

[dependencies]
# Implements the canonical ObjectStoreBridge seam over the F1 object-store plumbing,
# composing the F1.5 Arrow converter + F1.6 Parquet-bytes codec (all in storage-common).
proximadb-storage-common = { workspace = true }
proximadb-object-store = { path = "../proximadb-object-store" }
proximadb-records = { workspace = true }
proximadb-kernel.workspace = true
object_store.workspace = true
# Footer-driven range reads + column projection via the parquet async object-store
# reader (the workspace dep enables the `object_store` feature, which pulls in `async`).
parquet.workspace = true
bytes = "1.5"
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
# Test-only: name `ProximaType` when building a catalog-authoritative schema for
# the schema-explicit write test.
proximadb-data-model = { workspace = true }
