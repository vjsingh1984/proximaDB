[package]
name = "proximadb-block-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PAX block layout for ProximaDB: unified OLTP row-store + OLAP column-stripe storage"

[lib]
name = "proximadb_block_format"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crc32fast.workspace = true
rmp-serde.workspace = true

# Codec layer: encoding schemes for column stripes
proximadb-codec = { workspace = true }

# Type system: ProximaValue, ProximaType for column value encoding
proximadb-data-model = { workspace = true }

# Record envelope: ProximaRecord → PAX column projection
proximadb-records = { workspace = true }

[dev-dependencies]
proptest = "1"
