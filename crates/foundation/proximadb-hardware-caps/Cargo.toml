[package]
name = "proximadb-hardware-caps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ProximaDB rich hardware-capability detection (CPU/SIMD/memory/GPU) layered on proximadb-hardware; GPU detection is injected via register_gpu_detector so this foundation layer stays free of compute"

[lib]
name = "proximadb_hardware_caps"
path = "src/lib.rs"

[features]
# Mirrors the root crate's `gpu` feature: gates GPU-backend selection + the
# GPU-aware `Display` impls in this crate. GPU *detection* itself is injected at
# runtime via `register_gpu_detector` (no compute dependency here).
gpu = []

[dependencies]
anyhow.workspace = true
num_cpus = "1.16"
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
proximadb-hardware.workspace = true
proximadb-config.workspace = true

# `raw_cpuid` is used only inside `#[cfg(target_arch = "x86_64")]` blocks
# (CPUID vendor/model/cache probing in `get_cpu_info`), so gate the dependency to
# x86_64 — non-x86 targets (e.g. aarch64/macOS) don't compile those paths. The
# crate extraction (#180) moved the code here but left the dependency on the root
# crate, which broke the x86_64 build (`use raw_cpuid` resolved to an undeclared
# crate). Pinned to match the root crate's existing `raw-cpuid = "11.0"`.
[target.'cfg(target_arch = "x86_64")'.dependencies]
raw-cpuid = "11.0"
