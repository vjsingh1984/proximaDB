[package]
name = "proximadb-distance-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ProximaDB distance-computation kernel (SIMD/quantized/sparse distance engine over proximadb-vector); GPU acceleration is injected via register_gpu_accelerator_factory so this foundation crate stays free of compute"

[lib]
name = "proximadb_distance_kernel"
path = "src/lib.rs"

[features]
# Mirrors the root crate's `gpu` feature: gates the GPU accelerator path + factory
# hook. The GPU accelerator impl is injected at runtime via
# register_gpu_accelerator_factory (no compute dependency here).
gpu = []
# TurboQuant numerics (ADR-021); the kernels live in proximadb-vector.
experimental-turboquant = ["proximadb-vector/experimental-turboquant"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dashmap.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
proximadb-hardware.workspace = true
proximadb-hardware-caps.workspace = true
proximadb-proto.workspace = true
proximadb-runtime-common.workspace = true
proximadb-vector.workspace = true
