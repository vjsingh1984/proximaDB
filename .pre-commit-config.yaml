# Pre-commit hooks for ProximaDB
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  # Rust formatting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

  # Rust linting (advisory - does not block commit)
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy (advisory)
        entry: bash -c 'cargo clippy --all-targets 2>&1 || true'
        language: system
        types: [rust]
        pass_filenames: false
        verbose: true

  # Python formatting - black
  - repo: https://github.com/psf/black
    rev: '24.10.0'
    hooks:
      - id: black
        args: ['--config', 'clients/python/pyproject.toml']
        files: ^clients/python/
      - id: black
        name: black (embedded)
        args: ['--config', 'clients/python-embedded/pyproject.toml']
        files: ^clients/python-embedded/

  # Python import sorting - isort
  - repo: https://github.com/PyCQA/isort
    rev: '5.13.2'
    hooks:
      - id: isort
        args: ['--settings-path', 'clients/python/pyproject.toml']
        files: ^clients/python/
      - id: isort
        name: isort (embedded)
        files: ^clients/python-embedded/

  # Python linting - ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.8.6'
    hooks:
      - id: ruff
        args: ['--config', 'clients/python/pyproject.toml', '--fix']
        files: ^clients/python/
      - id: ruff
        name: ruff (embedded)
        args: ['--config', 'clients/python-embedded/pyproject.toml', '--fix']
        files: ^clients/python-embedded/

  # Python type checking - mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.13.0'
    hooks:
      - id: mypy
        args: ['--config-file', 'clients/python/pyproject.toml', '--ignore-missing-imports']
        files: ^clients/python/src/
        additional_dependencies: ['pydantic>=2.0.0', 'numpy>=1.21.0']
      - id: mypy
        name: mypy (embedded)
        args: ['--config-file', 'clients/python-embedded/pyproject.toml', '--ignore-missing-imports']
        files: ^clients/python-embedded/src/
        additional_dependencies: ['numpy>=1.21.0']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v5.0.0'
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
