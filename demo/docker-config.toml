# ProximaDB Configuration for Docker Demo Environment

[server]
host = "0.0.0.0"
port = 5678

[grpc]
host = "0.0.0.0"
port = 5679

[storage]
# Single metadata URL
metadata_url = "file:///app/metadata"

# Storage locations in container
[[storage.storage_locations]]
url = "file:///app/data"
weight = 1
tags = ["docker", "local"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# Memory and performance settings optimized for containers
mmap_enabled = true
cache_size_mb = 256
bloom_filter_bits = 10

[storage.lsm_config]
memtable_size_mb = 8
memory_flush_size_bytes = 2097152  # 2MB
compression = "snappy"

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

[logging]
level = "info"
file_path = "/app/logs/proximadb.log"
max_files = 5
max_file_size_mb = 100

[metrics]
enabled = true
port = 9090
path = "/metrics"

[security]
enable_tls = false  # Disabled for demo simplicity

[performance]
# Optimized for demo workloads
worker_threads = 4
max_connections = 1000
request_timeout_seconds = 30
batch_size = 100

[features]
# Enable all features for demo
quantization_enabled = true
hnsw_indexing_enabled = true
metadata_indexing_enabled = true
distributed_mode = false  # Single node for demo