[server]
host = "0.0.0.0"
port = 5678
data_dir = "./data"

[rest]
enable_compression = false
max_request_size_mb = 64

[grpc]
host = "0.0.0.0"
port = 5679
enable_compression = false
enable_reflection = false
max_frame_size_mb = 16

[storage]
metadata_url = "file://./metadata"

[[storage.storage_locations]]
url = "file://./data"
weight = 1
tags = ["local", "demo"]

[storage.assignment_config]
strategy = "hash"
affinity = true

[storage.sst_config]
memtable_size_mb = 1024
memory_flush_size_bytes = 16777216
compression = "zstd"
compression_enabled = true
compression_level = 3
compaction_threshold = 5
write_buffer_size_mb = 8192
block_size_kb = 4096

# Decompression cache configuration
[storage.sst_config.decompression_cache]
# Maximum cache size in MB (default: 512MB, max: 8192MB)
max_size_mb = 512
# Enable automatic prefetching of related blocks
enable_prefetch = true
# Number of accesses before prefetching related blocks (default: 3)
prefetch_threshold = 3
# TTL for cached entries in seconds (0 = no expiration, default: 0)
ttl_seconds = 0
# Cache invalidation check interval in seconds (default: 60)
invalidation_check_interval_seconds = 60

[storage.viper_config]
row_group_size = 50000
compression = "zstd"
compression_enabled = true
compression_level = 3
enable_statistics = true
data_directory = "./viper_data"
cache_size_mb = 256

[logging]
level = "info"
file_path = "./log/proximadb.log"
max_files = 5
max_file_size_mb = 100

[api]
rest_port = 5678
grpc_port = 5679
max_request_size_mb = 10000
timeout_seconds = 300

[network]
bind_address = "0.0.0.0"
port = 5678
enable_grpc = true
enable_rest = true
enable_dashboard = false
enable_compression = false

[rate_limit]
enabled = false

[metrics]
enabled = true
port = 9090
path = "/metrics"
