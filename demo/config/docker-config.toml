# ProximaDB Configuration for Docker Demo Environment

[server]
node_id = "proximadb-docker"
bind_address = "0.0.0.0"
port = 5678
data_dir = "/data"

[storage]
# Single metadata URL
metadata_url = "file:///data/metadata"

# Memory and performance settings optimized for containers
mmap_enabled = true
cache_size_mb = 512
bloom_filter_bits = 12

# Storage locations in container
[[storage.storage_locations]]
url = "file:///data/collections"
weight = 1
tags = ["docker", "local"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"
affinity = true

# WAL configuration
[storage.wal_config]
global_manifest_url = "file:///data/manifest"
memory_flush_size_bytes = 16777216
global_flush_threshold = 4294967296
enable_wal = true
distribution_strategy = "LoadBalanced"
collection_affinity = true

[storage.sst_config]
memtable_size_mb = 1024  # 1GB to reduce small file creation
memory_flush_size_bytes = 16777216  # 16MB to reduce small file creation
compression = "zstd"  # ZSTD for better compression ratio
compression_enabled = true  # Enable compression by default
compression_level = 3  # Balanced speed/compression (1-22)
compaction_threshold = 5  # Minimum 5 files before compaction
write_buffer_size_mb = 8192  # 8GB for global write buffer
block_size_kb = 2048  # 2MB blocks for optimal balance

# Decompression cache configuration for optimal performance
[storage.sst_config.decompression_cache]
max_size_mb = 512  # 512MB cache for compressed blocks
min_size_mb = 64   # Minimum 64MB for production safety
max_cap_mb = 2048  # Maximum 2GB cap for containers
enable_prefetch = true  # Background prefetching
prefetch_threshold = 3  # Prefetch after 3 accesses
ttl_seconds = 0  # No expiration for maximum performance
invalidation_check_interval_seconds = 60

[storage.viper_config]
row_group_size = 100000  # Optimized for analytics workloads
compression = "zstd"  # ZSTD for columnar data
compression_enabled = true  # Enable compression by default  
compression_level = 3  # Balanced speed/compression
enable_statistics = true
data_directory = "/data/viper_data"
cache_size_mb = 512  # Increased for better columnar performance
enable_quantization = true  # Two-stage search optimization
quantization_type = "int8"  # INT8 quantization for memory efficiency

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = false
cleanup_temp_on_startup = true

[logging]
level = "info"
file_path = "/data/logs/proximadb.log"
max_files = 5
max_file_size_mb = 100

[metrics]
enabled = true
port = 9090
path = "/metrics"

[security]
enabled = false
mode = "development"

[security.authentication]
enabled = false
methods = ["api_key"]
require_authentication = false
default_session_timeout_minutes = 60

[security.authentication.api_keys]
"dev-key" = { user_id = "devuser", permissions = ["*"], ip_restrictions = [] }

[security.authentication.jwt]
enabled = false
secret = "dev-secret-change-me"
access_token_expiration_minutes = 60
refresh_token_expiration_days = 7
issuer = "proximadb"
audience = "proximadb-clients"
algorithm = "HS256"

[security.authentication.sso]
enabled = false
providers = []
token_cache_ttl_minutes = 60

[security.rbac]
enabled = false
enable_field_level_permissions = false
enable_audit_logging = false
default_deny = false
cache_permissions = true
permission_cache_ttl_minutes = 60

[security.audit]
enable_audit_logging = false
encryption_enabled = false
retention_days = 30
enable_real_time_alerts = false
compliance_frameworks = []

[security.audit.storage_backend]
File = { directory = "/data/audit" }

[security.compliance]
frameworks = []
encryption_at_rest = false
encryption_in_transit = false

[security.tls]
enabled = false
require_client_certificates = false

# Hardware acceleration configuration for optimal performance
[hardware]
enable_detection = true           # Auto hardware detection
enable_gpu_acceleration = false   # Disabled for container compatibility  
enable_simd = true               # Enable SIMD acceleration
enable_avx512 = true             # Enable AVX-512 if available
enable_gpu_parsing = false       # Disabled for containers
enable_gpu_distance = false      # Disabled for containers
gpu_min_vector_size = 64         # Minimum vector size for GPU
gpu_min_batch_size = 100         # Minimum batch size for GPU

# API configuration for REST and gRPC servers
[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 64
timeout_seconds = 30
enable_tls = false

# ✅ Protocol compression now configurable (all defaults false)
rest_compression = false        # REST API compression
grpc_compression = false        # gRPC compression  
compression_algorithm = "gzip"  # Compression algorithm
compression_level = 6           # Compression level