[server]
host = "0.0.0.0"
port = 5678
data_dir = "./data"
threads = 8  # Match CPU cores for optimal performance
max_connections = 1000  # High concurrency support

# ✅ Protocol compression now configurable via [api] section

[storage]
metadata_url = "file://./metadata"
# Performance optimizations
mmap_enabled = true
cache_size_mb = 1024  # 1GB cache for optimal performance
bloom_filter_bits = 12  # Optimized for 95% scan reduction

[[storage.storage_locations]]
url = "file://./data"
weight = 1
tags = ["local", "demo"]

[storage.assignment_config]
strategy = "hash"
affinity = true

[storage.sst_config]
memtable_size_mb = 1024
memory_flush_size_bytes = 16777216
compression = "zstd"
compression_enabled = true
compression_level = 3
compaction_threshold = 5  # Deprecated - use compaction_config
write_buffer_size_mb = 8192
block_size_kb = 2048  # 2MB default

# Decompression cache configuration for production performance
[storage.sst_config.decompression_cache]
max_size_mb = 1024  # 1GB cache for high performance
min_size_mb = 64    # Minimum 64MB for production safety
max_cap_mb = 4096   # Maximum 4GB cap for local development
enable_prefetch = true  # Background prefetching
prefetch_threshold = 2  # More aggressive prefetching
ttl_seconds = 0     # No expiration for maximum performance
invalidation_check_interval_seconds = 30  # More frequent checks

# Compaction configuration (applies to all engines unless overridden)
[storage.compaction_config]
l0_file_threshold = 5          # Compact when 5+ files in L0
l0_size_threshold_mb = 256     # Or when L0 exceeds 256MB
level_multiplier = 2.0          # Double thresholds per level
max_levels = 7                  # Support up to 7 levels
strategy = "hybrid"             # Use both count and size thresholds
target_file_size_mb = 128       # Create 128MB output files

[storage.viper_config]
row_group_size = 100000  # Optimized for analytics workloads
compression = "zstd"
compression_enabled = true
compression_level = 3
enable_statistics = true
data_directory = "./viper_data"
cache_size_mb = 512  # Increased for better columnar performance
enable_quantization = true  # Two-stage search optimization
quantization_type = "int8"  # INT8 quantization for memory efficiency

# HELIX engine configuration (experimental clustering engine)
[storage.helix]
# Compaction settings
compaction_threads = 4
level0_file_num_compaction_trigger = 4
max_levels = 7
size_ratio = 10.0

# PCA clustering settings
pca_dimensions = 16                      # Dimensionality reduction target
pca_retrain_interval_hours = 24         # How often to retrain PCA model
enable_liquid_clustering = true         # Adaptive query-based clustering

# Performance settings
proxima_block_size = 128               # Proxima block size
block_cache_size_mb = 1024              # Block cache for hot data
bloom_filter_bits_per_key = 10         # Bloom filter precision

[logging]
level = "info"
file_path = "./log/proximadb.log"
max_files = 5
max_file_size_mb = 100

# API configuration for REST and gRPC servers
[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 100
timeout_seconds = 60
enable_tls = false

# ✅ Protocol compression now configurable (all defaults false)
rest_compression = false        # REST API compression
grpc_compression = false        # gRPC compression (default changed to false)
compression_algorithm = "gzip"  # User-configurable compression algorithm
compression_level = 6           # User-configurable compression level

# Network configuration
[network]
bind_address = "0.0.0.0"
port = 5678
enable_grpc = true
enable_rest = true
enable_dashboard = false
auth = { enabled = false, jwt_secret = null, jwt_expiration_secs = 3600, api_keys = [] }
rate_limit = { enabled = false }
request_timeout_secs = 30
max_request_size = 67108864  # 64MB
keep_alive_timeout_secs = 60
tcp_nodelay = true

[rate_limit]
enabled = false  # Disabled for maximum performance

# Hardware acceleration configuration for optimal performance
[hardware]
enable_detection = true           # Auto hardware detection
enable_gpu_acceleration = true    # Enable GPU if available
enable_simd = true               # Enable SIMD acceleration
enable_avx512 = true             # Enable AVX-512 if available
enable_gpu_parsing = true        # Enable GPU for SQL parsing
enable_gpu_distance = true       # Enable GPU for distance calculations
gpu_min_vector_size = 64         # Minimum vector size for GPU
gpu_min_batch_size = 100         # Minimum batch size for GPU

[metrics]
enabled = true
port = 9090
path = "/metrics"
# Export detailed performance metrics
export_cache_stats = true
export_hardware_stats = true
export_compression_stats = true
