# ProximaDB Cloud-Optimized Configuration
# Optimized 3MB block sizes for universal cloud IOPS alignment

[server]
node_id = "proximadb-001"
bind_address = "0.0.0.0"
port = 5678
grpc_port = 5679
data_dir = "/data/proximadb"

[storage]
# Cloud-specific storage locations optimized for 3MB blocks
storage_locations = [
    { url = "file:///fast-nvme/proximadb", storage_class = "hot", max_capacity_gb = 100 },
    { url = "file:///standard-ssd/proximadb", storage_class = "warm", max_capacity_gb = 500 }
]
metadata_url = "file:///fast-nvme/proximadb/metadata"

[storage.sst_config]
# 🎯 OPTIMAL 3MB BLOCK SIZE
# Universal cloud optimization for AWS/Azure/GCS
block_size_mb = 3  # 3MB - perfect for all cloud IOPS patterns

# Compression settings optimized for 3MB blocks
compression = "zstd"
compression_level = 3
compaction_strategy = "leveled"
level_count = 7
compaction_threshold = 5

# Cache settings (3MB blocks fit efficiently in memory)
cache_size_mb = 256
bloom_filter_bits_per_key = 10

[storage.sst_config.decompression_cache_config]
# Optimized for 3MB blocks
max_cache_size_mb = 128
max_entries = 1000
eviction_policy = "lru"

# 🌐 CLOUD-SPECIFIC CONFIGURATIONS

# AWS Configuration (EBS gp3: optimal at 1-4MB, st1: 1-4MB sequential)
[aws]
# EBS gp3 optimized - 3MB hits the sweet spot
preferred_block_size_mb = 3
enable_instance_store = true  # Use instance store for hot data when available
enable_s3_express = true      # Use S3 Express One Zone for warm tier

# Azure Configuration (Premium SSD: 512KB-2MB optimal, 3MB works well)
[azure]
# Azure Premium SSD optimized - 3MB aligns well
preferred_block_size_mb = 3
enable_local_nvme = true      # Use L-series local NVMe when available
blob_tier_strategy = "hot"    # Use Hot tier for primary storage

# GCS Configuration (Standard: 1-8MB optimal - 3MB is perfect)
[gcp]
# GCS Standard optimized - 3MB in sweet spot
preferred_block_size_mb = 3
enable_local_ssd = true       # Use local SSD when available
storage_class = "standard"    # Standard class for primary storage

[axis]
# AXIS configuration optimized for 3MB blocks
enabled = true
default_index_type = "hnsw"
cache_optimization = true

# 3MB blocks improve cache efficiency
cache_block_count = 1000      # ~3GB cache for blocks
memory_tier_threshold = 0.7   # Promote to memory when 70% full

[services]
# Vector operations service optimized for 3MB blocks
vector_batch_size = 1000      # Optimal batch size for 3MB blocks
enable_smart_routing = true   # Route based on block access patterns

[monitoring]
# Monitoring optimized for 3MB block insights
block_size_metrics = true
iops_optimization_tracking = true
compression_efficiency_tracking = true