# ProximaDB Configuration with Semantic Knowledge Store (SKS)

[server]
node_id = "sks-demo-node"
bind_address = "127.0.0.1"
port = 5678
grpc_port = 5679
data_dir = "./data/sks-demo"

[storage]
metadata_url = "file://./data/sks-demo/metadata"
cache_size_mb = 1024
mmap_enabled = true

[[storage.storage_locations]]
url = "file://./data/sks-demo/storage"
weight = 1
tags = ["local", "sks"]

[storage.wal_config]
write_buffer_size_mb = 2048
memory_flush_size_bytes = 16777216  # 16MB
vector_count_threshold = 50000
memtable_type = "BTree"
sync_mode = "PerBatch"
write_buffer_directory = "./data/sks-demo/wal"
enable_wal = true

[storage.sst_config]
level_count = 7
block_size_kb = 2048
compression = "zstd"
compression_level = 3
cache_size_mb = 512
mmap_enabled = true
data_directory = "./data/sks-demo/sst"

[storage.viper_config]
row_group_size = 100000
compression = "zstd"
compression_level = 3
enable_statistics = true
data_directory = "./data/sks-demo/viper"
cache_size_mb = 512

# Semantic Knowledge Store Configuration
[sks]
enabled = true
enable_entities = true
enable_relations = true
enable_provenance = true
enable_temporal = false  # Can be enabled for version tracking
enable_sql_extensions = true
max_embedding_versions = 10
max_traversal_depth = 5
entity_cache_mb = 512
relations_cache_mb = 256
default_embedding_model = "openai/text-embedding-3-large"
storage_backend = "sst"  # Options: "memory", "sst", "viper"

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 100
timeout_seconds = 60
enable_tls = false
rest_compression = false
grpc_compression = false

[monitoring]
metrics_enabled = true
log_level = "info"

[hardware]
enable_detection = true
enable_gpu_acceleration = true
enable_simd = true
enable_avx512 = true
enable_gpu_parsing = true
enable_gpu_similarity = true
gpu_min_vector_size = 64
gpu_min_batch_size = 100