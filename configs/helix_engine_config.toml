# HELIX Storage Engine Configuration
# This configuration is typically included in the main server config.toml

[storage.helix]
# Compaction settings
level0_file_num_compaction_trigger = 4    # Number of L0 files to trigger compaction
max_levels = 7                            # Maximum number of LSM levels
size_ratio = 10.0                          # Size ratio between adjacent levels

# Clustering settings
pca_dimensions = 16                       # Dimensions after PCA reduction (default: 16)
hilbert_bits_per_dimension = 16           # Resolution of Hilbert curve (default: 16, range: 8-21)
fastlane_block_size = 128                 # Vectors per FastLane block (default: 128)
enable_liquid_clustering = true           # Adaptive clustering based on query patterns

# Quantization settings
storage_quantization = false              # Enable storage quantization (false for FP32)

# Performance settings
bloom_filter_bits_per_key = 10           # Bloom filter bits per key
block_cache_size_mb = 1024                # Block cache size in MB
pca_retrain_interval_hours = 24          # How often to retrain PCA model

# Advanced tuning (optional)
[storage.helix.advanced]
# Hilbert curve precision tuning
# Higher values = better locality preservation but larger keys
# 8  = Fast but coarse (256 buckets per dimension)
# 12 = Balanced (4096 buckets per dimension)
# 16 = Default, good precision (65536 buckets per dimension)
# 20 = Very high precision (1M buckets per dimension)
# 21 = Maximum precision (2M buckets per dimension)
hilbert_precision_profile = "balanced"    # Options: "fast", "balanced", "precise", "maximum"

# Liquid clustering parameters
[storage.helix.liquid_clustering]
query_window_size = 1000                  # Number of queries to track for patterns
recluster_threshold = 10000               # Queries before triggering re-clustering
access_weight = 0.7                       # Weight for access frequency (0.0-1.0)
recency_weight = 0.3                      # Weight for recency (0.0-1.0)

# Per-collection overrides (if needed)
[[storage.helix.collection_overrides]]
collection_name = "high_dim_vectors"
pca_dimensions = 32                       # More dimensions for complex data
hilbert_bits_per_dimension = 20           # Higher precision for better clustering

[[storage.helix.collection_overrides]]
collection_name = "small_vectors"
pca_dimensions = 8                        # Fewer dimensions for simple data
hilbert_bits_per_dimension = 12           # Lower precision for faster processing
fastlane_block_size = 256                 # Larger blocks for small vectors