# Criterion Benchmark Configuration
# Fixes for Criterion 0.5 compatibility

# Use the correct option name for Criterion 0.5
# In 0.5, sample-size was changed to sample_size (underscore)
# We set explicit values to avoid the default configuration issue

[bench]
# Default measurement settings
measurement_time = 5 # seconds
warm_up_time = 3 # seconds

# Sample size is now automatically determined by Criterion 0.5
# based on measurement time. Don't set sample_size or sample-size.
