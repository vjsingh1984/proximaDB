# Immutable controlled-pair contract for the TD-IVF-3 corpus rebuild.
# Both models use the same BERT WordPiece vocabulary and 512-token context,
# but each model/tokenizer repository revision remains independently pinned.

[[models]]
model_id = "BAAI/bge-base-en-v1.5"
revision = "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
tokenizer_revision = "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
effective_context_limit = 512
document_template = "{text}"
query_template = "Represent this sentence for searching relevant passages: {text}"
native_dimension = 768
output_dimension = 768
runtime_provider = "open-weights"
local_files_only = true

