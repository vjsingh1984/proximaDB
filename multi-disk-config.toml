# ProximaDB Multi-Disk Test Configuration

[server]
node_id = "proximadb-node-1"
bind_address = "0.0.0.0"
port = 5678
data_dir = "/home/vsingh/code/proximaDB/test_data_fresh"

[grpc]
host = "0.0.0.0"
port = 5679

[storage]
# Single metadata URL for consistency
metadata_url = "file:///home/vsingh/code/proximaDB/test_data_fresh/metadata"

# Multiple storage locations across different disks
[[storage.storage_locations]]
url = "file:///home/vsingh/code/proximaDB/test_data_fresh/disk1"
weight = 3  # Higher weight for fast disk
tags = ["fast", "nvme", "disk1"]

[[storage.storage_locations]]
url = "file:///home/vsingh/code/proximaDB/test_data_fresh/disk2"
weight = 2  # Medium weight for secondary disk
tags = ["ssd", "disk2"]

# Assignment configuration
[storage.assignment_config]
strategy = "hash"  # Hash-based assignment for consistent placement
affinity = true    # Keep WAL/data/index together

# Storage engine settings
mmap_enabled = true
cache_size_mb = 512
bloom_filter_bits = 10

# LSM configuration
[storage.lsm_config]
memtable_size_mb = 64
level_count = 7
compaction_threshold = 4
block_size_kb = 64
memory_flush_size_bytes = 67108864
memtable_type = "skiplist"
compaction_strategy = "leveled"
compression = "snappy"
cache_size_mb = 128
write_buffer_size_mb = 64
max_files_per_level = 10
level_size_multiplier = 10.0
max_levels = 7
background_thread_count = 4
sync_mode = "sync"
enable_wal = true
wal_directory = "./test_data_fresh/lsm_wal"
data_directory = "./test_data_fresh/lsm_data"
mmap_enabled = true
prefetch_enabled = true
prefetch_size_kb = 64

[storage.bloom_filter_config]
bits_per_key = 10
enabled = true

[storage.filesystem_config]
enable_write_strategy_cache = true
temp_strategy = "SameDirectory"

[storage.filesystem_config.atomic_config]
enable_local_atomic = true
enable_object_store_atomic = true
cleanup_temp_on_startup = true

# Removed metadata_backend - now using metadata_url in main storage section

[api]
grpc_port = 5679
rest_port = 5678
max_request_size_mb = 64
timeout_seconds = 30
enable_tls = false

[logging]
level = "debug"
file_path = "./test_data_fresh/logs/proximadb.log"
max_files = 5
max_file_size_mb = 100

[monitoring]
metrics_enabled = true
log_level = "info"

[consensus]
node_id = 1
cluster_peers = []
election_timeout_ms = 5000
heartbeat_interval_ms = 1000
snapshot_threshold = 1000